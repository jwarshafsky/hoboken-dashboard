<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-title" content="Family">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="family-manifest.json">
<link rel="apple-touch-icon" href="icons/pwa/icon-180.png">
<title>Family</title>
<style>
  /* Design tokens copied from commute.html so the two PWAs feel like one app. */
  :root{
    --bg:#0b0f14; --card:#151b24; --card2:#1b2430; --line:#243040;
    --txt:#eef3f9; --dim:#8ea0b5; --live:#6bffb8;
    --urgent:#ff5050; --warn:#ff9b40; --yellow:#e0c040; --accent:#4aa8ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:max(14px, calc(env(safe-area-inset-top, 0px) + 10px)) 14px calc(24px + env(safe-area-inset-bottom))}
  @media (display-mode: standalone){
    body{padding-top:max(54px, calc(env(safe-area-inset-top, 0px) + 10px))}
  }
  body.standalone{padding-top:max(54px, calc(env(safe-area-inset-top, 0px) + 10px))}

  .top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
  .title{font-size:clamp(19px,6vw,24px); font-weight:800; letter-spacing:.2px}
  .title .sub{display:block; font-size:12px; font-weight:500; color:var(--dim)}
  .refresh{background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer}
  .refresh:active{background:var(--line)}

  /* One row per person. Face left, status middle, ETA right. */
  .person{display:flex; align-items:center; gap:13px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:13px 15px; margin-bottom:11px}
  .face{width:50px; height:50px; border-radius:50%; flex:none; overflow:hidden;
    background:var(--card2); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:17px; color:var(--dim)}
  .face img{width:100%; height:100%; object-fit:cover; display:block}
  .who{flex:1; min-width:0}
  .who .nm{font-size:17px; font-weight:700; line-height:1.2}
  .who .at{font-size:14px; color:var(--dim); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .who .at b{color:var(--txt); font-weight:600}
  .who .at .home{color:var(--live); font-weight:700}
  /* Fix age. Only rendered when it's old enough to matter — a 30-second-old
     phone fix doesn't need a caveat, an hour-old Bluetooth ping does. */
  .age{display:inline-block; font-size:11px; font-weight:600; color:var(--warn);
    background:#2a1f12; border:1px solid #4a3418; border-radius:6px;
    padding:1px 6px; margin-left:6px; vertical-align:1px}
  .age.cold{color:var(--urgent); background:#2a1414; border-color:#4a1e1e}

  .eta{text-align:right; flex:none; min-width:64px}
  .eta .n{font-size:26px; font-weight:800; line-height:1; color:var(--live)}
  .eta .n small{font-size:12px; font-weight:600; color:var(--dim); margin-left:2px}
  .eta .md{font-size:11px; color:var(--dim); margin-top:3px}
  .eta.athome .n{font-size:22px}
  /* A stale ETA is still shown (Jeff's call) but must never read as live. */
  .eta.stale .n{color:var(--dim)}
  .eta.stale .md{color:#6b7a8c}

  .sep{font-size:12px; font-weight:700; letter-spacing:.9px; text-transform:uppercase;
    color:var(--dim); margin:18px 2px 9px}
  .note{background:#1a222e; border:1px dashed var(--line); border-radius:12px;
    padding:12px 14px; color:var(--dim); font-size:13px; margin-bottom:14px}
  .foot{display:flex; justify-content:space-between; align-items:center;
    color:var(--dim); font-size:12px; margin-top:14px}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--dim); display:inline-block}
  .dot.ok{background:var(--live); box-shadow:0 0 8px var(--live)}
  .dot.bad{background:var(--urgent)}
  a.lnk{color:var(--accent); text-decoration:none}
  input[type=password]{width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--card2); color:var(--txt);
    font-size:16px; margin:10px 0}
  button.go{width:100%; padding:13px; border-radius:12px; border:none;
    background:var(--accent); color:#04121f; font-size:15px; font-weight:800}
</style>
</head>
<body>
  <div class="top">
    <div class="title">Family<span class="sub" id="sub">loading…</span></div>
    <button class="refresh" id="refreshBtn">↻</button>
  </div>

  <div id="content"></div>

  <div class="foot">
    <span><span class="dot" id="healthDot"></span> <span id="updated">—</span></span>
    <a class="lnk" id="forgetBtn" href="#">Sign out</a>
  </div>

<script>
const PROXY_URL = 'https://proxy-105885243706.us-east1.run.app';
const POLL_MS   = 30000;   // phone page: slower than the wall display on purpose
const TIMEOUT_MS = 20000;

// Display order. Anyone the proxy reports who isn't listed here still renders,
// just after these — so a new tracker shows up rather than vanishing.
const ORDER = ['HW','JHW','XW','JXW','JE','JN','SY','EL','JU'];
const NAMES = {HW:'Jeff', JHW:'Jeff', XW:'Jenny', JXW:'Jenny', JE:'Jenny',
               JN:'Jenny', SY:'Sydney', EL:'Elizabeth', JU:'Juno'};
const FACES = {HW:'jeff.jpg', JHW:'jeff.jpg', XW:'jenny.jpg', JXW:'jenny.jpg',
               JE:'jenny.jpg', JN:'jenny.jpg', SY:'sydney.jpg',
               EL:'elizabeth.jpg', JU:'juno.jpg'};
const MODE_LABEL = {home:'home', walk:'🚶 walk', bus:'🚌 bus',
                    ferry:'⛴️ ferry', drive:'🚗 drive'};

// Home coords are already public in index.html; used only for the
// "3.2 mi NW" fallback when someone is nowhere we've named.
const HOME = {lat: 40.75202, lon: -74.02816};

// Freshness thresholds. A phone reports every ~30s, so anything past a few
// minutes is genuinely behind; a Tile is Bluetooth-only and routinely stale.
const AGE_SHOW_S = 300;    // start showing the fix age
const AGE_COLD_S = 1800;   // treat the ETA as untrustworthy

let timer = null;

function tokenGet(){ return localStorage.getItem('famToken') || ''; }

function miles(a, b){
  const R = 3958.8, r = Math.PI/180;
  const dLat = (b.lat-a.lat)*r, dLon = (b.lon-a.lon)*r;
  const x = Math.sin(dLat/2)**2 +
            Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function bearing(a, b){
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  const ang = (Math.atan2(b.lon-a.lon, b.lat-a.lat)*180/Math.PI + 360) % 360;
  return dirs[Math.round(ang/45) % 8];
}
function humanAge(s){
  if (s < 90) return Math.round(s) + 's ago';
  const m = s/60;
  if (m < 90) return Math.round(m) + 'm ago';
  return (m/60).toFixed(1) + 'h ago';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function askForToken(msg){
  document.getElementById('content').innerHTML =
    '<div class="note">' + esc(msg || 'Enter the family access token to see locations.') +
    '</div>' +
    '<input type="password" id="tokIn" placeholder="Family token" autocomplete="off">' +
    '<button class="go" id="tokGo">Unlock</button>';
  document.getElementById('tokGo').onclick = function(){
    const v = document.getElementById('tokIn').value.trim();
    if (!v) return;
    localStorage.setItem('famToken', v);
    load();
  };
  document.getElementById('sub').textContent = 'locked';
}

function render(locs){
  // Away-from-home first — that's the actionable half of the list. Within each
  // group, keep the familiar family order.
  const idx = function(t){ const i = ORDER.indexOf(t); return i < 0 ? 99 : i; };
  const away = locs.filter(function(l){ return l.eta_mode !== 'home'; })
                   .sort(function(a,b){ return idx(a.tid) - idx(b.tid); });
  const home = locs.filter(function(l){ return l.eta_mode === 'home'; })
                   .sort(function(a,b){ return idx(a.tid) - idx(b.tid); });

  let html = '';
  if (away.length) html += '<div class="sep">Out</div>' + away.map(row).join('');
  if (home.length) html += '<div class="sep">Home</div>' + home.map(row).join('');
  if (!away.length && !home.length)
    html = '<div class="note">No locations reported. Check the proxy.</div>';
  document.getElementById('content').innerHTML = html;

  const out = away.length;
  document.getElementById('sub').textContent =
    out === 0 ? 'everyone home' : (out + (out === 1 ? ' person out' : ' out'));
}

function row(l){
  const name = NAMES[l.tid] || l.name || l.tid;
  const face = FACES[l.tid];
  const age  = l.fix_age_s == null ? 0 : l.fix_age_s;
  const cold = age >= AGE_COLD_S;

  // Where they are: a named place if we know one, otherwise distance+direction.
  let at;
  if (l.eta_mode === 'home')  at = '<span class="home">Home</span>';
  else if (l.place)           at = 'at <b>' + esc(l.place) + '</b>';
  else {
    const d = miles(HOME, {lat: l.lat, lon: l.lon});
    at = '<b>' + d.toFixed(1) + ' mi ' + bearing(HOME, {lat: l.lat, lon: l.lon}) + '</b>';
  }
  // Only caveat a fix once it's old enough to matter.
  if (age >= AGE_SHOW_S)
    at += '<span class="age' + (cold ? ' cold' : '') + '">' + humanAge(age) + '</span>';

  let eta;
  if (l.eta_mode === 'home') {
    eta = '<div class="eta athome"><div class="n">🏠</div><div class="md">home</div></div>';
  } else if (l.eta_min != null) {
    eta = '<div class="eta' + (cold ? ' stale' : '') + '">' +
          '<div class="n">' + l.eta_min + '<small>m</small></div>' +
          '<div class="md">' + (MODE_LABEL[l.eta_mode] || '') + '</div></div>';
  } else {
    eta = '<div class="eta"><div class="n" style="color:var(--dim)">—</div></div>';
  }

  // If the portrait 404s, collapse to initials rather than letting the browser
  // render overflowing alt text inside the circle.
  const ini = esc(name.substring(0,2).toUpperCase());
  const faceHtml = face
    ? '<img src="' + face + '" alt="" data-ini="' + ini + '" ' +
      'onerror="this.parentNode.textContent=this.dataset.ini">'
    : ini;

  return '<div class="person">' +
           '<div class="face">' + faceHtml + '</div>' +
           '<div class="who"><div class="nm">' + esc(name) + '</div>' +
             '<div class="at">' + at + '</div></div>' +
           eta +
         '</div>';
}

async function load(){
  const tok = tokenGet();
  if (!tok) { askForToken(); return; }
  const ctl = new AbortController();
  const to  = setTimeout(function(){ ctl.abort(); }, TIMEOUT_MS);
  try {
    const res = await fetch(PROXY_URL + '/?mode=locations', {
      headers: {'X-Fam-Token': tok},   // header only — never a query param,
      signal: ctl.signal,              // which would land in Cloud Run logs
      cache: 'no-store',
    });
    clearTimeout(to);
    if (res.status === 403) {
      localStorage.removeItem('famToken');
      askForToken('That token was rejected. Try again.');
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data.locations || []);
    document.getElementById('healthDot').className = 'dot ok';
    document.getElementById('updated').textContent =
      'updated ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  } catch (e) {
    clearTimeout(to);
    document.getElementById('healthDot').className = 'dot bad';
    document.getElementById('updated').textContent = 'offline — retrying';
  } finally {
    if (timer) clearTimeout(timer);
    timer = setTimeout(load, POLL_MS);
  }
}

document.getElementById('refreshBtn').onclick = function(){ load(); };
document.getElementById('forgetBtn').onclick = function(e){
  e.preventDefault();
  localStorage.removeItem('famToken');
  askForToken('Signed out.');
};
// Standalone PWAs on iOS sometimes report a 0 top inset; the class is a floor.
if (window.navigator.standalone) document.body.classList.add('standalone');
// Refresh the moment the app comes back to the foreground — a phone page is
// usually opened, glanced at, and closed, so the first paint must be current.
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) load();
});
load();
</script>
</body>
</html>
