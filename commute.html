<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<title>Commute</title>
<style>
  :root{
    --bg:#0b0f14; --card:#151b24; --card2:#1b2430; --line:#243040;
    --txt:#eef3f9; --dim:#8ea0b5; --live:#6bffb8;
    --urgent:#ff5050; --warn:#ff9b40; --yellow:#e0c040; --accent:#4aa8ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:max(14px,env(safe-area-inset-top)) 14px calc(24px+env(safe-area-inset-bottom))}
  .top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
  .dir{font-size:22px; font-weight:700; letter-spacing:.2px; display:flex; align-items:center; gap:8px}
  .dir .sub{font-size:12px; font-weight:500; color:var(--dim); display:block}
  .swap{background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer}
  .swap:active{background:var(--line)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px}
  .card h2{margin:0 0 12px; font-size:13px; font-weight:600; letter-spacing:.8px;
    text-transform:uppercase; color:var(--dim)}
  .stop{margin-bottom:16px}
  .stop:last-child{margin-bottom:0}
  .stop .name{font-size:15px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none}
  .dot.live{background:var(--live); box-shadow:0 0 8px var(--live)}
  .dot.inferred{background:var(--warn)}
  .dot.sched{background:var(--dim)}
  .rows{display:flex; flex-direction:column; gap:8px}
  .row{display:flex; align-items:center; gap:12px; background:var(--card2);
    border-radius:12px; padding:12px 14px}
  .badge{font-size:12px; font-weight:800; padding:4px 8px; border-radius:8px;
    background:#0e1620; border:1px solid var(--line); color:var(--accent); flex:none; min-width:42px; text-align:center}
  .mins{font-size:28px; font-weight:800; line-height:1; min-width:70px}
  .mins small{font-size:13px; font-weight:600; color:var(--dim); margin-left:3px}
  .meta{margin-left:auto; text-align:right; font-size:12px; color:var(--dim)}
  .meta .load{color:var(--warn)}
  .tunnel{display:flex; align-items:baseline; gap:10px}
  .tunnel .big{font-size:40px; font-weight:800; line-height:1}
  .tunnel .lbl{font-size:13px; color:var(--dim)}
  .eta{display:flex; align-items:baseline; gap:10px; margin-top:4px}
  .eta .big{font-size:34px; font-weight:800; color:var(--live)}
  .eta .lbl{font-size:13px; color:var(--dim)}
  .empty{color:var(--dim); font-size:14px; padding:8px 2px}
  .note{background:#1a222e; border:1px dashed var(--line); border-radius:12px;
    padding:12px 14px; color:var(--dim); font-size:13px; margin-bottom:14px}
  .foot{display:flex; justify-content:space-between; align-items:center;
    color:var(--dim); font-size:12px; margin-top:6px}
  .foot .stat{display:flex; align-items:center; gap:6px}
  .stale{opacity:.5}
  a.reset{color:var(--accent); text-decoration:none}
</style>
</head>
<body>
  <div class="top">
    <div class="dir" id="dirLabel">
      <span id="dirIcon">🚌</span>
      <span>
        <span id="dirText">Loading…</span>
        <span class="sub" id="dirSub">detecting location</span>
      </span>
    </div>
    <button class="swap" id="swapBtn">⇄ Flip</button>
  </div>

  <div id="content"></div>

  <div class="foot">
    <span class="stat"><span class="dot" id="healthDot"></span><span id="updated">—</span></span>
    <a class="reset" id="autoBtn" href="#">Use my location</a>
  </div>

<script>
const PROXY_URL = 'https://proxy-105885243706.us-east1.run.app';
const POLL_MS = 15000;
const TIMEOUT_MS = 12000;

// Anchors for auto direction detection.
const HOME = {lat: 40.7495, lon: -74.0300};          // central Hoboken
const NYC  = {lat: 40.7570, lon: -73.9903};          // Port Authority Bus Terminal
// Ride model for the inbound "ETA home": free-flow PABT->Hoboken minutes + walk.
const RIDE_BASE_MIN = 18;     // 126 PABT -> Hoboken stop, light traffic
const TUNNEL_FREEFLOW = 8;    // min; anything over this is added delay
const WALK_MIN = 5;

let dir = null;               // 'out' (to NYC) | 'in' (to Hoboken)
let manual = false;           // user flipped/overrode auto
let lastFetchedAt = 0;
let timer = null;

function haversine(a, b){
  const R=3958.8, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLon=toR(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function detectDirection(){
  if (manual) { render(); return; }
  if (!navigator.geolocation){ setDir('out'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const me = {lat: pos.coords.latitude, lon: pos.coords.longitude};
      setDir(haversine(me, NYC) < haversine(me, HOME) ? 'in' : 'out', true);
    },
    () => { if (dir === null) setDir('out'); },   // denied/failed → default outbound
    {enableHighAccuracy:false, timeout:8000, maximumAge:60000}
  );
}

function setDir(d, fromGeo){
  const changed = d !== dir;
  dir = d;
  if (fromGeo) document.getElementById('dirSub').textContent = 'from your location';
  if (changed || fromGeo){ render(); refresh(); }
}

function fetchT(url){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), TIMEOUT_MS);
  return fetch(url, {signal:c.signal, headers:{'Accept':'application/json'}})
    .finally(()=>clearTimeout(t));
}

// Reconcile a proxy countdown (minutes as of fetched_at) against the wall clock.
function liveMins(countdown, fetchedAt){
  const m = parseInt(countdown, 10);
  if (!isFinite(m)) return null;
  const drift = fetchedAt ? Math.floor((Date.now()/1000 - fetchedAt)) / 60 : 0;
  return Math.max(0, Math.round(m - drift));
}

function tunnelColor(tt){
  if (!isFinite(tt)) return 'var(--dim)';
  if (tt >= 35) return 'var(--urgent)';
  if (tt >= 20) return 'var(--warn)';
  if (tt >= 10) return 'var(--yellow)';
  return 'var(--live)';
}

function predRow(p, fetchedAt){
  const m = liveMins(p.countdown, fetchedAt);
  const mode = p.is_inferred ? 'inferred' : (p.is_live ? 'live' : 'sched');
  const label = m === null ? (p.departure_text||'') : (m <= 0 ? 'DUE' : m);
  const unit = (m !== null && m > 0) ? '<small>min</small>' : '';
  const load = (p.passload && !/no data/i.test(p.passload)) ? `<div class="load">${p.passload}</div>` : '';
  const est = p.is_inferred ? '<div>est</div>' : '';
  return `<div class="row">
    <span class="badge">${p.route||'126'}</span>
    <span class="mins">${label}${unit}</span>
    <span class="meta">${load}${est}</span>
  </div>`;
}

function renderStop(name, preds, fetchedAt){
  let mode = 'sched', rows = '';
  if (Array.isArray(preds) && preds.length){
    const any = preds.some(p=>p.is_live), inf = preds.some(p=>p.is_inferred);
    mode = inf ? 'inferred' : (any ? 'live' : 'sched');
    rows = preds.slice(0,4).map(p=>predRow(p, fetchedAt)).join('');
  } else {
    rows = `<div class="empty">No upcoming buses in the feed right now.</div>`;
  }
  return `<div class="stop">
    <div class="name"><span class="dot ${mode}"></span>${name}</div>
    <div class="rows">${rows}</div>
  </div>`;
}

function tunnelCard(tunnel){
  if (!tunnel || tunnel.error){
    return `<div class="card"><h2>Lincoln Tunnel</h2>
      <div class="empty">Tunnel time unavailable.</div></div>`;
  }
  const tt = parseInt(tunnel.travelTime, 10);
  const c = tunnelColor(tt);
  const sub = dir === 'in' ? 'affects your bus ride' : 'crossing to NYC';
  return `<div class="card"><h2>Lincoln Tunnel</h2>
    <div class="tunnel"><span class="big" style="color:${c}">${isFinite(tt)?tt:'--'}</span>
      <span class="lbl">min · ${sub}</span></div></div>`;
}

// Outbound: to NYC. Uses proxy `/` (stops 20490, 20523 + tunnel).
async function refreshOut(){
  const res = await fetchT(PROXY_URL);
  const data = await res.json();
  lastFetchedAt = data.fetched_at || Math.floor(Date.now()/1000);
  const s1 = data.stops && data.stops['20490'];
  const s2 = data.stops && data.stops['20523'];
  let html = `<div class="card"><h2>126 / 119 to Port Authority</h2>`;
  html += renderStop('14th & Bloomfield', s1 && s1.predictions, lastFetchedAt);
  html += renderStop('15th & Willow', s2 && s2.predictions, lastFetchedAt);
  html += `</div>`;
  html += tunnelCard(data.tunnel);
  document.getElementById('content').innerHTML = html;
  markHealth(data);
}

// Inbound: to Hoboken. Uses proxy `?mode=commute_home` (Hoboken-bound 126 from PABT).
// Falls back gracefully until the proxy ships that mode.
async function refreshIn(){
  // Tunnel always comes from `/`.
  let tunnel = null, homeData = null;
  try { const r = await fetchT(PROXY_URL); const d = await r.json(); tunnel = d.tunnel; } catch(e){}
  try {
    const r = await fetchT(PROXY_URL + '?mode=commute_home');
    homeData = await r.json();
  } catch(e){ homeData = {error:'unavailable'}; }

  let html = '';
  const preds = homeData && Array.isArray(homeData.predictions) ? homeData.predictions
              : (homeData && homeData.stop && homeData.stop.predictions) || null;
  const supported = Array.isArray(preds);

  if (!supported){
    html += `<div class="note">Inbound bus times turn on once the proxy update
      (Port Authority → Hoboken) is deployed. Tunnel traffic below is live now.</div>`;
  }
  lastFetchedAt = (homeData && homeData.fetched_at) || Math.floor(Date.now()/1000);
  html += `<div class="card"><h2>126 home from Port Authority</h2>`;
  html += renderStop('Port Authority Bus Terminal', preds, lastFetchedAt);
  html += `</div>`;
  html += tunnelCard(tunnel);

  // ETA home: next departure + tunnel-adjusted ride + walk.
  if (supported && preds.length){
    const next = liveMins(preds[0].countdown, lastFetchedAt) || 0;
    const tt = tunnel && !tunnel.error ? parseInt(tunnel.travelTime,10) : NaN;
    const delay = isFinite(tt) ? Math.max(0, tt - TUNNEL_FREEFLOW) : 0;
    const total = next + RIDE_BASE_MIN + delay + WALK_MIN;
    const arrive = new Date(Date.now() + total*60000);
    const hhmm = arrive.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    html += `<div class="card"><h2>Estimated time home</h2>
      <div class="eta"><span class="big">${total}</span><span class="lbl">min · home by ${hhmm}</span></div>
      <div class="foot" style="margin-top:8px">${next} wait · ${RIDE_BASE_MIN+delay} ride · ${WALK_MIN} walk</div>
    </div>`;
  }
  document.getElementById('content').innerHTML = html;
  markHealth(tunnel && !tunnel.error ? {tunnel} : null);
}

function markHealth(data){
  const dot = document.getElementById('healthDot');
  const ok = !!data;
  dot.className = 'dot ' + (ok ? 'live' : 'inferred');
  document.getElementById('updated').textContent =
    'updated ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}

function render(){
  const out = dir === 'out';
  document.getElementById('dirIcon').textContent = out ? '🚌' : '🏠';
  document.getElementById('dirText').textContent = out ? 'To NYC' : 'Home to Hoboken';
  if (manual) document.getElementById('dirSub').textContent = 'manual';
}

async function refresh(){
  if (document.hidden || dir === null) return;
  try { await (dir === 'out' ? refreshOut() : refreshIn()); }
  catch(e){ console.error(e); markHealth(null); }
}

document.getElementById('swapBtn').addEventListener('click', ()=>{
  manual = true;
  setDir(dir === 'out' ? 'in' : 'out');
});
document.getElementById('autoBtn').addEventListener('click', (e)=>{
  e.preventDefault(); manual = false;
  document.getElementById('dirSub').textContent = 'detecting location';
  detectDirection();
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });

detectDirection();
timer = setInterval(refresh, POLL_MS);
</script>
</body>
</html>
