<!DOCTYPE html>
<!--
  Hoboken Family Dashboard
  ========================
  Charter: A wall display that tells the Warshafskys where their people are
  and what's next. Family presence is the primary use case; transit, weather,
  and alerts are supporting data. Anything that doesn't serve that single
  sentence goes in a "maybe" file, not in here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Hoboken Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23151520'/><path fill='%236bffb8' d='M14 40c0 2.2 1 4.2 2.5 5.5V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-2.5h20V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-4.5c1.5-1.4 2.5-3.3 2.5-5.5V15c0-8.75-8.95-10-20-10S14 6.25 14 15v25zm8.75 2.5c-2.1 0-3.75-1.7-3.75-3.75S20.65 35 22.75 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm22.5 0c-2.1 0-3.75-1.7-3.75-3.75S43.15 35 45.25 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm3.75-15h-30V15h30v12.5z'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23151520'/><path fill='%236bffb8' d='M14 40c0 2.2 1 4.2 2.5 5.5V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-2.5h20V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-4.5c1.5-1.4 2.5-3.3 2.5-5.5V15c0-8.75-8.95-10-20-10S14 6.25 14 15v25zm8.75 2.5c-2.1 0-3.75-1.7-3.75-3.75S20.65 35 22.75 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm22.5 0c-2.1 0-3.75-1.7-3.75-3.75S43.15 35 45.25 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm3.75-15h-30V15h30v12.5z'/></svg>">
<style>
  /* ─────────────────────────────────────────────────────────────────
     Design tokens — keep all radii, font sizes, and key colors here.
     New panels MUST reuse these instead of introducing new values.
     ───────────────────────────────────────────────────────────────── */
  :root {
    /* Border radii */
    --r-card:  14px;
    --r-chip:  8px;
    --r-pill:  999px;
    --r-badge: 4px;

    /* Font sizes (4-tier + 1 sub for emphasis numbers) */
    --fs-micro: 0.6rem;   /* tiny labels (badges, day headers, micro status) */
    --fs-label: 0.75rem;  /* secondary text */
    --fs-body:  0.95rem;  /* primary readable content */
    --fs-sub:   1.4rem;   /* secondary numbers (tunnel min, hop ETA) */
    --fs-hero:  2.4rem;   /* time, temperature */

    /* Semantic colors */
    --c-live:   #6bffb8;  /* GREEN: reserved for live-state ONLY */
    --c-urgent: #ff6b6b;  /* RED: actionable urgency (≤5min bus, alerts) */
    --c-warn:   #ffb84d;  /* AMBER: warnings */
    --c-text:   #e8e8ec;
    --c-label:  #9a9aa8;
    --c-mute:   #888;
    --c-deep:   #0a0a0f;
    --c-border: #2a2a35;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    background: #000;
    color: #e8e8ec;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 0.67fr 1.62fr 0.97fr;
    grid-template-rows: 1fr auto auto;
    gap: 10px;
    padding: 12px;
  }

  /* TV simulation mode — body becomes a fixed 930x539 surface (the Onn's
     effective CSS viewport) that's scaled
     to fit the browser window. Activate by adding ?tv to the URL. */
  html.tv-sim {
    background: #000;
    overflow: hidden;
  }
  html.tv-sim body {
    width: 930px;
    height: 539px;
    transform-origin: top left;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* Cards */
  .card {
    background: #0a0a0f;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 0.5px solid #2a2a35;
  }

  .card-title {
    font-size: var(--fs-micro);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9a9aa8;
    margin-bottom: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-title svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  /* Weather card — bottom-right. Three vertical zones:
       1) HERO  : big icon + hero temp + desc + hi/lo + rain pill
       2) HOURLY: 7-step hourly forecast strip
       3) STATS : wind / humidity / pollen as 3 labeled stat blocks
     Sized to fit ~2× transit-card height × column-3 width. */
  .weather-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
    padding: 14px 12px;
  }

  .weather-main { display: contents; }  /* transparent wrapper */

  /* HERO ROW ------------------------------------------------------- */
  /* Three elements: summary (left) | icon (center) | temp (right), all on
     one line at the same height, sitting just above the forecast strip. */
  .weather-top {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 0;
    padding: 2px 6px;
  }

  .weather-icon {
    flex-shrink: 0;
    /* amcharts SVGs have ~15% padding inside the 64-unit viewBox, so the
       visible art is ~85% of the box. */
    width: 86px;
    height: 86px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .weather-icon img.wi { width: 100%; height: 100%; }

  /* Weather icon animations live INSIDE each amcharts SVG file under icons/.
     Sun and moon stay still (we stripped their rotation rules); clouds drift,
     rain falls, snow drifts, lightning flickers. CSS in this dashboard does
     not reach into the SVG sandbox when loaded via <img> — that's by design,
     animations are self-contained per-icon. */

  /* Summary block sits in the MIDDLE of the hero — description on top,
     hi/lo and rain pill below. Centered text so it reads as the middle
     anchor between icon (left) and temp (right). No flex:1 — it shrinks
     to its content width so space-evenly can distribute the gaps. */
  .weather-summary {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }

  .weather-temp {
    flex-shrink: 0;
    font-size: 1.9rem;   /* a touch smaller so it stops crowding the forecast text */
    font-weight: 200;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .weather-desc {
    font-size: 1.05rem;
    color: #e0e0e6;
    line-height: 1.2;
    font-weight: 400;
    /* description can wrap if it's long (e.g. "Thunderstorm + heavy hail") */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .weather-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px 10px;
    margin-top: 3px;
    font-size: var(--fs-label);
    color: var(--c-mute);
    white-space: nowrap;
  }
  .weather-meta .wm-hilo { color: var(--c-mute); }
  .weather-meta .wm-hilo span { color: #cfcfd6; font-weight: 500; }

  /* Rain probability — small amber pill, only visible when JS sets display:flex */
  #weatherRain {
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    background: rgba(240, 192, 64, 0.10);
    border: 0.5px solid rgba(240, 192, 64, 0.35);
    border-radius: var(--r-pill);
    color: #f0c040;
    font-size: var(--fs-micro);
    font-weight: 600;
    line-height: 1;
  }
  #weatherRain svg { flex-shrink: 0; }

  /* HOURLY FORECAST ----------------------------------------------- */
  .weather-forecast {
    display: flex;
    flex-direction: row;
    gap: 0;
    justify-content: space-between;
    align-items: center;
    border-top: 0.5px solid #1e1e2e;
    border-bottom: 0.5px solid #1e1e2e;
    padding: 7px 2px;
  }

  .weather-hour {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex: 1;
    min-width: 0;
  }

  .weather-hour .wh-time {
    font-size: var(--fs-micro);
    color: var(--c-label);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .weather-hour .wh-icon {
    line-height: 1;
    opacity: 0.95;
  }
  .weather-hour .wh-icon img { width: 22px; height: 22px; display: block; }

  .weather-hour .wh-temp {
    font-size: var(--fs-label);
    font-weight: 500;
    color: #e0e0e6;
    line-height: 1;
  }

  /* STATS ROW (wind / humidity / pollen / UV) ---------------------- */
  .weather-details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 2px 2px 0;
  }

  .weather-details .wd-stat + .wd-stat {
    border-left: 0.5px solid #1e1e2e;
    padding-left: 8px;
  }

  .weather-details .wd-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1;
  }

  .weather-details .wd-label {
    font-size: var(--fs-micro);
    color: var(--c-label);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  .weather-details .wd-value {
    font-size: var(--fs-body);
    color: #e0e0e6;
    font-weight: 500;
    line-height: 1;
  }

  .weather-details .wd-unit {
    font-size: var(--fs-micro);
    color: var(--c-mute);
    margin-left: 1px;
    font-weight: 400;
  }

  /* Calendar — top row, right column */
  #calCard {
    grid-row: 1;
    grid-column: 3;
  }

  /* Map card — top row, spans left two columns */
  #mapCard {
    grid-row: 1;
    grid-column: 1 / 3;
    padding: 0;
    overflow: hidden;
  }

  /* Late mode (weekday after 5pm, weekend after 9pm):
     hide bus + ferry, let map take the full left height. */
  body.late-mode #busCard,
  body.late-mode #ferryCard { display: none; }
  body.late-mode #mapCard   { grid-row: 1 / 4; }

  /* Weather card — bottom right, spans bus + ferry rows */
  #weatherCard {
    grid-row: 2 / 4;
    grid-column: 3;
  }

  /* Artwork fills the map's slot rather than taking a slot of its own, so the
     3x3 grid and late-mode's re-spanning stay exactly as they were. */
  #artPanel {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: var(--c-card, #12161c); gap: 10px; padding: 14px;
  }
  body.show-art #artPanel { display: flex; }
  body.show-art #hobokenMap,
  body.show-art #mapStatusOverlay { display: none; }
  #artPanel img {
    max-width: 100%; max-height: 100%; min-height: 0; flex: 1 1 auto;
    object-fit: contain; border-radius: 10px;
  }
  #artCaption { font-size: var(--fs-small, 15px); color: var(--c-mute, #8ea0b5); flex: 0 0 auto; }

  /* ---- Frame mode ---------------------------------------------------------
     Full-screen artwork floating in a museum mat, after the Samsung Frame. The
     whole dashboard goes away — that is the point of it — so this is the only
     thing on the panel. --mat is the one knob worth turning if the room wants a
     different board colour. */
  #frameMode { display: none; }
  body.frame-mode #frameMode {
    display: flex; position: fixed; inset: 0; z-index: 1500;
    flex-direction: column; align-items: center; justify-content: center;
    /* TWO declarations, and the literal MUST come first. This was
       `background: var(--mat, #e6dfd3)` and the mat came out near-black on the
       actual wall: the Google TV stick's WebView drops a whole declaration when
       var() appears inside a SHORTHAND, so the board colour never applied and
       the gradient below composited over the dashboard's dark page instead.
       The longhand takes the variable if the engine supports it and is simply
       ignored if not, leaving the literal standing. */
    background-color: #e6dfd3;
    background-color: var(--mat, #e6dfd3);
    /* Mat board is never a flat fill — across 65" a dead-even colour reads as a
       blank screen rather than as paper, so a very slight centre lift and edge
       fall-off stand in for the way a real mat catches room light. */
    background-image: radial-gradient(115% 85% at 50% 36%,
      rgba(255,255,255,.5), rgba(0,0,0,.04) 62%, rgba(0,0,0,.13));
  }
  body.frame-mode > *:not(#frameMode) { display: none !important; }

  /* The window hugs the artwork exactly (inline-block on a block image), which
     is what makes the bevel read as a mat CUT to the picture rather than a box
     the picture happens to sit in. */
  .fr-window { display: inline-block; line-height: 0; position: relative; }
  .fr-window img {
    display: block; max-width: 72vw; max-height: 70vh;
    opacity: 0; transition: opacity .55s ease;
  }
  .fr-window img.in { opacity: 1; }
  /* cut edge · the light catching the bevel · recess · the shadow it throws */
  .fr-window::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow:
      inset 0 0 0 1px rgba(58,46,32,.30),
      0 1px 0 2px rgba(255,255,255,.5),
      0 3px 7px rgba(0,0,0,.17),
      0 26px 55px rgba(0,0,0,.19);
  }
  .fr-plate {
    margin-top: 30px; text-align: center; line-height: 1.5;
    font-size: 15px; font-weight: 700; letter-spacing: .17em;
    text-transform: uppercase; color: rgba(52,42,30,.62);
  }
  .fr-plate .who {
    display: block; margin-top: 4px; font-size: 14px; font-weight: 600;
    letter-spacing: .06em; text-transform: none; color: rgba(52,42,30,.44);
  }
  /* The comment ticker is MOVED into the mat in frame mode rather than
     duplicated, so it keeps one implementation — but it was styled for a dark
     panel, so the colours have to flip for the board. */
  body.frame-mode #artTicker {
    max-width: 72vw; margin-top: 20px; padding-top: 10px;
    border-top: 1px solid rgba(58,46,32,.16);
  }
  body.frame-mode #artTickerTrack { font-size: 15px; color: rgba(52,42,30,.6); }
  body.frame-mode #artTickerTrack .who { color: rgba(124,72,20,.85); }
  body.frame-mode #artTickerTrack .sep { color: rgba(52,42,30,.3); }
  /* A note posted from the phone still has to reach the wall — frame mode hides
     the panel that normally carries it, so it is mirrored onto the mat. */
  #frameMsg { display: none; }
  /* IN FLOW, not absolutely pinned to the bottom: pinned, it landed directly on
     top of the comment ticker and both became unreadable. In the flex column the
     mat simply re-centres around whatever is present. */
  body.frame-mode.has-wall-msg #frameMsg {
    display: block; margin-top: 22px; max-width: 78vw;
    background: rgba(28,22,14,.88); color: #fdf9f2; padding: 11px 24px;
    border-radius: 999px; font-size: 17px; font-weight: 600; text-align: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }

  /* What the family said about the picture that is up, scrolling along the
     bottom. Hidden entirely when a piece has no comments, so the artwork keeps
     the full height rather than sitting above an empty strip. */
  #artTicker {
    flex: 0 0 auto; align-self: stretch; overflow: hidden; white-space: nowrap;
    border-top: 1px solid rgba(255,255,255,.08); padding-top: 7px; margin-top: 2px;
  }
  #artTicker[hidden] { display: none; }
  #artTickerTrack {
    display: inline-block; padding-left: 100%;   /* start just off the right edge */
    font-size: var(--fs-small, 15px); color: var(--c-text, #dbe4ef);
    animation: artScroll linear infinite;
  }
  #artTickerTrack .who { color: var(--c-accent, #f0a45a); font-weight: 700; }
  #artTickerTrack .sep { color: var(--c-mute, #8ea0b5); padding: 0 14px; }
  @keyframes artScroll { to { transform: translateX(-100%); } }
  /* A panel switched off from the phone. */
  body .card.panel-off { display: none !important; }

  #mapCard { position: relative; }
  #mapCard #hobokenMap { width: 100%; height: 100%; }

  /* View-mode toast — top-right of map, fades in/out on OK-button cycles. */
  #viewModeToast {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 600;
    pointer-events: none;
    background: rgba(10, 10, 15, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: var(--r-pill, 12px);
    padding: 5px 12px;
    font-size: var(--fs-label);
    font-weight: 600;
    color: #e8e8ec;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #viewModeToast.show { opacity: 1; }


  /* Overlay showing when each person last updated — one pill per person,
     sitting in the bottom-left corner of the map. */
  #mapStatusOverlay {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 1000;
    pointer-events: none;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ms-pill {
    background: rgba(0, 0, 0, 0.55);
    padding: 3px 9px;
    border-radius: 12px;
    /* fs-label, not micro — this pill is the most charter-critical text on
       screen ("Jeff · on 126 · 30s ago") and must read from 10 feet. */
    font-size: var(--fs-label);
    color: #ddd;
    line-height: 1.3;
    white-space: nowrap;
  }
  .ms-name { color: #fff; font-weight: 600; }
  .ms-status { color: #ddd; margin-left: 5px; }
  /* Freshness-pill tinting matches map-marker decay. */
  .ms-pill--warm .ms-status { color: #f0c040; }
  .ms-pill--warm .ms-ago    { color: #f0c040; }
  .ms-pill--cold            { opacity: 0.6; }
  .ms-pill--cold .ms-status { color: #a0a0b0; font-style: italic; }
  .ms-pill--cold .ms-ago    { color: #a0a0b0; }
  .ms-ago { color: #777; margin-left: 5px; font-size: var(--fs-micro); }

  /* Wall message — a note Jeff or Jenny types at /message.html. Overlaid on
     the bottom of the map (the least information-dense panel) rather than
     given a grid row, because every panel here uses explicit grid placement
     and late-mode re-spans the map. Only rendered when a message is active,
     so it costs nothing the rest of the time. */
  #wallMsg {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    z-index: 1200;
    pointer-events: none;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 9px 13px;
    border-radius: var(--r-chip);
    border-left: 3px solid var(--c-live);
    background: rgba(10, 10, 15, 0.86);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #wallMsg[hidden] { display: none; }
  .wm-text {
    font-size: var(--fs-body);
    font-weight: 600;
    color: var(--c-text);
    line-height: 1.25;
    /* Two lines max — a note longer than that stops being glanceable, and the
       service caps input at 120 chars so this rarely triggers. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .wm-from {
    font-size: var(--fs-label);
    color: var(--c-label);
    white-space: nowrap;
    margin-left: auto;
  }
  /* Shift the freshness pills up so the note never covers them. */
  body.has-wall-msg #mapStatusOverlay { bottom: 46px; }

  /* ---- Away insets --------------------------------------------------------
     A small live map of whoever is out of the house, pinned to the corner of
     the wall map that matches their DIRECTION from the house: north-east of
     home lands top-right, south-west lands bottom-left. The corner carries the
     bearing, so the box itself only has to answer "where exactly" — the wall
     map behind it keeps the overview, the inset is the close-up you can read a
     street off. Sized in % so the tailnet/phone view scales with it; no
     aspect-ratio here, the Onn's WebView is too old to bet on it. */
  :root { --pip-w: 24%; --pip-h: 44%; --pip-gap: 8px; }
  .loc-pip {
    position: absolute;
    z-index: 700;
    display: none;
    width: var(--pip-w);
    height: var(--pip-h);
    border-radius: var(--r-chip);
    overflow: hidden;
    background: #0a0a0f;
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
  }
  .loc-pip.on { display: block; }
  .loc-pip > div { width: 100%; height: 100%; }
  .pip-tl { top: var(--pip-gap);    left: var(--pip-gap); }
  .pip-tr { top: var(--pip-gap);    right: var(--pip-gap); }
  .pip-bl { bottom: var(--pip-gap); left: var(--pip-gap); }
  .pip-br { bottom: var(--pip-gap); right: var(--pip-gap); }
  /* Artwork owns the whole card when it's up. */
  body.show-art .loc-pip { display: none !important; }
  /* The bottom corners share that strip with the freshness pills and the wall
     note. Narrow those rather than stacking on top of them — the pill row is
     bottom-anchored and flex-wrap, so it grows upward once it has a right edge
     to wrap against.
     The pill row ships with only a `left`, so the bl rule also hands it a right
     edge — without one it can't wrap and just runs under the inset. Do NOT add
     "restore the other edge" rules here: both classes can be on the body at
     once, and a later `left: 8px` from the br rule silently undid the bl
     narrowing (caught 2026-08-01 — pills ran the full width over both boxes).
     Each rule now touches only the edge it owns. */
  body.has-pip-bl #mapStatusOverlay,
  body.has-pip-bl #wallMsg {
    left: calc(var(--pip-w) + var(--pip-gap) * 2);
    right: var(--pip-gap);
  }
  body.has-pip-br #mapStatusOverlay,
  body.has-pip-br #wallMsg { right: calc(var(--pip-w) + var(--pip-gap) * 2); }
  body.has-pip-tr #viewModeToast { right: calc(var(--pip-w) + var(--pip-gap) * 2); }

  /* Inset face + its own age. There is NO staleness cutoff on the insets: the
     girls' Tiles legitimately go 13h between fixes (they don't update
     overnight), so a phone-calibrated cutoff would mean the two people you most
     want a "where are they" box for never get one. The fix is shown instead
     with its age attached, decaying on the same ladder as the map markers, so
     an old position reads as old rather than being hidden or (worse) presented
     as live. Per-face, not per-box, so a fresh dot sharing a corner with a
     stale one isn't tarred with the other's age. */
  .pip-person { text-align: center; background: none; border: 0; }
  .pip-person .pf-face {
    width: 28px; height: 28px; margin: 0 auto;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.55);
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.65);
    overflow: hidden;
    background: #3a3a48;
    color: #000;
    font-weight: 700;
    font-size: var(--fs-micro);
    line-height: 26px;
  }
  .pip-person .pf-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pip-person .pf-age {
    display: inline-block;
    margin-top: 2px;
    padding: 0 4px;
    border-radius: var(--r-badge);
    background: rgba(0, 0, 0, 0.62);
    font-size: var(--fs-micro);
    font-weight: 600;
    line-height: 1.5;
    color: #ddd;
  }
  /* Same tiers as .ms-pill / .person-marker so one glance reads consistently. */
  .pip-person.stale-recent .pf-face { opacity: 0.92; }
  .pip-person.stale-warm  .pf-face { opacity: 0.8;  border-style: dashed; }
  .pip-person.stale-cold  .pf-face { opacity: 0.65; border-style: dashed; }
  .pip-person.stale-warm  .pf-age  { color: var(--c-warn); }
  .pip-person.stale-cold  .pf-age  { color: #a0a0b0; font-style: italic; }

  /* Calendar events (rendered from Google Calendar API) */
  .cal-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    padding-right: 4px;
  }

  .cal-content::-webkit-scrollbar { width: 0; }

  .cal-day-header {
    font-size: var(--fs-micro);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6bffb8;
    margin: 6px 0 3px 0;
    padding-bottom: 2px;
    border-bottom: 0.5px solid #1a1a28;
  }

  .cal-day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .cal-header-time {
    font-weight: 700;
    font-size: 1.15rem;
    color: #fff;
    /* Slight negative tracking + stretch keeps the glyphs narrower so the
       date label on the left and the clock on the right don't crowd each
       other on the TV's narrow calendar column. */
    letter-spacing: -0.03em;
    font-stretch: 85%;
    text-transform: none;
    white-space: nowrap;
  }

  .cal-day-header:first-child { margin-top: 0; }

  .cal-day-header.is-today {
    color: #fff;
    font-size: 1.15rem;
    margin-bottom: 8px;
    white-space: nowrap;
    letter-spacing: -0.03em;
    font-stretch: 85%;
  }
  .cal-day-header.is-future { color: #9a9aa8; }

  /* Morning commute estimate — one line per family commuter under the
     TODAY day header (Mon-Fri 7:00-10:30 AM). Same font size as a
     cal-event so each line reads as a calendar-style item, not a banner.
     The minute count picks up amber when that person's commute is tight. */
  .cal-commute {
    font-size: var(--fs-label);
    color: #cfcfd6;
    padding: 2px 0;
    line-height: 1.25;
  }
  .cal-commute .commute-min {
    font-weight: 600;
    color: #fff;
  }
  .cal-commute.tight .commute-min { color: #ff9b40; }

  .cal-event {
    padding: 2px 0;
    font-size: var(--fs-label);
    line-height: 1.25;
  }

  .cal-event-time {
    color: #888;
    font-weight: 500;
    font-size: var(--fs-micro);
    margin-left: 4px;
    white-space: nowrap;
  }

  .cal-leave-by {
    color: #ffb84d;
    font-size: var(--fs-micro);
    font-weight: 600;
    margin-top: 1px;
  }
  .cal-leave-mode {
    color: #aaa;
    font-weight: 400;
  }

  .cal-event-title {
    color: #e8e8ec;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-event.all-day .cal-event-time { color: #9a9aa8; }

  .cal-empty, .cal-signin-prompt {
    font-size: var(--fs-label);
    color: #9a9aa8;
    padding: 20px 8px;
    text-align: center;
  }

  .cal-signin-btn {
    background: #6bffb8;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 14px 28px;
    font-size: var(--fs-body);
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    outline: none;
  }

  .cal-signin-btn:focus {
    box-shadow: 0 0 0 3px #fff;
    transform: scale(1.05);
  }

  /* Alerts now stacked inside the calendar card (right column) */
  .cal-alert-divider {
    border-top: 0.5px solid #2a2a35;
    margin: 8px -12px 6px -12px;
  }

  .alerts-list {
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 50%;
  }

  .alert-item {
    font-size: var(--fs-micro);
    line-height: 1.3;
    color: #ccc;
    padding: 3px 0;
    border-bottom: 0.5px solid #1a1a28;
  }

  .alert-item:last-child { border-bottom: none; }

  .alert-item.is-alert {
    color: #ff9b6b;
    font-weight: 600;
  }

  .alert-badge {
    display: inline-block;
    font-size: var(--fs-micro);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 4px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .alert-badge.njt {
    background: #c0392b;
    color: #fff;
  }

  .alert-badge.nixle {
    background: #e67e22;
    color: #fff;
  }

  .alert-badge.news {
    background: #2a2a3a;
    color: #888;
  }

  /* Hide Leaflet controls — we want a clean ambient view */
  .leaflet-control-zoom,
  .leaflet-control-attribution {
    display: none !important;
  }

  /* Custom location markers */
  .person-marker {
    width: 44px !important;
    height: 44px !important;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.55);
    box-shadow: 0 0 6px rgba(0,0,0,0.65);
    overflow: hidden;
    background: #3a3a48;
    color: #000;
    font-weight: 700;
    font-size: var(--fs-label);
    line-height: 44px;
    text-align: center;
    transition: opacity 0.5s ease, filter 0.5s ease;
  }

  /* Freshness ladder. Fresh markers are full color; older positions fade
     a touch (and pick up a dashed border) so the family doesn't trust
     frozen coordinates as live — but faces remain recognizable. Color is
     preserved at every tier. */
  .person-marker.stale-recent { opacity: 0.92; }
  .person-marker.stale-warm   { opacity: 0.8; border-style: dashed; }
  .person-marker.stale-cold   { opacity: 0.65; border-style: dashed; }

  .person-marker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Smaller "orbit" face used when a person is at home — bumped from 20→28
     so faces are still recognizable around the house badge. */
  .person-marker.small {
    width: 28px !important;
    height: 28px !important;
    line-height: 26px;
    font-size: var(--fs-micro);
    border-width: 1.5px;
  }

  .home-marker {
    width: 24px !important;
    height: 24px !important;
    background: rgba(58, 123, 213, 0.85);
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.35);
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
    display: flex !important;
    align-items: center;
    justify-content: center;
  }
  .home-marker svg { width: 16px; height: 16px; }

  .bus-marker {
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
  }
  .leaflet-tooltip.bus-tip {
    background: rgba(10, 10, 15, 0.92);
    color: #e8e8ec;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .leaflet-tooltip.bus-tip::before { display: none; }
  /* NJT bus marker — NJTbus.png logo + direction arrow above (NY-bound) or
     below (return). Sizes are written inline by _busSvg() based on the
     map-zoom-derived scale, so we just provide the layout primitives here
     (column flex, centered, body clipped to a circle). */
  .bus-marker .nbm-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .bus-marker .nbm-body {
    display: block;
    /* NJTbus.png has a white square background — clip to circle to match
       the round logo and avoid white corners against the dark map. */
    border-radius: 50%;
    clip-path: circle(50%);
  }
  .bus-marker .nbm-arrow { display: block; }

  /* Hoboken Hop shuttle marker — bus icon, color is set inline per bus
     (red for Red Hop, green for Green Hop) */
  .hop-marker {
    width: 22px !important;
    height: 22px !important;
    background: transparent;
    border: none;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
  }

  /* Tile (Life360) tracker markers — purple */
  .tile-marker {
    width: 26px !important;
    height: 26px !important;
    background: #c870ff;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.45);
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
    font-size: var(--fs-body);
    font-weight: 700;
    color: #000;
    line-height: 22px;
    text-align: center;
  }

  /* Transit cards - full width.
     min-height keeps bus and ferry visually equal even when the ferry has
     only one route to display (bus shows 126 + 119, naturally taller).
     Compact padding lets map + calendar (row 1) take more vertical space. */
  .transit-card {
    grid-column: 1 / 3;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 6px 12px;
    min-height: 86px;
  }

  .transit-icon {
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .transit-icon svg {
    width: 32px;
    height: 32px;
    fill: #555;
  }

  .transit-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .transit-title {
    font-size: var(--fs-micro);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9a9aa8;
    margin-bottom: 2px;
  }

  .transit-routes {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: flex-start;
    overflow: hidden;
  }

  /* Stale-panel dimmer: applied when a source has been offline >5 min, so
     frozen countdowns don't masquerade as live data. */
  .panel-stale { opacity: 0.4; filter: grayscale(0.5); transition: opacity 0.4s, filter 0.4s; }

  .route-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .route-label {
    /* fs-label, not micro — at 10 feet the countdown numbers were readable
       but the route they belonged to wasn't. */
    font-size: var(--fs-label);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #9a9aa8;
    white-space: nowrap;
    min-width: 74px;
    flex-shrink: 0;
  }

  .dep-row {
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
  }

  .dep-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    background: #1a1a2a;
    padding: 3px 6px;
    border-radius: 6px;
    width: 64px;   /* +4px headroom for the larger --fs-sub countdown */
    text-align: center;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  .dep-chip:first-child {
    background: #1a2a1a;
  }

  .dep-chip .cd-unit {
    font-size: 0.65em;
    font-weight: 400;
  }

  .dep-chip .t {
    font-size: var(--fs-micro);
    font-weight: 400;
    color: #888;
    order: 2;
    line-height: 1.1;
  }

  .dep-chip:first-child .t {
    font-size: var(--fs-micro);
  }

  .dep-chip .cd {
    font-size: var(--fs-sub);   /* match tunnel/hop big-number size — the catchable
                                   bus countdown is the most decision-relevant number
                                   on the wall and shouldn't be out-sized by traffic. */
    font-weight: 600;
    color: #fff;
    order: 1;
    line-height: 1.1;
  }

  .tunnel-traffic {
    flex-shrink: 0;
    text-align: center;
    padding: 0 14px;
    border-left: 0.5px solid #1e1e2e;
    margin-left: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 130px;
    box-sizing: border-box;
    align-self: stretch;
  }

  .tunnel-label {
    font-size: var(--fs-micro);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9a9aa8;
    margin-bottom: 2px;
  }

  .tunnel-time {
    font-size: var(--fs-sub);
    font-weight: 300;
    color: #fff;
  }

  .tunnel-min {
    font-size: var(--fs-label);
    color: #888;
  }

  .tunnel-status {
    font-size: var(--fs-micro);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .no-service {
    font-size: var(--fs-label);
    color: #6a6a78;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .no-service svg { width: 11px; height: 11px; flex-shrink: 0; opacity: 0.8; }
  /* Three flavors of "nothing to show right now": */
  /* 1) Intentional emptiness — service is asleep / not running today */
  .no-service.is-asleep   { color: #6a6a78; }
  /* 2) Schedule fallback — proxy didn't return live predictions but we know
        when the next scheduled departure is */
  .no-service.is-fallback { color: #9a9aa8; }
  /* 3) Honest error — needs to read amber, not the same as quiet emptiness */
  .no-service.is-error    { color: #f0c040; }

  /* Bus headlights — green when API live, orange when inferred from
     vehicle positions, red when falling back to static schedule. */
  .bus-headlight { filter: none; }
  .bus-headlight.live { fill: #6bffb8; }
  .bus-headlight.inferred { fill: #ffa040; }
  .bus-headlight.schedule { fill: #c0392b; }

  /* Ferry wave animation (only when active) */
  .ferry-wave {
    transform-origin: center;
  }

  .ferry-wave.active {
    animation: ferry-wave-move 2.5s ease-in-out infinite;
  }

  @keyframes ferry-wave-move {
    0%, 100% { transform: translateX(-1.5px); }
    50% { transform: translateX(1.5px); }
  }

  /* Pause animations during sleep mode to save CPU/GPU on slow hardware.
     Note: weather-icon animations live inside each <img>-loaded SVG and
     can't be reached from this stylesheet (SVG runs sandboxed). They keep
     animating during sleep — typically not visible since sleep hides body. */
  body.sleeping .ferry-wave {
    animation-play-state: paused;
  }

  /* Respect user/system reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    .ferry-wave.active {
      animation: none !important;
    }
  }

  .status-bar {
    position: fixed;
    bottom: 1px;
    right: 14px;
    left: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: var(--fs-micro);
    color: #555;
    pointer-events: none;
    line-height: 1;
  }

  .status-warning {
    color: #ffb84d;
    font-weight: 600;
  }

  .status-ok { color: #666; }

  @media (max-width: 800px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto auto;
    }
    #calCard, #alertsCard, #weatherCard { grid-row: auto; grid-column: auto; }
    .transit-card { grid-column: auto; flex-direction: column; align-items: flex-start; }
    .weather-temp { font-size: var(--fs-hero); }
    .weather-forecast { flex-direction: row; flex-wrap: wrap; }
  }
    /* camera-feed overlay (Front rapid snapshots / Lower Door frames) */
    .cam-overlay{position:absolute;inset:0;background:#000;z-index:30;border-radius:inherit;overflow:hidden}
    .cam-overlay img{width:100%;height:100%;object-fit:cover;display:block}
    .cam-label{position:absolute;left:8px;bottom:8px;padding:2px 9px;border-radius:7px;background:rgba(0,0,0,.62);color:#fff;font-weight:700;font-size:13px;letter-spacing:.2px}
</style>
</head>
<body>

<!-- Row 1-2: Map (middle, always visible, fills its panel) -->
<div class="card" id="mapCard">
  <div id="hobokenMap"></div>
  <div id="artPanel">
    <img id="artImg" alt="">
    <div id="artCaption"></div>
    <div id="artTicker" hidden><div id="artTickerTrack"></div></div>
  </div>
  <div class="loc-pip pip-tl" id="pip-tl"><div id="pipmap-tl"></div></div>
  <div class="loc-pip pip-tr" id="pip-tr"><div id="pipmap-tr"></div></div>
  <div class="loc-pip pip-bl" id="pip-bl"><div id="pipmap-bl"></div></div>
  <div class="loc-pip pip-br" id="pip-br"><div id="pipmap-br"></div></div>
  <div id="mapStatusOverlay"></div>
  <div id="wallMsg" hidden>
    <div class="wm-text" id="wallMsgText"></div>
    <div class="wm-from" id="wallMsgFrom"></div>
  </div>
</div>

<!-- Row 1-2: Calendar + Alerts (right column, stacked with divider) -->
<div class="card" id="calCard">
  <div class="cal-content" id="calContent">
    <div class="cal-signin-prompt" id="calSigninPrompt" style="display:none;"></div>
    <div id="calEvents"></div>
  </div>
  <div class="cal-alert-divider"></div>
  <div class="alerts-list" id="alertsList">
    <div class="alert-item" style="color:#444;">Loading...</div>
  </div>
</div>

<!-- Row 2: Weather (below clock, left) -->
<div class="card weather-card" id="weatherCard">
      <div id="camOverlay" class="cam-overlay" style="display:none"><img id="camImg" alt="camera"><div id="camLabel" class="cam-label"></div></div>
  <div class="weather-main">
    <!-- Hero row: desc + hi/lo + rain (left) | icon (center) | temp (right) -->
    <div class="weather-top">
      <div class="weather-summary">
        <div class="weather-desc" id="weatherDesc">Loading...</div>
        <div class="weather-meta">
          <div class="wm-hilo">Hi&nbsp;<span id="weatherHi">--</span>&deg;&nbsp;&middot;&nbsp;Lo&nbsp;<span id="weatherLo">--</span>&deg;</div>
          <div id="weatherRain" style="display:none;"><svg viewBox="0 0 24 24" width="11" height="11" fill="#f0c040"><path d="M17 13.96c0 .61-.49 1.1-1.1 1.1H15v6c0 .55-.45 1-1 1s-1-.45-1-1v-6h-2v6c0 .55-.45 1-1 1s-1-.45-1-1v-6H8.1c-.61 0-1.1-.49-1.1-1.1 0-3.86 2.5-7.05 5-7.45V5c0-.55.45-1 1-1s1 .45 1 1v1.51c2.5.4 5 3.59 5 7.45z"/></svg><span id="weatherRainPct">--</span>% rain</div>
        </div>
      </div>
      <div class="weather-icon" id="weatherIcon">--</div>
      <div class="weather-temp" id="weatherTemp">--&deg;F</div>
    </div>
  </div>
  <div class="weather-forecast" id="weatherForecast"></div>
  <div class="weather-details">
    <div class="wd-stat"><div class="wd-label">Wind</div><div class="wd-value"><span id="weatherWind">--</span><span class="wd-unit">mph</span></div></div>
    <div class="wd-stat"><div class="wd-label">Humidity</div><div class="wd-value"><span id="weatherHumidity">--</span><span class="wd-unit">%</span></div></div>
    <div class="wd-stat"><div class="wd-label">UV</div><div class="wd-value" id="weatherUV">--</div></div>
    <div class="wd-stat"><div class="wd-label">Pollen</div><div class="wd-value" id="weatherPollen">--</div></div>
  </div>
</div>

<!-- Row 3: Bus (full width) -->
<div class="card transit-card" id="busCard">
  <div class="transit-icon" id="busIcon">
    <svg viewBox="0 0 24 24" fill="#555" width="32" height="32"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/><circle class="bus-headlight schedule" id="busHL1" cx="7.5" cy="15.5" r="1.5"/><circle class="bus-headlight schedule" id="busHL2" cx="16.5" cy="15.5" r="1.5"/></svg>
  </div>
  <div class="transit-body">
    <div class="transit-title">Bus to NY</div>
    <div class="transit-routes" id="busContent">
      <div class="no-service">Loading...</div>
    </div>

// ============================================================
(function setupTvSimulation() {
  if (!/(\?|&)tv(=|&|$)/.test(location.search)) return;
  document.documentElement.classList.add('tv-sim');
  function applyScale() {
    const targetW = 930, targetH = 539;
    const scale = Math.min(window.innerWidth / targetW, window.innerHeight / targetH);
    const offsetX = (window.innerWidth  - targetW * scale) / 2;
    const offsetY = (window.innerHeight - targetH * scale) / 2;
    document.body.style.transform = 'translate(' + offsetX + 'px,' + offsetY + 'px) scale(' + scale + ')';
  }
  if (document.body) applyScale();
  else window.addEventListener('DOMContentLoaded', applyScale);
  window.addEventListener('resize', applyScale);
})();

// Used for alerts + calendar so nothing is half-cut at the bottom.
function trimOverflow(container) {
  if (!container) return;
  // Wait for layout
  let safety = 200;
  while (safety-- > 0 &&
         container.scrollHeight > container.clientHeight + 1 &&
         container.lastElementChild) {
    container.removeChild(container.lastElementChild);
  }
}

// fetch with abort timeout — prevents hung TCP from piling up callbacks
function fetchT(url, opts, ms) {
  ms = ms || 15000;
  const c = new AbortController();
  const id = setTimeout(function() { c.abort(); }, ms);
  return fetch(url, Object.assign({}, opts || {}, { signal: c.signal }))

function markOk(key) {
  apiStatus[key].ok = true;

  apiStatus[key].failCount = 0;
}

function markFail(key) {
  // Require 2 consecutive failures before flagging offline — prevents flashes
  // from transient Cloud Run cold starts or network blips.
  apiStatus[key].failCount = (apiStatus[key].failCount || 0) + 1;
  if (apiStatus[key].failCount >= 2) {
    apiStatus[key].ok = false;

function agoText(ts) {
  if (!ts) return 'never';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return `${sec}s ago`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
  return `${Math.floor(sec / 3600)}h ago`;

function updateStatusBar() {

  document.getElementById('statusFreshness').textContent =
    newest ? `Updated ${agoText(newest)}` : 'Loading...';

  // Errors: list any failed APIs
  const failed = [];
  for (const [key, s] of Object.entries(apiStatus)) {
    if (s.ok === false) failed.push(key);

    errEl.textContent = '';

  // When transit or hop has been offline >5 min, dim the corresponding
  // panel so the family doesn't trust frozen countdowns as live.
  const FIVE_MIN = 5 * 60 * 1000;
  const now = Date.now();
  function staleClass(panelId, key) {
    const s = apiStatus[key];
    if (!s) return;
    const offline = s.ok === false;

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;

  const timeStr = `${h12}:${m} ${ampm}`;
  const el = document.querySelector('.cal-header-time');
  if (el) el.textContent = timeStr;

  // Refresh the commute estimate every clock tick so the wait countdown
  // tracks elapsed time between proxy polls (proxy fetches are typically
  // every 30-60s; we want minute-accurate display).
  updateCommuteEstimate();
}

// ============================================================
// COMMUTE ESTIMATES — Mon-Fri 7:00-10:30 AM
// One line per commuter under the TODAY header. Each entry below has a
// calculator that returns total minutes from leaving home NOW to being
// at the destination, or null if data is unavailable.
//
//   Jeff  → 11 Times Square via 126/119 + Lincoln Tunnel
//           wait_for_next_bus + 13 (ride to PABT) + tunnel_extra + 5
//           (2 walk to stop + 3 walk to office)
//
//   Jenny → 37 Old Slip via Hoboken 14th St ferry to Pier 11
//           wait_for_next_ferry + 7 (walk to terminal) + 14 (ride)
//           + 4 (Pier 11 to office)
// ============================================================
const COMMUTES = [
  {
    name: 'Jeff',
    destination: '11 Times Sq',
    tightThreshold: 35,
    calc: function () {
      const data = window._lastProxyData;
      const fetchedAtSec = window._transitFetchedAt || Math.floor(Date.now() / 1000);
      // Collect next-bus minutes from both stops, reconciled against now.
      let waitMin = null;
      if (data && data.stops) {
        const allPreds = [];
        for (const sid of ['20514', '20523']) {
          const s = data.stops[sid];
          if (s && Array.isArray(s.predictions)) allPreds.push(...s.predictions);
        }
        for (const p of allPreds) {
          const reported = njtRaw(p);
          if (!isFinite(reported)) continue;
          const arrivalMs = fetchedAtSec * 1000 + reported * 60000;
          const mins = Math.max(0, Math.round((arrivalMs - Date.now()) / 60000));
          if (mins < 60 && (waitMin === null || mins < waitMin)) waitMin = mins;
        }
      }
      if (waitMin === null) waitMin = _nextBusFromSchedule();
      if (waitMin === null) return null;
      // Tunnel schedule bakes in ~8 min — count excess as delay.
      let tunnelExtra = 0;
      if (data && data.tunnel && data.tunnel.travelTime) {
        const t = parseInt(data.tunnel.travelTime, 10);
        if (isFinite(t) && t > 8) tunnelExtra = t - 8;
      }
      return waitMin + 13 + tunnelExtra + 5;
    },
  },
  {
    name: 'Jenny',
    destination: '37 Old Slip',
    tightThreshold: 50,
    calc: function () {
      const waitMin = _nextWallStFerry();
      if (waitMin === null) return null;
      // 7 walk-to-terminal + 14 ride + 4 walk-to-office
      return waitMin + 25;
    },
  },
];

function updateCommuteEstimate() {
  const container = document.getElementById('commuteContainer');
  if (!container) return;
  const now = new Date();
  const day = now.getDay();
  const time = now.getHours() * 60 + now.getMinutes();
  // Mon-Fri only (excl. holidays), 7:00 AM to 10:30 AM inclusive
  if (day === 0 || day === 6 || isHolidayService() || time < 7 * 60 || time > 10 * 60 + 30) {
    container.innerHTML = '';
    return;
  }

  let html = '';
  for (const c of COMMUTES) {
    const total = c.calc();
    if (total === null) continue;
    const tightCls = total >= c.tightThreshold ? ' tight' : '';
    html += '<div class="cal-commute' + tightCls + '">' +
      c.name + ' → ' + c.destination + ': ' +
      '<span class="commute-min">' + total + '</span> min</div>';
  }
  container.innerHTML = html;
}

function _nextWallStFerry() {
  // Minutes until the next scheduled Hoboken 14th St → Pier 11 / Wall St
  // ferry. Weekday only (Wall St routes don't run weekends), and the commute
  // estimate itself is weekday-gated, so reading the weekday view is safe.
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const row14 = FERRY_VIEWS.weekday.rows.find(r => r.label === '14th St');
  const sched = row14 ? row14.times : [];
  let earliest = null;
  for (const t of sched) {
    const [h, m] = t.split(':').map(n => parseInt(n, 10));
    const depMin = h * 60 + m;
    const delta = depMin - nowMin;
    if (delta >= 0 && (earliest === null || delta < earliest)) earliest = delta;
  }
  return earliest;
}

function _nextBusFromSchedule() {
  // Minutes until the next scheduled 126 or 119, whichever is sooner.
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const sched126 = isSunday() ? BUS_126_SCHEDULE.sunday
                  : isWeekend() ? BUS_126_SCHEDULE.saturday
                  : BUS_126_SCHEDULE.weekday;
  const sched119 = isWeekend() ? BUS_119_SCHEDULE.saturday : BUS_119_SCHEDULE.weekday;
  let earliest = null;
  for (const arr of [sched126, sched119]) {
    if (!arr) continue;
    for (const t of arr) {
      const [h, m] = t.split(':').map(n => parseInt(n, 10));
      const depMin = h * 60 + m;
      const delta = depMin - nowMin;
      if (delta >= 0 && (earliest === null || delta < earliest)) earliest = delta;
    }
  }
  return earliest;
}

async function updateWeather() {
  if (document.hidden || isSleeping()) return;
  let apiSucceeded = false;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.744&longitude=-74.032'
      + '&current_weather=true&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max'
      + '&hourly=relativehumidity_2m,temperature_2m,weathercode,precipitation_probability,is_day,uv_index'
      + '&temperature_unit=fahrenheit&timezone=America/New_York';
    const res = await fetchT(url);
    const data = await res.json();
    apiSucceeded = true;
    markOk('weather');
    const cw = data.current_weather;
    const code = WMO_CODES[cw.weathercode] || ["Unknown", "?"];

    // Is it night right now? Use the per-hour is_day flag from the API.
    const nowHourForNight = new Date().getHours();
    const isNightNow = !(data.hourly && data.hourly.is_day && data.hourly.is_day[nowHourForNight]);

    const tempF = Math.round(cw.temperature);
    document.getElementById('weatherTemp').innerHTML = `${tempF}&deg;F`;
    document.getElementById('weatherDesc').textContent = code[0];
    document.getElementById('weatherIcon').innerHTML = wIcon(code[1], 44, isNightNow);
    document.getElementById('weatherWind').textContent = Math.round(cw.windspeed);

    // UV — prefer current hour's value, fall back to today's daily max
    try {
      let uvNow = null;
      const hourlyUV = data.hourly && data.hourly.uv_index;
      if (Array.isArray(hourlyUV) && hourlyUV[nowHourForNight] != null) {
        uvNow = hourlyUV[nowHourForNight];
      } else if (data.daily && Array.isArray(data.daily.uv_index_max)) {
        uvNow = data.daily.uv_index_max[0];
      }
      const uvEl = document.getElementById('weatherUV');
      if (uvEl) {
        if (uvNow == null) {
          uvEl.textContent = '--';
        } else {
          const uvR = Math.round(uvNow);
          uvEl.textContent = uvR;
          // Only call out elevated UV. Low / moderate stay neutral white
          // (matches the rest of the stats — pollen has the same rule).
          let uvColor = '#fff';
          if (uvR >= 8) uvColor = '#ff5050';       // very high / extreme — red
          else if (uvR >= 6) uvColor = '#ff9b40';  // high — orange
          uvEl.style.color = uvColor;
        }
      }
    } catch (e) { console.error('UV display error:', e); }

    document.getElementById('weatherHi').textContent = Math.round(data.daily.temperature_2m_max[0]);
    document.getElementById('weatherLo').textContent = Math.round(data.daily.temperature_2m_min[0]);

    // Precipitation: show umbrella if any hour in next 12 hours has >30% chance
    const nowH = new Date().getHours();
    const rainProbs = data.hourly.precipitation_probability || [];
    let maxRain = 0;
    for (let h = nowH; h < Math.min(nowH + 12, rainProbs.length); h++) {
      if (rainProbs[h] > maxRain) maxRain = rainProbs[h];
    }
    const rainEl = document.getElementById('weatherRain');
    if (maxRain >= 30) {
      rainEl.style.display = 'flex';
      document.getElementById('weatherRainPct').textContent = maxRain;
    } else {
      rainEl.style.display = 'none';
    }

    const nowHour = new Date().getHours();
    const humidity = data.hourly.relativehumidity_2m
      ? data.hourly.relativehumidity_2m[nowHour]
      : (data.hourly.relative_humidity_2m ? data.hourly.relative_humidity_2m[nowHour] : '--');
    document.getElementById('weatherHumidity').textContent = humidity;

    // Pollen
    try {
      const pollenUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=40.744&longitude=-74.032'
        + '&current=grass_pollen,birch_pollen,alder_pollen,ragweed_pollen,mugwort_pollen,olive_pollen';
      const pollenRes = await fetchT(pollenUrl);
      const pollenData = await pollenRes.json();
      const pc = pollenData.current;
      const vals = [pc.grass_pollen||0, pc.birch_pollen||0, pc.alder_pollen||0,
                    pc.ragweed_pollen||0, pc.mugwort_pollen||0, pc.olive_pollen||0];
      const peak = Math.max(...vals);
      // Color rule: only highlight in red when pollen is High or worse. Low
      // and Medium read as white (matches the surrounding details text) so
      // they don't grab attention on a normal day.
      let level, color;
      if (peak < 20)       { level = 'Low';    color = '#fff';    }
      else if (peak < 80)  { level = 'Med';    color = '#fff';    }
      else if (peak < 200) { level = 'High';   color = '#f44336'; }
      else                 { level = 'V.High'; color = '#f44336'; }
      const el = document.getElementById('weatherPollen');
      el.textContent = level;
      el.style.color = color;
    } catch (e) { console.error('Pollen error:', e); }

    // Hourly forecast
    const hourlyTemps = data.hourly.temperature_2m;
    const hourlyCodes = data.hourly.weathercode;
    const hourlyIsDay = data.hourly.is_day || [];
    if (hourlyTemps && hourlyCodes) {
      let fhtml = '';
      let count = 0;
      let h = nowHour + 2;
      while (count < 7 && h < hourlyTemps.length) {
        const t = Math.round(hourlyTemps[h]);
        const ic = WMO_CODES[hourlyCodes[h]] || ['?', 'overcast'];
        const displayH = h % 24;
        const ampm = displayH >= 12 ? 'PM' : 'AM';
        const h12 = displayH % 12 || 12;
        const hourIsNight = !hourlyIsDay[h];
        fhtml += `<div class="weather-hour"><span class="wh-time">${h12} ${ampm}</span><span class="wh-icon">${wIcon(ic[1], 14, hourIsNight)}</span><span class="wh-temp">${t}&deg;</span></div>`;
        h += 2;
        count++;
      }
      document.getElementById('weatherForecast').innerHTML = fhtml;
    }
  } catch (e) {
    console.error('Weather error:', e);
    if (!apiSucceeded) {
      document.getElementById('weatherDesc').textContent = 'Error loading weather';
      markFail('weather');
    }
  }
}

// ============================================================
// TRANSIT HELPERS
// ============================================================
function timeToMinutes(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function formatTime12(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
}

function minutesUntil(timeStr) {
  const target = timeToMinutes(timeStr);
  const now = nowMinutes();
  let diff = target - now;
  // Late-night service (target before 3am) only wraps when viewer is also late evening
  // (after 6pm). Prevents 00:05 bus from showing "23h59m" when checked at 00:10.
  if (diff < -180 && target < 180 && now > 18 * 60) {
    diff += 24 * 60;
  }
  return diff;
}

function countdownText(mins) {
  const u = s => `<span class="cd-unit">${s}</span>`;
  if (mins <= 0) return 'now';
  if (mins < 60) return `${mins}${u('m')}`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m > 0 ? `${h}${u('h')}${m}${u('m')}` : `${h}${u('h')}`;
}

// Dates NJ Transit runs Sunday-level (holiday) service. Folded into the day-type
// helpers below so the hardcoded schedule FALLBACK shows Sunday timetables — not
// phantom full-weekday departures — on holidays. (When live NJT data is present
// the dashboard trusts it regardless; this only governs the offline fallback.)
// Refresh this list each year.
const HOLIDAY_SERVICE = new Set([
  '2026-01-01', '2026-05-25', '2026-07-04', '2026-09-07', '2026-11-26', '2026-12-25',
  '2027-01-01', '2027-05-31', '2027-07-04', '2027-09-06', '2027-11-25', '2027-12-25',
]);
function isHolidayService() {
  const d = new Date();
  const key = d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
  return HOLIDAY_SERVICE.has(key);
}

// NOTE: these fold holidays into weekend / Sunday SERVICE — they are used only to
// pick which printed timetable to fall back to, so a holiday gets Sunday service.
function isWeekend() {
  const day = new Date().getDay();
  return day === 0 || day === 6 || isHolidayService();
}

function isSunday() {
  return new Date().getDay() === 0 || isHolidayService();
}

function getNextDepartures(times, count) {
  const upcoming = times.filter(t => minutesUntil(t) >= 0);
  upcoming.sort((a, b) => minutesUntil(a) - minutesUntil(b));
  return upcoming.slice(0, count);
}

function renderDepartures(times, label) {
  const next = getNextDepartures(times, 3);
  // SVG glyphs for the intentional/fallback/error empty states.
  const MOON_GLYPH = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>';
  if (times.length === 0) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service is-asleep">${MOON_GLYPH}No service today</div></div>`;
  }
  if (next.length === 0) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service is-asleep">${MOON_GLYPH}Done for today</div></div>`;
  }
  let html = `<div class="route-group"><div class="route-label">${label}:</div><div class="dep-row">`;
  for (const t of next) {
    const mins = minutesUntil(t);
    const cdColor = mins <= 5 ? '#ff6b6b' : '#6bffb8';
    html += `<div class="dep-chip"><span class="t">${formatTime12(t)}</span><span class="cd" style="color:${cdColor}">${countdownText(mins)}</span></div>`;
  }
  html += '</div></div>';
  return html;
}

// ============================================================
// BUS (static fallback)
// ============================================================
function get126WillowSchedule() {
  let base;
  if (isSunday()) base = BUS_126_SCHEDULE.sunday;
  else if (isWeekend()) base = BUS_126_SCHEDULE.saturday;
  else base = BUS_126_SCHEDULE.weekday;
  return base.map(t => {
    let mins = timeToMinutes(t) + 2;
    if (mins >= 24 * 60) mins -= 24 * 60;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  });
}

function get119Schedule() {
  if (isWeekend()) return BUS_119_SCHEDULE.saturday;
  return BUS_119_SCHEDULE.weekday;
}

// The printed timetable we carry is for 14th & Bloomfield, but this panel now
// reports Washington & 13th — one stop SOUTH on the NY-bound 126, so the bus
// gets there about 2 minutes earlier. Shift the whole table back rather than
// re-sourcing it. Mirror image of get126WillowSchedule(), which shifts +2.
function get126ThirteenthSchedule() {
  let base;
  if (isSunday()) base = BUS_126_SCHEDULE.sunday;
  else if (isWeekend()) base = BUS_126_SCHEDULE.saturday;
  else base = BUS_126_SCHEDULE.weekday;
  return base.map(t => {
    let mins = timeToMinutes(t) - 2;
    if (mins < 0) mins += 24 * 60;   // 00:01 - 2min wraps to the previous day
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  });
}

function updateBusStatic() {
  const container = document.getElementById('busContent');
  let html = '';
  html += renderDepartures(get126ThirteenthSchedule(), '126 @ 13th');
  html += renderDepartures(get119Schedule(), '119 @ 15th');
  container.innerHTML = html;
}

// ============================================================
// PROXY FETCH
// ============================================================
// Displayed bus times use NJT's RAW countdown, matching the NJT app and the
// phone commute page (Jeff, 2026-07-26). `countdown` carries the PREDICTION_BIAS
// correction on top; it stays in the payload and is still used by the 119/126
// de-duplication filter below (which compares like with like, so the constant
// bias cancels out), but it must not drive anything the user reads.
function njtRaw(p) {
  const raw = p.raw_countdown;
  return parseInt((raw !== null && raw !== undefined && raw !== '') ? raw : p.countdown, 10);
}

function renderLivePredictions(predictions, label) {
  if (!predictions || predictions.error) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service is-error"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22z M11 9h2v6h-2z M11 17h2v2h-2z"/></svg>Reconnecting</div></div>`;
  }
  if (Array.isArray(predictions) && predictions.length > 0) {
    let html = `<div class="route-group"><div class="route-label">${label}:</div><div class="dep-row">`;
    const items = predictions.slice(0, 3);
    // Compute the absolute arrival time (Unix ms) for each prediction by using
    // the proxy's fetched_at + the countdown that was true at that moment.
    // Then derive mins from current time. Conservative (floor) so we don't show
    // a longer countdown than reality and have the user miss the bus.
    const fetchedAtMs = (window._transitFetchedAt || Math.floor(Date.now() / 1000)) * 1000;
    // NJT seems to round their countdowns up, so shift the predicted arrival
    // ~30s earlier than reported. Makes the displayed countdown feel right —
    // not over-promising on time available.
    const DISPLAY_SHIFT_MS = 30000;
    for (const p of items) {
      const reportedMins = njtRaw(p);
      const arrivalMs = fetchedAtMs + reportedMins * 60000 - DISPLAY_SHIFT_MS;
      const msUntil = arrivalMs - Date.now();
      // Hide buses that are clearly more than 2 min past arrival.
      if (msUntil < -120000) continue;
      // Anything in (-2 min, +1 min) shows as "Due" so the imminent bus stays
      // visible until it's actually departed.
      const isDue = msUntil < 60000;
      const mins = isDue ? 0 : Math.floor(msUntil / 60000);
      const cdColor = mins <= 5 ? '#ff6b6b' : '#6bffb8';
      let displayTime;
      if (isDue) {
        displayTime = 'Due';
      } else {
        const arrive = new Date(arrivalMs);
        const hh = arrive.getHours();
        const mm = String(arrive.getMinutes()).padStart(2, '0');
        const ampm = hh >= 12 ? 'PM' : 'AM';
        const h12 = hh % 12 || 12;
        displayTime = `${h12}:${mm} ${ampm}`;
      }
      // Inferred (GPS-pace) ETAs are estimates, not live predictions. The proxy
      // flags them is_inferred; mark the chip so a guessed time never looks like
      // a real one — "~" on the countdown and "est" instead of a false-precise clock.
      const est = !!p.is_inferred;
      const cdText = (est ? '<span class="cd-unit">~</span>' : '') + countdownText(mins);
      const subLine = est ? 'est' : displayTime;
      html += `<div class="dep-chip"><span class="t">${subLine}</span><span class="cd" style="color:${cdColor}">${cdText}</span></div>`;
    }
    html += '</div></div>';
    return html;
  }
  return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service is-fallback"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zM12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>Schedule only</div></div>`;
}

async function fetchProxy() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(PROXY_URL);
    const data = await res.json();

    // Detect structured errors that mean the data is stale/wrong even
    // though the proxy returned 200. NJT auth-failed and per-stop "auth
    // failed" both look like normal {error: ...} objects — the dashboard
    // used to silently fall through to BUS_*_SCHEDULE static fallback
    // without firing markFail, so the panel-stale dimmer never engaged.
    const transitDegraded = (
      (data.stops && Object.values(data.stops).some(s =>
        s && s.predictions && s.predictions.error === 'NJT auth failed')) ||
      (data.tunnel && data.tunnel.error && /auth/i.test(data.tunnel.error || ''))
    );
    if (transitDegraded) markFail('transit'); else markOk('transit');

    // Stash fetched_at so renderLivePredictions can reconcile against current time
    window._transitFetchedAt = data.fetched_at || Math.floor(Date.now() / 1000);
    // Stash the whole response so updateCommuteEstimate() can derive the
    // morning commute number even on its own clock-driven timer ticks.
    window._lastProxyData = data;

    if (data.tunnel && !data.tunnel.error) {
      const t = data.tunnel;
      const tt = parseInt(t.travelTime, 10);
      const timeEl = document.getElementById('tunnelTime');
      timeEl.textContent = isFinite(tt) ? tt : '--';
      // Color tiers (research-confirmed thresholds; free-flow is 6-8 min):
      //   < 10 min → Light    (green)
      //   10-19 min → Moderate (yellow)
      //   20-34 min → Heavy    (orange)
      //   35+ min → Very Heavy (red)
      let color = '#6bffb8';
      if (isFinite(tt)) {
        if      (tt >= 35) color = '#ff5050';
        else if (tt >= 20) color = '#ff9b40';
        else if (tt >= 10) color = '#e0c040';
      }
      timeEl.style.color = color;
      const minEl = document.getElementById('tunnelMin');
      if (minEl) minEl.style.color = color;
      // PA's infomationalText ("USUAL TRAFFIC" etc.) is uninformative —
      // hide the status row entirely; color of the number says it all.
      const statusEl = document.getElementById('tunnelStatus');
      statusEl.style.display = 'none';
    } else if (data.tunnel && data.tunnel.error) {
      // PA API errored — clear the stale time so a 4-min cached value
      // doesn't persist through what's actually a 35-min jam. Grey out.
      const timeEl = document.getElementById('tunnelTime');
      timeEl.textContent = '--';
      timeEl.style.color = '#666';
      const minEl = document.getElementById('tunnelMin');
      if (minEl) minEl.style.color = '#666';
    }

    if (data.stops) {
      const container = document.getElementById('busContent');
      let html = '';
      let apiWorking = false;

      const stop20514 = data.stops['20514'];
      if (stop20514 && Array.isArray(stop20514.predictions) && stop20514.predictions.length > 0) {
        html += renderLivePredictions(stop20514.predictions, '126 @ 13th');
        // API is working if we got an array of predictions back (live or scheduled)
        apiWorking = true;
      } else {
        let schedule;
        schedule = get126ThirteenthSchedule();
        html += renderDepartures(schedule, '126 @ 13th');
      }

      const stop20523 = data.stops['20523'];
      if (stop20523 && Array.isArray(stop20523.predictions) && stop20523.predictions.length > 0) {
        const preds13 = (stop20514 && Array.isArray(stop20514.predictions)) ? stop20514.predictions : [];
        const etaMins13 = preds13.filter(p => p.route === '126').map(p => parseInt(p.countdown, 10));
        const filtered = stop20523.predictions.filter(p => {
          if (p.route !== '126') return true;
          const mins = parseInt(p.countdown, 10);
          return !etaMins13.some(m13 => Math.abs(mins - m13) <= 3);
        });
        if (filtered.length > 0) {
          html += renderLivePredictions(filtered, '119 @ 15th');
          apiWorking = true;
        } else {
          html += renderDepartures(get119Schedule(), '119 @ 15th');
        }
      } else {
        html += renderDepartures(get119Schedule(), '119 @ 15th');
      }

      container.innerHTML = html;

      const hl1 = document.getElementById('busHL1');
      const hl2 = document.getElementById('busHL2');
      if (hl1 && hl2) {
        // Detect inferred predictions: if the proxy fell back to
        // vehicle-position inference for any stop (BUSDV2 had no trips
        // there), those predictions carry is_inferred=true. Even a single
        // inferred prediction means at least one data stream is degraded,
        // so surface that as orange headlights — more honest than green.
        const allPreds = [stop20514, stop20523]
          .filter(s => s && Array.isArray(s.predictions))
          .flatMap(s => s.predictions);
        const anyInferred = allPreds.some(p => p.is_inferred);
        const mode = !apiWorking ? 'schedule' : (anyInferred ? 'inferred' : 'live');
        hl1.setAttribute('class', 'bus-headlight ' + mode);
        hl2.setAttribute('class', 'bus-headlight ' + mode);
      }
    }

    // Recompute the morning commute estimate with this fresh data.
    updateCommuteEstimate();
  } catch (e) {
    console.error('Proxy fetch error:', e);
    markFail('transit');
  }
}

// ============================================================
// FERRY
// ============================================================
function updateFerries() {
  const container = document.getElementById('ferryContent');
  const view = isWeekend() ? FERRY_VIEWS.weekend : FERRY_VIEWS.weekday;
  const titleEl = document.getElementById('ferryTitle');
  if (titleEl) titleEl.textContent = view.title;
  let html = '';
  let hasUpcoming = false;
  for (const row of view.rows) {
    if (getNextDepartures(row.times, 1).length > 0) hasUpcoming = true;
    html += renderDepartures(row.times, row.label);
  }
  container.innerHTML = html;

  // Animate wave only if ferries are running
  const wave = document.getElementById('ferryWave');
  if (wave) wave.setAttribute('class', 'ferry-wave' + (hasUpcoming ? ' active' : ''));
}

// ============================================================
// HOBOKEN HOP
// ============================================================
function renderHopEtas(data) {
  // Hop right panel mirrors the Lincoln Tunnel layout: big primary value +
  // "min" suffix on top, smaller status text below. The status line shows
  // the next 1–2 ETAs or a service note. Keeps bus and ferry cards visually
  // symmetric — both right-side panels read the same way.
  const timeEl = document.getElementById('hopTime');
  const minEl = document.getElementById('hopMin');
  const statusEl = document.getElementById('hopStatus');
  if (!timeEl || !statusEl) return;

  const setStatus = (text, color) => {
    statusEl.textContent = text;
    statusEl.style.color = color || '#9a9aa8';
  };

  // When the Hop isn't running, replace the "X min" line with a single
  // "No service" message (hide the trailing "min" suffix entirely).
  const showNoService = () => {
    timeEl.textContent = 'No service';
    timeEl.style.fontSize = '0.9rem';  // shrink so the words fit the chip
    if (minEl) minEl.style.display = 'none';
    setStatus('', '#666');
  };
  const showServiceMins = (n) => {
    timeEl.textContent = String(n);
    timeEl.style.fontSize = '';  // reset to the panel's default big number size
    if (minEl) minEl.style.display = '';
  };

  if (!data || data.error) {
    showNoService();
    setStatus(data && data.error ? 'Error' : '', '#666');
    return;
  }
  if (data.status === 'no vehicles' || !Array.isArray(data) || data.length === 0) {
    showNoService();
    return;
  }

  const mins = data.map(e => {
    const m = (e.eta || '').match(/^(\d+)/);
    return m ? parseInt(m[1], 10) + 1 : null;
  }).filter(n => n !== null);

  if (mins.length === 0) {
    showNoService();
    return;
  }

  showServiceMins(mins[0]);
  if (mins.length > 1) {
    setStatus('next ' + mins.slice(1, 3).join(', ') + ' min', '#6bffb8');
  } else {
    setStatus('Running', '#6bffb8');
  }
}

async function fetchHop() {
  if (document.hidden || isSleeping()) return;
  try {
    const resp = await fetchT('https://passiogo.com/mapGetData.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'json=' + encodeURIComponent(JSON.stringify({s0:'466',sA:1})) + '&eta=3&deviceId=web&stopIds=158942',
    });
    const data = await resp.json();

    // ETAs
    const etas = [];
    for (const [key, entries] of Object.entries(data.ETAs || {})) {
      for (const entry of entries) {
        if (entry.eta && entry.eta !== 'no vehicles') {
          etas.push({ eta: entry.eta });
        }
      }
    }
    if (etas.length > 0) {
      renderHopEtas(etas);
    } else {
      renderHopEtas({ status: 'no vehicles' });
    }

    // Build a routeId → route name map (PassioGo returns "routes" alongside "buses")
    const routeNameById = {};
    const routesArr = data.routes || [];
    if (Array.isArray(routesArr)) {
      for (const r of routesArr) {
        routeNameById[r.id || r.routeId] = (r.name || r.routeName || '').toString();
      }
    } else if (typeof routesArr === 'object') {
      for (const k of Object.keys(routesArr)) {
        routeNameById[k] = (routesArr[k].name || routesArr[k].routeName || '').toString();
      }
    }

    // Live bus positions
    const hopBuses = [];
    const busesData = data.buses || {};
    for (const routeId of Object.keys(busesData)) {
      const arr = busesData[routeId];
      if (!Array.isArray(arr)) continue;
      const routeName = routeNameById[routeId] || '';
      for (const b of arr) {
        if (b.outOfService === '1' || b.outOfService === 1) continue;
        const lat = parseFloat(b.latitude);
        const lon = parseFloat(b.longitude);
        if (!isFinite(lat) || !isFinite(lon)) continue;
        // Determine color by route name (or bus name as fallback)
        const probe = (routeName + ' ' + (b.busName || b.name || '')).toLowerCase();
        let color = '#b070ff';  // generic purple fallback
        if (probe.includes('red'))   color = '#ff5050';
        if (probe.includes('green')) color = '#6bffb8';
        const course = parseFloat(b.calculatedCourse || b.course);
        hopBuses.push({
          busId: b.busId || b.id || b.busName || b.name || '',
          name: b.busName || b.name || 'Hop',
          lat: lat,
          lon: lon,
          heading: isFinite(course) ? course : null,
          route: routeName || 'Hop',
          color: color,
        });
      }
    }
    renderHopBuses(hopBuses);
    markOk('hop');
  } catch (e) {
    console.error('Hop fetch error:', e);
    renderHopEtas({ error: e.message });
    renderHopBuses([]);  // clear stale markers on error
    markFail('hop');
  }
}

function renderHopBuses(hopBuses) {

// Animation state for smooth bus/hop marker movement between polls.
// Duration slightly exceeds the 15s poll cadence so the marker never visibly
// "stops" between polls; cubic ease-in-out softens both ends of the slide.
const MARKER_ANIM_MS = 15500;
let _markerAnims = {};
let _markerAnimFrame = null;

// Cubic ease-in-out: gentle start and finish, near-linear in the middle.
function _easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function _animateMarkers() {
  const now = performance.now();
  let active = false;
  for (const id of Object.keys(_markerAnims)) {
    const a = _markerAnims[id];
    if (!a.marker) { delete _markerAnims[id]; continue; }
    const tRaw = Math.min((now - a.t0) / MARKER_ANIM_MS, 1);
    const t = _easeInOutCubic(tRaw);
    a.marker.setLatLng([
      a.lat0 + (a.lat1 - a.lat0) * t,
      a.lon0 + (a.lon1 - a.lon0) * t,
    ]);
    if (tRaw < 1) active = true;
    else delete _markerAnims[id];
  }
  _markerAnimFrame = active ? requestAnimationFrame(_animateMarkers) : null;
}

function _slideTo(id, marker, lat, lon) {
  const cur = marker.getLatLng();
  if (Math.abs(cur.lat - lat) < 0.00001 && Math.abs(cur.lng - lon) < 0.00001) return;
  // Pick up from the marker's current visible position (which may itself
  // be mid-animation) so consecutive polls produce one continuous glide
  // rather than a jump-reset.
  _markerAnims[id] = {
    marker,
    lat0: cur.lat, lon0: cur.lng,
    lat1: lat,     lon1: lon,
    t0: performance.now(),
  };
  if (!_markerAnimFrame) _markerAnimFrame = requestAnimationFrame(_animateMarkers);
}
