      if (waitMin === null) waitMin = _nextBusFromSchedule();
      if (waitMin === null) return null;
      // Tunnel schedule bakes in ~8 min — count excess as delay.
      let tunnelExtra = 0;
      if (data && data.tunnel && data.tunnel.travelTime) {
        const t = parseInt(data.tunnel.travelTime, 10);
        if (isFinite(t) && t > 8) tunnelExtra = t - 8;
      }
      return waitMin + 13 + tunnelExtra + 5;
    },
  },
  {
    name: 'Jenny',
    destination: '37 Old Slip',
    tightThreshold: 50,
    calc: function () {
      const waitMin = _nextWallStFerry();
      if (waitMin === null) return null;
      // 7 walk-to-terminal + 14 ride + 4 walk-to-office
      return waitMin + 25;
    },
  },
];

function updateCommuteEstimate() {
  const container = document.getElementById('commuteContainer');
  if (!container) return;
  const now = new Date();
  const day = now.getDay();
  const time = now.getHours() * 60 + now.getMinutes();
  // Mon-Fri only (excl. holidays), 7:00 AM to 10:30 AM inclusive
  if (day === 0 || day === 6 || isHolidayService() || time < 7 * 60 || time > 10 * 60 + 30) {
    container.innerHTML = '';
    return;
  }

  let html = '';
  for (const c of COMMUTES) {
    const total = c.calc();
    if (total === null) continue;
    const tightCls = total >= c.tightThreshold ? ' tight' : '';
    html += '<div class="cal-commute' + tightCls + '">' +
      c.name + ' → ' + c.destination + ': ' +
      '<span class="commute-min">' + total + '</span> min</div>';
  }
  container.innerHTML = html;
}

function _nextWallStFerry() {
  // Minutes until the next scheduled Hoboken 14th St → Pier 11 / Wall St
  // ferry. Weekday only (Wall St routes don't run weekends), and the commute
  // estimate itself is weekday-gated, so reading the weekday view is safe.
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const row14 = FERRY_VIEWS.weekday.rows.find(r => r.label === '14th St');
  const sched = row14 ? row14.times : [];
  let earliest = null;
  for (const t of sched) {
    const [h, m] = t.split(':').map(n => parseInt(n, 10));
    const depMin = h * 60 + m;
    const delta = depMin - nowMin;
    if (delta >= 0 && (earliest === null || delta < earliest)) earliest = delta;
  }
  return earliest;
}

function _nextBusFromSchedule() {
  // Minutes until the next scheduled 126 or 119, whichever is sooner.
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const sched126 = isSunday() ? BUS_126_SCHEDULE.sunday
                  : isWeekend() ? BUS_126_SCHEDULE.saturday
                  : BUS_126_SCHEDULE.weekday;
  const sched119 = isWeekend() ? BUS_119_SCHEDULE.saturday : BUS_119_SCHEDULE.weekday;
  let earliest = null;
  for (const arr of [sched126, sched119]) {
    if (!arr) continue;
    for (const t of arr) {
      const [h, m] = t.split(':').map(n => parseInt(n, 10));
      const depMin = h * 60 + m;
      const delta = depMin - nowMin;
      if (delta >= 0 && (earliest === null || delta < earliest)) earliest = delta;
    }
  }
  return earliest;
}

// ============================================================
// WEATHER
// ============================================================
async function updateWeather() {
  if (document.hidden || isSleeping()) return;
  let apiSucceeded = false;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.744&longitude=-74.032'
      + '&current_weather=true&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max'
      + '&hourly=relativehumidity_2m,temperature_2m,weathercode,precipitation_probability,is_day,uv_index'
      + '&temperature_unit=fahrenheit&timezone=America/New_York';
    const res = await fetchT(url);
    const data = await res.json();
    apiSucceeded = true;
    markOk('weather');
    const cw = data.current_weather;
    const code = WMO_CODES[cw.weathercode] || ["Unknown", "?"];

    // Is it night right now? Use the per-hour is_day flag from the API.
    const nowHourForNight = new Date().getHours();
    const isNightNow = !(data.hourly && data.hourly.is_day && data.hourly.is_day[nowHourForNight]);

    const tempF = Math.round(cw.temperature);
    document.getElementById('weatherTemp').innerHTML = `${tempF}&deg;F`;
    document.getElementById('weatherDesc').textContent = code[0];
    document.getElementById('weatherIcon').innerHTML = wIcon(code[1], 44, isNightNow);
    document.getElementById('weatherWind').textContent = Math.round(cw.windspeed);

    // UV — prefer current hour's value, fall back to today's daily max
    try {
      let uvNow = null;
      const hourlyUV = data.hourly && data.hourly.uv_index;
      if (Array.isArray(hourlyUV) && hourlyUV[nowHourForNight] != null) {
        uvNow = hourlyUV[nowHourForNight];
      } else if (data.daily && Array.isArray(data.daily.uv_index_max)) {
        uvNow = data.daily.uv_index_max[0];
      }
      const uvEl = document.getElementById('weatherUV');
      if (uvEl) {
        if (uvNow == null) {
          uvEl.textContent = '--';
        } else {
          const uvR = Math.round(uvNow);
          uvEl.textContent = uvR;
          // Only call out elevated UV. Low / moderate stay neutral white
          // (matches the rest of the stats — pollen has the same rule).
          let uvColor = '#fff';
          if (uvR >= 8) uvColor = '#ff5050';       // very high / extreme — red
          else if (uvR >= 6) uvColor = '#ff9b40';  // high — orange
          uvEl.style.color = uvColor;
        }
      }
    } catch (e) { console.error('UV display error:', e); }

    document.getElementById('weatherHi').textContent = Math.round(data.daily.temperature_2m_max[0]);
    document.getElementById('weatherLo').textContent = Math.round(data.daily.temperature_2m_min[0]);

    // Precipitation: show umbrella if any hour in next 12 hours has >30% chance
    const nowH = new Date().getHours();
    const rainProbs = data.hourly.precipitation_probability || [];
    let maxRain = 0;
    for (let h = nowH; h < Math.min(nowH + 12, rainProbs.length); h++) {
      if (rainProbs[h] > maxRain) maxRain = rainProbs[h];
    }
    const rainEl = document.getElementById('weatherRain');
    if (maxRain >= 30) {
      rainEl.style.display = 'flex';
      document.getElementById('weatherRainPct').textContent = maxRain;
    } else {
      rainEl.style.display = 'none';
    }

    const nowHour = new Date().getHours();
    const humidity = data.hourly.relativehumidity_2m
      ? data.hourly.relativehumidity_2m[nowHour]
      : (data.hourly.relative_humidity_2m ? data.hourly.relative_humidity_2m[nowHour] : '--');
    document.getElementById('weatherHumidity').textContent = humidity;

    // Pollen
    try {
      const pollenUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=40.744&longitude=-74.032'
        + '&current=grass_pollen,birch_pollen,alder_pollen,ragweed_pollen,mugwort_pollen,olive_pollen';
      const pollenRes = await fetchT(pollenUrl);
      const pollenData = await pollenRes.json();
      const pc = pollenData.current;
      const vals = [pc.grass_pollen||0, pc.birch_pollen||0, pc.alder_pollen||0,
                    pc.ragweed_pollen||0, pc.mugwort_pollen||0, pc.olive_pollen||0];
      const peak = Math.max(...vals);
      // Color rule: only highlight in red when pollen is High or worse. Low
      // and Medium read as white (matches the surrounding details text) so
      // they don't grab attention on a normal day.
      let level, color;
      if (peak < 20)       { level = 'Low';    color = '#fff';    }
      else if (peak < 80)  { level = 'Med';    color = '#fff';    }
      else if (peak < 200) { level = 'High';   color = '#f44336'; }
      else                 { level = 'V.High'; color = '#f44336'; }
      const el = document.getElementById('weatherPollen');
      el.textContent = level;
      el.style.color = color;
    } catch (e) { console.error('Pollen error:', e); }

    // Hourly forecast
    const hourlyTemps = data.hourly.temperature_2m;
    const hourlyCodes = data.hourly.weathercode;
    const hourlyIsDay = data.hourly.is_day || [];
    if (hourlyTemps && hourlyCodes) {
      let fhtml = '';
      let count = 0;
      let h = nowHour + 2;
      while (count < 7 && h < hourlyTemps.length) {
        const t = Math.round(hourlyTemps[h]);
        const ic = WMO_CODES[hourlyCodes[h]] || ['?', 'overcast'];
        const displayH = h % 24;
        const ampm = displayH >= 12 ? 'PM' : 'AM';
        const h12 = displayH % 12 || 12;
        const hourIsNight = !hourlyIsDay[h];
        fhtml += `<div class="weather-hour"><span class="wh-time">${h12} ${ampm}</span><span class="wh-icon">${wIcon(ic[1], 14, hourIsNight)}</span><span class="wh-temp">${t}&deg;</span></div>`;
        h += 2;
        count++;
      }
      document.getElementById('weatherForecast').innerHTML = fhtml;
    }
  } catch (e) {
    console.error('Weather error:', e);
    if (!apiSucceeded) {
      document.getElementById('weatherDesc').textContent = 'Error loading weather';
      markFail('weather');
    }
  }
}

// ============================================================
// TRANSIT HELPERS
// ============================================================
function timeToMinutes(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function formatTime12(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
}

function minutesUntil(timeStr) {
  const target = timeToMinutes(timeStr);
  const now = nowMinutes();
  let diff = target - now;
  // Late-night service (target before 3am) only wraps when viewer is also late evening
  // (after 6pm). Prevents 00:05 bus from showing "23h59m" when checked at 00:10.
  if (diff < -180 && target < 180 && now > 18 * 60) {
    diff += 24 * 60;
  }
  return diff;
}

function countdownText(mins) {
  const u = s => `<span class="cd-unit">${s}</span>`;
  if (mins <= 0) return 'now';
  if (mins < 60) return `${mins}${u('m')}`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m > 0 ? `${h}${u('h')}${m}${u('m')}` : `${h}${u('h')}`;
}

// Dates NJ Transit runs Sunday-level (holiday) service. Folded into the day-type
// helpers below so the hardcoded schedule FALLBACK shows Sunday timetables — not
// phantom full-weekday departures — on holidays. (When live NJT data is present
// the dashboard trusts it regardless; this only governs the offline fallback.)
// Refresh this list each year.
const HOLIDAY_SERVICE = new Set([
  '2026-01-01', '2026-05-25', '2026-07-04', '2026-09-07', '2026-11-26', '2026-12-25',
  '2027-01-01', '2027-05-31', '2027-07-04', '2027-09-06', '2027-11-25', '2027-12-25',
]);
function isHolidayService() {
  const d = new Date();
  const key = d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
  return HOLIDAY_SERVICE.has(key);
}

// NOTE: these fold holidays into weekend / Sunday SERVICE — they are used only to
// pick which printed timetable to fall back to, so a holiday gets Sunday service.
function isWeekend() {
  const day = new Date().getDay();
  return day === 0 || day === 6 || isHolidayService();
}

function isSunday() {
  return new Date().getDay() === 0 || isHolidayService();
}

function getNextDepartures(times, count) {
  const upcoming = times.filter(t => minutesUntil(t) >= 0);
  upcoming.sort((a, b) => minutesUntil(a) - minutesUntil(b));
  return upcoming.slice(0, count);
}

function renderDepartures(times, label) {
  const next = getNextDepartures(times, 3);
  // SVG glyphs for the intentional/fallback/error empty states.
  const MOON_GLYPH = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>';
  if (times.length === 0) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service is-asleep">${MOON_GLYPH}No service today</div></div>`;
  }
  if (next.length === 0) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service is-asleep">${MOON_GLYPH}Done for today</div></div>`;
  }
  let html = `<div class="route-group"><div class="route-label">${label}:</div><div class="dep-row">`;
  for (const t of next) {
    const mins = minutesUntil(t);
    const cdColor = mins <= 5 ? '#ff6b6b' : '#6bffb8';
    html += `<div class="dep-chip"><span class="t">${formatTime12(t)}</span><span class="cd" style="color:${cdColor}">${countdownText(mins)}</span></div>`;
  }
  html += '</div></div>';
  return html;
}

// ============================================================
// BUS (static fallback)
// ============================================================
function get126WillowSchedule() {
  let base;
  if (isSunday()) base = BUS_126_SCHEDULE.sunday;
  else if (isWeekend()) base = BUS_126_SCHEDULE.saturday;
  else base = BUS_126_SCHEDULE.weekday;
  return base.map(t => {
    let mins = timeToMinutes(t) + 2;
    if (mins >= 24 * 60) mins -= 24 * 60;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  });
}

function get119Schedule() {
  if (isWeekend()) return BUS_119_SCHEDULE.saturday;
  return BUS_119_SCHEDULE.weekday;
}

// The printed timetable we carry is for 14th & Bloomfield, but this panel now
// reports Washington & 13th — one stop SOUTH on the NY-bound 126, so the bus
// gets there about 2 minutes earlier. Shift the whole table back rather than
// re-sourcing it. Mirror image of get126WillowSchedule(), which shifts +2.
function get126ThirteenthSchedule() {
  let base;
  if (isSunday()) base = BUS_126_SCHEDULE.sunday;
  else if (isWeekend()) base = BUS_126_SCHEDULE.saturday;
  else base = BUS_126_SCHEDULE.weekday;
  return base.map(t => {
    let mins = timeToMinutes(t) - 2;
    if (mins < 0) mins += 24 * 60;   // 00:01 - 2min wraps to the previous day
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  });
}

function updateBusStatic() {
  const container = document.getElementById('busContent');
  let html = '';
  html += renderDepartures(get126ThirteenthSchedule(), '126 @ 13th');
  html += renderDepartures(get119Schedule(), '119 @ 15th');
  container.innerHTML = html;
}

// ============================================================
// PROXY FETCH
// ============================================================
// Displayed bus times use NJT's RAW countdown, matching the NJT app and the
// phone commute page (Jeff, 2026-07-26). `countdown` carries the PREDICTION_BIAS
// correction on top; it stays in the payload and is still used by the 119/126
// de-duplication filter below (which compares like with like, so the constant
// bias cancels out), but it must not drive anything the user reads.
function njtRaw(p) {
  const raw = p.raw_countdown;
  return parseInt((raw !== null && raw !== undefined && raw !== '') ? raw : p.countdown, 10);
}

function renderLivePredictions(predictions, label) {
  if (!predictions || predictions.error) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service is-error"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22z M11 9h2v6h-2z M11 17h2v2h-2z"/></svg>Reconnecting</div></div>`;
  }
  if (Array.isArray(predictions) && predictions.length > 0) {
    let html = `<div class="route-group"><div class="route-label">${label}:</div><div class="dep-row">`;
    // Order by what we DISPLAY, not by the proxy's order. The proxy sorts on its
    // bias-corrected `countdown`, but we show the RAW countdown for live rows and
    // the plain scheduled minutes for schedule-only rows — two scales that differ
    // by PREDICTION_BIAS. So the proxy order can put a later-displaying bus ahead
    // of an earlier one (a schedule-only "9 min" above a live "7 min", 2026-08-11).
    // Re-sort on njtRaw() — the number the user reads — so the column always counts up.
    const items = predictions.slice().sort((a, b) => njtRaw(a) - njtRaw(b)).slice(0, 3);
    // Compute the absolute arrival time (Unix ms) for each prediction by using
    // the proxy's fetched_at + the countdown that was true at that moment.
    // Then derive mins from current time. Conservative (floor) so we don't show
    // a longer countdown than reality and have the user miss the bus.
    const fetchedAtMs = (window._transitFetchedAt || Math.floor(Date.now() / 1000)) * 1000;
    // NJT seems to round their countdowns up, so shift the predicted arrival
    // ~30s earlier than reported. Makes the displayed countdown feel right —
    // not over-promising on time available.
    const DISPLAY_SHIFT_MS = 30000;
    for (const p of items) {
      const reportedMins = njtRaw(p);
      const arrivalMs = fetchedAtMs + reportedMins * 60000 - DISPLAY_SHIFT_MS;
      const msUntil = arrivalMs - Date.now();
      // Hide buses that are clearly more than 2 min past arrival.
      if (msUntil < -120000) continue;
      // Anything in (-2 min, +1 min) shows as "Due" so the imminent bus stays
      // visible until it's actually departed.
      const isDue = msUntil < 60000;
      const mins = isDue ? 0 : Math.floor(msUntil / 60000);
      const cdColor = mins <= 5 ? '#ff6b6b' : '#6bffb8';
      let displayTime;
      if (isDue) {
        displayTime = 'Due';
      } else {
        const arrive = new Date(arrivalMs);
        const hh = arrive.getHours();
        const mm = String(arrive.getMinutes()).padStart(2, '0');
        const ampm = hh >= 12 ? 'PM' : 'AM';
        const h12 = hh % 12 || 12;
        displayTime = `${h12}:${mm} ${ampm}`;
      }
      // Inferred (GPS-pace) ETAs are estimates, not live predictions. The proxy
      // flags them is_inferred; mark the chip so a guessed time never looks like
      // a real one — "~" on the countdown and "est" instead of a false-precise clock.
      const est = !!p.is_inferred;
      // Timetable-only: NJT lists the departure with no bus broadcasting behind
      // it. Shown since 2026-08-02 — hiding it left a gap where the NJT app had
      // a bus — but never coloured by urgency, because a red "3 min" you cannot
      // actually catch is worse than no number at all.
      const sched = !!p.is_scheduled;
      const cdText = (est ? '<span class="cd-unit">~</span>' : '') + countdownText(mins);
      const subLine = est ? 'est' : displayTime;
      html += `<div class="dep-chip${sched ? ' sched' : ''}"><span class="t">${subLine}</span><span class="cd" style="color:${sched ? '#8a8a9e' : cdColor}">${cdText}</span></div>`;
    }
    html += '</div></div>';
    return html;
  }
  return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service is-fallback"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zM12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>Schedule only</div></div>`;
}

async function fetchProxy() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(PROXY_URL);
    const data = await res.json();

    // Detect structured errors that mean the data is stale/wrong even
    // though the proxy returned 200. NJT auth-failed and per-stop "auth
    // failed" both look like normal {error: ...} objects — the dashboard
    // used to silently fall through to BUS_*_SCHEDULE static fallback
    // without firing markFail, so the panel-stale dimmer never engaged.
    // Match "auth failed", not bare "auth": the proxy reports a dark PANYNJ
    // sensor as "no data from Port Authority", and /auth/i matched
    // "Authority" — one dead tunnel reading flagged all of transit offline
    // and dimmed live bus times (2026-10-25).
    const transitDegraded = (
      (data.stops && Object.values(data.stops).some(s =>
        s && s.predictions && s.predictions.error === 'NJT auth failed')) ||
      (data.tunnel && data.tunnel.error && /auth failed/i.test(data.tunnel.error || ''))
    );
    if (transitDegraded) markFail('transit'); else markOk('transit');

    // Stash fetched_at so renderLivePredictions can reconcile against current time
    window._transitFetchedAt = data.fetched_at || Math.floor(Date.now() / 1000);
    // Stash the whole response so updateCommuteEstimate() can derive the
    // morning commute number even on its own clock-driven timer ticks.
    window._lastProxyData = data;

    if (data.tunnel && !data.tunnel.error) {
      const t = data.tunnel;
      const tt = parseInt(t.travelTime, 10);
      const timeEl = document.getElementById('tunnelTime');
      timeEl.textContent = isFinite(tt) ? tt : '--';
      // Color tiers (research-confirmed thresholds; free-flow is 6-8 min):
      //   < 10 min → Light    (green)
      //   10-19 min → Moderate (yellow)
      //   20-34 min → Heavy    (orange)
      //   35+ min → Very Heavy (red)
      let color = '#6bffb8';
      if (isFinite(tt)) {
        if      (tt >= 35) color = '#ff5050';
        else if (tt >= 20) color = '#ff9b40';
        else if (tt >= 10) color = '#e0c040';
      }
      timeEl.style.color = color;
      const minEl = document.getElementById('tunnelMin');
      if (minEl) minEl.style.color = color;
      // PA's infomationalText ("USUAL TRAFFIC" etc.) is uninformative —
      // hide the status row entirely; color of the number says it all.
      const statusEl = document.getElementById('tunnelStatus');
      statusEl.style.display = 'none';
    } else if (data.tunnel && data.tunnel.error) {
      // PA API errored — clear the stale time so a 4-min cached value
      // doesn't persist through what's actually a 35-min jam. Grey out.
      const timeEl = document.getElementById('tunnelTime');
      timeEl.textContent = '--';
      timeEl.style.color = '#666';
      const minEl = document.getElementById('tunnelMin');
      if (minEl) minEl.style.color = '#666';
    }

    if (data.stops) {
      const container = document.getElementById('busContent');
      let html = '';
      let apiWorking = false;

      const stop20514 = data.stops['20514'];
      if (stop20514 && Array.isArray(stop20514.predictions) && stop20514.predictions.length > 0) {
        html += renderLivePredictions(stop20514.predictions, '126 @ 13th');
        // API is working if we got an array of predictions back (live or scheduled)
        apiWorking = true;
      } else {
        let schedule;
        schedule = get126ThirteenthSchedule();
        html += renderDepartures(schedule, '126 @ 13th');
      }

      const stop20523 = data.stops['20523'];
      if (stop20523 && Array.isArray(stop20523.predictions) && stop20523.predictions.length > 0) {
        const preds13 = (stop20514 && Array.isArray(stop20514.predictions)) ? stop20514.predictions : [];
        const p13_126 = preds13.filter(p => p.route === '126');
        // Exact match first: one bus on one trip carries the same trip_id at
        // both stops, which beats any time window.
        const trips13 = new Set(p13_126.map(p => p.trip_id).filter(Boolean));
        // Then RAW (un-biased) countdowns. This used to read `countdown`, on the
        // grounds that PREDICTION_BIAS is a constant that cancels when comparing
        // like with like — but is_scheduled rows get no bias, so once they were
        // shown (2026-08-02) the two sides could differ by the bias alone and a
        // 126 leaked into the 119 column. njtRaw() is unbiased on both sides.
        const etaMins13 = p13_126.map(njtRaw);
        const filtered = stop20523.predictions.filter(p => {
          if (p.route !== '126') return true;
          if (p.trip_id && trips13.has(p.trip_id)) return false;
          const mins = njtRaw(p);
          return !etaMins13.some(m13 => Math.abs(mins - m13) <= 3);
        });
        if (filtered.length > 0) {
          html += renderLivePredictions(filtered, '119 @ 15th');
          apiWorking = true;
        } else {
          html += renderDepartures(get119Schedule(), '119 @ 15th');
        }
      } else {
        html += renderDepartures(get119Schedule(), '119 @ 15th');
      }

      container.innerHTML = html;

      const hl1 = document.getElementById('busHL1');
      const hl2 = document.getElementById('busHL2');
      if (hl1 && hl2) {
        // Detect inferred predictions: if the proxy fell back to
        // vehicle-position inference for any stop (BUSDV2 had no trips
        // there), those predictions carry is_inferred=true. Even a single
        // inferred prediction means at least one data stream is degraded,
        // so surface that as orange headlights — more honest than green.
        const allPreds = [stop20514, stop20523]
          .filter(s => s && Array.isArray(s.predictions))
          .flatMap(s => s.predictions);
        const anyInferred = allPreds.some(p => p.is_inferred);
        // A board carrying nothing but is_scheduled rows is a SCHEDULE board,
        // even though the API answered — no bus is being tracked at either
        // stop. Without this the headlights went green over timetable times.
        const anyTracked = allPreds.some(p => p.is_live);
        const mode = (!apiWorking || !anyTracked) ? 'schedule'
                   : (anyInferred ? 'inferred' : 'live');
        hl1.setAttribute('class', 'bus-headlight ' + mode);
        hl2.setAttribute('class', 'bus-headlight ' + mode);
      }
    }

    // Recompute the morning commute estimate with this fresh data.
    updateCommuteEstimate();
  } catch (e) {
    console.error('Proxy fetch error:', e);
    markFail('transit');
  }
}

function _hopSegDistM(lat, lng, a, b) {
  // meters from point to segment, equirectangular approx (fine at city scale)
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
  const ax = (a[1] - lng) * kx, ay = (a[0] - lat) * ky;
  const bx = (b[1] - lng) * kx, by = (b[0] - lat) * ky;
  const dx = bx - ax, dy = by - ay;
  const den = dx * dx + dy * dy;
  let t = den ? -(ax * dx + ay * dy) / den : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(ax + t * dx, ay + t * dy);
}

function _hopNearestStreet(lat, lng, streets) {
  let best = null;
  for (const s of streets) {
    const pts = s[1];
    for (let i = 0; i < pts.length - 1; i++) {
      const d = _hopSegDistM(lat, lng, pts[i], pts[i + 1]);
      if (!best || d < best.d) best = { name: s[0], d: d };
    }
  }
  return best;
}

function hopCorner(lat, lng) {
  const a = _hopNearestStreet(lat, lng, HOP_AVES);
  const x = _hopNearestStreet(lat, lng, HOP_XSTS);
  if (!a || !x || a.d > 100 || x.d > 100) return null;
  return a.name + ' & ' + x.name;
}

function renderHopEtas(data) {
  // Hop right panel mirrors the Lincoln Tunnel layout: big primary value +
  // "min" suffix on top, smaller status text below. The status line shows
  // the next 1–2 ETAs or a service note. Keeps bus and ferry cards visually
  // symmetric — both right-side panels read the same way.
  const timeEl = document.getElementById('hopTime');
  const minEl = document.getElementById('hopMin');
  const statusEl = document.getElementById('hopStatus');
  if (!timeEl || !statusEl) return;

  const setStatus = (text, color) => {
    statusEl.textContent = text;
    statusEl.style.color = color || '#9a9aa8';
  };

  // When the Hop isn't running, replace the "X min" line with a single
  // "No service" message (hide the trailing "min" suffix entirely).
  const showNoService = () => {
    timeEl.textContent = 'No service';
    timeEl.style.fontSize = '0.9rem';  // shrink so the words fit the chip
    if (minEl) minEl.style.display = 'none';
    setStatus('', '#666');
  };
  const showServiceMins = (n) => {
    timeEl.textContent = String(n);
    timeEl.style.fontSize = '';  // reset to the panel's default big number size
    if (minEl) minEl.style.display = '';
  };

  if (!data || data.error) {
    showNoService();
    setStatus(data && data.error ? 'Error' : '', '#666');
    return;
  }
  if (data.status === 'starts' && data.startsAt) {
    // Pre-service: show the first run's time instead of a phantom countdown.
    timeEl.textContent = 'Starts ' + data.startsAt;
    timeEl.style.fontSize = '0.9rem';  // shrink so the words fit the chip
    if (minEl) minEl.style.display = 'none';
    setStatus('', '#666');
    return;
  }
  if (data.status === 'no vehicles' || !Array.isArray(data) || data.length === 0) {
    showNoService();
    return;
  }

  const parsed = data.map(e => {
    const m = ((e && e.eta) || '').match(/^(\d+)/);
    return m ? { min: parseInt(m[1], 10) + 1, pos: e.pos } : null;
  }).filter(p => p !== null);

  if (parsed.length === 0) {
    showNoService();
    return;
  }
  const mins = parsed.map(p => p.min);

  // Where the bus IS beats a noisy ETA (Jeff, 2026-08-26): headline the
  // nearest corner ("Willow & 10th"), demote the minutes to the status line.
  // PassioGo's ETA engine is broken upstream (solidETAfailed on every poll),
  // but the GPS position is ground truth. Falls back to the old big-number
  // layout when the bus is off the street grid or has no position.
  const pos = parsed[0].pos;
  const corner = (pos && isFinite(pos[0]) && isFinite(pos[1]))
    ? hopCorner(pos[0], pos[1]) : null;
  if (corner) {
    timeEl.textContent = corner;
    timeEl.style.fontSize = corner.length > 16 ? '0.72rem' : '0.85rem';
    if (minEl) minEl.style.display = 'none';
    setStatus('~' + mins.slice(0, 2).join(', ') + ' min', '#6bffb8');
    return;
  }

  showServiceMins(mins[0]);
  if (mins.length > 1) {
    setStatus('next ' + mins.slice(1, 3).join(', ') + ' min', '#6bffb8');
  } else {
    setStatus('Running', '#6bffb8');
  }
}

async function fetchHop() {
  if (document.hidden || isSleeping()) return;
  try {
    const resp = await fetchT('https://passiogo.com/mapGetData.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'json=' + encodeURIComponent(JSON.stringify({s0:'466',sA:1})) + '&eta=3&deviceId=web&stopIds=158942',
    });
    const data = await resp.json();

    // ETAs — pre-service gate. ⚠️ scheduleTime "Service starts at H:MM" is
    // NOT a pre-service flag: it's the next scheduled stop time and persists
    // all day (logged 2026-08-26 — flipped 9:19→9:49 at 9:19:23 while the bus
    // was mid-loop). And a moving bus BEFORE the first scheduled run is a real
    // early loop, not a phantom (H4 claimed "7 min" at 8:58 and its GPS hit
    // the stop at 9:05, for a 9:19 first run). So only gate when BOTH hold:
    // the day's first scheduled run (scheduleTimes[0]) hasn't come AND the
    // bus isn't moving — i.e. it's genuinely parked at the depot.
    const etas = [];
    let startsAt = null;
    const clockMin = (s) => {
      const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(s || '');
      if (!m) return null;
      let h = parseInt(m[1], 10) % 12;
      if (/pm/i.test(m[3])) h += 12;
      return h * 60 + parseInt(m[2], 10);
    };
    const nowD = new Date();
    const nowMin = nowD.getHours() * 60 + nowD.getMinutes();
    for (const [key, entries] of Object.entries(data.ETAs || {})) {
      for (const entry of entries) {
        const sched = /^Service starts at\s+(.+)$/i.exec(entry.scheduleTime || '');
        const first = clockMin(Array.isArray(entry.scheduleTimes) ? entry.scheduleTimes[0] : null);
        const preWindow = first !== null && nowMin < first;
        const moving = (parseFloat(entry.speed) || 0) > 1;
        if (sched && preWindow && !moving) { startsAt = sched[1].trim(); continue; }
        if (entry.eta && entry.eta !== 'no vehicles') {
          // busLatLng = [lat, lng] of the bus this ETA belongs to — feeds the
          // corner label in renderHopEtas.
          const ll = entry.busLatLng;
          etas.push({
            eta: entry.eta,
            pos: (Array.isArray(ll) && ll.length === 2) ? ll : null,
          });
        }
      }
    }
    if (etas.length > 0) {
      renderHopEtas(etas);
    } else if (startsAt) {
      renderHopEtas({ status: 'starts', startsAt: startsAt });
    } else {
      renderHopEtas({ status: 'no vehicles' });
    }

    // Build a routeId → route name map (PassioGo returns "routes" alongside "buses")
    const routeNameById = {};
    const routesArr = data.routes || [];
    if (Array.isArray(routesArr)) {
      for (const r of routesArr) {
        routeNameById[r.id || r.routeId] = (r.name || r.routeName || '').toString();
      }
    } else if (typeof routesArr === 'object') {
      for (const k of Object.keys(routesArr)) {
        routeNameById[k] = (routesArr[k].name || routesArr[k].routeName || '').toString();
      }
    }

    // Live bus positions
    const hopBuses = [];
    const busesData = data.buses || {};
    for (const routeId of Object.keys(busesData)) {
      const arr = busesData[routeId];
      if (!Array.isArray(arr)) continue;
      const routeName = routeNameById[routeId] || '';
      for (const b of arr) {
        if (b.outOfService === '1' || b.outOfService === 1) continue;
        const lat = parseFloat(b.latitude);
        const lon = parseFloat(b.longitude);
        if (!isFinite(lat) || !isFinite(lon)) continue;
        // Determine color by route name (or bus name as fallback)
        const probe = (routeName + ' ' + (b.busName || b.name || '')).toLowerCase();
        let color = '#b070ff';  // generic purple fallback
        if (probe.includes('red'))   color = '#ff5050';
        if (probe.includes('green')) color = '#6bffb8';
        const course = parseFloat(b.calculatedCourse || b.course);
        hopBuses.push({
          busId: b.busId || b.id || b.busName || b.name || '',
          name: b.busName || b.name || 'Hop',
          lat: lat,
          lon: lon,
          heading: isFinite(course) ? course : null,
          route: routeName || 'Hop',
          color: color,
        });
      }
    }
    renderHopBuses(hopBuses);
    markOk('hop');
  } catch (e) {
    console.error('Hop fetch error:', e);
    renderHopEtas({ error: e.message });
    renderHopBuses([]);  // clear stale markers on error
    markFail('hop');
  }
}

// Animation state for smooth bus/hop marker movement between polls.
// Duration slightly exceeds the 15s poll cadence so the marker never visibly
// "stops" between polls; cubic ease-in-out softens both ends of the slide.
const MARKER_ANIM_MS = 15500;
let _markerAnims = {};
let _markerAnimFrame = null;

// Cubic ease-in-out: gentle start and finish, near-linear in the middle.
function _easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function _animateMarkers() {
  const now = performance.now();
  let active = false;
  for (const id of Object.keys(_markerAnims)) {
    const a = _markerAnims[id];
    if (!a.marker) { delete _markerAnims[id]; continue; }
    const tRaw = Math.min((now - a.t0) / MARKER_ANIM_MS, 1);
    const t = _easeInOutCubic(tRaw);
    a.marker.setLatLng([
      a.lat0 + (a.lat1 - a.lat0) * t,
      a.lon0 + (a.lon1 - a.lon0) * t,
    ]);
    if (tRaw < 1) active = true;
    else delete _markerAnims[id];
  }
  _markerAnimFrame = active ? requestAnimationFrame(_animateMarkers) : null;
}

function _slideTo(id, marker, lat, lon) {
  const cur = marker.getLatLng();
  if (Math.abs(cur.lat - lat) < 0.00001 && Math.abs(cur.lng - lon) < 0.00001) return;
  // Pick up from the marker's current visible position (which may itself
  // be mid-animation) so consecutive polls produce one continuous glide
  // rather than a jump-reset.
  _markerAnims[id] = {
    marker,
    lat0: cur.lat, lon0: cur.lng,
    lat1: lat,     lon1: lon,
    t0: performance.now(),
  };
  if (!_markerAnimFrame) _markerAnimFrame = requestAnimationFrame(_animateMarkers);
}

  // Only advance state on a genuinely newer fix (received_at moved forward) so a
  // re-render of the same fix doesn't read as zero-speed and clear motion.
  const fixT = loc.received_at ? loc.received_at * 1000 : now;
  if (p.lastFixT != null && fixT > p.lastFixT && p.lastLat != null) {
    const moved = distMi({ lat: p.lastLat, lon: p.lastLon }, loc);
    const hrs = (fixT - p.lastFixT) / 3600000;
    if (hrs > 0 && moved / hrs >= RIDE_MIN_MPH) p.lastMovedAt = now;
  }
  if (fixT !== p.lastFixT) { p.lastLat = loc.lat; p.lastLon = loc.lon; p.lastFixT = fixT; }
  const recentlyMoving = p.lastMovedAt != null && (now - p.lastMovedAt) < RIDE_MOVE_GRACE;
  const fixFresh = (loc.received_at ? (now / 1000 - loc.received_at) : Infinity) <= RIDE_FIX_MAX_AGE;

  // Distance-to-home history (8-min rolling window) for the "heading home"
  // status. Appended only on genuinely newer fixes so re-renders don't dilute.
  if (!p.distSamples) p.distSamples = [];
  if (!p.distSamples.length || fixT > p.distSamples[p.distSamples.length - 1].t) {
    p.distSamples.push({ t: fixT, d: dHome });
    while (p.distSamples.length && fixT - p.distSamples[0].t > 8 * 60000) {
      p.distSamples.shift();
    }
  }

  // --- Match the nearest vehicle, but only when riding-eligible. -------------
  let candidate = null, candidateKey = null, matchedVeh = null;
  if (recentlyMoving && fixFresh) {
    for (const b of _lastBuses) {
      if (b.lat == null || b.lon == null) continue;
      if (distMi(loc, { lat: b.lat, lon: b.lon }) < RIDE_NEAR_MI) {
        candidate = 'on ' + b.route;
        candidateKey = b.route + '#' + (b.vehicle_id || '?');
        matchedVeh = b;
        break;
      }
    }
    if (!candidate) {
      for (const b of _lastHopBuses) {
        if (b.lat == null || b.lon == null) continue;
        if (distMi(loc, { lat: b.lat, lon: b.lon }) < RIDE_NEAR_MI) {
          const probe = (b.route || '').toLowerCase();
          candidate = probe.includes('red')   ? 'on Red Hop' :
                      probe.includes('green') ? 'on Green Hop' :
                      'on Hop';
          candidateKey = 'hop#' + (b.vehicle_id || b.route || '?');
          matchedVeh = b;
          break;
        }
      }
    }
  }

  // Persistence: confirm only after 60s alongside the SAME vehicle AND only if
  // that vehicle actually moved (co-travel). Anchoring busStart* to the vehicle
  // position when the lock begins lets us measure how far it travelled during
  // the lock — an idling bus next to a parked person never clears CO_TRAVEL_MIN.
  if (candidateKey && matchedVeh) {
    if (p.candidate !== candidateKey) {
      p.candidate = candidateKey; p.since = now;
      p.busStartLat = matchedVeh.lat; p.busStartLon = matchedVeh.lon;
    }
    const busTravelled = (p.busStartLat != null)
      ? distMi({ lat: p.busStartLat, lon: p.busStartLon }, { lat: matchedVeh.lat, lon: matchedVeh.lon })
      : 0;
    if (now - p.since >= 60000 && busTravelled >= CO_TRAVEL_MIN) return candidate;
  } else {
    p.candidate = null; p.since = null; p.busStartLat = null; p.busStartLon = null;
  }

  // Over water → on ferry, but only on a FRESH fix. You can't be mid-Hudson
  // except on a boat — but a STALE dot that happens to sit in the river bbox
  // (or a waterfront walk at the box edge) shouldn't be asserted as "on ferry".
  if (fixFresh && isOverWater(loc.lat, loc.lon)) return 'on ferry';

  // Heading home: outside the neighborhood, fresh fix, and distance-to-home
  // has fallen steadily for 2+ minutes → show an ETA. Covers the stretch the
  // vehicle matcher can't (Lincoln Tunnel, Manhattan, driving) — the exact
  // window when "is Jeff on his way?" gets asked.
  if (fixFresh && dHome >= 0.5 && p.distSamples.length >= 2) {
    const first = p.distSamples[0];
    const last = p.distSamples[p.distSamples.length - 1];
    const spanMin = (last.t - first.t) / 60000;
    const closedMi = first.d - last.d;
    if (spanMin >= 2 && closedMi >= 0.25) {
      const rate = closedMi / spanMin;   // miles per minute toward home
      if (rate >= 0.08) {                // sustained ≥ ~5 mph closing speed
        let eta = Math.round(dHome / rate);
        if (eta <= 90) {
          if (eta > 10) eta = Math.round(eta / 5) * 5;  // coarse past 10 min
          return 'heading home · ~' + Math.max(eta, 1) + ' min';
        }
      }
    }
  }

  // Where they actually are. This sits BELOW the dynamic states above on
  // purpose: "on 126" / "heading home · ~15 min" answer the question the wall
  // is usually asked, and a static place name would be a downgrade from them.
  // But it outranks bare distance — "at Bright Horizons" beats "1.2 mi away",
  // and "near home" is uselessly vague when we can name Trader Joe's.
  // `place` comes from the geofence list, `city` from the proxy's box/OSM
  // resolution; both may be absent, hence the distance fallback below.
  if (loc.place) return 'at ' + loc.place;
  if (loc.city)  return 'in ' + loc.city;

  if (dHome < 0.5) return 'near home';
  return dHome.toFixed(1) + ' mi away';
}

// --- Pill grouping: people who are in the same place share one pill ---------
// Home is its own group regardless of coordinate jitter — isAtHome() already
// settled that question (Life360 geofence beats a 300 ft Tile wobble), and two
// people in the house can otherwise read as 400 ft apart.
function groupByPlace(people) {
  const groups = [];
  (people || []).forEach(function (l) {
    const home = isAtHome(l);
    let g = null;
    for (const cand of groups) {
      if (cand.home !== home) continue;
      if (home) { g = cand; break; }
      // NaN (a person with no usable fix) fails this, so they stand alone.
      if (distMi(cand.people[0], l) <= OVERLAP_MI) { g = cand; break; }
    }
    if (g) g.people.push(l);
    else groups.push({ home: home, people: [l] });
  });
  return groups;
}

// One label for the group. personStatus() is per-person and can disagree for
// people standing together — one phone knows the geofence name, the other only
// its distance. Prefer whichever actually names the place; the fallbacks all
// describe the same spot anyway.
function groupStatus(people) {
  const vague = /^(near home|last seen |[\d.]+ mi away)/;
  let best = null;
  people.forEach(function (l) {
    const s = personStatus(l);   // called once per person either way
    if (best === null || (vague.test(best) && !vague.test(s))) best = s;
  });
  return best || '';
}

function joinNames(names) {
  if (names.length <= 1) return names[0] || '';
  if (names.length === 2) return names[0] + ' & ' + names[1];
  return names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
}

function distMi(a, b) {
  const R = 3959; // miles
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(lat1) * Math.cos(lat2);
  return 2 * R * Math.asin(Math.sqrt(x));
}

// Jawg.Dark — clean dark theme, no road shield badges. Shared by the wall map
// and the corner away-insets so they never drift apart visually.
const MAP_TILE_URL = 'https://{s}.tile.jawg.io/jawg-dark/{z}/{x}/{y}{r}.png?access-token=Lrrwi9HKsiS8ptMSGUR1K7cGy3sg60y1kCop0PsvWIy3H5yUz85QIzfTXJwtjwnq';

// Face bubble for a person marker. onerror: photos live only on the Beelink now
// (pulled from the public repo 2026-07-26) — on the Pages fallback the jpgs 404,
// so degrade to the same initials treatment as an unmapped TID.
function faceMarkerHtml(loc) {
  if (loc.tid === 'WG') return WAGON_MARKER_HTML;  // PNG data URI — the WebView mangles SVG
  const faceUrl = FACE_IMAGES[loc.tid];
  return faceUrl
    ? '<img src="' + faceUrl + '" alt="' + displayName(loc) +
      '" onerror="this.replaceWith(this.alt.slice(0,2).toUpperCase())"/>'
    : (displayName(loc) || '?').substring(0, 2).toUpperCase();
}

function initHobokenMap() {
  if (_hobokenMap || typeof L === 'undefined') return;
  const hasRotate = typeof L.Map.prototype.setBearing === 'function';
  _hobokenMap = L.map('hobokenMap', Object.assign({
    zoomControl: false,
    attributionControl: false,
    dragging: true,
    scrollWheelZoom: false,
  }, hasRotate ? {
    rotate: true,
    bearing: 0,
    touchRotate: false,
    // No compass button. Rotation is driven by the remote's OK button through
    // applyViewMode(), and nobody touches the wall display with a mouse — the
    // control was just a stray widget sitting on the map.
    rotateControl: false,
  } : {}));
  // Use setView with center+zoom (works better with rotation than fitBounds)
  // Center: between Hoboken and Midtown Manhattan
  _hobokenMap.setView([40.750, -74.003], 14);
  L.tileLayer(MAP_TILE_URL, {
    maxZoom: 22,
    subdomains: 'abcd',
    attribution: '',
  }).addTo(_hobokenMap);

  // Home marker — small blue house. Reduced from 30→24px so the family
  // bubbles (the actual answer to "where is everyone?") become the loudest
  // thing on the map. When people are at home they orbit this badge in a ring.
  const homeIcon = L.divIcon({
    className: 'home-marker',
    html:
      '<svg viewBox="0 0 24 24" fill="#fff">' +
      '<path d="M12 3 3 11h2v8h5v-5h4v5h5v-8h2z"/></svg>',
    iconSize: [24, 24],
    iconAnchor: [12, 12],
  });
  _homeMarker = L.marker([HOME.lat, HOME.lon], {
    icon: homeIcon,
    zIndexOffset: -500,  // home sits BEHIND people now (they're the answer)
  }).addTo(_hobokenMap);

  // Re-render bus markers when zoom changes so their size adjusts to the
  // new view. At wide zooms (Hoboken + Manhattan visible) markers shrink so
  // 40+ buses don't pile into a cluttered mess. _busIconScale() picks the
  // factor; _lastBuses holds the last batch so we don't need a new fetch.
  _hobokenMap.on('zoomend', function () {
    if (typeof renderBuses === 'function') renderBuses(mapBuses());
  });

  // Initial view: tight on home (will re-fit once locations arrive)
  _hobokenMap.setView([HOME.lat, HOME.lon], 14);
  // The grid/fonts settle a beat after init; re-measure so the very first paint
  // loads a full set of tiles instead of a half-sized gray map ("load properly
  // at the start", Jeff 2026-08-30).
  setTimeout(function () { if (_hobokenMap) _hobokenMap.invalidateSize(); }, 400);

  // Remote-control zoom: channel-up / channel-down buttons zoom the map.
  // Different TV platforms emit different key identifiers for these buttons,
  // so we match all the common ones. D-pad arrows are left alone so they keep
  // panning via Leaflet's default keyboard handler.
  const ZOOM_IN_KEYS  = new Set(['ChannelUp',   'PageUp',   'MediaTrackNext']);
  const ZOOM_OUT_KEYS = new Set(['ChannelDown', 'PageDown', 'MediaTrackPrevious']);
  const ZOOM_IN_CODES  = new Set([427, 33]);   // 427 = VK_CHANNEL_UP, 33 = PageUp
  const ZOOM_OUT_CODES = new Set([428, 34]);   // 428 = VK_CHANNEL_DOWN, 34 = PageDown
  // Select / OK button in the center of the D-pad: typically Enter (13),
  // sometimes 'Select' or the legacy 'Spacebar'. Cycles map view mode.
  const SELECT_KEYS  = new Set(['Enter', 'Select', ' ', 'Spacebar', 'OK']);
  const SELECT_CODES = new Set([13, 32, 23]);   // 23 = Android KEYCODE_DPAD_CENTER

  // View-mode state machine (0..3):
  //   0 = default                  (true north, no labels)
  //   1 = rotated to street grid   (Hoboken streets point straight up)
  //   2 = default + bus labels     (true north, permanent #s)
  //   3 = street grid + bus labels (streets up, permanent #s)
  const STREET_GRID_BEARING = -29;
  // Restore the last view mode from prior session if available so a nightly
  // reload (or Onn restart) lands the family back where they left off.
  let _persistedMode = 0;
  try {
    const v = parseInt(localStorage.getItem('viewMode'), 10);
    if (!isNaN(v) && v >= 0 && v <= 3) _persistedMode = v;
  } catch (e) {}
  window._viewMode = _persistedMode;
  window._showBusLabels = false;
  let _lastSelectTs = 0;
  function applyViewMode() {
    const m = window._viewMode | 0;
    const wantStreetGrid = (m === 1 || m === 3);
    const wantLabels     = (m === 2 || m === 3);
    if (_hobokenMap && typeof _hobokenMap.setBearing === 'function') {
      _hobokenMap.setBearing(wantStreetGrid ? STREET_GRID_BEARING : 0);
    }
    window._showBusLabels = wantLabels;
    // Re-bind tooltips on existing bus markers so permanent flag matches.
    for (const key of Object.keys(_busMarkers || {})) {
      const mk = _busMarkers[key];
      if (!mk) continue;
      const content = mk.getTooltip() ? mk.getTooltip().getContent() : '';
      mk.unbindTooltip();
      mk.bindTooltip(content, {
        direction: 'top',
        offset: [0, -18],
        className: 'bus-tip',
        permanent: wantLabels,
      });
    }
    // Rotating to the street grid moves people around the compass on screen,
    // so the away-insets have to re-pick their corners with it.
    if (typeof renderAwayInsets === 'function') renderAwayInsets(_lastLocations);
  }
  applyViewMode();

  // View-mode toast — 3s auto-fading label in the map's top-right whenever
  // the mode CHANGES (not on initial load). The mode persists across reboots
  // via localStorage, so without this an accidental OK press would leave the
  // map silently reconfigured forever.
  const VIEW_MODE_NAMES = [
    'North up',
    'Streets up',
    'North up · bus #s',
    'Streets up · bus #s',
  ];
  let _toastTimer = null;
  function showViewModeToast() {
    const mapCard = document.getElementById('mapCard');
    if (!mapCard) return;
    let el = document.getElementById('viewModeToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'viewModeToast';
      mapCard.appendChild(el);
    }
    el.textContent = VIEW_MODE_NAMES[window._viewMode | 0] || '';
    el.classList.add('show');
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3000);
  }

  // On-screen key debug — shows the last key event so we can identify what
  // the remote actually emits. Toggle by appending ?keydebug to the URL.
  let _keyDebugEl = null;
  if (location.search.includes('keydebug')) {
    _keyDebugEl = document.createElement('div');
    _keyDebugEl.style.cssText =
      'position:fixed;bottom:8px;right:8px;z-index:9999;background:#000;color:#0f0;' +
      'font:13px monospace;padding:6px 10px;border:1px solid #0f0;border-radius:4px;';
    _keyDebugEl.textContent = 'keydebug ready';
    document.body.appendChild(_keyDebugEl);
  }
  window.addEventListener('keydown', function (e) {
    if (_keyDebugEl) {
      _keyDebugEl.textContent = 'key=' + e.key + ' code=' + e.code + ' kc=' + e.keyCode;
    }
    // Silently ignore the remote when the screen is asleep — otherwise the
    // family wakes up to a randomly-cycled view mode.
    if (typeof isSleeping === 'function' && isSleeping()) return;
    if (!_hobokenMap) return;
    const k = e.key || '';
    if (ZOOM_IN_KEYS.has(k) || ZOOM_IN_CODES.has(e.keyCode)) {
      _hobokenMap.zoomIn(1);
      e.preventDefault(); e.stopPropagation();
    } else if (ZOOM_OUT_KEYS.has(k) || ZOOM_OUT_CODES.has(e.keyCode)) {
      _hobokenMap.zoomOut(1);
      e.preventDefault(); e.stopPropagation();
    } else if (SELECT_KEYS.has(k) || SELECT_CODES.has(e.keyCode)) {
      // Debounce — Onn remote auto-repeats; 150ms keeps the cycle predictable.
      const now = performance.now();
      if (now - _lastSelectTs < 150) {
        e.preventDefault(); e.stopPropagation();
        return;
      }
      _lastSelectTs = now;
      window._viewMode = ((window._viewMode | 0) + 1) % 4;
      try { localStorage.setItem('viewMode', String(window._viewMode)); } catch (_) {}
      applyViewMode();
      showViewModeToast();
      e.preventDefault(); e.stopPropagation();
    }
  }, true);

  // Seed home stubs so face bubbles appear before first network fetch
  renderLocations(HOME_STUBS);
}

// Approach-mode: when anyone is inside Hoboken AND moving toward home, we
// want fresher data — bump the location poll cadence so the family knows
// who's almost-arrived. Tracks per-TID last-known distance to home so we
// can detect "decreasing distance" between polls.
const HOBOKEN_BBOX = { latMin: 40.733, latMax: 40.768, lonMin: -74.040, lonMax: -74.018 };
const APPROACH_POLL_MS = 7000;   // when someone's approaching, poll every 7s
const DEFAULT_POLL_MS = 15000;   // otherwise the normal 15s
let _prevDistToHome = {};        // tid → last-known distance (miles)

function _inHoboken(loc) {
  return loc.lat >= HOBOKEN_BBOX.latMin && loc.lat <= HOBOKEN_BBOX.latMax &&
         loc.lon >= HOBOKEN_BBOX.lonMin && loc.lon <= HOBOKEN_BBOX.lonMax;
}

function _someoneApproachingHome(locs) {
  // True if at least one person is inside Hoboken bbox, outside the at-home
  // radius (so they're meaningfully en route), and closer to home than the
  // previous reading by at least 0.01 mi (~50 ft, filters GPS jitter).
  for (const l of locs) {
    if (!l.received_at || !l.lat || !l.lon) continue;
    if (!_inHoboken(l)) continue;
    const d = distMi(HOME, l);
    if (isAtHome(l)) continue;               // already home
    if (d > 1.5) continue;                   // too far to care yet
    const prev = _prevDistToHome[l.tid];
    if (prev != null && (prev - d) >= 0.01) return true;
  }
  return false;
}

// Remembers whether the *previous* poll detected someone approaching, so
// we send fast=1 on the NEXT proxy request. The flag mirrors the cadence
// state — if we're polling at 7s, we ask the proxy to tighten its Life360
// cache to 15s too.
let _approachMode = false;

async function fetchLocations() {
  if (!PROXY_URL) return;
  // This loop is a self-rescheduling setTimeout, so a bare return here KILLS
  // location updates until a visibility/wake event happens to re-kick it —
  // and Fully's screen-on doesn't reliably fire one (bit us 2026-08-13 when
  // the page loaded while the screen was off). Idle cheaply instead.
  _locationsLastRun = Date.now();
  if (document.hidden || isSleeping()) { _scheduleLocationsPoll(DEFAULT_POLL_MS); return; }
  const token = localStorage.getItem('calToken') || '';
  let next = DEFAULT_POLL_MS;
  try {
    const url = PROXY_URL + '?mode=locations' + (_approachMode ? '&fast=1' : '');
    const res = await fetchT(url, { headers: { 'X-Cal-Token': token } });
    if (!res.ok) { markFail('locations'); return; }   // finally still reschedules
    const data = await res.json();
    markOk('locations');
    applyHomeFromProxy(data.home);     // real coords before anything measures distance
    _lastBuses = data.buses || [];     // first: the riding status reads it
    renderBuses(mapBuses());
    const liveLocs = data.locations || [];
    const liveTids = new Set(liveLocs.map(l => l.tid));
    const stubs = HOME_STUBS.filter(s => !liveTids.has(s.tid));
    renderLocations([...stubs, ...liveLocs]);
    renderTiles(data.tiles || []);

    // Approach detection: compare each person's current distance-to-home
    // against last poll's. If anyone's actively closing the gap inside
    // Hoboken, schedule the next poll on the fast cadence + signal the
    // proxy to tighten its Life360 cache.
    const approaching = _someoneApproachingHome(liveLocs);
    for (const l of liveLocs) {
      if (l.lat != null && l.lon != null) _prevDistToHome[l.tid] = distMi(HOME, l);
    }
    _approachMode = approaching;
    next = approaching ? APPROACH_POLL_MS : DEFAULT_POLL_MS;
  } catch (e) {
    console.error('Locations fetch error:', e);
    markFail('locations');
  } finally {
    // The ONE place the chain continues — every exit path passes through here.
    _scheduleLocationsPoll(next);
  }
}

let _locationsPollTimer = null;
let _locationsLastRun = 0;
function _scheduleLocationsPoll(ms) {
  if (_locationsPollTimer) clearTimeout(_locationsPollTimer);
  _locationsPollTimer = setTimeout(fetchLocations, ms);
}

// Watchdog: fetchLocations() runs at least every 15s (even asleep/hidden, where
// it idles without network). If it hasn't run in 60s the chain died some way we
// didn't foresee — restart it rather than leave the map frozen until a reload.
setInterval(function () {
  if (_locationsLastRun && Date.now() - _locationsLastRun > 60000) {
    console.warn('Locations loop stalled; restarting');
    fetchLocations();
  }
}, 30000);

function renderTiles(tiles) {
  if (!_hobokenMap) return;
  const seen = new Set();
  for (const t of tiles) {
    const key = t.uuid;
    seen.add(key);
    const latlng = [t.lat, t.lon];
    const cfg = TILE_DEVICES[t.name] || {};
    const label = cfg.icon || (t.name || '?').substring(0, 2).toUpperCase();
    const style = cfg.color ? ('background:' + cfg.color + ';') : '';
    const icon = L.divIcon({
      className: 'tile-marker',
      html: '<div style="' + style + 'width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;">' + label + '</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13],
    });
    if (_tileMarkers[key]) {
      _tileMarkers[key].setLatLng(latlng);
      _tileMarkers[key].setIcon(icon);
    } else {
      _tileMarkers[key] = L.marker(latlng, { icon: icon, zIndexOffset: 9000 }).addTo(_hobokenMap);
    }
  }
  for (const key of Object.keys(_tileMarkers)) {
    if (!seen.has(key)) {
      _hobokenMap.removeLayer(_tileMarkers[key]);
      delete _tileMarkers[key];
    }
  }
}

function busLoadColor(passload) {
  const p = (passload || '').toUpperCase();
  if (p === 'EMPTY')                      return '#44ee44';
  if (p === 'LIGHT')                      return '#a0e060';
  if (p === 'MEDIUM')                     return '#e0c040';
  if (p === 'HEAVY')                      return '#ff9b40';
  if (p === 'FULL' || p === 'OVERLOADED') return '#ff5050';
  return '#7090a0';
}

function _busSvg(arrowColor, scale) {
  // NJT bus marker: NJTbus.png logo as the body, with a colored arrow above.
  // Only NY-bound 126s are drawn (see renderBuses), so the arrow always
  // points up; its color encodes passenger load (see busLoadColor). All
  // sizes are written inline so the marker scales with map zoom —
  // _busIconScale() returns the factor (1.0 at zoom 15+, dropping to 0.4 at
  // zoom <= 11).
  scale = scale || 1;
  const W  = Math.round(26 * scale);   // marker width & body height (body is square)
  const AH = Math.round(14 * scale);   // arrow height
  const arrow =
    '<svg class="nbm-arrow" width="' + W + '" height="' + AH + '" viewBox="0 0 26 14">' +
      '<polygon points="13,1 1,13 25,13" fill="' + arrowColor + '"' +
        ' stroke="rgba(20,30,40,0.8)" stroke-width="1" stroke-linejoin="round"/>' +
    '</svg>';
  const img = '<img src="NJTbus.png" class="nbm-body" alt=""' +
              ' style="width:' + W + 'px;height:' + W + 'px;">';
  return '<div class="nbm-wrap" style="width:' + W + 'px;height:' + (W + AH) + 'px;">' +
         arrow + img + '</div>';
}

// ── Which way is each bus going? Read from its movement, not its label ──
// NJT stopped sending destinations on 2026-10-01; the proxy fills them from
// the trips listed at OUR three stops, so most buses come back blank (46 of
// 56 at 8:35 on 2026-10-26), and blank used to draw a "to Hoboken" arrow on
// buses plainly driving north to the tunnel. The labels that do arrive are
// wrong too: a bus keeps reporting its last trip number after the trip ends,
// so a 126 leaving Port Authority westbound still reads "126 NEW YORK".
// Movement is the ground truth. Both routes run between the Lincoln Tunnel
// and points south and west of it, so on the NJ side a bus closing on the
// tunnel portal is NY-bound; in Manhattan, one closing on Port Authority is;
// crossing the river eastward is, westward isn't. The label is only a first
// guess until the bus has moved; a bus with no label that hasn't moved yet
// counts as unknown, and renderBuses doesn't draw it.
//
// A ratchet, not a step-by-step comparison: the routes jog and loop (cross
// streets, the circuit at Hoboken Terminal), and comparing each fix with the
// last flipped arrows back and forth on those stretches. Instead remember the
// closest the bus has come to its goal (or the farthest it has got from it)
// and flip only once it has gone BUS_FLIP_M back the other way. Real
// turnarounds happen at the terminals, so the cost is a short delay there.
const BUS_LT_PORTAL_NJ = [40.7630, -74.0165];  // Lincoln Tunnel, Weehawken
const BUS_PABT         = [40.7570, -73.9910];  // Port Authority Bus Terminal
const BUS_HUDSON_LON   = -74.012;              // east of this = NY side / tube
const BUS_FIRST_M      = 60;     // first call: GPS jitter at a stop stays below
const BUS_FLIP_M       = 150;    // reversal needed to flip an established call
const BUS_TRACK_TTL_MS = 10 * 60 * 1000;
let _busTrack = {};   // vehicle_id -> {ny, ext, toNYC, seen}

function _metersBetween(lat1, lon1, lat2, lon2) {
  const dN = (lat2 - lat1) * 111320;
  const dE = (lon2 - lon1) * 111320 * Math.cos(lat1 * Math.PI / 180);
  return Math.hypot(dN, dE);
}

function _busLabelToNYC(b) {
  const d = (b.destination || '').toUpperCase();
  if (!d) return null;
  return d.includes('NEW YORK');
}

function _busGoalDist(b, ny) {
  const g = ny ? BUS_PABT : BUS_LT_PORTAL_NJ;
  return _metersBetween(b.lat, b.lon, g[0], g[1]);
}

// Returns true (NY-bound), false (heading away from NY) or null (unknown).
function busToNYC(b, now) {
  const id = b.vehicle_id;
  if (!id) return _busLabelToNYC(b);
  const ny = b.lon > BUS_HUDSON_LON;
  const d = _busGoalDist(b, ny);
  let t = _busTrack[id];
  if (!t) {
    // ext = distance to the goal where the current call was last confirmed
    // (for an unknown, where the bus was first seen).
    t = _busTrack[id] = { ny, ext: d, toNYC: null, seen: now };
  } else if (t.ny !== ny) {
    t.ny = ny; t.ext = d; t.toNYC = ny;  // crossed the river
  } else if (t.toNYC === null) {
    if (Math.abs(d - t.ext) >= BUS_FIRST_M) { t.toNYC = d < t.ext; t.ext = d; }
  } else if (t.toNYC) {
    t.ext = Math.min(t.ext, d);
    if (d - t.ext >= BUS_FLIP_M) { t.toNYC = false; t.ext = d; }
  } else {
    t.ext = Math.max(t.ext, d);
    if (t.ext - d >= BUS_FLIP_M) { t.toNYC = true; t.ext = d; }
  }
  t.seen = now;
  return t.toNYC !== null ? t.toNYC : _busLabelToNYC(b);
}

function _pruneBusTrack(now) {
  for (const id of Object.keys(_busTrack)) {
    if (now - _busTrack[id].seen > BUS_TRACK_TTL_MS) delete _busTrack[id];
  }
}

// Bus icon size scales with map zoom — at the close-in Hoboken view (zoom
// 15+) the 26×40 marker is right-sized, but zoomed out to show Lower
// Manhattan (zoom 12-13) those same markers crowd into a cluttered mess of
// 40+ overlapping buses. Drop to ~50% size at zoom 12 so they still convey
// "bus density" without obscuring the map underneath.
function _busIconScale() {
  if (!_hobokenMap) return 1;
  const z = _hobokenMap.getZoom();
  if (z >= 15) return 1.0;
  if (z >= 14) return 0.85;
  if (z >= 13) return 0.65;
  if (z >= 12) return 0.5;
  return 0.4;
}

// ── Live bus positions from the Beelink (2026-10-26) ──
// The proxy's /locations caches NJT's vehicle feed for 40 s (a Cloud Run cost
// choice), so buses glided 15 s and then sat still ~35 s while NJT itself
// updates each one about every 15 s. bus-feed.service (~/apps/bus-feed) now
// fetches NJT from the Beelink every ~12 s while the wall asks, free, and
// Caddy serves it here on the LAN. The proxy's list stays as the fallback
// whenever the feed is missing or stale, and stays the source for the riding
// status, which also needs the 119s.
const BUS_FEED_URL = '/api/buses';
const BUS_FEED_POLL_MS = 10000;
const BUS_FEED_STALE_S = 60;

async function pollBusFeed() {
  if (!IS_LOCAL || document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(BUS_FEED_URL, null, 8000);
    const d = res.ok ? await res.json() : null;
    _feedBuses = (d && d.fetched_at && d.age_s != null && d.age_s < BUS_FEED_STALE_S)
      ? (d.buses || []) : null;
  } catch (e) {
    _feedBuses = null;
  }
  renderBuses(mapBuses());
}

// The buses the map should draw from: the live feed when it's fresh, else the
// proxy's list. NJT's own feed carries no destinations; borrow the label the
// proxy filled in, which busToNYC uses only as a first guess.
function mapBuses() {
  if (!_feedBuses) return _lastBuses;
  const labels = {};
  for (const b of _lastBuses) if (b.vehicle_id && b.destination) labels[b.vehicle_id] = b.destination;
  return _feedBuses.map(function (b) {
    return (b.destination || !labels[b.vehicle_id]) ? b
      : Object.assign({}, b, { destination: labels[b.vehicle_id] });
  });
}

// Only the 126, and only NY-bound: Jeff's commute (2026-10-26, "I only need
// to show 126 and only those going the direction of my commute"). Every 126
// is still tracked, so one turning around at Hoboken Terminal appears as soon
// as it heads north. _lastBuses (set by the locations poll) keeps the FULL
// proxy list on purpose: the "on 126" / "on 119" riding status reads it and
// has to work in either direction.
function renderBuses(buses) {
  if (!_hobokenMap) return;
  const scale = _busIconScale();
  const W = Math.round(26 * scale);
  const AH = Math.round(14 * scale);
  const H = W + AH;  // body W + arrow AH — match what _busSvg builds
  const seen = new Set();
  const now = Date.now();
  _pruneBusTrack(now);
  const shown = [];
  for (const b of buses || []) {
    if (b.route !== '126' || busToNYC(b, now) !== true) continue;
    shown.push(b);
    const key = 'bus_' + (b.vehicle_id || (b.route + '_' + b.lat.toFixed(4) + '_' + b.lon.toFixed(4)));
    seen.add(key);
    const arrowColor = busLoadColor(b.passload);
    const icon = L.divIcon({
      className: 'bus-marker',
      html: _busSvg(arrowColor, scale),
      iconSize: [W, H],
      iconAnchor: [Math.round(W / 2), Math.round(H / 2)],
    });
    const label = (b.route ? b.route : 'Bus') + (b.vehicle_id ? ' · #' + b.vehicle_id : '');
    if (_busMarkers[key]) {
      _busMarkers[key].setIcon(icon);
      _busMarkers[key].setTooltipContent(label);
      _slideTo(key, _busMarkers[key], b.lat, b.lon);
    } else {
      _busMarkers[key] = L.marker([b.lat, b.lon], { icon: icon })
        .bindTooltip(label, {
          direction: 'top',
          offset: [0, -18],
          className: 'bus-tip',
          permanent: !!window._showBusLabels,
        })
        .addTo(_hobokenMap);
    }
  }
  _shownBuses = shown;
  for (const key of Object.keys(_busMarkers)) {
    if (!seen.has(key)) {
      _hobokenMap.removeLayer(_busMarkers[key]);
      delete _busMarkers[key];
      delete _markerAnims[key];
    }
  }
}

var _lastZoomKey = null;
function _smoothZoomTo(center, zoom) {
  var key = center[0].toFixed(5) + ',' + center[1].toFixed(5) + ',' + zoom;
  if (_lastZoomKey === key) return;
  _lastZoomKey = key;
  _hobokenMap.flyTo(center, zoom, { duration: 1.2 });
}
function _smoothZoomBounds(bounds, opts) {
  var key = bounds[0][0].toFixed(5) + ',' + bounds[0][1].toFixed(5) + ',' +
            bounds[1][0].toFixed(5) + ',' + bounds[1][1].toFixed(5) + ',' + (opts.maxZoom || '');
  if (_lastZoomKey === key) return;
  _lastZoomKey = key;
  _hobokenMap.flyToBounds(bounds, Object.assign({ duration: 1.2 }, opts));
}

// ============================================================
// MAIN MAP FRAMING — decided first, because it decides the insets
// ============================================================
// The wall map and the corner insets answer the same question at two scales,
// so they must never answer it twice for the same person. Framing is therefore
// planned as data (who ends up inside the view) before anything is drawn, and
// planAwayInsets() hands a box only to people this set leaves out. The old
// code approximated that with "not at home, not in Hoboken, >2 blocks out",
// which drifted from what the map actually framed: anyone from 0.15 mi to the
// 5 mi auto-fit edge was a dot on screen AND a whole corner box.
//
// Hoboken anchor (Jeff, 2026-08-04): when the family is mostly in town, the
// map's job is the town. Midtown is ~3.5 mi out — inside the 5 mi auto-fit —
// so one adult at work pulled the frame across the Hudson and squeezed the
// three people actually here into a few pixels. Now the town holds the frame
// and the outlier gets a corner box, which is the more useful split anyway:
// wide view of home, close-up of whoever is out.
//
// Juno sits out the head-count entirely ("don't worry about Juno's location")
// — the dog's walk shouldn't decide how the map is framed in either direction.
// The wagon Tile (WG) sits out for the same reason: it's cargo, not a person,
// and the proxy already hides it whenever it's at home.
function isPet(l) {
  return !!l && (l.tid === 'JU' || l.tid === 'WG' || PERSON_NAMES[l.tid] === 'Juno');
}
function hasFix(l) {
  return !!l && isFinite(l.lat) && isFinite(l.lon);
}
// In town = on the main map once the town holds the frame. At-home counts:
// the home badge is the one point every framing branch includes.
function inTown(l) {
  return hasFix(l) && (isAtHome(l) || inHoboken(l));
}

// Roughly how far the map card can see from its centre, in miles, at a given
// zoom. The card is ~900×500 CSS px; one pixel spans 24901·cos(lat)/(256·2^z)
// miles of longitude. Measured on the SHORT axis, so this under-claims on the
// wide axis — the safe direction: at worst someone near the left edge gets a
// box they didn't strictly need, never a box AND a dot for the same person.
function visRadiusMi(zoom) {
  const miPerPx = 24901 * Math.cos(HOME.lat * Math.PI / 180) / (256 * Math.pow(2, zoom));
  return 250 * miPerPx;   // half the ~500px short axis
}

// Pure: returns the framing decision plus the set of people that view puts on
// screen. applyMapFrame() does the moving, later in the render, so the corner
// assignment still measures against the view the wall is currently showing.
//
// `fit` is who the view is BUILT around; `framed` is who ends up visible in it,
// which is a superset — a z15 view of the house also shows the park two blocks
// over. Answering "is this person already on the map" with the bounding box
// alone got that wrong: someone 0.2 mi out, plainly on screen, still took a
// corner. So visibility is judged against the view's actual reach.
function planMapFrame(locations) {
  const list = (locations || []).filter(hasFix);
  const town = list.filter(inTown);
  const inRange = list.filter(function (l) { return distMi(HOME, l) <= AUTO_FIT_RADIUS_MI; });
  // Ties anchor on the town — this is a wall in the house, and the house wins
  // a 1-in/1-out split. Pets excluded from both sides of the count.
  const townPeople = town.filter(function (l) { return !isPet(l); }).length;
  const awayPeople = list.filter(function (l) { return !inTown(l) && !isPet(l); }).length;
  const anchorTown = town.length > 0 && townPeople >= awayPeople;
  const fit = anchorTown ? town : inRange;

  // Everyone within reach of the resulting view, whether or not it was built
  // for them. Centre + radius rather than a rectangle: the map is rotated to
  // the street grid in one of its view modes, so a lat/lon box isn't what's
  // on screen anyway.
  function framedWithin(centerLat, centerLon, radiusMi) {
    const center = { lat: centerLat, lon: centerLon };
    const s = new Set();
    list.forEach(function (l) {
      if (distMi(center, l) <= radiusMi) s.add(l.tid);
    });
    // The fit group counts as framed even in the close-up approach view, where
    // the far end of town falls off screen for a minute or two. Boxes popping
    // in and out for the length of someone's walk up the block is churn, not
    // information; the pill row still names anyone the close-up drops.
    fit.forEach(function (l) { s.add(l.tid); });
    return s;
  }

  if (!fit.length) {
    return { mode: 'default', fit: fit, framed: framedWithin(HOME.lat, HOME.lon, visRadiusMi(14)) };
  }
  if (fit.every(isAtHome)) {
    return { mode: 'home', fit: fit, framed: framedWithin(HOME.lat, HOME.lon, visRadiusMi(15)) };
  }
  // Someone is within ~2 blocks: close up on the last stretch home.
  const approaching = fit.filter(function (l) {
    return !isAtHome(l) && distMi(HOME, l) <= NEAR_HOME_RADIUS_MI;
  });
  const pts = approaching.length ? approaching : fit;
  const maxZoom = approaching.length ? 16 : 15;
  const lats = [HOME.lat].concat(pts.map(function (p) { return p.lat; }));
  const lngs = [HOME.lon].concat(pts.map(function (p) { return p.lon; }));
  const cLat = (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2;
  const cLon = (Math.min.apply(null, lngs) + Math.max.apply(null, lngs)) / 2;
  // A bounds fit stops zooming in at maxZoom, so a tight cluster still shows
  // the whole neighbourhood around it — hence the floor. A spread-out fit
  // reaches at least to its own corners.
  const reach = Math.max(
    distMi({ lat: cLat, lon: cLon }, { lat: Math.max.apply(null, lats), lon: Math.max.apply(null, lngs) }),
    visRadiusMi(maxZoom)
  );
  return {
    mode: approaching.length ? 'approach' : 'fit',
    fit: fit,
    approaching: approaching,
    framed: framedWithin(cLat, cLon, reach),
  };
}

// Anyone whose marker is actually inside the live map viewport is already
// visible and must NOT also get a corner box — regardless of what the
// size-based visRadiusMi estimate claimed. visRadiusMi assumes a ~900×500 card;
// in expanded late-mode the map is far larger, so a person 1+ mi out reads as
// on-screen while the estimate still says "away" and hands them a redundant box
// (Jeff, 2026-09-01: Jenny's marker + a PiP for the same fix). This measures the
// CURRENTLY rendered bounds (this poll's applyMapFrame runs later), which is
// stable across the 7-15s cadence so it converges within a tick. A small inward
// inset means a face straddling the edge still earns its box. Rotated views:
// leaflet-rotate's getBounds returns the axis-aligned box covering the rotated
// viewport — slightly generous, erring toward "visible → no box", which is the
// preferred direction here.
function framedByLiveBounds(locations) {
  const s = new Set();
  if (!_hobokenMap || typeof L === 'undefined') return s;
  let b;
  try { b = _hobokenMap.getBounds(); } catch (e) { return s; }
  if (!b) return s;
  const latPad = (b.getNorth() - b.getSouth()) * 0.08;
  const lonPad = (b.getEast() - b.getWest()) * 0.08;
  const inner = L.latLngBounds(
    [b.getSouth() + latPad, b.getWest() + lonPad],
    [b.getNorth() - latPad, b.getEast() - lonPad]);
  (locations || []).forEach(function (l) {
    if (hasFix(l) && inner.contains([l.lat, l.lon])) s.add(l.tid);
  });
  return s;
}

function applyMapFrame(frame) {
  if (!_hobokenMap || !frame) return;
  if (frame.mode === 'default') { _smoothZoomTo([HOME.lat, HOME.lon], 14); return; }
  if (frame.mode === 'home')    { _smoothZoomTo([HOME.lat, HOME.lon], 15); return; }
  let pts, opts;
  if (frame.mode === 'approach') {
    // Also include any approaching NY-bound bus that's within ~3 mi of home
    // so the map auto-frames "Jeff + the bus he's about to catch" together.
    const nearbyBuses = (_shownBuses || []).filter(function (b) {
      return b && b.lat && b.lon && distMi(HOME, b) <= NEAR_HOME_RADIUS_MI;
    });
    pts = frame.approaching.concat(nearbyBuses);
    opts = { padding: [30, 30], maxZoom: 16 };
  } else {
    pts = frame.fit;
    opts = { padding: [20, 20], maxZoom: 15 };
  }
  const lats = [HOME.lat].concat(pts.map(function (p) { return p.lat; }));
  const lngs = [HOME.lon].concat(pts.map(function (p) { return p.lon; }));
  _smoothZoomBounds(
    [[Math.min.apply(null, lats), Math.min.apply(null, lngs)],
     [Math.max.apply(null, lats), Math.max.apply(null, lngs)]],
    opts
  );
}

// Who is WITH the wagon (Jeff, 2026-10-19: "when we are in the same location as
// the wagon, show us around the wagon similar to how we show around the house").
// Pure. Returns the away wagon plus everyone within OVERLAP_MI of it — the map's
// one "these are the same place" threshold — or null when nobody is. At-home
// people are left out (they orbit the house), and so is a wagon the client reads
// as home (HOME_ZONE is wider than the proxy's geofence), so the two hubs never
// compete for the same faces.
function planWagonGroup(locations) {
  const list = (locations || []).filter(hasFix);
  const wagon = list.find(function (l) { return l.tid === 'WG'; });
  if (!wagon || isAtHome(wagon)) return null;
  const members = list.filter(function (l) {
    return l.tid !== 'WG' && !isAtHome(l) && distMi(wagon, l) < OVERLAP_MI;
  });
  return members.length ? { wagon: wagon, members: members } : null;
}

function renderLocations(locations) {
  _lastLocations = locations || [];   // away-insets re-render on view-mode changes
  // Feeds the automatic panel rule. Kids' trackers count: "everyone home"
  // means the whole household, which is exactly when the map is redundant.
  // The wagon (WG) does NOT count — it only appears in the payload when it's
  // away, and a wagon left in the car overnight must not hold the wall in map
  // mode while the whole family is home.
  try {
    const list = (locations || []).filter(function (l) { return l.tid !== 'WG'; });
    // isAtHome (not raw place==='Home') so the widened home-block zone counts —
    // a tracker jittering inside the house must read home here too, else auto
    // art/frame never triggers while someone is plainly on the couch.
    setEveryoneHome(list.length > 0 && list.every(isAtHome));
    // Camera gate (Jeff, 2026-08-13): the overlay only matters when a person is
    // in the house to see it, so pollCameraState() idles otherwise. Pets don't
    // count as viewers. An empty payload keeps the camera working (fail soft).
    _anyoneHome = list.length === 0 || list.some(function (l) { return !isPet(l) && isAtHome(l); });
    if (typeof applyWallConfig === 'function' && IS_LOCAL) applyWallConfig();
  } catch (e) {}
  if (!_hobokenMap) return;
  // Decide the frame FIRST, then the boxes (only for people the frame leaves
  // out), then the pills (only for people neither one covers).
  const frame = planMapFrame(locations);
  // Union in anyone actually inside the live viewport (handles the expanded
  // late-mode map that visRadiusMi under-claims for). A person on the map keeps
  // their marker and loses the redundant corner box.
  framedByLiveBounds(locations).forEach(function (t) { frame.framed.add(t); });
  _pipPlan = planAwayInsets(locations, frame.framed);
  const RING_RADIUS_DEG = 0.0003; // ~110 ft for non-home clustering

  // Split into at-home vs elsewhere
  const atHome = locations.filter(function (l) { return isAtHome(l); });
  const elsewhere = locations.filter(function (l) { return !isAtHome(l); });
  const wagonGroup = planWagonGroup(locations);

  // At-home people: pinned to HOME lat/lng, positioned by iconAnchor (pixel offset
  // from home). Smaller icon so they look like satellites orbiting the home badge.
  // People with the wagon orbit the wagon the same way, the wagon shrunk to a
  // hub badge at its own fix.
  const HOME_FACE_SIZE = 28;
  const HOME_ORBIT_RADIUS = 22; // px from home center to face center
  const WAGON_HUB_SIZE = 24;    // same footprint as the home badge
  const orbitIconConfig = {};
  function orbit(people, latlng) {
    people.forEach(function (l, idx) {
      const angle = (idx / Math.max(people.length, 1)) * 2 * Math.PI - Math.PI / 2;
      const dx = Math.cos(angle) * HOME_ORBIT_RADIUS;
      const dy = Math.sin(angle) * HOME_ORBIT_RADIUS;
      // iconAnchor positions the (x,y) point of the icon at the latlng. To shift
      // the icon's visual center by (dx, dy), we offset the anchor by (-dx, -dy)
      // from the icon's natural center (size/2).
      orbitIconConfig[l.tid] = {
        latlng: latlng,
        iconSize: [HOME_FACE_SIZE, HOME_FACE_SIZE],
