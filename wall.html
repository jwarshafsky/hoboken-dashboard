<!DOCTYPE html>
<!--
  Hoboken Family Dashboard
  ========================
  Charter: A wall display that tells the Warshafskys where their people are
  and what's next. Family presence is the primary use case; transit, weather,
  and alerts are supporting data. Anything that doesn't serve that single
  sentence goes in a "maybe" file, not in here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Hoboken Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>

<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23151520'/><path fill='%236bffb8' d='M14 40c0 2.2 1 4.2 2.5 5.5V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-2.5h20V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-4.5c1.5-1.4 2.5-3.3 2.5-5.5V15c0-8.75-8.95-10-20-10S14 6.25 14 15v25zm8.75 2.5c-2.1 0-3.75-1.7-3.75-3.75S20.65 35 22.75 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm22.5 0c-2.1 0-3.75-1.7-3.75-3.75S43.15 35 45.25 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm3.75-15h-30V15h30v12.5z'/></svg>">
<style>
  /* ─────────────────────────────────────────────────────────────────
     Design tokens — keep all radii, font sizes, and key colors here.
     New panels MUST reuse these instead of introducing new values.
     ───────────────────────────────────────────────────────────────── */
  :root {
    /* Border radii */
    --r-card:  14px;
    --r-chip:  8px;
    --r-pill:  999px;
    --r-badge: 4px;

    /* Font sizes (4-tier + 1 sub for emphasis numbers) */
    --fs-micro: 0.6rem;   /* tiny labels (badges, day headers, micro status) */
    --fs-label: 0.75rem;  /* secondary text */
    --fs-body:  0.95rem;  /* primary readable content */
    --fs-sub:   1.4rem;   /* secondary numbers (tunnel min, hop ETA) */
    --fs-hero:  2.4rem;   /* time, temperature */

    /* Semantic colors */
    --c-live:   #6bffb8;  /* GREEN: reserved for live-state ONLY */
    --c-urgent: #ff6b6b;  /* RED: actionable urgency (≤5min bus, alerts) */
    --c-warn:   #ffb84d;  /* AMBER: warnings */
    --c-text:   #e8e8ec;
    --c-label:  #9a9aa8;
    --c-mute:   #888;
    --c-deep:   #0a0a0f;
    --c-border: #2a2a35;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    background: #000;
    color: #e8e8ec;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 0.67fr 1.62fr 0.97fr;
    grid-template-rows: 1fr auto auto;
    gap: 10px;
    padding: 12px;
  }

  /* TV simulation mode — body becomes a fixed 930x539 surface (the Onn's
     effective CSS viewport) that's scaled
     to fit the browser window. Activate by adding ?tv to the URL. */
  html.tv-sim {
    background: #000;
    overflow: hidden;
  }
  html.tv-sim body {
    width: 930px;
    height: 539px;
    transform-origin: top left;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* Cards */
  .card {
    background: #0a0a0f;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 0.5px solid #2a2a35;
  }

  .card-title {
    font-size: var(--fs-micro);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9a9aa8;
    margin-bottom: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-title svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  /* Weather card — bottom-right. Three vertical zones:
       1) HERO  : big icon + hero temp + desc + hi/lo + rain pill
       2) HOURLY: 7-step hourly forecast strip
       3) STATS : wind / humidity / pollen as 3 labeled stat blocks
     Sized to fit ~2× transit-card height × column-3 width. */
  .weather-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
    padding: 14px 12px;
  }

  .weather-main { display: contents; }  /* transparent wrapper */

  /* HERO ROW ------------------------------------------------------- */
  /* Three elements: summary (left) | icon (center) | temp (right), all on
     one line at the same height, sitting just above the forecast strip. */
  .weather-top {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 0;
    padding: 2px 6px;
  }

  .weather-icon {
    flex-shrink: 0;
    /* amcharts SVGs have ~15% padding inside the 64-unit viewBox, so the
       visible art is ~85% of the box. */
    width: 86px;
    height: 86px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .weather-icon img.wi { width: 100%; height: 100%; }

  /* Weather icon animations live INSIDE each amcharts SVG file under icons/.
     Sun and moon stay still (we stripped their rotation rules); clouds drift,
     rain falls, snow drifts, lightning flickers. CSS in this dashboard does
     not reach into the SVG sandbox when loaded via <img> — that's by design,
     animations are self-contained per-icon. */

  /* Summary block sits in the MIDDLE of the hero — description on top,
     hi/lo and rain pill below. Centered text so it reads as the middle
     anchor between icon (left) and temp (right). No flex:1 — it shrinks
     to its content width so space-evenly can distribute the gaps. */
  .weather-summary {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }

  .weather-temp {
    flex-shrink: 0;
    font-size: 1.9rem;   /* a touch smaller so it stops crowding the forecast text */
    font-weight: 200;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .weather-desc {
    font-size: 1.05rem;
    color: #e0e0e6;
    line-height: 1.2;
    font-weight: 400;
    /* description can wrap if it's long (e.g. "Thunderstorm + heavy hail") */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .weather-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px 10px;
    margin-top: 3px;
    font-size: var(--fs-label);
    color: var(--c-mute);
    white-space: nowrap;
  }
  .weather-meta .wm-hilo { color: var(--c-mute); }
  .weather-meta .wm-hilo span { color: #cfcfd6; font-weight: 500; }

  /* Rain probability — small amber pill, only visible when JS sets display:flex */
  #weatherRain {
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    background: rgba(240, 192, 64, 0.10);
    border: 0.5px solid rgba(240, 192, 64, 0.35);
    border-radius: var(--r-pill);
    color: #f0c040;
    font-size: var(--fs-micro);
    font-weight: 600;
    line-height: 1;
  }
  #weatherRain svg { flex-shrink: 0; }

  /* HOURLY FORECAST ----------------------------------------------- */
  .weather-forecast {
    display: flex;
    flex-direction: row;
    gap: 0;
    justify-content: space-between;
    align-items: center;
    border-top: 0.5px solid #1e1e2e;
    border-bottom: 0.5px solid #1e1e2e;
    padding: 7px 2px;
  }

  .weather-hour {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex: 1;
    min-width: 0;
  }

  .weather-hour .wh-time {
    font-size: var(--fs-micro);
    color: var(--c-label);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .weather-hour .wh-icon {
    line-height: 1;
    opacity: 0.95;
  }
  .weather-hour .wh-icon img { width: 22px; height: 22px; display: block; }

  .weather-hour .wh-temp {
    font-size: var(--fs-label);
    font-weight: 500;
    color: #e0e0e6;
    line-height: 1;
  }

  /* STATS ROW (wind / humidity / pollen / UV) ---------------------- */
  .weather-details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 2px 2px 0;
  }

  .weather-details .wd-stat + .wd-stat {
    border-left: 0.5px solid #1e1e2e;
    padding-left: 8px;
  }

  .weather-details .wd-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1;
  }

  .weather-details .wd-label {
    font-size: var(--fs-micro);
    color: var(--c-label);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  .weather-details .wd-value {
    font-size: var(--fs-body);
    color: #e0e0e6;
    font-weight: 500;
    line-height: 1;
  }

  .weather-details .wd-unit {
    font-size: var(--fs-micro);
    color: var(--c-mute);
    margin-left: 1px;
    font-weight: 400;
  }

  /* Calendar — top row, right column */
  #calCard {
    grid-row: 1;
    grid-column: 3;
  }

  /* Map card — top row, spans left two columns */
  #mapCard {
    grid-row: 1;
    grid-column: 1 / 3;
    padding: 0;
    overflow: hidden;
  }

  /* Late mode (weekday after 5pm, weekend after 9pm):
     hide bus + ferry, let map take the full left height. */
  body.late-mode #busCard,
  body.late-mode #ferryCard { display: none; }
  body.late-mode #mapCard   { grid-row: 1 / 4; }

  /* Weather card — bottom right, spans bus + ferry rows */
  #weatherCard {
    grid-row: 2 / 4;
    grid-column: 3;
  }

  /* Art mode takes the whole left region — everything except the calendar and
     the weather (Jeff, 2026-08-02). Those two are the reason to be in art mode
     rather than Frame: you still want to see what's on today and what it's
     doing outside. Bus and ferry go, because a picture worth showing full
     height beats a departure board nobody is about to use.

     This is the SAME re-span late mode does, deliberately — one mechanism, and
     when both are on the two rules are identical rather than fighting. The
     panel still lives inside #mapCard rather than taking a grid slot of its
     own, so it inherits the card's position:relative and needs no placement of
     its own; growing the card grows the artwork. No guard against frame-mode
     is needed: that hides every grid child with !important anyway. */
  body.show-art #busCard,
  body.show-art #ferryCard { display: none; }
  body.show-art #mapCard   { grid-row: 1 / 4; }

  #artPanel {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: var(--c-card, #12161c); gap: 10px; padding: 14px;
  }
  body.show-art #artPanel { display: flex; }
  body.show-art #hobokenMap,
  body.show-art #mapStatusOverlay { display: none; }
  #artPanel img {
    max-width: 100%; max-height: 100%; min-height: 0; flex: 1 1 auto;
    object-fit: contain; border-radius: 10px;
  }
  #artCaption { font-size: var(--fs-small, 15px); color: var(--c-mute, #8ea0b5); flex: 0 0 auto; }

  /* ---- Frame mode ---------------------------------------------------------
     Full-screen artwork floating in a museum mat, after the Samsung Frame. The
     whole dashboard goes away — that is the point of it — so this is the only
     thing on the panel. --mat is the one knob worth turning if the room wants a
     different board colour. */
  #frameMode { display: none; }
  body.frame-mode #frameMode {
    display: flex; position: fixed; inset: 0; z-index: 1500;
    flex-direction: column; align-items: center; justify-content: center;
    /* TWO declarations, and the literal MUST come first. This was
       `background: var(--mat, #e6dfd3)` and the mat came out near-black on the
       actual wall: the Google TV stick's WebView drops a whole declaration when
       var() appears inside a SHORTHAND, so the board colour never applied and
       the gradient below composited over the dashboard's dark page instead.
       The longhand takes the variable if the engine supports it and is simply
       ignored if not, leaving the literal standing. */
    background-color: #e6dfd3;
    background-color: var(--mat, #e6dfd3);
    /* Mat board is never a flat fill — across 65" a dead-even colour reads as a
       blank screen rather than as paper, so a very slight centre lift and edge
       fall-off stand in for the way a real mat catches room light. */
    background-image: radial-gradient(115% 85% at 50% 36%,
      rgba(255,255,255,.5), rgba(0,0,0,.04) 62%, rgba(0,0,0,.13));
  }
  body.frame-mode > *:not(#frameMode) { display: none !important; }

  /* The window hugs the artwork exactly (inline-block on a block image), which
     is what makes the bevel read as a mat CUT to the picture rather than a box
     the picture happens to sit in. */
  .fr-window { display: inline-block; line-height: 0; position: relative; }
  .fr-window img {
    display: block; max-width: 72vw; max-height: 70vh;
    opacity: 0; transition: opacity .55s ease;
  }
  .fr-window img.in { opacity: 1; }
  /* cut edge · the light catching the bevel · recess · the shadow it throws */
  .fr-window::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow:
      inset 0 0 0 1px rgba(58,46,32,.30),
      0 1px 0 2px rgba(255,255,255,.5),
      0 3px 7px rgba(0,0,0,.17),
      0 26px 55px rgba(0,0,0,.19);
  }
  .fr-plate {
    margin-top: 30px; text-align: center; line-height: 1.5;
    font-size: 15px; font-weight: 700; letter-spacing: .17em;
    text-transform: uppercase; color: rgba(52,42,30,.62);
  }
  .fr-plate .who {
    display: block; margin-top: 4px; font-size: 14px; font-weight: 600;
    letter-spacing: .06em; text-transform: none; color: rgba(52,42,30,.44);
  }
  /* The comment ticker is MOVED into the mat in frame mode rather than
     duplicated, so it keeps one implementation — but it was styled for a dark
     panel, so the colours have to flip for the board. */
  body.frame-mode #artTicker {
    max-width: 72vw; margin-top: 20px; padding-top: 10px;
    border-top: 1px solid rgba(58,46,32,.16);
  }
  body.frame-mode #artTickerTrack { font-size: 15px; color: rgba(52,42,30,.6); }
  body.frame-mode #artTickerTrack .who { color: rgba(124,72,20,.85); }
  body.frame-mode #artTickerTrack .sep { color: rgba(52,42,30,.3); }
  /* A note posted from the phone still has to reach the wall — frame mode hides
     the panel that normally carries it, so it is mirrored onto the mat. */
  #frameMsg { display: none; }
  /* IN FLOW, not absolutely pinned to the bottom: pinned, it landed directly on
     top of the comment ticker and both became unreadable. In the flex column the
     mat simply re-centres around whatever is present. */
  body.frame-mode.has-wall-msg #frameMsg {
    display: block; margin-top: 22px; max-width: 78vw;
    background: rgba(28,22,14,.88); color: #fdf9f2; padding: 11px 24px;
    border-radius: 999px; font-size: 17px; font-weight: 600; text-align: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }

  /* What the family said about the picture that is up, scrolling along the
     bottom. Hidden entirely when a piece has no comments, so the artwork keeps
     the full height rather than sitting above an empty strip. */
  #artTicker {
    flex: 0 0 auto; align-self: stretch; overflow: hidden; white-space: nowrap;
    border-top: 1px solid rgba(255,255,255,.08); padding-top: 7px; margin-top: 2px;
  }
  #artTicker[hidden] { display: none; }
  #artTickerTrack {
    display: inline-block; padding-left: 100%;   /* start just off the right edge */
    font-size: var(--fs-small, 15px); color: var(--c-text, #dbe4ef);
    animation: artScroll linear infinite;
  }
  #artTickerTrack .who { color: var(--c-accent, #f0a45a); font-weight: 700; }
  #artTickerTrack .sep { color: var(--c-mute, #8ea0b5); padding: 0 14px; }
  @keyframes artScroll { to { transform: translateX(-100%); } }
  /* A panel switched off from the phone. */
  body .card.panel-off { display: none !important; }

  #mapCard { position: relative; }
  #mapCard #hobokenMap { width: 100%; height: 100%; }

  /* View-mode toast — top-right of map, fades in/out on OK-button cycles. */
  #viewModeToast {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 600;
    pointer-events: none;
    background: rgba(10, 10, 15, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: var(--r-pill, 12px);
    padding: 5px 12px;
    font-size: var(--fs-label);
    font-weight: 600;
    color: #e8e8ec;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #viewModeToast.show { opacity: 1; }


  /* Overlay showing when each person last updated — one pill per person,
     sitting in the bottom-left corner of the map. */
  #mapStatusOverlay {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 1000;
    pointer-events: none;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ms-pill {
    background: rgba(0, 0, 0, 0.55);
    padding: 3px 9px;
    border-radius: 12px;
    /* fs-label, not micro — this pill is the most charter-critical text on
       screen ("Jeff · on 126 · 30s ago") and must read from 10 feet. */
    font-size: var(--fs-label);
    color: #ddd;
    line-height: 1.3;
    white-space: nowrap;
  }
  .ms-name { color: #fff; font-weight: 600; }
  .ms-status { color: #ddd; margin-left: 5px; }
  /* Freshness-pill tinting matches map-marker decay. */
  .ms-pill--warm .ms-status { color: #f0c040; }
  .ms-pill--warm .ms-ago    { color: #f0c040; }
  .ms-pill--cold            { opacity: 0.6; }
  .ms-pill--cold .ms-status { color: #a0a0b0; font-style: italic; }
  .ms-pill--cold .ms-ago    { color: #a0a0b0; }
  .ms-ago { color: #777; margin-left: 5px; font-size: var(--fs-micro); }

  /* Wall message — a note Jeff or Jenny types at /message.html. Overlaid on
     the bottom of the map (the least information-dense panel) rather than
     given a grid row, because every panel here uses explicit grid placement
     and late-mode re-spans the map. Only rendered when a message is active,
     so it costs nothing the rest of the time. */
  #wallMsg {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    z-index: 1200;
    pointer-events: none;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 9px 13px;
    border-radius: var(--r-chip);
    border-left: 3px solid var(--c-live);
    background: rgba(10, 10, 15, 0.86);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #wallMsg[hidden] { display: none; }
  .wm-text {
    font-size: var(--fs-body);
    font-weight: 600;
    color: var(--c-text);
    line-height: 1.25;
    /* Two lines max — a note longer than that stops being glanceable, and the
       service caps input at 120 chars so this rarely triggers. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .wm-from {
    font-size: var(--fs-label);
    color: var(--c-label);
    white-space: nowrap;
    margin-left: auto;
  }
  /* Shift the freshness pills up so the note never covers them. */
  body.has-wall-msg #mapStatusOverlay { bottom: 46px; }

  /* ---- Away insets --------------------------------------------------------
     A small live map of whoever is out of the house, pinned to the corner of
     the wall map that matches their DIRECTION from the house: north-east of
     home lands top-right, south-west lands bottom-left. The corner carries the
     bearing, so the box itself only has to answer "where exactly" — the wall
     map behind it keeps the overview, the inset is the close-up you can read a
     street off. Sized in % so the tailnet/phone view scales with it; no
     aspect-ratio here, the Onn's WebView is too old to bet on it. */
  :root { --pip-w: 24%; --pip-h: 44%; --pip-gap: 8px; }
  /* Three boxes wall off one whole side at full size, so they step down when
     the third appears. Custom properties inherit, so overriding them on <body>
     re-sizes the boxes AND the pill/note narrowing that calc()s off them. */
  body.pips-3 { --pip-w: 19%; --pip-h: 34%; }
  .loc-pip {
    position: absolute;
    z-index: 700;
    display: none;
    width: var(--pip-w);
    height: var(--pip-h);
    /* --pip-h is a share of the CARD, and late mode gives the map all three
       rows — without this cap a box becomes a 152x218 slab after 5pm. */
    max-height: 120px;
    border-radius: var(--r-chip);
    overflow: hidden;
    background: #0a0a0f;
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
  }
  .loc-pip.on { display: block; }
  .loc-pip > .pip-map { width: 100%; height: 100%; }
  /* Where the box IS — the geofence name if the fix has one ("Abujia"), else
     the city. Hidden entirely when neither is known rather than captioned with
     a placeholder. Sits above every Leaflet pane (controls are z 800). */
  .pip-place {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 900;
    padding: 3px 7px;
    background: linear-gradient(rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0));
    font-size: var(--fs-label);
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .pip-place:empty { display: none; }
  .pip-tl { top: var(--pip-gap);    left: var(--pip-gap); }
  .pip-tr { top: var(--pip-gap);    right: var(--pip-gap); }
  .pip-bl { bottom: var(--pip-gap); left: var(--pip-gap); }
  .pip-br { bottom: var(--pip-gap); right: var(--pip-gap); }
  /* Artwork owns the whole card when it's up. */
  body.show-art .loc-pip { display: none !important; }

  /* Fish tank (Jeff, 2026-10-21): a simulated reef aquarium in the main slot,
     picked on the Wall Board page like Map/Artwork/Frame (wall_config main
     "fish"). Same left-region re-span as art, and it covers everything the map
     card normally layers on top — map, pills, corner boxes, artwork. The wall
     note (#wallMsg, z-index 1200) still shows over it. The simulation itself is
     the FISHTANK block above the main script; it only runs while this is on. */
  body.show-fish #busCard,
  body.show-fish #ferryCard { display: none; }
  body.show-fish #mapCard   { grid-row: 1 / 4; }
  #fishPanel { position: absolute; inset: 0; display: none; background: #0b3d63; border-radius: inherit; overflow: hidden; }
  body.show-fish #fishPanel { display: block; }
  body.show-fish #hobokenMap,
  body.show-fish #mapStatusOverlay,
  body.show-fish #artPanel,
  body.show-fish .loc-pip { display: none !important; }
  /* The glass: darkened edges and a faint diagonal reflection, done in CSS so
     the canvas never pays for it. */
  .fish-glass {
    position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    box-shadow: inset 0 0 38px 6px rgba(0,12,28,.55);
    background: linear-gradient(112deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 28%,
                rgba(255,255,255,0) 72%, rgba(255,255,255,.035) 100%);
  }
  /* The bottom corners share that strip with the freshness pills and the wall
     note. Narrow those rather than stacking on top of them — the pill row is
     bottom-anchored and flex-wrap, so it grows upward once it has a right edge
     to wrap against.
     The pill row ships with only a `left`, so the bl rule also hands it a right
     edge — without one it can't wrap and just runs under the inset. Do NOT add
     "restore the other edge" rules here: both classes can be on the body at
     once, and a later `left: 8px` from the br rule silently undid the bl
     narrowing (caught 2026-08-01 — pills ran the full width over both boxes).
     Each rule now touches only the edge it owns. */
  body.has-pip-bl #mapStatusOverlay,
  body.has-pip-bl #wallMsg {
    left: calc(var(--pip-w) + var(--pip-gap) * 2);
    right: var(--pip-gap);
  }
  body.has-pip-br #mapStatusOverlay,
  body.has-pip-br #wallMsg { right: calc(var(--pip-w) + var(--pip-gap) * 2); }
  body.has-pip-tr #viewModeToast { right: calc(var(--pip-w) + var(--pip-gap) * 2); }

  /* Inset face + its own age. There is NO staleness cutoff on the insets: the
     girls' Tiles legitimately go 13h between fixes (they don't update
     overnight), so a phone-calibrated cutoff would mean the two people you most
     want a "where are they" box for never get one. The fix is shown instead
     with its age attached, decaying on the same ladder as the map markers, so
     an old position reads as old rather than being hidden or (worse) presented
     as live. Per-face, not per-box, so a fresh dot sharing a corner with a
     stale one isn't tarred with the other's age. */
  .pip-person { text-align: center; background: none; border: 0; }
  .pip-person .pf-face {
    width: 28px; height: 28px; margin: 0 auto;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.55);
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.65);
    overflow: hidden;
    background: #3a3a48;
    color: #000;
    font-weight: 700;
    font-size: var(--fs-micro);
    line-height: 26px;
  }
  .pip-person .pf-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pip-person .pf-age {
    display: inline-block;
    margin-top: 2px;
    padding: 0 4px;
    border-radius: var(--r-badge);
    background: rgba(0, 0, 0, 0.62);
    font-size: var(--fs-micro);
    font-weight: 600;
    line-height: 1.5;
    color: #ddd;
  }
  /* Same tiers as .ms-pill / .person-marker so one glance reads consistently. */
  .pip-person.stale-recent .pf-face { opacity: 0.92; }
  .pip-person.stale-warm  .pf-face { opacity: 0.8;  border-style: dashed; }
  .pip-person.stale-cold  .pf-face { opacity: 0.65; border-style: dashed; }
  .pip-person.stale-warm  .pf-age  { color: var(--c-warn); }
  .pip-person.stale-cold  .pf-age  { color: #a0a0b0; font-style: italic; }

  /* Calendar events (rendered from Google Calendar API) */
  .cal-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    padding-right: 4px;
  }

  .cal-content::-webkit-scrollbar { width: 0; }

  .cal-day-header {
    font-size: var(--fs-micro);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6bffb8;
    margin: 6px 0 3px 0;
    padding-bottom: 2px;
    border-bottom: 0.5px solid #1a1a28;
  }

  .cal-day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    /* Guaranteed breathing room between the date label and the clock.
       Without it, a label that fits with zero slack ("FRIDAY, SEPTEMBER 4")
       runs straight into "7:30 AM" and reads as "SEPTEMBER 47:30 AM". The gap
       counts toward scrollWidth, so _autoFitTodayHeader() sees the overflow
       and steps down to a shorter date form instead. */
    column-gap: 16px;
    white-space: nowrap;
  }

  .cal-header-time {
    font-weight: 700;
    font-size: 1.15rem;
    color: #fff;
    /* Slight negative tracking + stretch keeps the glyphs narrower so the
       date label on the left and the clock on the right don't crowd each
       other on the TV's narrow calendar column. */
    letter-spacing: -0.03em;
    font-stretch: 85%;
    text-transform: none;
    white-space: nowrap;
  }

  .cal-day-header:first-child { margin-top: 0; }

  .cal-day-header.is-today {
    color: #fff;
    font-size: 1.15rem;
    margin-bottom: 8px;
    white-space: nowrap;
    letter-spacing: -0.03em;
    font-stretch: 85%;
  }
  .cal-day-header.is-future { color: #9a9aa8; }

  /* Morning commute estimate — one line per family commuter under the
     TODAY day header (Mon-Fri 7:00-10:30 AM). Same font size as a
     cal-event so each line reads as a calendar-style item, not a banner.
     The minute count picks up amber when that person's commute is tight. */
  .cal-commute {
    font-size: var(--fs-label);
    color: #cfcfd6;
    padding: 2px 0;
    line-height: 1.25;
  }
  .cal-commute .commute-min {
    font-weight: 600;
    color: #fff;
  }
  .cal-commute.tight .commute-min { color: #ff9b40; }

  .cal-event {
    padding: 2px 0;
    font-size: var(--fs-label);
    line-height: 1.25;
  }

  .cal-event-time {
    color: #888;
    font-weight: 500;
    font-size: var(--fs-micro);
    margin-left: 4px;
    white-space: nowrap;
  }

  .cal-leave-by {
    color: #ffb84d;
    font-size: var(--fs-micro);
    font-weight: 600;
    margin-top: 1px;
  }
  .cal-leave-mode {
    color: #aaa;
    font-weight: 400;
  }

  .cal-event-title {
    color: #e8e8ec;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-event.all-day .cal-event-time { color: #9a9aa8; }

  .cal-empty, .cal-signin-prompt {
    font-size: var(--fs-label);
    color: #9a9aa8;
    padding: 20px 8px;
    text-align: center;
  }

  .cal-signin-btn {
    background: #6bffb8;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 14px 28px;
    font-size: var(--fs-body);
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    outline: none;
  }

  .cal-signin-btn:focus {
    box-shadow: 0 0 0 3px #fff;
    transform: scale(1.05);
  }

  /* Alerts now stacked inside the calendar card (right column) */
  .cal-alert-divider {
    border-top: 0.5px solid #2a2a35;
    margin: 8px -12px 6px -12px;
  }

  .alerts-list {
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 50%;
  }

  .alert-item {
    font-size: var(--fs-micro);
    line-height: 1.3;
    color: #ccc;
    padding: 3px 0;
    border-bottom: 0.5px solid #1a1a28;
  }

  .alert-item:last-child { border-bottom: none; }

  .alert-item.is-alert {
    color: #ff9b6b;
    font-weight: 600;
  }

  .alert-badge {
    display: inline-block;
    font-size: var(--fs-micro);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 4px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .alert-badge.njt {
    background: #c0392b;
    color: #fff;
  }

  .alert-badge.nixle {
    background: #e67e22;
    color: #fff;
  }

  .alert-badge.news {
    background: #2a2a3a;
    color: #888;
  }

  /* Hide Leaflet controls — we want a clean ambient view */
  .leaflet-control-zoom,
  .leaflet-control-attribution {
    display: none !important;
  }

  /* Custom location markers */
  .person-marker {
    width: 44px !important;
    height: 44px !important;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.55);
    box-shadow: 0 0 6px rgba(0,0,0,0.65);
    overflow: hidden;
    background: #3a3a48;
    color: #000;
    font-weight: 700;
    font-size: var(--fs-label);
    line-height: 44px;
    text-align: center;
    transition: opacity 0.5s ease, filter 0.5s ease;
  }

  /* Freshness ladder. Fresh markers are full color; older positions fade
     a touch (and pick up a dashed border) so the family doesn't trust
     frozen coordinates as live — but faces remain recognizable. Color is
     preserved at every tier. */
  .person-marker.stale-recent { opacity: 0.92; }
  .person-marker.stale-warm   { opacity: 0.8; border-style: dashed; }
  .person-marker.stale-cold   { opacity: 0.65; border-style: dashed; }

  .person-marker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Smaller "orbit" face used when a person is at home — bumped from 20→28
     so faces are still recognizable around the house badge. */
  .person-marker.small {
    width: 28px !important;
    height: 28px !important;
    line-height: 26px;
    font-size: var(--fs-micro);
    border-width: 1.5px;
  }

  /* The wagon as a hub, when people are with it: shrinks to the home badge's
     footprint so their small faces orbit it the way they orbit the house. */
  .person-marker.wagon-hub {
    width: 24px !important;
    height: 24px !important;
    line-height: 22px;
  }

  .home-marker {
    width: 24px !important;
    height: 24px !important;
    background: rgba(58, 123, 213, 0.85);
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.35);
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
    display: flex !important;
    align-items: center;
    justify-content: center;
  }
  .home-marker svg { width: 16px; height: 16px; }

  .bus-marker {
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
  }
  .leaflet-tooltip.bus-tip {
    background: rgba(10, 10, 15, 0.92);
    color: #e8e8ec;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .leaflet-tooltip.bus-tip::before { display: none; }
  /* NJT bus marker — NJTbus.png logo + load-colored arrow above (only
     NY-bound 126s are drawn). Sizes are written inline by _busSvg() based on the
     map-zoom-derived scale, so we just provide the layout primitives here
     (column flex, centered, body clipped to a circle). */
  .bus-marker .nbm-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .bus-marker .nbm-body {
    display: block;
    /* NJTbus.png has a white square background — clip to circle to match
       the round logo and avoid white corners against the dark map. */
    border-radius: 50%;
    clip-path: circle(50%);
  }
  .bus-marker .nbm-arrow { display: block; }

  /* Hoboken Hop shuttle marker — bus icon, color is set inline per bus
     (red for Red Hop, green for Green Hop) */
  .hop-marker {
    width: 22px !important;
    height: 22px !important;
    background: transparent;
    border: none;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
  }

  /* Tile (Life360) tracker markers — purple */
  .tile-marker {
    width: 26px !important;
    height: 26px !important;
    background: #c870ff;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.45);
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
    font-size: var(--fs-body);
    font-weight: 700;
    color: #000;
    line-height: 22px;
    text-align: center;
  }

  /* Transit cards - full width.
     min-height keeps bus and ferry visually equal even when the ferry has
     only one route to display (bus shows 126 + 119, naturally taller).
     Compact padding lets map + calendar (row 1) take more vertical space. */
  .transit-card {
    grid-column: 1 / 3;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 6px 12px;
    min-height: 86px;
  }

  .transit-icon {
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .transit-icon svg {
    width: 32px;
    height: 32px;
    fill: #555;
  }

  .transit-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .transit-title {
    font-size: var(--fs-micro);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9a9aa8;
    margin-bottom: 2px;
  }

  .transit-routes {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: flex-start;
    overflow: hidden;
  }

  /* Stale-panel dimmer: applied when a source has been offline >5 min, so
     frozen countdowns don't masquerade as live data. */
  .panel-stale { opacity: 0.4; filter: grayscale(0.5); transition: opacity 0.4s, filter 0.4s; }

  .route-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .route-label {
    /* fs-label, not micro — at 10 feet the countdown numbers were readable
       but the route they belonged to wasn't. */
    font-size: var(--fs-label);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #9a9aa8;
    white-space: nowrap;
    /* Floor must clear the WIDEST label in any card, or a longer label
       overflows it and shoves that row's chips right while shorter rows stay
       at the floor — which misaligned the ferry card ("DOWNTOWN:" ~83px vs
       "14TH ST:" ~74px). 90px floors every current label (bus labels are
       tabular-digit twins, so they were already mutually aligned) so the
       departure columns line up. */
    min-width: 90px;
    flex-shrink: 0;
  }

  .dep-row {
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
  }

  .dep-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    background: #1a1a2a;
    padding: 3px 6px;
    /* Transparent by default so .sched can turn it dashed without resizing the
       chip. An `outline` would be the layout-free way to do this, but old
       WebViews (this is an Onn stick) draw outlines square and ignore the
       border-radius, which would read as a rendering bug on the wall. */
    border: 1px solid transparent;
    border-radius: 6px;
    width: 64px;   /* +4px headroom for the larger --fs-sub countdown */
    text-align: center;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  .dep-chip:first-child {
    background: #1a2a1a;
  }

  /* NJT lists this departure but has no bus broadcasting behind it. The DASHED
     border is the actual signal (Jeff, 2026-08-02). The first pass used only a
     dim countdown and a darker background, and on a row where every trailing
     chip was scheduled there was no bright chip beside it to read the dimming
     against — "how am I supposed to tell". A dashed edge reads as provisional
     on its own, at wall distance, with nothing to compare it to.
     Deliberately NOT `opacity` — that fades the dashes too, and they are the
     one part that has to stay crisp; muting is done with colours instead.
     It also never takes the green "next chip" highlight, since that reads as
     "this is the one you can catch", which is the one thing we don't know. */
  .dep-chip.sched,
  .dep-chip.sched:first-child {
    background: #16161f;
    border-color: #8a8a9e;
    border-style: dashed;
  }

  .dep-chip .cd-unit {
    font-size: 0.65em;
    font-weight: 400;
  }

  .dep-chip .t {
    font-size: var(--fs-micro);
    font-weight: 400;
    color: #888;
    order: 2;
    line-height: 1.1;
  }

  .dep-chip:first-child .t {
    font-size: var(--fs-micro);
  }

  .dep-chip .cd {
    font-size: var(--fs-sub);   /* match tunnel/hop big-number size — the catchable
                                   bus countdown is the most decision-relevant number
                                   on the wall and shouldn't be out-sized by traffic. */
    font-weight: 600;
    color: #fff;
    order: 1;
    line-height: 1.1;
  }

  .tunnel-traffic {
    flex-shrink: 0;
    text-align: center;
    padding: 0 14px;
    border-left: 0.5px solid #1e1e2e;
    margin-left: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 130px;
    box-sizing: border-box;
    align-self: stretch;
  }

  .tunnel-label {
    font-size: var(--fs-micro);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9a9aa8;
    margin-bottom: 2px;
  }

  .tunnel-time {
    font-size: var(--fs-sub);
    font-weight: 300;
    color: #fff;
  }

  .tunnel-min {
    font-size: var(--fs-label);
    color: #888;
  }

  .tunnel-status {
    font-size: var(--fs-micro);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .no-service {
    font-size: var(--fs-label);
    color: #6a6a78;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .no-service svg { width: 11px; height: 11px; flex-shrink: 0; opacity: 0.8; }
  /* Three flavors of "nothing to show right now": */
  /* 1) Intentional emptiness — service is asleep / not running today */
  .no-service.is-asleep   { color: #6a6a78; }
  /* 2) Schedule fallback — proxy didn't return live predictions but we know
        when the next scheduled departure is */
  .no-service.is-fallback { color: #9a9aa8; }
  /* 3) Honest error — needs to read amber, not the same as quiet emptiness */
  .no-service.is-error    { color: #f0c040; }

  /* Bus headlights — green when API live, orange when inferred from
     vehicle positions, red when falling back to static schedule. */
  .bus-headlight { filter: none; }
  .bus-headlight.live { fill: #6bffb8; }
  .bus-headlight.inferred { fill: #ffa040; }
  .bus-headlight.schedule { fill: #c0392b; }

  /* Ferry wave animation (only when active) */
  .ferry-wave {
    transform-origin: center;
  }

  .ferry-wave.active {
    animation: ferry-wave-move 2.5s ease-in-out infinite;
  }

  @keyframes ferry-wave-move {
    0%, 100% { transform: translateX(-1.5px); }
    50% { transform: translateX(1.5px); }
  }

  /* Pause animations during sleep mode to save CPU/GPU on slow hardware.
     Note: weather-icon animations live inside each <img>-loaded SVG and
     can't be reached from this stylesheet (SVG runs sandboxed). They keep
     animating during sleep — typically not visible since sleep hides body. */
  body.sleeping .ferry-wave {
    animation-play-state: paused;
  }

  /* Respect user/system reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    .ferry-wave.active {
      animation: none !important;
    }
  }

  .status-bar {
    position: fixed;
    bottom: 1px;
    right: 14px;
    left: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: var(--fs-micro);
    color: #555;
    pointer-events: none;
    line-height: 1;
  }

  .status-warning {
    color: #ffb84d;
    font-weight: 600;
  }

  .status-ok { color: #666; }

  @media (max-width: 800px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto auto;
    }
    #calCard, #alertsCard, #weatherCard { grid-row: auto; grid-column: auto; }
    .transit-card { grid-column: auto; flex-direction: column; align-items: flex-start; }
    .weather-temp { font-size: var(--fs-hero); }
    .weather-forecast { flex-direction: row; flex-wrap: wrap; }
  }
    /* camera-feed overlay (Front rapid snapshots / Lower Door frames) */
    .cam-overlay{position:absolute;inset:0;background:#000;z-index:30;border-radius:inherit;overflow:hidden}
    .cam-overlay img{width:100%;height:100%;object-fit:cover;display:block}

<script>
// ============================================================
// FISH TANK — a simulated reef aquarium for the wall's main slot
// ============================================================
// Jeff, 2026-10-21: "change map on wall display to a simulated fish tank",
// then: make it more realistic, let the launcher's Wall Board put it up, add a
// button to feed the fish (and they eat it), and send surprises — sharks,
// scuba divers, etc.
//
// Self-contained; the wall page talks to it only through window.FishTank:
//   start(el)      mount into el (first call) and run the loop
//   stop()         pause the loop; state is kept for next time
//   events(blk)    the `fish` block of /api/wall-config: {now, events:[{id,type,ts}]}
//   trigger(type)  'feed' | 'treasure' | a visitor name | 'surprise'
//   fps()          frames/s over the last 2 s window (the wall reports it back)
//
// Canvas 2D, tuned for the Onn stick's weak GPU: everything that never moves
// (water, far reef, sand, rocks, coral) is painted ONCE into offscreen layers
// and the frame loop only draws what moves. The loop adapts one way if the
// stick can't keep up: 60 fps cap -> 30 fps cap -> lower internal resolution.
(function () {
  'use strict';

  var TAU = Math.PI * 2, PI = Math.PI;
  function mulberry(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = Math.random;
  function rr(a, b) { return a + (b - a) * rnd(); }

  // is already on screen and only one side of the tank lets them meet.
  var forceDir = 0;
  function rdir() { return forceDir || (rnd() < 0.5 ? 1 : -1); }
  // Moves a facing value (-1..1) toward the way it should face; passing through
  // 0 squashes the drawing flat, which reads as turning round.
  function turnToward(f, to, step) { return f < to ? Math.min(to, f + step) : Math.max(to, f - step); }
  function pick(a) { return a[(rnd() * a.length) | 0]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

  var W = 0, H = 0, S = 1, U = 1;      // CSS px size, render scale, design unit (H/500)
  var G = {};                          // layout for the current size
  var Lyr = {};                        // prerendered layers and sprites
  var running = false, raf = 0, last = 0, T = 0;
  var fish = [], food = [], bubbles = [], snow = [], visitors = [], fx = [], ripples = [];
  var queue = [], pending = [], threats = [], drawList = [];
  // Frame pacing counts display refreshes rather than milliseconds: the wall's
  // TV runs at 50 Hz, where a "30 fps" timer really delivers an uneven 25-ish.
  // div = draw on every div-th refresh (1 = full rate, 2 = a steady half rate).
  var Q = { scale: 1, div: 1, hz: 60, tick: 0, prevRaf: 0, n: 0, t0: 0, fps: 0, low: 0, since: 0 };
  var seenId = 0, nextAuto = 0, bubT = 0;
  // ?fishdbg=a,b on the wall URL switches pieces off to find what the stick
  // can't afford (norays, nocaus, nofish, noplants, nofloor, nobg, s15, s05, noadapt).
  var DBG = {};
  try { (new URLSearchParams(location.search).get('fishdbg') || '').split(',').forEach(function (k) { if (k) DBG[k] = 1; }); } catch (e) {}
  var PROF = [0, 0, 0, 0, 0, 0], PROFN = 0, PROFOUT = '';
  var chest = { lid: 0, want: 0, open: 0, peek: 0, next: 40, burst: 0 };
  var crab = { x: -1, tx: 0, ph: 0, pause: 3, claw: 0, meal: null };
  var retract = 0;
  var scenes = [], flash = 0, lastTreasure = -99, lastFeed = -99, lastFeedX = 0;

  // ---- species --------------------------------------------------------------
  // Lengths are in design units (U = panel height / 500). ht/hb = half-height of
  // the body above/below the midline as a fraction of length; xm = where it is
  // deepest; pk = tail-stalk half-height; fore/rise shape the head (small fore
  // + big rise = blunt, the other way = a snout). dorsal/anal = [x front,
  // x rear, height]. eye = [x, y, r]. Speeds in U/s.
  var SPECIES = {
    clown: { len: 40, ht: 0.25, hb: 0.24, xm: 0.04, pk: 0.075, fore: 0.03, rise: 0.62, ny: 0.03,
      top: '#d9480f', mid: '#ff7b1c', bot: '#ffae5e', fin: '#ff8a2a', edge: '#151515', iris: '#f59f00',
      tail: 'round', tl: 0.25, th: 0.17, dorsal: [0.2, -0.32, 0.17], anal: [-0.06, -0.3, 0.13], pect: 0.17,

      tailc: '#ffd21a', pectc: '#ffd21a', tail: 'lunate', tl: 0.22, th: 0.26, dorsal: [0.22, -0.3, 0.09],
      anal: [0.05, -0.3, 0.08], pect: 0.16, eye: [0.31, -0.07, 0.055], cruise: 32, max: 120, zone: 'open',
      hover: 0.1, edgeW: 1 },
    ytang: { len: 54, ht: 0.38, hb: 0.36, xm: 0.0, pk: 0.05, fore: 0.14, rise: 0.32, ny: 0.08,
      top: '#efb000', mid: '#ffd60a', bot: '#ffe766', fin: '#ffcf00', edge: '#d9a200', iris: '#1d1d1d',
      tail: 'truncate', tl: 0.17, th: 0.22, dorsal: [0.18, -0.32, 0.19], anal: [0.1, -0.3, 0.16], pect: 0.14,
      eye: [0.27, -0.1, 0.05], cruise: 27, max: 100, zone: 'open', hover: 0.15 },
    gramma: { len: 28, ht: 0.23, hb: 0.21, xm: 0.06, pk: 0.08, fore: 0.05, rise: 0.55, ny: 0.02,
      top: '#7a12b8', mid: '#a321d9', bot: '#c45ae6', fin: '#a321d9', edge: '#e7c400', iris: '#ffd43b',
      rear: '#ffc812', tailc: '#ffc812', tail: 'round', tl: 0.22, th: 0.16, dorsal: [0.15, -0.3, 0.15],
      anal: [-0.05, -0.3, 0.12], pect: 0.16, eye: [0.31, -0.05, 0.07], cruise: 15, max: 60, zone: 'rock',
      hover: 0.5 },
    idol: { len: 48, ht: 0.47, hb: 0.42, xm: -0.02, pk: 0.045, fore: 0.17, rise: 0.25, ny: 0.12,
      top: '#efe8c9', mid: '#fbf6e2', bot: '#fffdf2', fin: '#f4ecc6', edge: '#121212', iris: '#d9a400',
      rear: '#ffd84a', tailc: '#1a1a1a', tail: 'truncate', tl: 0.17, th: 0.2, dorsal: [0.12, -0.24, 0.24],
      anal: [0.06, -0.27, 0.22], pect: 0.13, eye: [0.22, -0.1, 0.05], cruise: 21, max: 80, zone: 'open',
      hover: 0.2 },
    chromis: { len: 20, ht: 0.22, hb: 0.2, xm: 0.05, pk: 0.06, fore: 0.06, rise: 0.5, ny: 0.02,
      top: '#3a9d93', mid: '#6fd6c2', bot: '#d2fff3', fin: '#8fe8d6', edge: '#4fb3a6', iris: '#c9d4d8',
      tail: 'fork', tl: 0.3, th: 0.2, dorsal: [0.15, -0.28, 0.14], anal: [-0.02, -0.28, 0.11], pect: 0.17,
      eye: [0.31, -0.05, 0.075], cruise: 36, max: 110, zone: 'school', hover: 0 },
    puffer: { len: 42, ht: 0.27, hb: 0.3, xm: 0.06, pk: 0.075, fore: 0.02, rise: 0.72, ny: 0.04,
      top: '#77663f', mid: '#b9a47a', bot: '#f2ecda', fin: '#c9b88e', edge: '#5d4d31', iris: '#9acd32',
      tail: 'round', tl: 0.2, th: 0.14, dorsal: [-0.12, -0.28, 0.11], anal: [-0.14, -0.28, 0.09], pect: 0.15,
      eye: [0.25, -0.1, 0.085], cruise: 13, max: 55, zone: 'low', hover: 0.4, puffs: 1, bottom: 1 }
  };

  // ---- mount / loop ---------------------------------------------------------
  function mount(el) {
    host = el;
    cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
    var glass = document.createElement('div');
    glass.className = 'fish-glass';
    el.appendChild(cvs);
    el.appendChild(glass);
    ctx = cvs.getContext('2d', { alpha: false });
    // Canvas resolution is fixed for the life of the page. Changing it at run
    // time (the old quality ladder stepped 1.5 -> 1.25 -> 1) froze the Onn
    // stick for ~2 s per step, nearly all of it GPU-side re-allocation, and
    // the stick always ended at 1 anyway. ?fishdbg=s15 tries 1.5 on purpose.
    Q.scale = DBG.s05 ? 0.5 : DBG.s15 ? Math.min(window.devicePixelRatio || 1, 1.5) : 1;
    setLevel(0, performance.now());
  }

  function start(el) {
    if (!host) { if (!el) return; mount(el); }
    if (running) return;
    running = true; last = 0; Q.t0 = 0; Q.prevRaf = 0; Q.since = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function stop() { running = false; cancelAnimationFrame(raf); }

  function frame(now) {
    if (!running) return;
    raf = requestAnimationFrame(frame);
    if (document.hidden || (typeof isSleeping === 'function' && isSleeping())) { last = 0; Q.t0 = 0; Q.prevRaf = 0; return; }

    // average would just measure our own frame time when frames run long.

    // Forgotten by time (~6%/min), held to 48-62 Hz: uncapped long frames
    // never show a single-refresh gap and would otherwise drag hz down.
    if (Q.prevRaf && gap > 6 && gap < 60) {
      Q.vs = Math.min(gap, (Q.vs || gap) * (1 + gap * 1e-6));
      Q.hz = Math.max(48, Math.min(62, 1000 / Q.vs));

    // callbacks instead would lose a whole extra refresh after any long frame.

    last = now;
    var w = host.clientWidth, h = host.clientHeight;

  // change pacing, never the canvas, so they cost nothing; the step back up
  // after visitors leave has a growing back-off if it doesn't hold.
  var LADDER = [2, 1];
  function setLevel(i, now) {

  function paintWater(c, r) {

  function tubes(c, r, x, y) {

      c.fillStyle = '#240b33'; c.beginPath(); c.ellipse(tx, y - h, w * 0.4, 1.6 * U, 0, 0, TAU); c.fill();

  }

  function mushroom(c, x, y, rad, a, b) {

    var g = c.createRadialGradient(0, 0, 0, 0, 0, rad);
    g.addColorStop(0, a); g.addColorStop(0.7, b); g.addColorStop(1, 'rgba(8,60,50,0.9)');

  }

  function starfish(c, x, y, R) {
    c.save(); c.translate(x, y); c.scale(1, 0.55); c.rotate(0.35);
    c.beginPath();
    for (var i = 0; i < 5; i++) {
      var a = -PI / 2 + i * TAU / 5, a2 = a + PI / 5;
      c.quadraticCurveTo(Math.cos(a - 0.3) * R * 0.45, Math.sin(a - 0.3) * R * 0.45, Math.cos(a) * R, Math.sin(a) * R);
      c.quadraticCurveTo(Math.cos(a + 0.3) * R * 0.45, Math.sin(a + 0.3) * R * 0.45, Math.cos(a2) * R * 0.38, Math.sin(a2) * R * 0.38);

    c.fillStyle = g; c.fill();
    c.fillStyle = 'rgba(255,225,190,0.75)';
    for (i = 0; i < 5; i++) { a = -PI / 2 + i * TAU / 5; for (var k = 1; k < 4; k++) { c.beginPath(); c.arc(Math.cos(a) * R * k * 0.22, Math.sin(a) * R * k * 0.22, R * 0.045, 0, TAU); c.fill(); } }
    c.restore();
  }

  function paintFloor(c, r) {
    var x, y, i;
    // sand
    var g = c.createLinearGradient(0, G.fb - H * 0.04, 0, H);
    g.addColorStop(0, '#ecdcae'); g.addColorStop(0.35, '#d5bc86'); g.addColorStop(1, '#977b4f');
    c.beginPath(); c.moveTo(0, H);
    for (x = 0; x <= W + 4; x += 4) c.lineTo(x, floorAt(x));
    c.lineTo(W, H); c.closePath(); c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(255,248,225,0.35)'; c.lineWidth = 1.6 * U;
    c.beginPath(); for (x = 0; x <= W + 4; x += 4) c.lineTo(x, floorAt(x) + 0.8 * U); c.stroke();
    var grainCols = ['rgba(255,251,238,0.55)', 'rgba(140,110,70,0.35)', 'rgba(100,78,50,0.3)', 'rgba(255,230,190,0.45)', 'rgba(60,45,30,0.25)'];
    var N = Math.min(4500, Math.round(W * (H - G.fb) * 0.06 / (U * U)));
    grainCols.forEach(function (col) {
      c.beginPath();
      for (var k = 0; k < N / 5; k++) {
        var gx = r() * W, fy = floorAt(gx), gy = fy + Math.pow(r(), 0.85) * (H - fy);
        var s = (0.5 + r() * 0.9) * U * (0.7 + 0.6 * (gy - fy) / (H - fy));

      }

    });

    for (i = 0; i < 34; i++) {
      x = r() * W; y = floorAt(x) + (0.15 + r() * 0.75) * (H - floorAt(x));
      c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 10 * U, y - 2.4 * U, x + 22 * U, y); c.quadraticCurveTo(x + 32 * U, y + 2 * U, x + 42 * U, y); c.stroke();
    }
    // pebbles and shells on the open sand
    for (i = 0; i < 22; i++) {
      x = r() * W; y = floorAt(x) + (0.1 + r() * 0.8) * (H - floorAt(x));
      var pr = (1.5 + r() * 3) * U, pg = c.createRadialGradient(x - pr * 0.3, y - pr * 0.3, 0, x, y, pr);
      var tone = pick(['#9a9188', '#7d746c', '#b8ad9c', '#6c6560']);
      pg.addColorStop(0, '#e8e2d8'); pg.addColorStop(0.4, tone); pg.addColorStop(1, '#3a332e');
      c.fillStyle = pg; c.beginPath(); c.ellipse(x, y, pr * 1.3, pr * 0.8, r(), 0, TAU); c.fill();
    }
    for (i = 0; i < 4; i++) {
      x = W * (0.3 + r() * 0.45); y = floorAt(x) + (0.2 + r() * 0.5) * (H - floorAt(x));
      var sr = (4 + r() * 3) * U;
      c.save(); c.translate(x, y); c.rotate((r() - 0.5) * 0.8); c.scale(1, 0.62);
      c.fillStyle = pick(['#f3d9c8', '#f7c6b4', '#efe3d2']);
      c.beginPath(); c.moveTo(0, sr * 0.3); c.arc(0, sr * 0.3, sr, PI * 1.08, PI * 1.92); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(160,100,80,0.45)'; c.lineWidth = 0.7 * U; c.beginPath();
      for (var k = 0; k < 7; k++) { var a = PI * (1.12 + k * 0.12); c.moveTo(0, sr * 0.3); c.lineTo(Math.cos(a) * sr, sr * 0.3 + Math.sin(a) * sr); }
      c.stroke(); c.restore();
    }
    starfish(c, W * 0.36, floorAt(W * 0.36) + 10 * U, 13 * U);
    // contact shadows, then the reef: a sea fan behind the right pile, both piles, corals on top
    G.piles.forEach(function (p) {
      p.bs.forEach(function (b) {
        c.fillStyle = 'rgba(45,32,20,0.28)';
        c.beginPath(); c.ellipse(b.x, b.y + b.ry * 0.82, b.rx * 1.05, 6 * U, 0, 0, TAU); c.fill();
      });
    });
    seaFan(c, r, G.piles[1].x + G.piles[1].w * 0.18, floorAt(G.piles[1].x) - G.piles[1].h * 0.4, H * 0.42);
    G.piles.forEach(function (p) { p.bs.forEach(function (b) { boulder(c, r, b); }); });
    var L0 = G.piles[0], R0 = G.piles[1], t0 = L0.top, t1 = R0.top;

    c.strokeStyle = '#8e44ad'; c.fillStyle = '#8e44ad'; c.lineCap = 'round';
    for (i = 0; i < 6; i++) branchy(c, r, t0.x - t0.rx * 0.55, t0.y - t0.ry * 0.55, -PI / 2 + (r() - 0.5) * 1.4, (14 + r() * 10) * U, 4.4 * U, 3, 1.1, '#f0abfc');
    c.save(); c.translate(Math.max(L0.x - L0.w * 0.3, 34 * U), L0.bs[0].y - L0.bs[0].ry * 0.55);
    for (i = 0; i < 3; i++) {
      c.fillStyle = ['#7d9a4a', '#91ad5a', '#a8c46b'][i];
      c.beginPath(); c.ellipse(0, -i * 5 * U, (26 - i * 6) * U, (6 - i) * U, -0.05, 0, TAU); c.fill();
    }
    c.restore();
    mushroom(c, L0.x + L0.w * 0.2, L0.top.y + L0.top.ry * 0.25, 9 * U, '#c9fff2', '#25c9a5');
    mushroom(c, L0.x + L0.w * 0.3, L0.top.y + L0.top.ry * 0.55, 7 * U, '#ffd6f1', '#d6479b');
    mushroom(c, L0.x - L0.w * 0.08, L0.top.y + L0.top.ry * 0.7, 8 * U, '#c9fff2', '#25c9a5');

    cg.addColorStop(0, '#f29ac0'); cg.addColorStop(1, '#a8406c');

    c.quadraticCurveTo(a.x + 9 * U, a.y + 14 * U, a.x + 12 * U, a.y); c.closePath(); c.fill();

    c.fillStyle = '#5f6670'; c.beginPath(); c.ellipse(bs.x, bs.y, 7 * U, 3.5 * U, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); c.ellipse(bs.x - 1.5 * U, bs.y - 1.2 * U, 4 * U, 1.3 * U, 0, 0, TAU); c.fill();
  }

  // ---- population -------------------------------------------------------------
  function makePal(sp, h) {
    var p = {};
    ['top', 'mid', 'bot', 'fin', 'edge', 'iris', 'rear', 'tailc', 'pectc'].forEach(function (k) { if (sp[k]) p[k] = hz(sp[k], h); });
    p.finA = hz(sp.fin, h, 0.82); p.pectA = hz(sp.pectc || sp.fin, h, 0.6); p.tailA = hz(sp.tailc || sp.fin, h, 0.88);
    p.white = hz('#ffffff', h); p.black = hz('#0e0e10', h); p.dark = hz('#000000', h, 0.22);
    p.spot = hz('#3b2f1e', h, 0.65); p.belly = hz('#fbf8ee', h, 0.7); p.saddle = hz('#ff9f1c', h);
    return p;
  }

  function makeFish(kind, d) {
    var sp = SPECIES[kind], f = { kind: kind, sp: sp, d: d, sc: 1 - 0.42 * d, haze: d * 0.5 };
    f.L0 = sp.len * rr(0.88, 1.12); f.L = f.L0 * U * f.sc;
    f.x = rr(0.12, 0.88) * W; f.y = rr(G.surf + H * 0.1, G.fb - H * 0.22);
    if (sp.zone === 'anem') { f.x = G.anem.x + rr(-30, 30) * U; f.y = G.anem.y - rr(12, 40) * U; }
    f.vx = rr(-1, 1) * sp.cruise * U * f.sc; f.vy = 0;
    f.phi = f.vx < 0 ? PI : 0; f.face = f.phi; f.pitch = 0;
    f.ph = rr(0, TAU); f.pph = rr(0, TAU); f.amp = 0.5; f.beat = rr(0.9, 1.1);
    f.cruise = sp.cruise * rr(0.85, 1.15); f.vmax = sp.max; f.agi = sp.len < 30 ? 2.8 : 1.9;
    f.hunger = rr(0.5, 1); f.eat = 0; f.puff = 0; f.fear = 0; f.meal = null; f.lookAt = 0;
    f.tt = 0; f.tx = f.x; f.ty = f.y; f.leg = 1; f.school = sp.zone === 'school';
    f.ox = rr(-50, 50); f.oy = rr(-24, 24); f.seed = rr(0, 100);
    f.pal = makePal(sp, f.haze);
    if (sp.puffs) { f.spots = []; for (var i = 0; i < 28; i++) f.spots.push([rr(-0.3, 0.38), rr(-0.95, 0.35), rr(0.011, 0.02)]); }
    f.render = renderFish;
    return f;
  }

  function populate() {
    fish = [];
    function add(kind, n, d0, d1) { for (var i = 0; i < n; i++) fish.push(makeFish(kind, rr(d0, d1))); }
    add('clown', 2, 0.32, 0.42);
    add('tang', 2, 0.05, 0.75);
    add('ytang', 2, 0.1, 0.8);
    add('gramma', 2, 0.25, 0.55);
    add('idol', 1, 0.1, 0.5);
    add('puffer', 1, 0.15, 0.35);
    add('chromis', 14, 0.35, 0.62);
    initSnow();
    nextAuto = T + rr(600, 1100);
  }

  function initSnow() {
    snow = [];
    for (var i = 0; i < 46; i++) snow.push({ x: rnd() * W, y: rr(G.surf, H), v: rr(2, 7), s: rr(0.6, 1.5), ph: rr(0, TAU) });
  }

  // ---- fish behaviour ---------------------------------------------------------
  function newTarget(f) {
    var sp = f.sp, z = sp.zone, x, y;
    f.tt = T + rr(4, 11); f.leg = rr(0.7, 1.15);
    if (rnd() < sp.hover) {
      f.tx = clamp(f.x + rr(-22, 22) * U, 30 * U, W - 30 * U); f.ty = f.y + rr(-10, 10) * U;
      f.leg = 0.25; f.tt = T + rr(2, 6); return;
    }
    if (z === 'anem') { x = G.anem.x + rr(-55, 55) * U; y = G.anem.y + rr(-60, -8) * U; }
    else if (z === 'rock') { var p = pick(G.piles); x = p.x + rr(-0.45, 0.45) * p.w; y = floorAt(x) - p.h * rr(0.3, 1.2); }
    else if (z === 'low') { x = rr(0.08, 0.92) * W; y = floorAt(x) - rr(14, 70) * U; }
    else { x = rr(0.06, 0.94) * W; y = rr(G.surf + H * 0.07, G.fb - H * 0.18); }
    f.tx = x; f.ty = y;
  }

  function nearestFood(f) {
    var best = null, bd = Math.pow(280 * U * (0.4 + f.hunger), 2);
    for (var i = 0; i < food.length; i++) {
      var p = food[i];
      if (p.gone || (p.st === 2 && !f.sp.bottom)) continue;
      var dx = p.x - f.x, dy = p.y - f.y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  function updateFish(f, dt) {
    var sp = f.sp, k = U * f.sc, cruise = f.cruise * k, vmax = f.vmax * k;
    var ax = 0, ay = 0, dx, dy, d, i, fear = 0;
    for (i = 0; i < threats.length; i++) {
      var t = threats[i];
      dx = f.x - t.x; dy = f.y - t.y; d = Math.sqrt(dx * dx + dy * dy) + 1e-3;
      if (d < t.r) { var q = 1 - d / t.r; ax += dx / d * q * 900 * k * t.s; ay += dy / d * q * 380 * k * t.s; fear = Math.max(fear, q * t.s); }
    }
    f.fear = Math.max(fear, f.fear - dt * 0.45);
    if (f.fear > 0.3 && !f.hide && !f.school && sp.zone !== 'anem') {
      var hp = G.piles[Math.abs(G.piles[0].x - f.x) < Math.abs(G.piles[1].x - f.x) ? 0 : 1];
      var hx = hp.x + rr(-0.4, 0.4) * hp.w;
      f.hide = { x: hx, y: floorAt(hx) - hp.h * rr(0.25, 0.75) };
    } else if (f.fear < 0.08) f.hide = null;
    if (f.meal && (f.meal.gone || (f.meal.st === 2 && !sp.bottom))) f.meal = null;
    if (f.fear > 0.25) f.meal = null;
    else if (!f.meal && food.length && f.hunger > 0.12 && T > f.lookAt) { f.meal = nearestFood(f); f.lookAt = T + 0.35; }

    var wx, wy, spd;
    if (f.meal) { wx = f.meal.x; wy = f.meal.y; spd = vmax * (0.5 + 0.35 * f.hunger); }
    else if (f.fear > 0.25 && sp.zone === 'anem') { wx = G.anem.x; wy = G.anem.y - 10 * U; spd = vmax; }
    else if (f.hide) { wx = f.hide.x; wy = f.hide.y; spd = vmax; }
    else if (f.school) {
      wx = G.school.x + (f.ox + Math.sin(T * 0.4 + f.seed) * 14) * k;
      wy = G.school.y + (f.oy + Math.cos(T * 0.33 + f.seed) * 8) * k;
      spd = cruise;
    } else {
      if (T > f.tt || Math.abs(f.tx - f.x) + Math.abs(f.ty - f.y) < 14 * k) newTarget(f);
      wx = f.tx; wy = f.ty; spd = cruise * f.leg;
    }
    dx = wx - f.x; dy = wy - f.y; d = Math.sqrt(dx * dx + dy * dy) + 1e-3;
    var arrive = Math.min(1, d / (26 * k));
    ax += (dx / d * spd * arrive - f.vx) * f.agi;
    ay += (dy / d * spd * arrive * 0.75 - f.vy) * f.agi;

    var avx = 0, avy = 0, an = 0;
    for (i = 0; i < fish.length; i++) {
      var o = fish[i];
      if (o === f) continue;
      dx = f.x - o.x; dy = f.y - o.y;
      var sep = (f.L + o.L) * 0.5;
      if (f.school && o.school && Math.abs(dx) < 70 * k && Math.abs(dy) < 50 * k) { avx += o.vx; avy += o.vy; an++; }
      if (Math.abs(dx) > sep || Math.abs(dy) > sep || Math.abs(f.d - o.d) > 0.22) continue;
      d = Math.sqrt(dx * dx + dy * dy) + 1e-3;
      if (d < sep) { var s = 1 - d / sep; ax += dx / d * s * 240 * k; ay += dy / d * s * 170 * k; }
    }
    if (an) { ax += (avx / an - f.vx) * 1.1; ay += (avy / an - f.vy) * 1.1; }

    var m = f.L * 0.55 + 8 * U, top = G.surf + 10 * U + f.L * 0.25;
    var bot = floorAt(f.x) - (sp.bottom ? 5 : 12) * U - f.L * 0.3;
    if (f.x < m) ax += (m - f.x) * 9; else if (f.x > W - m) ax -= (f.x - (W - m)) * 9;
    if (f.y < top) ay += (top - f.y) * 9; else if (f.y > bot) ay -= (f.y - bot) * 11;

    f.vx += ax * dt; f.vy += ay * dt;
    var v = Math.sqrt(f.vx * f.vx + f.vy * f.vy), lim = vmax * (1 + f.fear * 0.6);
    if (v > lim) { f.vx *= lim / v; f.vy *= lim / v; v = lim; }
    f.vy *= 1 - Math.min(1, 0.8 * dt);
    f.x = clamp(f.x + f.vx * dt, f.L * 0.3, W - f.L * 0.3);
    f.y = clamp(f.y + f.vy * dt, G.surf + 5 * U, floorAt(f.x) - 3 * U);

    if (f.vx > 3 * k) f.face = 0; else if (f.vx < -3 * k) f.face = PI;
    var dphi = f.face - f.phi, stepA = dt * PI / 0.5;
    f.phi += clamp(dphi, -stepA, stepA);
    var tp = clamp(Math.atan2(f.vy, Math.abs(f.vx) + 8 * k), -0.5, 0.5);
    f.pitch += (tp - f.pitch) * Math.min(1, dt * 4);
    var sr = Math.min(1.4, v / vmax);
    f.ph += dt * TAU * (1.1 + 4.2 * sr) * f.beat * (f.L0 < 30 ? 1.4 : 1);
    f.amp = lerp(f.amp, 0.32 + 0.6 * sr + (Math.abs(dphi) > 0.2 ? 0.45 : 0), Math.min(1, dt * 3));
    f.pph += dt * TAU * (2.6 - 1.2 * Math.min(1, sr));

    if (f.meal) {
      var mx = f.x + Math.cos(f.phi) * Math.cos(f.pitch) * f.L * 0.5, my = f.y + Math.sin(f.pitch) * f.L * 0.5;
      dx = mx - f.meal.x; dy = my - f.meal.y;
      var reach = Math.max(3.5 * U, f.L * 0.16);
      if (dx * dx + dy * dy < reach * reach) {
        f.meal.gone = true; f.meal = null; f.eat = 1;
        f.hunger = Math.max(0, f.hunger - 0.2); f.lookAt = T + rr(0.2, 0.8);
      }
    }
    f.eat = Math.max(0, f.eat - dt * 3);
    f.hunger = Math.min(1, f.hunger + dt / 480);
    if (sp.puffs) f.puff = clamp(f.puff + (f.fear > 0.3 ? dt * 2.2 : -dt / 7), 0, 1);
  }

  // ---- fish drawing -----------------------------------------------------------
  function bodyPath(sp, L, ht, hb) {
    var P = new Path2D(), nx = L * 0.5, ny = L * sp.ny, xm = L * sp.xm, px = -L * 0.36, pk = L * sp.pk, fore = L * sp.fore;

  // Mermaid + treasure: she dives to the open chest, comes up wearing a crown

  function canCrown(M) { return M.state < 2 && !M.ctl && !M.crown && onScreen(M.x, 0.08) && treasureOn(); }
  function playCrown(M) {
    var phase = 0, t1 = 0;
    M.ctl = true; M.wave = 0;

      if (phase === 0) {                             // swim down to the chest

        var tx = G.chest.x - M.face * 30 * M.k, ty = G.chest.y - 34 * U, dx = tx - M.x, dy = ty - M.y;
        var dd = Math.sqrt(dx * dx + dy * dy), v = W * 0.17 * dt;

        M.y += (dy2 > 0 ? 1 : -1) * v2;

  // Octopus + treasure: it creeps over to the open chest, takes a gold coin and
  // hides beside the chest (the coin still glinting) before jetting off with it.
  function canCoin(O) { return O.state < 2 && !O.coin && onScreen(O.x, 0.02) && treasureOn(); }
  function playCoin(O) {
    var tx = G.chest.x + (O.x < G.chest.x ? -1 : 1) * 30 * U;

  // Octopus + diver: the hiding octopus shoots up past the diver and inks their

  function canInkDiver(O, Dv) {

  }
  function playInkDiver(O, Dv) {

  // Diver + shark: the diver turns to face it, raises a camera and -- flash! --
  // the startled shark jumps and speeds off.
  function canPhoto(Dv, S) {

  function playPhoto(Dv, S) {

  // Turtle + jellyfish: sea turtles eat jellies, so it hurries after one; the
  // jelly pulses hard and zips away just in time, and the turtle snaps at water.
  function turtleHead(Tu) { return { x: Tu.x + Tu.dir * Tu.L * 0.5, y: Tu.y }; }
  function canJellyChase(Tu, J) {
    if (Tu.t < 2) return false;
    var h = turtleHead(Tu);
    for (var i = 0; i < J.items.length; i++) {
      var j = J.items[i], dx = (j.x - h.x) * Tu.dir;
      if (dx > W * 0.04 && dx < W * 0.42 && Math.abs(j.y - h.y) < H * 0.3 && onScreen(j.x, 0.05)) { Tu.prey = j; return true; }
    }
    return false;
  }
  function playJellyChase(Tu) {
    var j = Tu.prey, phase = 0;
    return { step: function (dt) {
      if (gone(Tu)) return false;
      var h = turtleHead(Tu);

        Tu.rate = Math.min(2.4, Tu.rate + dt * 2);
        Tu.oy += (clamp(j.y - (h.y - Tu.oy), -H * 0.28, H * 0.28) - Tu.oy) * Math.min(1, dt * 1.2);
        var dx = j.x - h.x, dy = j.y - h.y;

      }

    } };
  }

  // Whale + mermaid: the whale sings (rings and notes from its head, slowing to
  // listen), she turns and sings back, twice each.
  var SONG = [0, 2.2, 4.4, 6.4];
  function canSong(Wh, M) {
    var h = Wh.at(44, 2);
    return M.state < 2 && !M.ctl && onScreen(M.x, 0.1) && onScreen(h.x, 0.14);
  }
  function playSong(Wh, M) {
    var turn = -1;
    Wh.bt = 0.5;
    return { step: function (dt) {
      if (gone(Wh) || gone(M)) { if (!gone(Wh)) Wh.bt = 1; return false; }
      M.state = 1; M.st = Math.min(M.st, 2);

  // Feed + shark: it rises to the falling food, opens wide and takes a big
  // mouthful (the school has already scattered), then sinks back to its line.
  function canSnack(S) {
    if (S.t < 1) return false;
    var m = sharkMouth(S);

      var p = food[i], dx = (p.x - m.x) * S.dir;

    }
    return false;

  function snackAhead(S) {
    var m = sharkMouth(S), best = null, bd = 1e9;

      var p = food[i], dx = (p.x - m.x) * S.dir;
      if (p.gone || p.st > 1 || p.y < G.surf + S.L * 0.2 || dx < -W * 0.02 || dx > W * 0.7) continue;
      var d = dx + Math.abs(p.y - m.y);

    var p = S.prey, phase = 0;

      if (phase === 0) {

        S.oy += (want - S.oy) * Math.min(1, dt * 1.6);

        }

  // Feed + dolphins: each dolphin does a backflip as it passes over the food.
  function canFlips(D) {
    if (!feedOn()) return false;

    return false;
  }
  function playFlips(D) {
    return { step: function () {
      if (gone(D)) return false;
      var left = 0;
      for (var i = 0; i < D.items.length; i++) {
        var o = D.items[i];
        if (o.flipped) continue;
        left++;
        if (o.flip == null && Math.abs(o.x - lastFeedX) < W * 0.07) { o.flip = 0; beat('flips:flip'); }
      }
      return left > 0;
    } };
  }

  // b is a visitor type, or 'treasure' / 'feed' for the chest and the food.
  var COMBOS = [
    { id: 'ride', a: 'diver', b: 'whale', can: canRide, play: playRide },
    { id: 'chase', a: 'dolphins', b: 'shark', can: canChase, play: playChase },
    { id: 'dolphride', a: 'mermaid', b: 'dolphins', can: canDolphRide, play: playDolphRide },
    { id: 'inkshark', a: 'octopus', b: 'shark', can: canInkShark, play: playInkShark },
    { id: 'crown', a: 'mermaid', b: 'treasure', can: canCrown, play: playCrown },
    { id: 'coin', a: 'octopus', b: 'treasure', can: canCoin, play: playCoin },
    { id: 'inkdiver', a: 'octopus', b: 'diver', can: canInkDiver, play: playInkDiver },
    { id: 'photo', a: 'diver', b: 'shark', can: canPhoto, play: playPhoto },
    { id: 'jellychase', a: 'turtle', b: 'jelly', can: canJellyChase, play: playJellyChase },
    { id: 'song', a: 'whale', b: 'mermaid', can: canSong, play: playSong },
    { id: 'snack', a: 'shark', b: 'feed', can: canSnack, play: playSnack },
    { id: 'flips', a: 'dolphins', b: 'feed', can: canFlips, play: playFlips }
  ];

  function directScenes(dt) {
    var i, j, k;
    for (i = scenes.length - 1; i >= 0; i--) {
      var s = scenes[i];
      s.t += dt;
      if (!s.step(dt)) {
        if (s.a && s.a.scene === s) s.a.scene = null;
        if (s.b && s.b.scene === s) s.b.scene = null;
        scenes.splice(i, 1);
      }
    }
    for (i = 0; i < visitors.length; i++) {
      var a = visitors[i];
      if (!idle(a)) continue;
      for (k = 0; k < COMBOS.length && !a.scene; k++) {
        var cb = COMBOS[k];
        if (cb.a !== a.type || a.done[cb.id]) continue;
        if (cb.b === 'treasure' || cb.b === 'feed') { if (cb.can(a)) startScene(cb, a, null); continue; }
        for (j = 0; j < visitors.length; j++) {
          var b = visitors[j];
          if (b === a || b.type !== cb.b || !idle(b) || b.done[cb.id]) continue;
          if (cb.can(a, b)) { startScene(cb, a, b); break; }
        }
      }
    }
  }
  function startScene(cb, a, b) {
    var s = cb.play(a, b);
    s.id = cb.id; s.t = 0; s.a = a; s.b = b;
    a.scene = s; a.done[cb.id] = true;
    if (b) { b.scene = s; b.done[cb.id] = true; }
    scenes.push(s);
  }

  function trigger(type, dir) {
    if (!W) { if (pending.length < 8) pending.push(type); return; }
    if (type === 'surprise') type = pick(SURPRISES);
    if (type === 'feed') return feed();
    if (type === 'treasure') return treasure();
    var Mk = MAKERS[type];
    if (!Mk) return;
    for (var i = 0; i < visitors.length; i++) if (visitors[i].type === type && visitors[i].fade == null) return;
    // A full tank used to queue requests first-come (6 deep) behind visitors that
    // stay 16-120 s, so a kid pressing Mermaid watched minutes of earlier presses
    // swim by instead (Jeff, 2026-10-25: "we pressed mermaid and other things came
    // instead"). Now the NEWEST request goes to the front, only QUEUE_MAX wait,
    // and step() fades the oldest visitor out to make room for each of them.
    if (visitors.length >= 3) {
      var qi = queue.indexOf(type);
      if (qi >= 0) queue.splice(qi, 1);
      queue.unshift(type);
      if (queue.length > QUEUE_MAX) queue.length = QUEUE_MAX;
      return;
    }
    forceDir = dir || arrangeDir(type);
    var v = new Mk();
    forceDir = 0;
    v.done = {}; v.scene = null;
    visitors.push(v);
  }
  // Fade the longest-staying visitor that has had MIN_STAY on screen, so a
  // queued request gets its slot within seconds without anyone vanishing the
  // moment they arrive.
  // Prefers a visitor that isn't in a combo scene or waiting for a partner
  // that's in the queue, so pressing Diver then Whale doesn't fade the diver.
  function makeRoom() {
    var oldest = null, any = null;
    for (var i = 0; i < visitors.length; i++) {
      var v = visitors[i];
      if (v.fade != null || v.t < MIN_STAY) continue;
      if (!any || v.t > any.t) any = v;
      var busy = !!v.scene, ps = PARTNERS[v.type] || [];
      for (var j = 0; j < ps.length && !busy; j++) if (queue.indexOf(ps[j]) >= 0) busy = true;
      if (!busy && (!oldest || v.t > oldest.t)) oldest = v;
    }
    if (oldest || any) (oldest || any).fade = 1;
  }

  // ---- frame ------------------------------------------------------------------------
  function step(dt) {
    T += dt;
    G.cur = Math.sin(T * 0.11) * 0.6 + Math.sin(T * 0.043 + 1) * 0.4;
    var i, scary = false;
    var leaving = 0;
    for (i = visitors.length - 1; i >= 0; i--) {
      var vi = visitors[i], alive = vi.update(dt);
      if (vi.fade != null) {
        vi.fade -= dt / FADE;
        if (vi.items) for (var k = 0; k < vi.items.length; k++) vi.items[k].a = Math.max(0, vi.fade);
        if (vi.fade <= 0) alive = false; else leaving++;
      }
      if (!alive || vi.dead) { vi.dead = true; visitors.splice(i, 1); }
    }
    while (queue.length && visitors.length < 3) trigger(queue.shift());
    if (queue.length > leaving) makeRoom();
    // Unprompted visitors only drop into a tank with room; they never queue or
    // push out something a person asked for.
    if (T > nextAuto) { if (visitors.length < 3 && !queue.length) trigger(pick(AUTO)); nextAuto = T + rr(600, 1200); }
    directScenes(dt);
    flash = Math.max(0, flash - dt * 1.8);
    threats.length = 0;
    for (i = 0; i < visitors.length; i++) {
      var v = visitors[i];
      if (v.threat) threats.push(v.threat);
      if (v.type === 'shark' || v.type === 'octopus') scary = true;
    }
    retract += ((scary ? 1 : 0) - retract) * Math.min(1, dt * 1.5);
    G.school.t -= dt;
    for (i = 0; i < threats.length; i++) {
      var th = threats[i];
      if (th.s >= 0.8 && Math.abs(th.x - G.school.x) < th.r * 1.4 && G.school.flee !== th) {
        G.school.flee = th; G.school.t = 4;
