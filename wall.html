        iconAnchor: [HOME_FACE_SIZE / 2 - dx, HOME_FACE_SIZE / 2 - dy],
        className: 'person-marker small',
      };
    });
  }
  orbit(atHome, [HOME.lat, HOME.lon]);
  if (wagonGroup) orbit(wagonGroup.members, [wagonGroup.wagon.lat, wagonGroup.wagon.lon]);

  // Cluster elsewhere people who happen to be near each other. The wagon and
  // its orbit are already placed, so they sit this out.
  const loose = elsewhere.filter(function (l) {
    return !orbitIconConfig[l.tid] && !(wagonGroup && l.tid === 'WG');
  });
  const positions = {};
  for (const loc of loose) positions[loc.tid] = { lat: loc.lat, lon: loc.lon };
  const handled = new Set();
  for (let i = 0; i < loose.length; i++) {
    if (handled.has(loose[i].tid)) continue;
    const cluster = [loose[i]];
    handled.add(loose[i].tid);
    for (let j = i + 1; j < loose.length; j++) {
      if (handled.has(loose[j].tid)) continue;
      if (distMi(loose[i], loose[j]) < OVERLAP_MI) {
        cluster.push(loose[j]);
        handled.add(loose[j].tid);
      }
    }
    if (cluster.length > 1) {
      const cx = cluster.reduce(function (s, c) { return s + c.lat; }, 0) / cluster.length;
      const cy = cluster.reduce(function (s, c) { return s + c.lon; }, 0) / cluster.length;
      cluster.forEach(function (c, idx) {
        const angle = (idx / cluster.length) * 2 * Math.PI + 0.5;
        positions[c.tid].lat = cx + RING_RADIUS_DEG * Math.cos(angle);
        positions[c.tid].lon = cy + RING_RADIUS_DEG * Math.sin(angle);
      });
    }
  }

  // Render markers
  const seen = new Set();
  for (const loc of locations) {
    seen.add(loc.tid);
    const html = faceMarkerHtml(loc);

    // Freshness ladder (drives marker visual decay + pill copy below).
    // fresh < 3m, recent < 30m, stale < 3h, cold ≥ 3h.
    const ageSec = loc.received_at ? (Date.now() / 1000 - loc.received_at) : 0;
    let staleClass = '';
    if (!loc.received_at || ageSec >= 10800)      staleClass = ' stale-cold';
    else if (ageSec >= 1800)                       staleClass = ' stale-warm';
    else if (ageSec >= 180)                        staleClass = ' stale-recent';

    let latlng, iconSize, iconAnchor, className;
    // Hub badges sit BEHIND the faces orbiting them (the house does it with
    // -500); everything sharing a latlng ties on y, so the offset decides.
    let zOffset = 10000;
    if (orbitIconConfig[loc.tid]) {
      const cfg = orbitIconConfig[loc.tid];
      latlng = cfg.latlng;
      iconSize = cfg.iconSize;
      iconAnchor = cfg.iconAnchor;
      className = cfg.className + staleClass;
    } else if (wagonGroup && loc.tid === 'WG') {
      latlng = [loc.lat, loc.lon];
      iconSize = [WAGON_HUB_SIZE, WAGON_HUB_SIZE];
      iconAnchor = [WAGON_HUB_SIZE / 2, WAGON_HUB_SIZE / 2];
      className = 'person-marker wagon-hub' + staleClass;
      zOffset = 9500;
    } else {
      const pos = positions[loc.tid] || { lat: loc.lat, lon: loc.lon };
      latlng = [pos.lat, pos.lon];
      // Enlarged from 36→44 so faces dominate the map hierarchy.
      iconSize = [44, 44];
      iconAnchor = [22, 22];
      className = 'person-marker' + staleClass;
    }

    const icon = L.divIcon({
      className: className,
      html: html,
      iconSize: iconSize,
      iconAnchor: iconAnchor,
    });
    if (_personMarkers[loc.tid]) {
      _personMarkers[loc.tid].setLatLng(latlng);
      _personMarkers[loc.tid].setIcon(icon);
      _personMarkers[loc.tid].setZIndexOffset(zOffset);
    } else {
      _personMarkers[loc.tid] = L.marker(latlng, { icon: icon, zIndexOffset: zOffset }).addTo(_hobokenMap);
    }
  }
  // Remove markers for people no longer in the list
  for (const tid of Object.keys(_personMarkers)) {
    if (!seen.has(tid)) {
      _hobokenMap.removeLayer(_personMarkers[tid]);
      delete _personMarkers[tid];
    }
  }
  // Update overlay — one semi-transparent pill per person, left-aligned
  const overlay = document.getElementById('mapStatusOverlay');
  if (overlay) {
    if (locations.length === 0) {
      // A family display with no family reads as broken — say why instead.
      overlay.innerHTML =
        '<span class="ms-pill ms-pill--cold"><span class="ms-status">Location sharing offline</span></span>';
    } else if (elsewhere.every(function (l) { return _pipPlan.shown.has(l.tid); })) {
      // Everyone home = the boring steady state, and the faces orbiting the
      // house badge already say it. The strip earns its place only when
      // someone is out (Jeff, 2026-07-26) — and since 2026-08-01, only when
      // someone is out WITHOUT a corner inset. A person in an inset is fully
      // described there (face, place, age); repeating it down here was saying
      // the same thing twice.
      overlay.innerHTML = '';
    } else {
      // Someone is out: away pills carry the full story (where + how fresh);
      // at-home pills compress to a bare name so all five fit one line on
      // the 930px wall display.
      //
      // One pill per PLACE, not per person (Jeff, 2026-08-04): the girls at the
      // same park produced two pills saying the same location twice, which is
      // both the widest and the least informative way to use the row. Grouping
      // is by proximity rather than by matching status text, because two fixes
      // in the same building can still be labelled differently ("at Columbus
      // Park" vs "0.4 mi away") — same OVERLAP_MI the map markers use to decide
      // two faces are one dot.
      overlay.innerHTML = groupByPlace(locations.filter(function (l) {
        return !_pipPlan.shown.has(l.tid);
      })).map(function (g) {
        // Freshness is the group's NEWEST fix: the pill asserts one place, and
        // the newest fix is the strongest evidence anyone is still at it.
        const newest = g.people.reduce(function (a, b) {
          return (b.received_at || 0) > (a.received_at || 0) ? b : a;
        });
        const ageSec = newest.received_at ? (Date.now() / 1000 - newest.received_at) : Infinity;
        let cls = '';
        if (!newest.received_at || ageSec >= 10800) cls = ' ms-pill--cold';
        else if (ageSec >= 1800)                    cls = ' ms-pill--warm';
        // The wagon trails the people it's with — "Elizabeth, Sydney & Wagon",
        // never "Elizabeth, Wagon & Sydney" (Jeff, 2026-10-19).
        const ordered = g.people.filter(function (l) { return l.tid !== 'WG'; })
          .concat(g.people.filter(function (l) { return l.tid === 'WG'; }));
        const names = joinNames(ordered.map(displayName));
        if (g.home) {
          return '<span class="ms-pill' + cls + '"><span class="ms-name">' +
            names + '</span></span>';
        }
        const status = groupStatus(g.people);
        // A cold fix reads "last seen 13h ago" from personStatus(), so the
        // trailing age span would repeat it verbatim — "Sydney last seen 13h
        // ago 13h ago". Same 3h threshold personStatus() switches on.
        const showAge = !!newest.received_at && ageSec < 10800;
        return '<span class="ms-pill' + cls + '"><span class="ms-name">' + names +
          '</span><span class="ms-status">' + status + '</span>' +
          (showAge ? '<span class="ms-ago">' + agoText(newest.received_at * 1000) + '</span>' : '') +
          '</span>';
      }).join('');
    }
  }

  applyMapFrame(frame);

  renderAwayInsets(locations, _pipPlan);
}

// ============================================================
// AWAY INSETS — a corner picture-in-picture for whoever is out
// ============================================================
// The wall map frames the whole family at once, which is exactly why it can't
// answer "where is Jeff, specifically" — at a fit-everyone zoom his face covers
// six blocks. So each person who's out gets a small map of their own, and the
// CORNER it sits in is their direction from the house: top-right = north-east,
// bottom-left = south-west. Direction from the corner, detail from the box.
const PIP_CORNERS = ['tl', 'tr', 'bl', 'br'];
const _pipMaps = {};        // corner → { map, markers }
let _lastLocations = [];
let _pipShrunk = false;
// Who currently has a box. renderLocations() fills this before it builds the
// pill row; anyone in it is described by their box and skipped in the pills.
let _pipPlan = { groups: { tl: [], tr: [], bl: [], br: [] }, shown: new Set() };

// Direction is measured in SCREEN space (container points), not raw lat/lon, so
// street-grid view (map rotated -29°) puts the inset in the corner the person
// actually appears toward. Trig fallback if the projection can't answer.
function pipCornerFor(loc) {
  try {
    const h = _hobokenMap.latLngToContainerPoint([HOME.lat, HOME.lon]);
    const p = _hobokenMap.latLngToContainerPoint([loc.lat, loc.lon]);
    if (isFinite(h.x) && isFinite(h.y) && isFinite(p.x) && isFinite(p.y)) {
      return (p.y < h.y ? 't' : 'b') + (p.x < h.x ? 'l' : 'r');
    }
  } catch (e) {}
  return (loc.lat >= HOME.lat ? 't' : 'b') + (loc.lon >= HOME.lon ? 'r' : 'l');
}

// Compact age for the chip under an inset face. agoText() stops at hours, which
// would render a two-day-old Tile fix as "50h ago"; with no cutoff on the insets
// that case is now reachable, so this one carries days.
function pipAgeText(receivedAt) {
  if (!receivedAt) return 'no fix';
  const sec = Math.max(0, Math.floor(Date.now() / 1000 - receivedAt));
  if (sec < 60)    return sec + 's';
  if (sec < 3600)  return Math.floor(sec / 60) + 'm';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h';
  return Math.floor(sec / 86400) + 'd';
}

// Close enough to read the block when they're local, wide enough to say
// "Boston" when they're not.
function pipZoom(mi) {
  if (mi <= 1)   return 15;
  if (mi <= 3)   return 14;
  if (mi <= 8)   return 13;
  if (mi <= 25)  return 11;
  if (mi <= 80)  return 9;
  if (mi <= 300) return 7;
  return 5;
}

// Who earns an inset. ONE definition, because the pill row keys off it too:
// anyone with a box is described there and is dropped from the pills.
// No staleness cutoff on purpose (Jeff, 2026-08-01) — the girls' Tiles don't
// update overnight, so a 13h-old fix can be the freshest thing that exists for
// them; the age rides on the face instead (see .pip-person).
//
// The one real test is the frame: a box exists to show someone the main map
// can't, so anyone the main map DOES show is disqualified — a box for them is
// a second copy of a dot already on screen. That used to be approximated with
// at-home / in-Hoboken / 2-block rules that quietly disagreed with the actual
// auto-fit (Juno 0.2 mi out on a walk took a whole corner, and so did anyone
// between there and the 5 mi fit edge). planMapFrame() now answers it exactly.
function hasAwayInset(l, framed) {
  if (!hasFix(l)) return false;
  if (isAtHome(l)) return false;
  return !framed.has(l.tid);
}

// How many boxes can be up at once, and how far apart two people can be and
// still share one. Three is the realistic ceiling for this house (the girls'
// Tiles report identical coordinates so they always merge, and Juno is home) —
// a fourth box would wall off 88% of the card's height on both edges. Anyone
// who doesn't get a box isn't dropped: they fall back to the pill row, which
// since 2026-08-01 exists precisely for away people without one.
const MAX_PIPS = 3;
const PIP_SPREAD_MAX_MI = 25;

// Decides who gets a box and where. Pure — returns the assignment rather than
// touching the DOM, because renderLocations() needs it BEFORE it builds the
// pill row (a person with a box is dropped from the pills).
function planAwayInsets(locations, framed) {
  const groups = { tl: [], tr: [], bl: [], br: [] };
  const shown = new Set();
  const inFrame = framed || planMapFrame(locations).framed;
  const cands = (locations || []).filter(function (l) {
    return hasAwayInset(l, inFrame);
  }).map(function (l) {
    return {
      loc: l,
      age: l.received_at ? (Date.now() / 1000 - l.received_at) : Infinity,
      dist: distMi(HOME, l),
      corner: pipCornerFor(l),
    };
  });
  // Fresh beats stale, then farther first: a live fix answers "where are they
  // NOW", and among equally live people the distant one is the news.
  cands.sort(function (a, b) {
    const fa = a.age < 1800 ? 0 : 1;
    const fb = b.age < 1800 ? 0 : 1;
    if (fa !== fb) return fa - fb;
    return b.dist - a.dist;
  });
  let corners = 0;
  cands.forEach(function (c) {
    const g = groups[c.corner];
    if (!g.length) {
      if (corners >= MAX_PIPS) return;   // budget spent — this one gets a pill
      corners++;
      g.push(c.loc);
      shown.add(c.loc.tid);
      return;
    }
    // Share a box only with someone actually nearby. Midtown and Boston are
    // both "north-east"; one box fitted to both zooms out to a scale that
    // shows neither. The far one falls to the pill row instead.
    if (distMi(g[0], c.loc) <= PIP_SPREAD_MAX_MI) {
      g.push(c.loc);
      shown.add(c.loc.tid);
    }
  });
  return { groups: groups, shown: shown };
}

function renderAwayInsets(locations, plan) {
  if (!_hobokenMap) return;
  const p = plan || planAwayInsets(locations);
  let n = 0;
  PIP_CORNERS.forEach(function (c) { if (p.groups[c].length) n++; });
  const shrink = n >= 3;
  const resized = shrink !== _pipShrunk;
  _pipShrunk = shrink;
  document.body.classList.toggle('pips-3', shrink);
  PIP_CORNERS.forEach(function (c) { renderPip(c, p.groups[c]); });
  // The boxes just changed size under Leaflet's feet; maps that already
  // existed measured the old ones.
  if (resized) {
    Object.keys(_pipMaps).forEach(function (c) { _pipMaps[c].map.invalidateSize(); });
  }
}

function createPipMap(corner) {
  if (typeof L === 'undefined') return null;
  // Inert on purpose — the remote drives the main map only, and a pan that
  // nobody can undo would strand the box on the wrong place for days.
  const map = L.map('pipmap-' + corner, {
    // rotateControl: leaflet-rotate adds a compass button by default, and four
    // of them stamped into the corners of four tiny maps is pure noise.
    zoomControl: false, attributionControl: false, rotateControl: false,
    dragging: false, keyboard: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false, touchZoom: false,
    zoomAnimation: false, fadeAnimation: false, inertia: false,
  }).setView([HOME.lat, HOME.lon], 13);
  L.tileLayer(MAP_TILE_URL, { maxZoom: 22, subdomains: 'abcd', attribution: '' }).addTo(map);
  const ctx = _pipMaps[corner] = { map: map, markers: {} };
  // Deferred, so it can outlive the box: a corner that fills and empties inside
  // the same tick (two polls landing back to back) tore the map down first, and
  // this fired into a removed Leaflet instance — an uncaught TypeError on the
  // wall every time someone's box flickered. Only measure a map still in use.
  setTimeout(function () {
    if (_pipMaps[corner] && _pipMaps[corner].map === map) map.invalidateSize();
  }, 0);
  return ctx;
}

function renderPip(corner, people) {
  const box = document.getElementById('pip-' + corner);
  if (!box) return;
  if (!people.length) {
    box.classList.remove('on');
    document.body.classList.remove('has-pip-' + corner);
    const emptyLabel = document.getElementById('pipplace-' + corner);
    if (emptyLabel) emptyLabel.textContent = '';   // don't keep a dead place name
    // Tear the map down rather than parking it hidden — this page runs for
    // days between reloads and a hidden Leaflet instance keeps its tiles.
    if (_pipMaps[corner]) {
      _pipMaps[corner].map.remove();
      delete _pipMaps[corner];
    }
    return;
  }
  // Show the box BEFORE creating the map: Leaflet measures a display:none
  // element as 0×0 and never recovers on its own.
  box.classList.add('on');
  document.body.classList.add('has-pip-' + corner);
  const ctx = _pipMaps[corner] || createPipMap(corner);
  if (!ctx) return;

  // Name the place: the geofence name if the fix carries one ("Abujia"),
  // otherwise the proxy's city. De-duplicated, because the usual case is two
  // people at the SAME place and "Abujia · Abujia" is noise.
  const label = document.getElementById('pipplace-' + corner);
  if (label) {
    const names = [];
    people.forEach(function (l) {
      const n = l.place || l.city;
      if (n && names.indexOf(n) === -1) names.push(n);
    });
    label.textContent = names.join(' · ');
  }

  // Co-located people stack into one dot and hide each other — the girls' two
  // Tiles report the EXACT same lat/lon (verified live 2026-08-01: both at
  // 40.8743,-74.1946), so without this the box shows one face and silently
  // drops the other. The main map fans them into a lat/lon ring; here the fan
  // is in PIXELS via iconAnchor, because the ring radius that separates faces
  // at the wall map's zoom is sub-pixel at an inset's.
  const fanDx = {};
  const fanned = new Set();
  people.forEach(function (a) {
    if (fanned.has(a.tid)) return;
    const group = people.filter(function (b) {
      return !fanned.has(b.tid) && distMi(a, b) < OVERLAP_MI;
    });
    group.forEach(function (b, i) {
      fanned.add(b.tid);
      fanDx[b.tid] = (i - (group.length - 1) / 2) * 30;
    });
  });

  const seen = new Set();
  people.forEach(function (l) {
    seen.add(l.tid);
    const ageSec = l.received_at ? (Date.now() / 1000 - l.received_at) : Infinity;
    let staleClass = '';
    if (!l.received_at || ageSec >= 10800) staleClass = ' stale-cold';
    else if (ageSec >= 1800)               staleClass = ' stale-warm';
    else if (ageSec >= 180)                staleClass = ' stale-recent';
    const icon = L.divIcon({
      className: 'pip-person' + staleClass,
      html: '<div class="pf-face">' + faceMarkerHtml(l) + '</div>' +
            '<div class="pf-age">' + pipAgeText(l.received_at) + '</div>',
      // Anchor on the FACE's centre, not the icon's — the age line hangs below
      // it, and anchoring on the middle of the pair would float the dot north
      // of where the person actually is. Subtracting the fan offset shifts the
      // icon visually RIGHT (same trick as the at-home orbit).
      iconSize: [56, 46],
      iconAnchor: [28 - (fanDx[l.tid] || 0), 14],
    });
    if (ctx.markers[l.tid]) {
      ctx.markers[l.tid].setLatLng([l.lat, l.lon]);
      ctx.markers[l.tid].setIcon(icon);
    } else {
      ctx.markers[l.tid] = L.marker([l.lat, l.lon], { icon: icon, zIndexOffset: 10000 }).addTo(ctx.map);
    }
  });
  Object.keys(ctx.markers).forEach(function (tid) {
    if (seen.has(tid)) return;
    ctx.map.removeLayer(ctx.markers[tid]);
    delete ctx.markers[tid];
  });

  if (people.length === 1) {
    ctx.map.setView([people[0].lat, people[0].lon],
      pipZoom(distMi(HOME, people[0])), { animate: false });
  } else {
    // Two people in the same direction share one box.
    const lats = people.map(function (p) { return p.lat; });
    const lons = people.map(function (p) { return p.lon; });
    ctx.map.fitBounds(
      [[Math.min.apply(null, lats), Math.min.apply(null, lons)],
       [Math.max.apply(null, lats), Math.max.apply(null, lons)]],
      { padding: [22, 22], maxZoom: 14, animate: false });
  }
}

// ============================================================
// ALERTS
// ============================================================
async function fetchAlerts() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(PROXY_URL + '?mode=alerts');
    const data = await res.json();
    markOk('alerts');
    const container = document.getElementById('alertsList');
    let items = [];

    // Only NJT alerts that mention routes/services the family rides (126, 119, ferry).
    // Nixle and broader NJT system-wide noise are filtered out by default.
    const RELEVANT_KEYWORDS = /\b(126|119|ferry|hoboken|all bus|systemwide)\b/i;
    // Long-running advisories (months-long detours) sit in the RSS feed
    // forever — after 2 days they're wallpaper, not news (Jeff, 2026-07-26).
    // An unparseable/missing pubDate keeps the alert (fail-open: better a
    // stale alert than a silently dropped fresh one).
    const MAX_ALERT_AGE_MS = 2 * 24 * 3600 * 1000;
    if (Array.isArray(data.njt_alerts)) {
      for (const a of data.njt_alerts) {
        if (a.error) continue;
        const posted = Date.parse(a.pubDate || '');
        if (isFinite(posted) && Date.now() - posted > MAX_ALERT_AGE_MS) continue;
        const text = a.description || a.title || '';
        if (!RELEVANT_KEYWORDS.test(text)) continue;
        items.push({ text: text, badge: 'njt', badgeText: 'NJT', isAlert: true });
      }
    }

    // Alerts only — no news, no stocks
    const divider = document.querySelector('.cal-alert-divider');
    if (items.length === 0) {
      container.innerHTML = '';
      container.style.display = 'none';
      if (divider) divider.style.display = 'none';
    } else {
      container.style.display = 'flex';
      if (divider) divider.style.display = 'block';
      let html = '';
      for (const item of items) {
        html += `<div class="alert-item is-alert">`;
        html += `<span class="alert-badge ${item.badge}">${item.badgeText}</span>`;
        html += item.text;
        html += '</div>';
      }
      container.innerHTML = html;
      requestAnimationFrame(() => trimOverflow(container));
    }
  } catch (e) {
    console.error('Alerts fetch error:', e);
    markFail('alerts');
  }
}

// ============================================================
// CALENDAR (private ICS feed via proxy, token stored per-device)
// ============================================================
function initCalAuth() {
  watchCalendarResize();
  if (IS_LOCAL) {
    // Caddy injects the token — never prompt on local origins.
    document.getElementById('calSigninPrompt').style.display = 'none';
    fetchCalEvents();
    return;
  }
  const token = localStorage.getItem('calToken');
  if (!token) {
    showCalTokenPrompt();
    return;
  }
  document.getElementById('calSigninPrompt').style.display = 'none';
  fetchCalEvents();
}

function showCalTokenPrompt() {
  const c = document.getElementById('calContent');
  c.innerHTML =
    '<div class="cal-signin-prompt">' +
    '<div style="margin-bottom:10px;">Enter calendar token:</div>' +
    '<input id="calTokenInput" type="password" autocomplete="off" ' +
    'style="background:#1a1a2a;border:0.5px solid #2a2a35;border-radius:6px;' +
    'color:#fff;padding:8px 12px;font-size:var(--fs-body);width:80%;outline:none;" />' +
    '<div><button class="cal-signin-btn" onclick="saveCalToken()">Save</button></div>' +
    '</div>';
  setTimeout(function () {
    const inp = document.getElementById('calTokenInput');
    if (inp) inp.focus();
  }, 100);
}

function saveCalToken() {
  const inp = document.getElementById('calTokenInput');
  if (!inp || !inp.value.trim()) return;
  localStorage.setItem('calToken', inp.value.trim());
  initCalAuth();
}

function resetCalendarChoice() {
  // Triggered by double-click on calendar title — clear the saved token so the user
  // can re-enter it. To actually switch to a different calendar's ICS feed,
  // update the CALENDAR_ICS_URL env var on Cloud Run.
  if (confirm('Reset calendar token? You will need to re-enter it.')) {
    localStorage.removeItem('calToken');
    initCalAuth();
  }
}

async function fetchCalEvents() {
  if (document.hidden || isSleeping()) return;
  const token = localStorage.getItem('calToken') || '';
  try {
    // Token via header (not query string) to avoid URL logging
    const res = await fetchT(PROXY_URL + '?mode=calendar',
      { headers: { 'X-Cal-Token': token } });
    if (res.status === 403) {
      if (IS_LOCAL) {
        // Local origins never use a typed token — a 403 here means Caddy's
        // CAL_TOKEN env is broken or this browser isn't on the /proxy
        // allowlist (TV stick + tailnet). Prompting would be misleading.
        markFail('calendar');
        document.getElementById('calEvents').innerHTML =
          '<div class="cal-empty">Calendar blocked (proxy auth)</div>';
        return;
      }
      // Bad token — re-prompt
      localStorage.removeItem('calToken');
      showCalTokenPrompt();
      return;
    }
    const data = await res.json();
    if (data.events && Array.isArray(data.events)) {
      markOk('calendar');
      renderCalEvents(data.events);
    } else if (data.events && data.events.error) {
      markFail('calendar');
      document.getElementById('calEvents').innerHTML =
        '<div class="cal-empty">Calendar error</div>';
      console.error('Calendar error:', data.events.error);
    }
  } catch (e) {
    markFail('calendar');
    console.error('Calendar fetch error:', e);
  }
}

function renderCalEvents(events) {
  const container = document.getElementById('calEvents');
  if (!events || events.length === 0) {
    container.innerHTML = '<div class="cal-empty">No upcoming events</div>';
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);

  // Today as YYYY-MM-DD for cross-day comparisons
  const todayStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  function fmtMonthDay(dateStr) {
    // dateStr is YYYY-MM-DD; render as "May 25"
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function daysBetween(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }

  // Normalize ICS-feed format. Preserve start, end, allDay.
  // Compute display anchor date: if a multi-day event is happening today,
  // anchor to today instead of its original start.
  events = events.map(function (e) {
    const isAllDay = !!e.allDay || /^\d{4}-\d{2}-\d{2}$/.test(e.start || '');
    const startStr = e.start || '';
    const endStr = e.end || '';
    let anchorDate;
    if (isAllDay) {
      // ICS DTEND is exclusive — a multi-day all-day event runs [start, end)
      const isMultiDay = endStr && daysBetween(startStr, endStr) > 1;
      const lastDayInclusive = isMultiDay
        ? new Date(new Date(endStr + 'T00:00:00').getTime() - 86400000)
            .toISOString().substring(0, 10)
        : startStr;
      // If today falls within [start, lastDayInclusive], anchor to today
      if (startStr <= todayStr && todayStr <= lastDayInclusive) {
        anchorDate = todayStr;
      } else {
        anchorDate = startStr;
      }
      return {
        summary: e.summary,
        location: e.location || '',
        start: { date: startStr },
        end: { date: endStr },
        isMultiDay: isMultiDay,
        lastDay: lastDayInclusive,
        anchorDate: anchorDate,
        _calendarColor: '#6bffb8',
      };
    } else {
      const d = new Date(e.start);
      const startDay = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      let lastDay = startDay;
      if (e.end) {
        const de = new Date(e.end);
        lastDay = de.getFullYear() + '-' +
          String(de.getMonth() + 1).padStart(2, '0') + '-' +
          String(de.getDate()).padStart(2, '0');
      }
      // A timed event that started before today but is still ongoing (the
      // proxy only sends events overlapping now→+30d) must anchor to today,
      // or its past start date sorts a day group above the TODAY header.
      anchorDate = (startDay < todayStr) ? todayStr : startDay;
      return {
        summary: e.summary,
        location: e.location || '',
        start: { dateTime: e.start },
        end: e.end ? { dateTime: e.end } : null,
        isMultiDay: lastDay > startDay,
        startDay: startDay,
        lastDay: lastDay,
        anchorDate: anchorDate,
        _calendarColor: '#6bffb8',
      };
    }
  });

  // Group by anchor date
  const byDate = {};
  for (const ev of events) {
    if (!ev.anchorDate) continue;
    if (!byDate[ev.anchorDate]) byDate[ev.anchorDate] = [];
    byDate[ev.anchorDate].push(ev);
  }

  // Always render the TODAY header (with the live clock + commute line),
  // even if there are no events today.
  if (!byDate[todayStr]) byDate[todayStr] = [];

  const dateKeys = Object.keys(byDate).sort();
  let html = '';
  for (const dateKey of dateKeys) {
    const date = new Date(dateKey + 'T12:00:00');
    const isToday = date.toDateString() === today.toDateString();
    const isTomorrow = date.toDateString() === tomorrow.toDateString();

    let dayLabel;
    let cls = 'is-future';
    if (isToday) {
      // Start with the long form. _autoFitTodayHeader() runs after paint
      // and progressively shrinks (long → short weekday → short month) if
      // the label overflows the clock. So most days you see the big
      // "WEDNESDAY, MAY 27" — only the longest cases (e.g.
      // "WEDNESDAY, DECEMBER 31") fall back to short forms.
      dayLabel = date.toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric'
      }).toUpperCase();
      cls = 'is-today';
    }
    else if (isTomorrow) dayLabel = 'TOMORROW';
    else dayLabel = date.toLocaleDateString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric'
    }).toUpperCase();

    let timeHtml = '';
    if (isToday) {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      timeHtml = '<span class="cal-header-time">' + h12 + ':' + m + ' ' + ampm + '</span>';
    }
    html += '<div class="cal-day-header ' + cls + '">' + dayLabel + timeHtml + '</div>';

    // Morning commute estimates sit as child lines under the TODAY header
    // (one per family commuter). updateCommuteEstimate() populates this
    // container with one .cal-commute div per person each tick. Outside
    // the Mon-Fri 7:00-10:30 AM window, container stays empty.
    if (isToday) {
      html += '<div id="commuteContainer"></div>';
    }

    for (const ev of byDate[dateKey]) {
      let timeLabel = '';
      let evCls = 'cal-event';
      if (ev.start.date) {
        evCls += ' all-day';
        // Only show a label if it's a multi-day event (date range). Single-day
        // all-day events don't need "(All day)" — the day header above implies it.
        if (ev.isMultiDay) {
          timeLabel = fmtMonthDay(ev.start.date) + ' - ' + fmtMonthDay(ev.lastDay);
        }
      } else if (ev.startDay && ev.startDay < ev.anchorDate) {
        // Ongoing timed event that started before today — its start time is
        // stale under the TODAY header, so show the date range instead.
        timeLabel = fmtMonthDay(ev.startDay) + ' - ' + fmtMonthDay(ev.lastDay);
      } else {
        const startDate = new Date(ev.start.dateTime);
        const h = startDate.getHours();
        const m = String(startDate.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        timeLabel = h12 + ':' + m + ' ' + ampm;
      }
      const title = (ev.summary || '(no title)').replace(/</g, '&lt;');
      const timeHtml = timeLabel ? '<span class="cal-event-time">(' + timeLabel + ')</span>' : '';

      // "Leave by X" only for timed events with a location, within the next 24h.
      let leaveHtml = '';
      if (ev.location && ev.start.dateTime) {
        const eventMs = new Date(ev.start.dateTime).getTime();
        const hrsUntil = (eventMs - Date.now()) / 3600000;
        if (hrsUntil > 0 && hrsUntil < 24) {
          // Heuristic mode: city (NYC) → bus; otherwise drive
          const isNYC = /\b(NY|NYC|New York|Manhattan)\b/i.test(ev.location);
          const travelMin = isNYC ? 45 : 20;
          // "transit" not "126/119": this is a rough fixed-time estimate, not a
          // checked live departure — don't name a route that may not be running
          // (e.g. a weekend/holiday/late-night event).
          const mode = isNYC ? 'transit' : 'drive';
          const leaveMs = eventMs - travelMin * 60000;
          const leaveDate = new Date(leaveMs);
          const lh = leaveDate.getHours();
          const lm = String(leaveDate.getMinutes()).padStart(2, '0');
          const lampm = lh >= 12 ? 'PM' : 'AM';
          const lh12 = lh % 12 || 12;
          const leaveStr = lh12 + ':' + lm + ' ' + lampm;
          leaveHtml = '<div class="cal-leave-by">Leave ~' + leaveStr +
            ' <span class="cal-leave-mode">(' + mode + ')</span></div>';
        }
      }
      html += '<div class="' + evCls + '">' + title + timeHtml + leaveHtml + '</div>';
    }
  }
  container.innerHTML = html;
  // The commute line is rendered hidden inline; reveal/update immediately so
  // there's no 1s flicker waiting for the next clock tick.
  if (typeof updateCommuteEstimate === 'function') updateCommuteEstimate();
  // After paint, trim trailing items / orphan day headers until everything fits cleanly.
  // Use double-rAF + setTimeout to make sure layout has settled before measuring.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      _autoFitTodayHeader();
      setTimeout(trimCalendarOverflow, 30);
    });
  });
}

// Today's day-header tries long forms first (WEDNESDAY, DECEMBER 31). If
// the label + clock overflow the calendar's width, shrink in steps:
// long-weekday→short-weekday→short-month. Keeps the big text when it fits,
// gracefully degrades when it doesn't.
function _autoFitTodayHeader() {
  const header = document.querySelector('#calContent .cal-day-header.is-today');
  if (!header) return;
  const timeSpan = header.querySelector('.cal-header-time');
  const timeHtml = timeSpan ? timeSpan.outerHTML : '';
  const realTime = timeSpan ? timeSpan.textContent : '';
  const today = new Date();
  const FORMATS = [
    { weekday: 'long',  month: 'long',  day: 'numeric' }, // WEDNESDAY, DECEMBER 31
    { weekday: 'short', month: 'long',  day: 'numeric' }, // WED, DECEMBER 31
    { weekday: 'short', month: 'short', day: 'numeric' }, // WED, DEC 31
  ];
  // Measure against the WIDEST clock string, not the current one: this only
  // runs on calendar render (every 5 min), but the clock ticks every minute
  // and "9:59 AM" → "10:00 AM" grows a digit. A label chosen at 9:59 would
  // otherwise crowd the clock at 10:00.
  const WIDEST_CLOCK = '12:00 PM';
  let chosen = FORMATS[FORMATS.length - 1];
  for (const fmt of FORMATS) {
    const label = today.toLocaleDateString('en-US', fmt).toUpperCase();
    header.innerHTML = label + timeHtml;
    const probe = header.querySelector('.cal-header-time');
    if (probe) probe.textContent = WIDEST_CLOCK;
    // 1px slack for sub-pixel rounding. scrollWidth > clientWidth means
    // content overflowed the header's content box even with nowrap.
    if (header.scrollWidth <= header.clientWidth + 1) { chosen = fmt; break; }
  }
  // All formats overflow (unlikely) — shortest stays applied.
  header.innerHTML = today.toLocaleDateString('en-US', chosen).toUpperCase() + timeHtml;
  const restored = header.querySelector('.cal-header-time');
  if (restored) restored.textContent = realTime;
}

function trimCalendarOverflow() {
  const container = document.getElementById('calEvents');
  const scrollParent = document.getElementById('calContent');
  if (!container || !scrollParent) return;
  let safety = 300;
  while (safety-- > 0 && container.lastElementChild) {
    const overflow = scrollParent.scrollHeight > scrollParent.clientHeight + 1;
    const lastIsHeader = container.lastElementChild.classList.contains('cal-day-header');
    if (!overflow && !lastIsHeader) break;
    container.removeChild(container.lastElementChild);
  }
}

// Re-trim the calendar whenever its container resizes (e.g. when alerts panel
// grows below it and reduces available height).
let _calResizeObserver = null;
function watchCalendarResize() {
  if (_calResizeObserver || typeof ResizeObserver === 'undefined') return;
  const target = document.getElementById('calContent');
  if (!target) return;
  let _lastCalHeight = target.clientHeight;
  _calResizeObserver = new ResizeObserver(function () {
    const h = target.clientHeight;
    if (h < _lastCalHeight - 4) {
      // Panel shrank — trim trailing events that no longer fit
      trimCalendarOverflow();
    } else if (h > _lastCalHeight + 20) {
      // Panel grew significantly — re-render so we use the new space
      fetchCalEvents();
    }
    _lastCalHeight = h;
  });
  _calResizeObserver.observe(target);
}

// ============================================================
// INIT
// ============================================================
function updateTransit() {
  if (PROXY_URL) {
    fetchProxy();
  } else {
    updateBusStatic();
  }
  updateFerries();
  fetchHop();
}

// ============================================================
// SLEEP MODE — black screen midnight to 7am (also pauses animations + polls)
// ============================================================
function isSleeping() {
  const h = new Date().getHours();
  return h >= 1 && h < 7;
}

// When the TV turns off, the streaming stick suspends the browser tab; when
// it turns back on, JS resumes but the next scheduled poll could be up to
// 15s away (or longer for transit/weather). Without this handler the family
// stares at the last-rendered frame from before the suspension — Jenny at
// home even though she's actually at work.
//
// Force a one-shot refresh of every data source the moment the tab regains
// visibility. Throttled to once per 3s so multiple visibility events in
// quick succession (TV flicker, dev tools docking, etc.) don't hammer the
// proxy.
let _lastVisibilityRefresh = 0;
function _forceFullRefresh() {
  const now = Date.now();
  if (now - _lastVisibilityRefresh < 3000) return;
  _lastVisibilityRefresh = now;
  try { updateTransit    && updateTransit();    } catch (e) {}
  try { updateWeather    && updateWeather();    } catch (e) {}
  try { fetchAlerts      && fetchAlerts();      } catch (e) {}
  try { fetchLocations   && fetchLocations();   } catch (e) {}
  try { updateFerries    && updateFerries();    } catch (e) {}
  try { fetchHop         && fetchHop();         } catch (e) {}
  try { fetchCalEvents   && fetchCalEvents();   } catch (e) {}
  try { fetchWallMessage && fetchWallMessage(); } catch (e) {}
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && !isSleeping()) {
    _forceFullRefresh();
  }
});

// pageshow with persisted=true fires when the page is restored from the
// back-forward cache (bfcache) — common on Android TV / Onn / Fire TV when
// the streaming stick resumes a suspended browser session.
window.addEventListener('pageshow', function (e) {
  if (e.persisted && !isSleeping()) _forceFullRefresh();
});

// window focus is a backstop for the rare case where visibilitychange
// doesn't fire (some embedded browsers).
window.addEventListener('focus', function () {
  if (!document.hidden && !isSleeping()) _forceFullRefresh();
});

let _wasSleeping = false;
function checkSleepMode() {
  const sleeping = isSleeping();
  document.body.style.visibility = sleeping ? 'hidden' : 'visible';
  document.body.style.background = sleeping ? '#000' : '#0a0a0f';
  document.body.classList.toggle('sleeping', sleeping);
  // Sleep → wake transition: force a one-shot refresh of every feed so the
  // family doesn't see stale "last night" data for up to 15s after 7 AM.
  // Fade-in via opacity so the screen doesn't pop on.
  if (_wasSleeping && !sleeping) {
    try { updateTransit && updateTransit(); } catch (e) {}
    try { updateWeather && updateWeather(); } catch (e) {}
    try { fetchAlerts && fetchAlerts(); } catch (e) {}
    try { fetchLocations && fetchLocations(); } catch (e) {}
    try { updateFerries && updateFerries(); } catch (e) {}
    try { fetchHop && fetchHop(); } catch (e) {}
    document.body.style.opacity = '0';
    requestAnimationFrame(function () {
      document.body.style.transition = 'opacity 600ms ease';
      document.body.style.opacity = '1';
    });
  }
  _wasSleeping = sleeping;
}

// LATE MODE — hide bus + ferry, expand map to full height.
// Weekdays after 5pm, weekends after 9pm.
function isLateMode() {
  const now = new Date();
  const day = now.getDay();   // 0=Sun, 6=Sat
  const hour = now.getHours();
  // Always considered "late" before 5 AM — panels reappear at 5 AM.
  if (hour < 5) return true;
  // Weekday evenings: hide from 5 PM onward.
  if (day >= 1 && day <= 5) return hour >= 17;
  // Weekend evenings: hide from 9 PM onward.
  return hour >= 21;
}
function applyLateMode() {
  document.body.classList.toggle('late-mode', isLateMode());
  if (_hobokenMap) _hobokenMap.invalidateSize();
}

updateClock();
updateTransit();
updateWeather();
fetchAlerts();
checkSleepMode();
applyLateMode();
setInterval(applyLateMode, 60000);
initCalAuth();
setInterval(fetchCalEvents, 5 * 60 * 1000); // refresh calendar every 5 min
setInterval(updateClock, 1000);
setInterval(checkSleepMode, 60000);
setInterval(updateStatusBar, 10000);
updateStatusBar();
setInterval(updateTransit, 15000);
setInterval(pollBusFeed, BUS_FEED_POLL_MS);
pollBusFeed();   // also starts bus-feed's NJT polling, so data is ready by the next tick
setInterval(updateWeather, 600000);
setInterval(fetchAlerts,   300000);

// ============================================================
// WALL MESSAGE
// ============================================================
// A note Jeff or Jenny types at http://192.168.1.183/message.html (home WiFi,
// no Tailscale needed). Served by wall-message.service via Caddy. LOCAL ONLY:
// the GitHub Pages fallback has no /api/message route, so we never even try
// there — a 404 every 20s would be noise, not information.
function fetchWallMessage() {
  if (!IS_LOCAL) return;
  if (document.hidden || isSleeping()) return;
  fetch('/api/message', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      const box = document.getElementById('wallMsg');
      if (!box) return;
      const text = data && data.message;
      // Frame mode hides the panel this normally lives in, so the note is
      // mirrored onto the mat — a message nobody sees is worse than a mat with
      // something on it.
      const fm = document.getElementById('frameMsg');
      if (!text) {
        box.hidden = true;
        if (fm) fm.textContent = '';
        document.body.classList.remove('has-wall-msg');
        return;
      }
      document.getElementById('wallMsgText').textContent = text;
      document.getElementById('wallMsgFrom').textContent = data.sender ? '— ' + data.sender : '';
      if (fm) fm.textContent = text + (data.sender ? '   — ' + data.sender : '');
      box.hidden = false;
      document.body.classList.add('has-wall-msg');
    })
    .catch(function () { /* fail soft — a missing note must never break the wall */ });
}
fetchWallMessage();
setInterval(fetchWallMessage, 20000);

// ============================================================
// PANEL LAYOUT — automatic, overridable from the phone
// ============================================================
// Two inputs decide what the wall shows:
//   1. `/api/wall-config` — what the phone last set. `main:"auto"` hands the
//      decision back to the rules below; "map"/"art" pin it.
//   2. The rules: when EVERYONE is home and it is not a commute window, the
//      map is telling you nothing you don't already know, so the slot becomes
//      the kids' artwork instead.
// LOCAL ONLY, like the wall message — the Pages fallback has neither endpoint.
let _wallCfg = {main: 'auto', hidden: []};
let _everyoneHome = false;      // set by renderLocations() via setEveryoneHome()

// Everyone-home has to SETTLE before auto hands the wall over to Frame/art
// (Jeff, 2026-09-01). The switch used to fire on the very first poll that saw
// the last person arrive, so walking in the door blanked the dashboard while
// you were still putting your bag down. The state now has to HOLD for
// EVERYONE_HOME_SETTLE_MS before auto acts on it.
//
// The delay is deliberately ONE-SIDED: slow to hide the dashboard, instant to
// bring it back. The moment anyone leaves, _everyoneHome goes false, the timer
// clears, and autoMain() returns 'map' on the very next poll — nobody waits
// 5 minutes to find out where someone is.
//
// Persisted so an ordinary reload (the nightly one, or a remote cache-clear
// after a deploy) doesn't restart the wait and strand the wall on 'map' when
// everyone has in fact been home for hours. Only a stamp in the past is
// trusted; anything else falls back to "the clock starts now".
const EVERYONE_HOME_SETTLE_MS = 5 * 60 * 1000;
let _everyoneHomeSince = 0;

function setEveryoneHome(v){
  if (!v){
    _everyoneHomeSince = 0;
    try { localStorage.removeItem('everyoneHomeSince'); } catch(e){}
  } else if (!_everyoneHomeSince){
    let stored = 0;
    try { stored = parseInt(localStorage.getItem('everyoneHomeSince') || '0', 10) || 0; } catch(e){}
    _everyoneHomeSince = (stored > 0 && stored <= Date.now()) ? stored : Date.now();
    try { localStorage.setItem('everyoneHomeSince', String(_everyoneHomeSince)); } catch(e){}
  }
  _everyoneHome = v;
}

function everyoneHomeSettled(){
  return _everyoneHome && _everyoneHomeSince > 0 &&
         (Date.now() - _everyoneHomeSince) >= EVERYONE_HOME_SETTLE_MS;
}
let _anyoneHome = true;         // set by renderLocations(); starts true so the camera works until locations load
// Current picture is tracked by URL, not by index: /api/artworks is newest-first,
// so any upload or edit reshuffles every index.
let _artIds = [], _artCur = null, _artFetchedAt = 0;
// Jeff (2026-07-29, restated 2026-07-30): every picture gets 12 seconds on
// screen. This is now a FIXED dwell, not a floor — nothing extends it, and the
// comment ticker fits itself into the window instead (see renderTicker).
const ART_DWELL_MS = 12000;
// Near-realtime, so a new upload or an edited artist name lands almost at once.
// /api/artworks is local (Caddy -> artwork-api on this box), so this is cheap.
const ART_ROSTER_MS = 15000;
// Recency bias: 5-day half-life, with a floor so older pieces still come round
// instead of being buried forever.
const ART_HALF_LIFE_DAYS = 5;
const ART_MIN_WEIGHT = 0.06;
let _artTimer = null;
// New arrivals waiting for their turn, newest first. Anything that appears in
// the roster having never been seen goes in here, and nextArt() drains it
// BEFORE the weighted random resumes — so "a new picture always comes up next"
// holds even when several land at once, or when one lands while the previous
// new one is still on screen (Jeff, 2026-07-30). Before this only ONE new piece
// was jumped to and the rest were left to chance.
let _artNewQueue = [];

function inCommuteWindow(){
  const d = new Date(), day = d.getDay();
  if (day === 0 || day === 6) return false;
  const m = d.getHours() * 60 + d.getMinutes();
  return (m >= 7*60 && m <= 10*60+30) || (m >= 16*60+30 && m <= 20*60);
}

// What "auto" resolves to, in one place so it is easy to argue with later.
// Returns a mode name rather than a boolean, because there are now three
// destinations and applyWallConfig() should only have to APPLY the answer.
//
// Jeff (2026-08-02), in two steps: auto's off-commute destination moved from
// the artwork PANEL to full-screen Frame — then weekend daytime moved back to
// the panel, because Frame hides the clock, weather and calendar and on a lazy
// Saturday he wants those. So Frame is the evening/weekday gesture; the weekend
// day keeps a readable dashboard with the artwork in the map slot.
//
// isLateMode() is reused as the day/evening line rather than a new constant: it
// is the display's existing one (weekends flip at 9 PM, and anything before
// 5 AM counts as late), and it already governs whether panels are on screen.
function autoMain(){
  const now = new Date();
  const day = now.getDay();
  const weekend = day === 0 || day === 6;
  // Everyone home from our commutes after 7 PM on a weekday → Frame, even inside
  // the evening commute window (16:30-20:00) that would otherwise show the map
  // (Jeff, 2026-08-20). The window returns 'map' to show who's still heading
  // home; once nobody is still out that map has nothing to say, so go straight
  // to Frame instead of waiting for the window to end at 8 PM. Sits BEFORE the
  // commute-window test so it wins. Weekday-only on purpose — weekends keep the
  // readable 'art' dashboard until 9 PM (isLateMode), unchanged.
  // everyoneHomeSettled(), not _everyoneHome: the last arrival has to have been
  // home for EVERYONE_HOME_SETTLE_MS before the dashboard gives way to Frame.
  if (everyoneHomeSettled() && !weekend && now.getHours() >= 19) return 'frame';
  if (!everyoneHomeSettled() || inCommuteWindow()) return 'map';
  if (weekend && !isLateMode()) return 'art';
  // Weekday mornings show the full dashboard, not Frame (Jeff 2026-08-17). On a
  // weekday AM he wants the map/transit/weather glanceable even when everyone's
  // home. Noon is the cutoff; the 7:00-10:30 commute window already returns
  // 'map' above, so this covers 10:30-noon (and pre-7 once the screen is on).
  // Weekday afternoons/evenings still fall through to Frame.
  if (!weekend && now.getHours() < 12) return 'map';
  return 'frame';
}

// The ticker is MOVED between the panel and the mat rather than duplicated, so
// there stays exactly one implementation of it. It has to be re-rendered after
// the move because its scroll duration is computed from the container width and
// the mat is far wider than the map slot — clearing the key forces that.
function moveTicker(toFrame){
  const t = document.getElementById('artTicker');
  const dest = document.getElementById(toFrame ? 'frameMode' : 'artPanel');
  if (t && dest && t.parentNode !== dest) {
    dest.appendChild(t);
    _artCommentsFor = null;
  }
}

function applyWallConfig(){
  const mode = _wallCfg.main;
  // Resolve auto to a real mode first, then apply exactly one of them. "art"
  // and "frame" stay hand-pickable and mean the same thing however they were
  // arrived at: art = artwork in the MAP SLOT with the rest of the dashboard
  // intact, frame = the whole screen.
  const eff = mode === 'auto' ? autoMain() : mode;
  const frame = eff === 'frame';
  // The fish tank is only ever hand-picked; autoMain() never returns it.
  const fish = eff === 'fish';
  // Frame implies show-art: same picture pipeline (ensureArt/renderArt paint
  // #frameImg once frame-mode is on), and frame-mode's CSS hides the rest
  // anyway. Kept as it was so an auto-Frame and a hand-picked Frame are
  // literally the same state.
  const want = frame || eff === 'art';
  const wasShowing = document.body.classList.contains('show-art');
  const wasFrame = document.body.classList.contains('frame-mode');
  const wasFish = document.body.classList.contains('show-fish');
  document.body.classList.toggle('frame-mode', frame);
  document.body.classList.toggle('show-art', !!want);
  document.body.classList.toggle('show-fish', fish);
  if (fish !== wasFish && window.FishTank) {
    if (fish) FishTank.start(document.getElementById('fishPanel'));
    else FishTank.stop();
  }
  if (frame !== wasFrame) { moveTicker(frame); placeCamOverlay(); }
  // Coming back to the MAP from art/frame: #hobokenMap was display:none, so
  // Leaflet could never lay it out and the tiles come up gray even though the
  // face markers are positioned ("map doesn't load fully", Jeff 2026-08-30).
  // Re-measure once the DOM has flipped to block, then re-fit to the family so
  // it renders complete immediately instead of waiting for the next poll.
  if (((wasShowing && !want) || (wasFish && !fish)) && _hobokenMap) {
    setTimeout(function () {
      if (!_hobokenMap) return;
      _hobokenMap.invalidateSize();
      if (_lastLocations && _lastLocations.length) renderLocations(_lastLocations);
    }, 80);
  }
  if (want) {
    ensureArt();
    // Turning art ON restarts the dwell clock, so the first picture gets its
    // full turn instead of inheriting whatever was left of the last timer.
    if (!wasShowing) armArtTimer();
  }
  (_wallCfg.panels || ['mapCard','calCard','weatherCard','busCard','ferryCard'])
    .forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('panel-off', (_wallCfg.hidden || []).indexOf(id) !== -1);
    });
}

function ensureArt(){
  if (Date.now() - _artFetchedAt > ART_ROSTER_MS) {
    _artFetchedAt = Date.now();
    fetch('/api/artworks', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        const list = (d && (d.artworks || d)) || [];
        const prev = _artIds.map(function (x) { return x.url; });
        _artIds = list
          .filter(function (a) { return a && a.status === 'ready' && a.urls; })
          .map(function (a) {
            // NOTE the date field is `created`, NOT `created_at` (that one is
            // null on every record). Getting it wrong silently kills the recency
            // weighting, because everything then looks equally old.
            return {
              url: a.urls.web,
              id: a.id,
              // Carried so the ticker can skip the fetch entirely for a piece
              // nobody has commented on, and re-fetch when the count moves.
              comments: a.comments || 0,
              kid: a.kid,
              title: a.title,
              created: Date.parse(a.created || a.created_at || '') || null
            };
          });
        // Any URL we had not seen before is a new upload. The feed is
        // newest-first, so [0] is the newest -- straight up on screen, and any
        // others queued so they follow it rather than falling back into the
        // random draw.
        const fresh = prev.length
          ? _artIds.filter(function (x) { return prev.indexOf(x.url) === -1; })
          : [];
        if (fresh.length) {
          // Queued newest-first, minus the one going up right now. Anything
          // already waiting stays behind them: a brand new picture outranks a
          // slightly less new one.
          _artNewQueue = fresh.slice(1).map(function (x) { return x.url; })
            .concat(_artNewQueue.filter(function (u) {
              return u !== fresh[0].url;
            }));
          _artCur = fresh[0].url;
          renderArt();
          armArtTimer();
        } else {
          // No new picture, but a title or artist may have been edited -- still
          // re-render, which refreshes the caption in place.
          renderArt();
        }
      })
      .catch(function () { /* fail soft: the map simply stays */ });
  } else renderArt();
}

// Strongly favour recent work without ever fully retiring the old stuff.
function artWeight(a){
  if (!a.created) return ART_MIN_WEIGHT;
  const days = Math.max(0, (Date.now() - a.created) / 86400000);
  return Math.max(ART_MIN_WEIGHT, Math.pow(0.5, days / ART_HALF_LIFE_DAYS));
}

// "Fireworks - Sydney - Jul 28". No name at all when kid === 'both' (Jeff's
// call); the date is always shown.
function artLabel(a){
  const who = (a.kid && a.kid !== 'both')
    ? a.kid.charAt(0).toUpperCase() + a.kid.slice(1) : '';
  const when = a.created
    ? new Date(a.created).toLocaleDateString('en-US', {month: 'short', day: 'numeric'})
    : '';
  return [a.title, who, when].filter(Boolean).join(' \u2014 ');
}

function currentArt(){
  if (!_artIds.length) return null;
  const hit = _artIds.filter(function (x) { return x.url === _artCur; })[0];
  return hit || _artIds[0];
}

// Weighted random rather than round-robin, so recent art dominates while older
// art still surfaces. Excludes the picture currently up, so nothing repeats
// back-to-back.
function pickArt(){
  const pool = _artIds.length > 1
    ? _artIds.filter(function (x) { return x.url !== _artCur; })
    : _artIds.slice();
  if (!pool.length) return null;
  let total = 0;
  const w = pool.map(function (a) { const v = artWeight(a); total += v; return v; });
  let r = Math.random() * total;
  for (let k = 0; k < pool.length; k++) { r -= w[k]; if (r <= 0) return pool[k]; }
  return pool[pool.length - 1];
}

// Paint the CURRENT picture. Never advances and never touches the dwell timer:
// applyWallConfig() reaches here from renderLocations() on every locations poll
// (15s, tightening to 7s near home), from the config poll and from the rule
// re-check. When one function both painted AND advanced, those callers raced the
// rotation timer and pictures flipped after a few seconds.
// ---- comment ticker -------------------------------------------------------
// What the family said about the picture that is up, scrolling along the bottom
// of the art panel. Keyed by "<id>:<count>" so a NEW comment on the picture
// currently showing re-fetches, while the 15s roster poll re-rendering the same
// unchanged picture does not.
let _artCommentsFor = null;

// Only the most recent few. The ticker has to finish a pass inside the picture's
// turn on screen, and every extra comment lengthens that pass.
const TICKER_MAX = 4;
// The dwell is now a FIXED 12s for every picture (Jeff, 2026-07-30: "make sure
// they are all showing for 12 seconds"), which reverses the old arrangement —
// the ticker used to stretch the picture's turn up to 34s to finish its pass.
// So the speed is now DERIVED from the time available instead of being fixed:
// fit one complete pass inside the dwell, with a moment to spare.
const TICKER_FIT_MS = ART_DWELL_MS - 1000;
// ...but not at any speed. Past this it is a blur, so a very chatty piece
// scrolls at the cap and simply does not complete its pass — the alternative is
// parking on the wall, which is the thing being fixed.
const TICKER_MAX_SPEED = 260;   // px/second
const TICKER_MIN_SPEED = 70;    // don't crawl when there is little to say

function renderTicker(items){
  const box = document.getElementById('artTicker');
  const track = document.getElementById('artTickerTrack');
  if (!box || !track) return;
  track.textContent = '';
  if (!items || !items.length) {
    box.hidden = true;
    return;
  }
  items = items.slice(-TICKER_MAX);
  items.forEach(function (c, i) {
    if (i) {
      const sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '•';
      track.appendChild(sep);
    }
    const who = document.createElement('span');
    who.className = 'who'; who.textContent = (c.author || 'Family') + ': ';
    const body = document.createElement('span');
    // textContent, never innerHTML — comment text is typed by people and is
    // never parsed as markup, same rule as the gallery's own comment list.
    body.textContent = c.body || '';
    track.appendChild(who); track.appendChild(body);
  });
  box.hidden = false;
  // Fit one pass into the picture's fixed turn, at a readable speed. The dwell
  // does not move for the ticker any more, so this is the only lever left.
  const dist = track.scrollWidth + box.clientWidth;
  const speed = Math.max(TICKER_MIN_SPEED,
                Math.min(TICKER_MAX_SPEED, dist / (TICKER_FIT_MS / 1000)));
  const secs = dist / speed;
  // Reassigning the shorthand after a reflow restarts the scroll from the right;
  // without the reflow the browser coalesces the change and the text jumps.
  track.style.animation = 'none';
  void track.offsetWidth;
  track.style.animation = 'artScroll ' + secs.toFixed(1) + 's linear infinite';
}

function loadArtComments(a){
  const key = a ? a.id + ':' + (a.comments || 0) : null;
  if (_artCommentsFor === key) return;
  _artCommentsFor = key;
  if (!a || !a.id || !a.comments) { renderTicker(null); return; }
  fetch('/api/artworks/' + encodeURIComponent(a.id) + '/comments', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (_artCommentsFor !== key) return;   // picture moved on mid-fetch
      renderTicker((d && d.comments) || null);
    })
    .catch(function () { renderTicker(null); });
}

function renderArt(){
  const img = document.getElementById('artImg');
  const cap = document.getElementById('artCaption');
  if (!img) return;
  const fimg = document.getElementById('frameImg');
  const plate = document.getElementById('framePlate');
  const a = currentArt();
  if (!a) {
    cap.textContent = 'No artwork yet';
    img.removeAttribute('src');
    if (fimg) fimg.removeAttribute('src');
    if (plate) plate.textContent = '';
    loadArtComments(null);
    return;
  }
  _artCur = a.url;
  loadArtComments(a);
  if (fimg) {
    // Cross-fade rather than a hard cut: on a wall this is the difference
    // between a picture frame and a slideshow.
    if (fimg.getAttribute('src') !== a.url) {
      fimg.classList.remove('in');
      fimg.onload = function () { fimg.classList.add('in'); };
      fimg.alt = a.title || 'Artwork';
      fimg.src = a.url;
    } else {
      fimg.classList.add('in');
    }
  }
  if (plate) {
    // Same rule as the panel caption: no name at all when it is both girls
    // (Jeff's call), and the date reads long-form because a mat is not a feed.
    plate.textContent = a.title || 'Untitled';
    const who = (a.kid && a.kid !== 'both')
      ? a.kid.charAt(0).toUpperCase() + a.kid.slice(1) : '';
    const when = a.created
      ? new Date(a.created).toLocaleDateString('en-US', {month: 'long', year: 'numeric'})
      : '';
    const sub = document.createElement('span');
    sub.className = 'who';
    sub.textContent = [who, when].filter(Boolean).join(' · ');
    plate.appendChild(sub);
  }
  // Caption refreshed EVERY time, so an edited title or artist name shows up even
  // though the image itself did not change. (An earlier version returned early
  // when the src matched, which silently froze the caption.)
  cap.textContent = artLabel(a);
  img.alt = a.title || 'Artwork';
  // ...but only touch src on a real change -- reassigning it makes the stick's
  // WebView re-decode the image, a visible flicker on the wall.
  if (img.getAttribute('src') !== a.url) img.src = a.url;
}

// Take the next queued arrival that is still in the roster. Entries are dropped
// rather than trusted: a piece can be deleted, unapproved or edited out between
// being queued and its turn coming round.
function takeQueuedArt(){
  while (_artNewQueue.length) {
    const url = _artNewQueue.shift();
    if (url === _artCur) continue;
    const hit = _artIds.filter(function (x) { return x.url === url; })[0];
    if (hit) return hit;
  }
  return null;
}

// Advance one picture and restart the dwell clock. New arrivals first, then the
// weighted random draw.
function nextArt(){
  const a = takeQueuedArt() || pickArt();
  if (!a) return;
  _artCur = a.url;
  renderArt();
  armArtTimer();
}

// A self-rescheduling timeout rather than a free-running setInterval, so the
// dwell is measured from when the picture actually appeared. While art is hidden
// or the wall is asleep it re-arms WITHOUT advancing, so the roster is not burned
// through behind a dark screen.
function armArtTimer(){
  clearTimeout(_artTimer);
  _artTimer = setTimeout(function(){
    if (document.body.classList.contains('show-art') && !document.hidden && !isSleeping()) nextArt();
    else armArtTimer();
  }, ART_DWELL_MS);
}

function fetchWallConfig(){
  if (!IS_LOCAL) return;
  if (document.hidden || isSleeping()) return;
  // While the fish tank is up, each poll carries its frame rate and render
  // quality back, so how the stick is really coping shows up in wall-message's
  // request log (journalctl --user -u wall-message | grep fps=).
  const q = (window.FishTank && FishTank.running())
    ? '?fps=' + FishTank.fps() + '&q=' + FishTank.quality().cap + 'x' + FishTank.quality().scale + '&ms=' + FishTank.prof() : '';
  fetch('/api/wall-config' + q, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (c) {
      if (!c) return;
      _wallCfg = c; applyWallConfig();
      // Feed / visitor taps from the Wall Board page ride along in `fish`.
      if (c.fish && window.FishTank) FishTank.events(c.fish);
    })
    .catch(function () { /* keep whatever we last applied */ });
}
fetchWallConfig();
// 2s, not 20s: a mode change picked on the Wall Board controller should show on
// the wall almost immediately ("switching modes should be instant", Jeff
// 2026-08-30). /api/wall-config is a local loopback service (guarded by
// IS_LOCAL + skipped while hidden/asleep), so the extra polling is free.
setInterval(fetchWallConfig, 2000);
// Re-evaluate the automatic rule on its own clock: "everyone home" and the
// commute window both change without the config changing.
setInterval(function(){ if (IS_LOCAL) applyWallConfig(); }, 60000);
// Rotation is driven by armArtTimer() (12s per picture, measured from when it
// appeared) — deliberately NOT a setInterval, which could not stay in step with
// the re-renders above.
armArtTimer();

// --- camera-feed overlay: Front / Lower Door / Parking Spot, over the weather panel ---
// LOCAL path (IS_LOCAL, 2026-09-05): camfeed.service on the Beelink serves the
// state at /camfeed/state and a multipart MJPEG stream at /camfeed/stream.mjpeg
// (Caddy -> 127.0.0.1:5013, gated like /proxy). One <img src> carries the whole
// stream on the LAN -- no per-frame fetch, no Cloud Run, no egress. The old
// blob-fetch loop against ?mode=camera_img stays ONLY as the non-local
// fallback (public GitHub Pages copy); camfeed no longer pushes frames to the
// proxy unless its cloud_push knob is turned back on, so expect that path to
// show nothing.
let camImgTimer = null, camObjUrl = null, camStreamOn = false, camStreamSig = null, camStreamSince = 0;
function startCamImg(st){
  const img = document.getElementById('camImg');
  if (IS_LOCAL){
    // A closed MJPEG stream fires no event -- the <img> just keeps its last
    // frame -- so camfeed reports a stream generation (bumps on every ffmpeg
    // restart, incl. a service restart) and its open-client count. Reconnect
    // when the generation moves, or when the server sees nobody connected
    // while we think we are (allowing a few seconds for the connect itself).
    const sig = (st.camera || '') + ':' + (st.gen || 0);
    const orphaned = camStreamOn && st.clients === 0 && (Date.now() - camStreamSince) > 4000;
    if (camStreamOn && camStreamSig === sig && !orphaned) return;
    camStreamOn = true; camStreamSig = sig; camStreamSince = Date.now();
    img.onerror = function(){                            // Caddy/camfeed hiccup: retry while still wanted
      if (camStreamOn) setTimeout(function(){ if (camStreamOn) img.src = '/camfeed/stream.mjpeg?t=' + Date.now(); }, 1500);
    };
    img.src = '/camfeed/stream.mjpeg?t=' + Date.now();
    return;
  }
  if (camImgTimer) return;
  const tok = localStorage.getItem('calToken') || '';
  camImgTimer = setInterval(async function(){          // fetch WITH auth header, show as blob
    try{
      const r = await fetch(PROXY_URL + '?mode=camera_img&t=' + Date.now(), {headers:{'X-Cal-Token':tok}});
      if (!r.ok) return;
      const u = URL.createObjectURL(await r.blob());
      img.onload = function(){ if (camObjUrl) URL.revokeObjectURL(camObjUrl); camObjUrl = u; };
      img.src = u;
    }catch(e){}
  }, 250);
}
// Sound (2026-09-16): a manual hold from the Wall Board page can carry sound.
// The tile is MJPEG, so audio is its own stream -- camfeed's /audio.mp3, a
// per-connection MP3 transcode of the camera's mic, served only while the
// hold's audio flag is on (404 otherwise). Plain <audio src> + play(): Fully
// has autoplay enabled, so no gesture is needed. Expect the sound to run a
// second or two behind the picture; that is the MP3 buffering, not a bug.
let camAudioSig = null;
function startCamAudio(st){
  const a = document.getElementById('camAudio');
  if (!a) return;
  const sig = (st.camera || '') + ':' + (st.gen || 0);
  if (camAudioSig === sig && a.getAttribute('src') && !a.error && !a.ended) return;
  camAudioSig = sig;
  const connect = function(){
    if (!camAudioSig) return;
    a.src = '/camfeed/audio.mp3?t=' + Date.now();
    a.play().catch(function(){});
  };
  // A dropped stream ends or errors; retry while sound is still wanted.
  a.onerror = a.onended = function(){ if (camAudioSig) setTimeout(connect, 2000); };
  connect();
}
function stopCamAudio(){
  const a = document.getElementById('camAudio');
  if (!a) return;
  camAudioSig = null; a.onerror = a.onended = null;
  if (a.getAttribute('src')){ a.pause(); a.removeAttribute('src'); a.load(); }
}
function stopCamImg(){
  stopCamAudio();
  if (camStreamOn){                                     // dropping src aborts the open MJPEG connection
    camStreamOn = false; camStreamSig = null;
    const img = document.getElementById('camImg'); img.onerror = null; img.removeAttribute('src');
  }
  if (camImgTimer){ clearInterval(camImgTimer); camImgTimer = null; }
  if (camObjUrl){ URL.revokeObjectURL(camObjUrl); camObjUrl = null; }
}
// Frame mode hides every grid card with !important -- the weather card and
// this overlay inside it included -- so a camera would be invisible exactly
// when someone asks for it from the phone in the evening. While Frame is on,
// the overlay is moved into #frameMode (the one element Frame leaves on
// screen) and floats over the mat; it goes back to the weather card when Frame
// ends. Same reparenting trick as moveTicker(): one overlay, one stream, no
// duplicate. Reparenting an <img> does not restart its MJPEG connection.
function placeCamOverlay(){
  const ov = document.getElementById('camOverlay');
  if (!ov) return;
  const frame = document.body.classList.contains('frame-mode');
  const dest = document.getElementById(frame ? 'frameMode' : 'weatherCard');
  if (dest && ov.parentNode !== dest) {
    if (frame) dest.appendChild(ov); else dest.insertBefore(ov, dest.firstChild);
  }
  ov.classList.toggle('cam-in-frame', frame);
}
async function pollCameraState(){
  const ov = document.getElementById('camOverlay');
  // Skip the poll while asleep/hidden (like the other pollers). On the cloud
  // fallback also skip whenever no person is home — that poll is billable and
  // nobody is in front of the display. The LOCAL poll is free, and it has to
  // run regardless because a MANUAL hold (the Wall Board page's "front
  // camera" button, 2026-09-16) must show even when the location feed thinks
  // the house is empty: someone tapped the button, so someone is looking.
  if (document.hidden || isSleeping() || (!_anyoneHome && !IS_LOCAL)){
    ov.style.display = 'none'; stopCamImg();
    return;
  }
  try{
    let st;
    if (IS_LOCAL){
      st = await (await fetch('/camfeed/state', {cache:'no-store'})).json();
    } else {
      const tok = localStorage.getItem('calToken') || '';
      st = await (await fetch(PROXY_URL + '?mode=camera', {headers:{'X-Cal-Token':tok}})).json();
    }
    // Automatic holds (motion, an approach) still need a person home; a manual
    // one does not — see above.
    if (st.active && (_anyoneHome || st.manual)){
      document.getElementById('camLabel').textContent = st.label || 'Camera';
      placeCamOverlay();
      ov.style.display = 'block'; startCamImg(st);
      if (st.audio) startCamAudio(st); else stopCamAudio();
    } else { ov.style.display = 'none'; stopCamImg(); }
  }catch(e){}
}
// 5s, not 1s: worst case the overlay appears ~5s after motion, against hold
// times of 120s/15s. The 1 Hz version dominated the proxy's vCPU bill.
setInterval(pollCameraState, 5000);
pollCameraState();
// fetchLocations reschedules itself dynamically (7s when someone is
// approaching home inside Hoboken, otherwise 15s). Just kick off the
// first fetch — the loop runs from there.
setTimeout(function () { initHobokenMap(); fetchLocations(); }, 1500);
</script>
</body>
</html>
