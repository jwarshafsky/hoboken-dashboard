function displayName(loc) {
  return PERSON_NAMES[loc.tid] || loc.name || loc.tid || '';
}

// Hudson River bounding box — anyone in this lon/lat strip is over the water,
// so we assume they're on the ferry.
function isOverWater(lat, lon) {
  return lat >= 40.700 && lat <= 40.770 &&
         lon >= -74.020 && lon <= -74.011;
}

// Persistence tracker: only claim "on bus/Hop" if the person has been near
// the SAME vehicle for at least 60 seconds (avoids false positives from
// momentarily passing a stopped bus or standing at a stop).
const _statusPersistence = {};  // tid → { candidate, since, confirmed }

function personStatus(loc) {
  // Cold-stale (≥3h since last fix): coordinates are very likely lying.
  // Don't claim "at home" or "2.3 mi away" — say "last seen X" so the
  // family treats the dot as a memory, not a fact.
  if (loc.received_at) {
    const ageSec = Date.now() / 1000 - loc.received_at;
    if (ageSec >= 10800) return 'last seen ' + agoText(loc.received_at * 1000);
  }
  const dHome = distMi(HOME, loc);
  if (dHome < HOME_RADIUS_MI) return 'at home';

  const now = Date.now();
  const tid = loc.tid || 'XX';
  const p = _statusPersistence[tid] || (_statusPersistence[tid] = {});

  // Detect near a vehicle (NJT bus or Hop). Pick whichever is closer.
  let candidate = null;
  for (const b of _lastBuses) {
    if (b.lat == null || b.lon == null) continue;
    if (distMi(loc, { lat: b.lat, lon: b.lon }) < 0.12) {
      candidate = 'on ' + b.route;
      break;
    }
  }
  if (!candidate) {
    for (const b of _lastHopBuses) {
      if (distMi(loc, { lat: b.lat, lon: b.lon }) < 0.08) {
        const probe = (b.route || '').toLowerCase();
        candidate = probe.includes('red')   ? 'on Red Hop' :
                    probe.includes('green') ? 'on Green Hop' :
                    'on Hop';
        break;
      }
    }
  }

  // Update persistence tracking
  if (candidate) {
    if (p.candidate !== candidate) {
      p.candidate = candidate;
      p.since = now;
    }
    if (now - p.since >= 60000) {
      return candidate;  // confirmed — been alongside the vehicle 60+ sec
    }
  } else {
    p.candidate = null;
    p.since = null;
  }

  // Over water → on ferry (no persistence check needed; physically impossible
  // to be over the Hudson without being on a boat)
  if (isOverWater(loc.lat, loc.lon)) return 'on ferry';

  if (dHome < 0.5) return 'near home';
  return dHome.toFixed(1) + ' mi away';
}

function distMi(a, b) {
  const R = 3959; // miles
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(lat1) * Math.cos(lat2);
  return 2 * R * Math.asin(Math.sqrt(x));
}

function initHobokenMap() {
  if (_hobokenMap || typeof L === 'undefined') return;
  const hasRotate = typeof L.Map.prototype.setBearing === 'function';
  _hobokenMap = L.map('hobokenMap', Object.assign({
    zoomControl: false,
    attributionControl: false,
    dragging: true,
    scrollWheelZoom: false,
  }, hasRotate ? {
    rotate: true,
    bearing: 0,
    touchRotate: false,
    rotateControl: { closeOnZeroBearing: false },
  } : {}));
  // Use setView with center+zoom (works better with rotation than fitBounds)
  // Center: between Hoboken and Midtown Manhattan
  _hobokenMap.setView([40.750, -74.003], 14);
  // Jawg.Dark — clean dark theme, no road shield badges
  L.tileLayer('https://{s}.tile.jawg.io/jawg-dark/{z}/{x}/{y}{r}.png?access-token=Lrrwi9HKsiS8ptMSGUR1K7cGy3sg60y1kCop0PsvWIy3H5yUz85QIzfTXJwtjwnq', {
    maxZoom: 22,
    subdomains: 'abcd',
    attribution: '',
  }).addTo(_hobokenMap);

  // Home marker — small blue house. Reduced from 30→24px so the family
  // bubbles (the actual answer to "where is everyone?") become the loudest
  // thing on the map. When people are at home they orbit this badge in a ring.
  const homeIcon = L.divIcon({
    className: 'home-marker',
    html:
      '<svg viewBox="0 0 24 24" fill="#fff">' +
      '<path d="M12 3 3 11h2v8h5v-5h4v5h5v-8h2z"/></svg>',
    iconSize: [24, 24],
    iconAnchor: [12, 12],
  });
  _homeMarker = L.marker([HOME.lat, HOME.lon], {
    icon: homeIcon,
    zIndexOffset: -500,  // home sits BEHIND people now (they're the answer)
  }).addTo(_hobokenMap);

  // Initial view: tight on home (will re-fit once locations arrive)
  _hobokenMap.setView([HOME.lat, HOME.lon], 14);

  // Remote-control zoom: channel-up / channel-down buttons zoom the map.
  // Different TV platforms emit different key identifiers for these buttons,
  // so we match all the common ones. D-pad arrows are left alone so they keep
  // panning via Leaflet's default keyboard handler.
  const ZOOM_IN_KEYS  = new Set(['ChannelUp',   'PageUp',   'MediaTrackNext']);
  const ZOOM_OUT_KEYS = new Set(['ChannelDown', 'PageDown', 'MediaTrackPrevious']);
  const ZOOM_IN_CODES  = new Set([427, 33]);   // 427 = VK_CHANNEL_UP, 33 = PageUp
  const ZOOM_OUT_CODES = new Set([428, 34]);   // 428 = VK_CHANNEL_DOWN, 34 = PageDown
  // Select / OK button in the center of the D-pad: typically Enter (13),
  // sometimes 'Select' or the legacy 'Spacebar'. Cycles map view mode.
  const SELECT_KEYS  = new Set(['Enter', 'Select', ' ', 'Spacebar', 'OK']);
  const SELECT_CODES = new Set([13, 32, 23]);   // 23 = Android KEYCODE_DPAD_CENTER

  // View-mode state machine (0..3):
  //   0 = default                  (true north, no labels)
  //   1 = rotated to street grid   (Hoboken streets point straight up)
  //   2 = default + bus labels     (true north, permanent #s)
  //   3 = street grid + bus labels (streets up, permanent #s)
  const STREET_GRID_BEARING = -29;
  // Restore the last view mode from prior session if available so a nightly
  // reload (or Onn restart) lands the family back where they left off.
  let _persistedMode = 0;
  try {
    const v = parseInt(localStorage.getItem('viewMode'), 10);
    if (!isNaN(v) && v >= 0 && v <= 3) _persistedMode = v;
  } catch (e) {}
  window._viewMode = _persistedMode;
  window._showBusLabels = false;
  let _lastSelectTs = 0;
  function applyViewMode() {
    const m = window._viewMode | 0;
    const wantStreetGrid = (m === 1 || m === 3);
    const wantLabels     = (m === 2 || m === 3);
    if (_hobokenMap && typeof _hobokenMap.setBearing === 'function') {
      _hobokenMap.setBearing(wantStreetGrid ? STREET_GRID_BEARING : 0);
    }
    window._showBusLabels = wantLabels;
    // Re-bind tooltips on existing bus markers so permanent flag matches.
    for (const key of Object.keys(_busMarkers || {})) {
      const mk = _busMarkers[key];
      if (!mk) continue;
      const content = mk.getTooltip() ? mk.getTooltip().getContent() : '';
      mk.unbindTooltip();
      mk.bindTooltip(content, {
        direction: 'top',
        offset: [0, -18],
        className: 'bus-tip',
        permanent: wantLabels,
      });
    }
  }
  applyViewMode();
  // On-screen key debug — shows the last key event so we can identify what
  // the remote actually emits. Toggle by appending ?keydebug to the URL.
  let _keyDebugEl = null;
  if (location.search.includes('keydebug')) {
    _keyDebugEl = document.createElement('div');
    _keyDebugEl.style.cssText =
      'position:fixed;bottom:8px;right:8px;z-index:9999;background:#000;color:#0f0;' +
      'font:13px monospace;padding:6px 10px;border:1px solid #0f0;border-radius:4px;';
    _keyDebugEl.textContent = 'keydebug ready';
    document.body.appendChild(_keyDebugEl);
  }
  window.addEventListener('keydown', function (e) {
    if (_keyDebugEl) {
      _keyDebugEl.textContent = 'key=' + e.key + ' code=' + e.code + ' kc=' + e.keyCode;
    }
    // Silently ignore the remote when the screen is asleep — otherwise the
    // family wakes up to a randomly-cycled view mode.
    if (typeof isSleeping === 'function' && isSleeping()) return;
    if (!_hobokenMap) return;
    const k = e.key || '';
    if (ZOOM_IN_KEYS.has(k) || ZOOM_IN_CODES.has(e.keyCode)) {
      _hobokenMap.zoomIn(1);
      e.preventDefault(); e.stopPropagation();
    } else if (ZOOM_OUT_KEYS.has(k) || ZOOM_OUT_CODES.has(e.keyCode)) {
      _hobokenMap.zoomOut(1);
      e.preventDefault(); e.stopPropagation();
    } else if (SELECT_KEYS.has(k) || SELECT_CODES.has(e.keyCode)) {
      // Debounce — Onn remote auto-repeats; 150ms keeps the cycle predictable.
      const now = performance.now();
      if (now - _lastSelectTs < 150) {
        e.preventDefault(); e.stopPropagation();
        return;
      }
      _lastSelectTs = now;
      window._viewMode = ((window._viewMode | 0) + 1) % 4;
      try { localStorage.setItem('viewMode', String(window._viewMode)); } catch (_) {}
      applyViewMode();
      e.preventDefault(); e.stopPropagation();
    }
  }, true);

  // Seed home stubs so face bubbles appear before first network fetch
  renderLocations(HOME_STUBS);
}

// Approach-mode: when anyone is inside Hoboken AND moving toward home, we
// want fresher data — bump the location poll cadence so the family knows
// who's almost-arrived. Tracks per-TID last-known distance to home so we
// can detect "decreasing distance" between polls.
const HOBOKEN_BBOX = { latMin: 40.733, latMax: 40.768, lonMin: -74.040, lonMax: -74.018 };
const APPROACH_POLL_MS = 7000;   // when someone's approaching, poll every 7s
const DEFAULT_POLL_MS = 15000;   // otherwise the normal 15s
let _prevDistToHome = {};        // tid → last-known distance (miles)

function _inHoboken(loc) {
  return loc.lat >= HOBOKEN_BBOX.latMin && loc.lat <= HOBOKEN_BBOX.latMax &&
         loc.lon >= HOBOKEN_BBOX.lonMin && loc.lon <= HOBOKEN_BBOX.lonMax;
}

function _someoneApproachingHome(locs) {
  // True if at least one person is inside Hoboken bbox, outside the at-home
  // radius (so they're meaningfully en route), and closer to home than the
  // previous reading by at least 0.01 mi (~50 ft, filters GPS jitter).
  for (const l of locs) {
    if (!l.received_at || !l.lat || !l.lon) continue;
    if (!_inHoboken(l)) continue;
    const d = distMi(HOME, l);
    if (d < HOME_RADIUS_MI) continue;        // already home
    if (d > 1.5) continue;                   // too far to care yet
    const prev = _prevDistToHome[l.tid];
    if (prev != null && (prev - d) >= 0.01) return true;
  }
  return false;
}

// Remembers whether the *previous* poll detected someone approaching, so
// we send fast=1 on the NEXT proxy request. The flag mirrors the cadence
// state — if we're polling at 7s, we ask the proxy to tighten its Life360
// cache to 15s too.
let _approachMode = false;

async function fetchLocations() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  const token = localStorage.getItem('calToken') || '';
  try {
    const url = PROXY_URL + '?mode=locations' + (_approachMode ? '&fast=1' : '');
    const res = await fetchT(url, { headers: { 'X-Cal-Token': token } });
    if (!res.ok) return;
    const data = await res.json();
    renderBuses(data.buses || []);     // first so _lastBuses is populated
    const liveLocs = data.locations || [];
    const liveTids = new Set(liveLocs.map(l => l.tid));
    const stubs = HOME_STUBS.filter(s => !liveTids.has(s.tid));
    renderLocations([...stubs, ...liveLocs]);
    renderTiles(data.tiles || []);

    // Approach detection: compare each person's current distance-to-home
    // against last poll's. If anyone's actively closing the gap inside
    // Hoboken, schedule the next poll on the fast cadence + signal the
    // proxy to tighten its Life360 cache.
    const approaching = _someoneApproachingHome(liveLocs);
    for (const l of liveLocs) {
      if (l.lat != null && l.lon != null) _prevDistToHome[l.tid] = distMi(HOME, l);
    }
    _approachMode = approaching;
    _scheduleLocationsPoll(approaching ? APPROACH_POLL_MS : DEFAULT_POLL_MS);
  } catch (e) {
    console.error('Locations fetch error:', e);
    _scheduleLocationsPoll(DEFAULT_POLL_MS);
  }
}

let _locationsPollTimer = null;
function _scheduleLocationsPoll(ms) {
  if (_locationsPollTimer) clearTimeout(_locationsPollTimer);
  _locationsPollTimer = setTimeout(fetchLocations, ms);
}

function renderTiles(tiles) {
  if (!_hobokenMap) return;
  const seen = new Set();
  for (const t of tiles) {
    const key = t.uuid;
    seen.add(key);
    const latlng = [t.lat, t.lon];
    const cfg = TILE_DEVICES[t.name] || {};
    const label = cfg.icon || (t.name || '?').substring(0, 2).toUpperCase();
    const style = cfg.color ? ('background:' + cfg.color + ';') : '';
    const icon = L.divIcon({
      className: 'tile-marker',
      html: '<div style="' + style + 'width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;">' + label + '</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13],
    });
    if (_tileMarkers[key]) {
      _tileMarkers[key].setLatLng(latlng);
      _tileMarkers[key].setIcon(icon);
    } else {
      _tileMarkers[key] = L.marker(latlng, { icon: icon }).addTo(_hobokenMap);
    }
  }
  for (const key of Object.keys(_tileMarkers)) {
    if (!seen.has(key)) {
      _hobokenMap.removeLayer(_tileMarkers[key]);
      delete _tileMarkers[key];
    }
  }
}

function busLoadColor(passload) {
  const p = (passload || '').toUpperCase();
  if (p === 'EMPTY')                      return '#44ee44';
  if (p === 'LIGHT')                      return '#a0e060';
  if (p === 'MEDIUM')                     return '#e0c040';
  if (p === 'HEAVY')                      return '#ff9b40';
  if (p === 'FULL' || p === 'OVERLOADED') return '#ff5050';
  return '#7090a0';
}

function _busSvg(arrowColor, toNYC) {
  // NJT bus marker: NJTbus.png logo as the body, with a colored direction
  // arrow stacked above (NY-bound) or below (return). Arrow color encodes
  // passenger load (see busLoadColor).
  const pts = toNYC ? '13,1 1,13 25,13' : '13,13 1,1 25,1';
  const arrow =
    '<svg class="nbm-arrow" width="26" height="14" viewBox="0 0 26 14">' +
      '<polygon points="' + pts + '" fill="' + arrowColor + '"' +
        ' stroke="rgba(20,30,40,0.8)" stroke-width="1" stroke-linejoin="round"/>' +
    '</svg>';
  const img = '<img src="NJTbus.png" class="nbm-body" alt="">';
  return '<div class="nbm-wrap">' + (toNYC ? arrow + img : img + arrow) + '</div>';
}

function renderBuses(buses) {
  _lastBuses = buses || [];
  if (!_hobokenMap) return;
  const seen = new Set();
  for (const b of buses) {
    const key = 'bus_' + (b.vehicle_id || (b.route + '_' + b.lat.toFixed(4) + '_' + b.lon.toFixed(4)));
    seen.add(key);
    const toNYC = (b.destination || '').toUpperCase().includes('NEW YORK');
    const arrowColor = busLoadColor(b.passload);
    const icon = L.divIcon({
      className: 'bus-marker',
      html: _busSvg(arrowColor, toNYC),
      iconSize: [26, 40],
      iconAnchor: [13, 20],
    });
    const label = (b.route ? b.route : 'Bus') + (b.vehicle_id ? ' · #' + b.vehicle_id : '');
    if (_busMarkers[key]) {
      _busMarkers[key].setIcon(icon);
      _busMarkers[key].setTooltipContent(label);
      _slideTo(key, _busMarkers[key], b.lat, b.lon);
    } else {
      _busMarkers[key] = L.marker([b.lat, b.lon], { icon: icon })
        .bindTooltip(label, {
          direction: 'top',
          offset: [0, -18],
          className: 'bus-tip',
          permanent: !!window._showBusLabels,
        })
        .addTo(_hobokenMap);
    }
  }
  for (const key of Object.keys(_busMarkers)) {
    if (!seen.has(key)) {
      _hobokenMap.removeLayer(_busMarkers[key]);
      delete _busMarkers[key];
      delete _markerAnims[key];
      delete _busHeadings[key];   // avoid long-uptime memory leak
    }
  }
}

var _lastZoomKey = null;
function _smoothZoomTo(center, zoom) {
  var key = center[0].toFixed(5) + ',' + center[1].toFixed(5) + ',' + zoom;
  if (_lastZoomKey === key) return;
  _lastZoomKey = key;
  _hobokenMap.flyTo(center, zoom, { duration: 1.2 });
}
function _smoothZoomBounds(bounds, opts) {
  var key = bounds[0][0].toFixed(5) + ',' + bounds[0][1].toFixed(5) + ',' +
            bounds[1][0].toFixed(5) + ',' + bounds[1][1].toFixed(5) + ',' + (opts.maxZoom || '');
  if (_lastZoomKey === key) return;
  _lastZoomKey = key;
  _hobokenMap.flyToBounds(bounds, Object.assign({ duration: 1.2 }, opts));
}

function renderLocations(locations) {
  if (!_hobokenMap) return;
  const OVERLAP_MI = 0.05;        // ~265 ft for clustering non-home people
  const RING_RADIUS_DEG = 0.0003; // ~110 ft for non-home clustering

  // Split into at-home vs elsewhere
  const atHome = locations.filter(function (l) { return distMi(HOME, l) < HOME_RADIUS_MI; });
  const elsewhere = locations.filter(function (l) { return distMi(HOME, l) >= HOME_RADIUS_MI; });

  // At-home people: pinned to HOME lat/lng, positioned by iconAnchor (pixel offset
  // from home). Smaller icon so they look like satellites orbiting the home badge.
  const HOME_FACE_SIZE = 28;
  const HOME_ORBIT_RADIUS = 22; // px from home center to face center
  const homeIconConfig = {};
  atHome.forEach(function (l, idx) {
    const angle = (idx / Math.max(atHome.length, 1)) * 2 * Math.PI - Math.PI / 2;
    const dx = Math.cos(angle) * HOME_ORBIT_RADIUS;
    const dy = Math.sin(angle) * HOME_ORBIT_RADIUS;
    // iconAnchor positions the (x,y) point of the icon at the latlng. To shift
    // the icon's visual center by (dx, dy), we offset the anchor by (-dx, -dy)
    // from the icon's natural center (size/2).
    homeIconConfig[l.tid] = {
      latlng: [HOME.lat, HOME.lon],
      iconSize: [HOME_FACE_SIZE, HOME_FACE_SIZE],
      iconAnchor: [HOME_FACE_SIZE / 2 - dx, HOME_FACE_SIZE / 2 - dy],
      className: 'person-marker small',
    };
  });

  // Cluster elsewhere people who happen to be near each other
  const positions = {};
  for (const loc of elsewhere) positions[loc.tid] = { lat: loc.lat, lon: loc.lon };
  const handled = new Set();
  for (let i = 0; i < elsewhere.length; i++) {
    if (handled.has(elsewhere[i].tid)) continue;
    const cluster = [elsewhere[i]];
    handled.add(elsewhere[i].tid);
    for (let j = i + 1; j < elsewhere.length; j++) {
      if (handled.has(elsewhere[j].tid)) continue;
      if (distMi(elsewhere[i], elsewhere[j]) < OVERLAP_MI) {
        cluster.push(elsewhere[j]);
        handled.add(elsewhere[j].tid);
      }
    }
    if (cluster.length > 1) {
      const cx = cluster.reduce(function (s, c) { return s + c.lat; }, 0) / cluster.length;
      const cy = cluster.reduce(function (s, c) { return s + c.lon; }, 0) / cluster.length;
      cluster.forEach(function (c, idx) {
        const angle = (idx / cluster.length) * 2 * Math.PI + 0.5;
        positions[c.tid].lat = cx + RING_RADIUS_DEG * Math.cos(angle);
        positions[c.tid].lon = cy + RING_RADIUS_DEG * Math.sin(angle);
      });
    }
  }

  // Render markers
  const seen = new Set();
  for (const loc of locations) {
    seen.add(loc.tid);
    const faceUrl = FACE_IMAGES[loc.tid];
    const html = faceUrl
      ? '<img src="' + faceUrl + '" alt="' + displayName(loc) + '"/>'
      : (displayName(loc) || '?').substring(0, 2).toUpperCase();

    // Freshness ladder (drives marker visual decay + pill copy below).
    // fresh < 3m, recent < 30m, stale < 3h, cold ≥ 3h.
    const ageSec = loc.received_at ? (Date.now() / 1000 - loc.received_at) : 0;
    let staleClass = '';
    if (!loc.received_at || ageSec >= 10800)      staleClass = ' stale-cold';
    else if (ageSec >= 1800)                       staleClass = ' stale-warm';
    else if (ageSec >= 180)                        staleClass = ' stale-recent';

    let latlng, iconSize, iconAnchor, className;
    if (homeIconConfig[loc.tid]) {
      const cfg = homeIconConfig[loc.tid];
      latlng = cfg.latlng;
      iconSize = cfg.iconSize;
      iconAnchor = cfg.iconAnchor;
      className = cfg.className + staleClass;
    } else {
      const pos = positions[loc.tid] || { lat: loc.lat, lon: loc.lon };
      latlng = [pos.lat, pos.lon];
      // Enlarged from 36→44 so faces dominate the map hierarchy.
      iconSize = [44, 44];
      iconAnchor = [22, 22];
      className = 'person-marker' + staleClass;
    }

    const icon = L.divIcon({
      className: className,
      html: html,
      iconSize: iconSize,
      iconAnchor: iconAnchor,
    });
    if (_personMarkers[loc.tid]) {
      _personMarkers[loc.tid].setLatLng(latlng);
      _personMarkers[loc.tid].setIcon(icon);
    } else {
      _personMarkers[loc.tid] = L.marker(latlng, { icon: icon }).addTo(_hobokenMap);
    }
  }
  // Remove markers for people no longer in the list
  for (const tid of Object.keys(_personMarkers)) {
    if (!seen.has(tid)) {
      _hobokenMap.removeLayer(_personMarkers[tid]);
      delete _personMarkers[tid];
    }
  }
  // Update overlay — one semi-transparent pill per person, left-aligned
  const overlay = document.getElementById('mapStatusOverlay');
  if (overlay) {
    if (locations.length === 0) {
      overlay.innerHTML = '';
    } else {
      overlay.innerHTML = locations.map(function (l) {
        const status = personStatus(l);
        const ago = agoText(l.received_at * 1000);
        const ageSec = l.received_at ? (Date.now() / 1000 - l.received_at) : Infinity;
        let cls = '';
        if (!l.received_at || ageSec >= 10800)   cls = ' ms-pill--cold';
        else if (ageSec >= 1800)                  cls = ' ms-pill--warm';
        return '<span class="ms-pill' + cls + '"><span class="ms-name">' + displayName(l) +
          '</span><span class="ms-status">' + status +
          '</span><span class="ms-ago">' + ago + '</span></span>';
      }).join('');
    }
  }

  // Auto-fit: include home + any person within 5mi. If none in range, default Hoboken view.
  const inRange = locations.filter(function (l) {
    return distMi(HOME, l) <= AUTO_FIT_RADIUS_MI;
  });
  var anyApproaching = inRange.some(function (l) {
    var d = distMi(HOME, l);
    return d >= HOME_RADIUS_MI && d <= NEAR_HOME_RADIUS_MI;
  });
  if (inRange.length === 0) {
    _smoothZoomTo([HOME.lat, HOME.lon], 14);
  } else if (locations.length > 0 && inRange.length === locations.length &&
             inRange.every(function (l) { return distMi(HOME, l) < HOME_RADIUS_MI; })) {
    _smoothZoomTo([HOME.lat, HOME.lon], 15);
  } else if (anyApproaching) {
    var approaching = inRange.filter(function (l) { return distMi(HOME, l) <= NEAR_HOME_RADIUS_MI; });
    // Also include any approaching NY-bound bus that's within ~3 mi of home
    // so the map auto-frames "Jeff + the bus he's about to catch" together.
    var nearbyBuses = (_lastBuses || []).filter(function (b) {
      return b && b.lat && b.lon && distMi(HOME, b) <= NEAR_HOME_RADIUS_MI;
    });
    var pts = approaching.concat(nearbyBuses);
    var lats = [HOME.lat].concat(pts.map(function (p) { return p.lat; }));
    var lngs = [HOME.lon].concat(pts.map(function (p) { return p.lon; }));
    _smoothZoomBounds(
      [[Math.min.apply(null, lats), Math.min.apply(null, lngs)],
       [Math.max.apply(null, lats), Math.max.apply(null, lngs)]],
      { padding: [30, 30], maxZoom: 16 }
    );
  } else {
    var lats = [HOME.lat].concat(inRange.map(function (l) { return l.lat; }));
    var lngs = [HOME.lon].concat(inRange.map(function (l) { return l.lon; }));
    var minLat = Math.min.apply(null, lats);
    var maxLat = Math.max.apply(null, lats);
    var minLng = Math.min.apply(null, lngs);
    var maxLng = Math.max.apply(null, lngs);
    _smoothZoomBounds([[minLat, minLng], [maxLat, maxLng]], {
      padding: [20, 20],
      maxZoom: 15,
    });
  }
}

function setAlertsMode(mode) {
  // mode: 'news' or 'map'
  const mapEl = document.getElementById('mapContainer');
  const listEl = document.getElementById('personList');
  if (mode === 'map') {
    mapEl.style.display = 'block';
    listEl.style.display = 'flex';
    initHobokenMap();
    if (_hobokenMap) setTimeout(function () { _hobokenMap.invalidateSize(); }, 100);
  } else {
    mapEl.style.display = 'none';
    listEl.style.display = 'none';
  }
}

// ============================================================
// ALERTS & NEWS
// ============================================================
async function fetchAlerts() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(PROXY_URL + '?mode=alerts');
    const data = await res.json();
    markOk('alerts');
    const container = document.getElementById('alertsList');
    let items = [];

    // Only NJT alerts that mention routes/services the family rides (126, 119, ferry).
    // Nixle and broader NJT system-wide noise are filtered out by default.
    const RELEVANT_KEYWORDS = /\b(126|119|ferry|hoboken|all bus|systemwide)\b/i;
    if (Array.isArray(data.njt_alerts)) {
      for (const a of data.njt_alerts) {
        if (a.error) continue;
        const text = a.description || a.title || '';
        if (!RELEVANT_KEYWORDS.test(text)) continue;
        items.push({ text: text, badge: 'njt', badgeText: 'NJT', isAlert: true });
      }
    }

    // Alerts only — no news, no stocks
    const divider = document.querySelector('.cal-alert-divider');
    if (items.length === 0) {
      container.innerHTML = '';
      container.style.display = 'none';
      if (divider) divider.style.display = 'none';
    } else {
      container.style.display = 'flex';
      if (divider) divider.style.display = 'block';
      let html = '';
      for (const item of items) {
        html += `<div class="alert-item is-alert">`;
        html += `<span class="alert-badge ${item.badge}">${item.badgeText}</span>`;
        html += item.text;
        html += '</div>';
      }
      container.innerHTML = html;
      requestAnimationFrame(() => trimOverflow(container));
    }
  } catch (e) {
    console.error('Alerts fetch error:', e);
    markFail('alerts');
  }
}

// ============================================================
// CALENDAR (private ICS feed via proxy, token stored per-device)
// ============================================================
function initCalAuth() {
  watchCalendarResize();
  const token = localStorage.getItem('calToken');
  if (!token) {
    showCalTokenPrompt();
    return;
  }
  document.getElementById('calSigninPrompt').style.display = 'none';
  fetchCalEvents();
}

function showCalTokenPrompt() {
  const c = document.getElementById('calContent');
  c.innerHTML =
    '<div class="cal-signin-prompt">' +
    '<div style="margin-bottom:10px;">Enter calendar token:</div>' +
    '<input id="calTokenInput" type="password" autocomplete="off" ' +
    'style="background:#1a1a2a;border:0.5px solid #2a2a35;border-radius:6px;' +
    'color:#fff;padding:8px 12px;font-size:var(--fs-body);width:80%;outline:none;" />' +
    '<div><button class="cal-signin-btn" onclick="saveCalToken()">Save</button></div>' +
    '</div>';
  setTimeout(function () {
    const inp = document.getElementById('calTokenInput');
    if (inp) inp.focus();
  }, 100);
}

function saveCalToken() {
  const inp = document.getElementById('calTokenInput');
  if (!inp || !inp.value.trim()) return;
  localStorage.setItem('calToken', inp.value.trim());
  initCalAuth();
}

function resetCalendarChoice() {
  // Triggered by double-click on calendar title — clear the saved token so the user
  // can re-enter it. To actually switch to a different calendar's ICS feed,
  // update the CALENDAR_ICS_URL env var on Cloud Run.
  if (confirm('Reset calendar token? You will need to re-enter it.')) {
    localStorage.removeItem('calToken');
    initCalAuth();
  }
}

async function fetchCalEvents() {
  if (document.hidden || isSleeping()) return;
  const token = localStorage.getItem('calToken') || '';
  try {
    // Token via header (not query string) to avoid URL logging
    const res = await fetchT(PROXY_URL + '?mode=calendar',
      { headers: { 'X-Cal-Token': token } });
    if (res.status === 403) {
      // Bad token — re-prompt
      localStorage.removeItem('calToken');
      showCalTokenPrompt();
      return;
    }
    const data = await res.json();
    if (data.events && Array.isArray(data.events)) {
      renderCalEvents(data.events);
    } else if (data.events && data.events.error) {
      document.getElementById('calEvents').innerHTML =
        '<div class="cal-empty">Calendar error</div>';
      console.error('Calendar error:', data.events.error);
    }
  } catch (e) {
    console.error('Calendar fetch error:', e);
  }
}

function renderCalEvents(events) {
  const container = document.getElementById('calEvents');
  if (!events || events.length === 0) {
    container.innerHTML = '<div class="cal-empty">No upcoming events</div>';
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);

  // Today as YYYY-MM-DD for cross-day comparisons
  const todayStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  function fmtMonthDay(dateStr) {
    // dateStr is YYYY-MM-DD; render as "May 25"
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function daysBetween(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }

  // Normalize ICS-feed format. Preserve start, end, allDay.
  // Compute display anchor date: if a multi-day event is happening today,
  // anchor to today instead of its original start.
  events = events.map(function (e) {
    const isAllDay = !!e.allDay || /^\d{4}-\d{2}-\d{2}$/.test(e.start || '');
    const startStr = e.start || '';
    const endStr = e.end || '';
    let anchorDate;
    if (isAllDay) {
      // ICS DTEND is exclusive — a multi-day all-day event runs [start, end)
      const isMultiDay = endStr && daysBetween(startStr, endStr) > 1;
      const lastDayInclusive = isMultiDay
        ? new Date(new Date(endStr + 'T00:00:00').getTime() - 86400000)
            .toISOString().substring(0, 10)
        : startStr;
      // If today falls within [start, lastDayInclusive], anchor to today
      if (startStr <= todayStr && todayStr <= lastDayInclusive) {
        anchorDate = todayStr;
      } else {
        anchorDate = startStr;
      }
      return {
        summary: e.summary,
        location: e.location || '',
        start: { date: startStr },
        end: { date: endStr },
        isMultiDay: isMultiDay,
        lastDay: lastDayInclusive,
        anchorDate: anchorDate,
        _calendarColor: '#6bffb8',
      };
    } else {
      const d = new Date(e.start);
      anchorDate = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      return {
        summary: e.summary,
        location: e.location || '',
        start: { dateTime: e.start },
        end: e.end ? { dateTime: e.end } : null,
        isMultiDay: false,
        anchorDate: anchorDate,
        _calendarColor: '#6bffb8',
      };
    }
  });

  // Group by anchor date
  const byDate = {};
  for (const ev of events) {
    if (!ev.anchorDate) continue;
    if (!byDate[ev.anchorDate]) byDate[ev.anchorDate] = [];
    byDate[ev.anchorDate].push(ev);
  }

  // Always render the TODAY header (with the live clock + commute line),
  // even if there are no events today.
  if (!byDate[todayStr]) byDate[todayStr] = [];

  const dateKeys = Object.keys(byDate).sort();
  let html = '';
  for (const dateKey of dateKeys) {
    const date = new Date(dateKey + 'T12:00:00');
    const isToday = date.toDateString() === today.toDateString();
    const isTomorrow = date.toDateString() === tomorrow.toDateString();

    let dayLabel;
    let cls = 'is-future';
    if (isToday) {
      // Start with the long form. _autoFitTodayHeader() runs after paint
      // and progressively shrinks (long → short weekday → short month) if
      // the label overflows the clock. So most days you see the big
      // "WEDNESDAY, MAY 27" — only the longest cases (e.g.
      // "WEDNESDAY, DECEMBER 31") fall back to short forms.
      dayLabel = date.toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric'
      }).toUpperCase();
      cls = 'is-today';
    }
    else if (isTomorrow) dayLabel = 'TOMORROW';
    else dayLabel = date.toLocaleDateString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric'
    }).toUpperCase();

    let timeHtml = '';
    if (isToday) {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      timeHtml = '<span class="cal-header-time">' + h12 + ':' + m + ' ' + ampm + '</span>';
    }
    html += '<div class="cal-day-header ' + cls + '">' + dayLabel + timeHtml + '</div>';

    // Morning commute estimates sit as child lines under the TODAY header
    // (one per family commuter). updateCommuteEstimate() populates this
    // container with one .cal-commute div per person each tick. Outside
    // the Mon-Fri 7:00-10:30 AM window, container stays empty.
    if (isToday) {
      html += '<div id="commuteContainer"></div>';
    }

    for (const ev of byDate[dateKey]) {
      let timeLabel = '';
      let evCls = 'cal-event';
      if (ev.start.date) {
        evCls += ' all-day';
        // Only show a label if it's a multi-day event (date range). Single-day
        // all-day events don't need "(All day)" — the day header above implies it.
        if (ev.isMultiDay) {
          timeLabel = fmtMonthDay(ev.start.date) + ' - ' + fmtMonthDay(ev.lastDay);
        }
      } else {
        const startDate = new Date(ev.start.dateTime);
        const h = startDate.getHours();
        const m = String(startDate.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        timeLabel = h12 + ':' + m + ' ' + ampm;
      }
      const title = (ev.summary || '(no title)').replace(/</g, '&lt;');
      const timeHtml = timeLabel ? '<span class="cal-event-time">(' + timeLabel + ')</span>' : '';

      // "Leave by X" only for timed events with a location, within the next 24h.
      let leaveHtml = '';
      if (ev.location && ev.start.dateTime) {
        const eventMs = new Date(ev.start.dateTime).getTime();
        const hrsUntil = (eventMs - Date.now()) / 3600000;
        if (hrsUntil > 0 && hrsUntil < 24) {
          // Heuristic mode: city (NYC) → bus; otherwise drive
          const isNYC = /\b(NY|NYC|New York|Manhattan)\b/i.test(ev.location);
          const travelMin = isNYC ? 45 : 20;
          const mode = isNYC ? '126/119' : 'drive';
          const leaveMs = eventMs - travelMin * 60000;
          const leaveDate = new Date(leaveMs);
          const lh = leaveDate.getHours();
          const lm = String(leaveDate.getMinutes()).padStart(2, '0');
          const lampm = lh >= 12 ? 'PM' : 'AM';
          const lh12 = lh % 12 || 12;
          const leaveStr = lh12 + ':' + lm + ' ' + lampm;
          leaveHtml = '<div class="cal-leave-by">Leave ' + leaveStr +
            ' <span class="cal-leave-mode">(' + mode + ')</span></div>';
        }
      }
      html += '<div class="' + evCls + '">' + title + timeHtml + leaveHtml + '</div>';
    }
  }
  container.innerHTML = html;
  // The commute line is rendered hidden inline; reveal/update immediately so
  // there's no 1s flicker waiting for the next clock tick.
  if (typeof updateCommuteEstimate === 'function') updateCommuteEstimate();
  // After paint, trim trailing items / orphan day headers until everything fits cleanly.
  // Use double-rAF + setTimeout to make sure layout has settled before measuring.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      _autoFitTodayHeader();
      setTimeout(trimCalendarOverflow, 30);
    });
  });
}

// Today's day-header tries long forms first (WEDNESDAY, DECEMBER 31). If
// the label + clock overflow the calendar's width, shrink in steps:
// long-weekday→short-weekday→short-month. Keeps the big text when it fits,
// gracefully degrades when it doesn't.
function _autoFitTodayHeader() {
  const header = document.querySelector('#calContent .cal-day-header.is-today');
  if (!header) return;
  const timeSpan = header.querySelector('.cal-header-time');
  const timeHtml = timeSpan ? timeSpan.outerHTML : '';
  const today = new Date();
  const FORMATS = [
    { weekday: 'long',  month: 'long',  day: 'numeric' }, // WEDNESDAY, DECEMBER 31
    { weekday: 'short', month: 'long',  day: 'numeric' }, // WED, DECEMBER 31
    { weekday: 'short', month: 'short', day: 'numeric' }, // WED, DEC 31
  ];
  for (const fmt of FORMATS) {
    const label = today.toLocaleDateString('en-US', fmt).toUpperCase();
    header.innerHTML = label + timeHtml;
    // 1px slack for sub-pixel rounding. scrollWidth > clientWidth means
    // content overflowed the header's content box even with nowrap.
    if (header.scrollWidth <= header.clientWidth + 1) return;
  }
  // All formats overflow (unlikely) — last one (shortest) stays applied.
}

function trimCalendarOverflow() {
  const container = document.getElementById('calEvents');
  const scrollParent = document.getElementById('calContent');
  if (!container || !scrollParent) return;
  let safety = 300;
  while (safety-- > 0 && container.lastElementChild) {
    const overflow = scrollParent.scrollHeight > scrollParent.clientHeight + 1;
    const lastIsHeader = container.lastElementChild.classList.contains('cal-day-header');
    if (!overflow && !lastIsHeader) break;
    container.removeChild(container.lastElementChild);
  }
}

// Re-trim the calendar whenever its container resizes (e.g. when alerts panel
// grows below it and reduces available height).
let _calResizeObserver = null;
function watchCalendarResize() {
  if (_calResizeObserver || typeof ResizeObserver === 'undefined') return;
  const target = document.getElementById('calContent');
  if (!target) return;
  let _lastCalHeight = target.clientHeight;
  _calResizeObserver = new ResizeObserver(function () {
    const h = target.clientHeight;
    if (h < _lastCalHeight - 4) {
      // Panel shrank — trim trailing events that no longer fit
      trimCalendarOverflow();
    } else if (h > _lastCalHeight + 20) {
      // Panel grew significantly — re-render so we use the new space
      fetchCalEvents();
    }
    _lastCalHeight = h;
  });
  _calResizeObserver.observe(target);
}

// ============================================================
// INIT
// ============================================================
function updateTransit() {
  if (PROXY_URL) {
    fetchProxy();
  } else {
    updateBusStatic();
  }
  updateFerries();
  fetchHop();
}

// ============================================================
// SLEEP MODE — black screen midnight to 7am (also pauses animations + polls)
// ============================================================
function isSleeping() {
  const h = new Date().getHours();
  return h >= 1 && h < 7;
}

let _wasSleeping = false;
function checkSleepMode() {
  const sleeping = isSleeping();
  document.body.style.visibility = sleeping ? 'hidden' : 'visible';
  document.body.style.background = sleeping ? '#000' : '#0a0a0f';
  document.body.classList.toggle('sleeping', sleeping);
  // Sleep → wake transition: force a one-shot refresh of every feed so the
  // family doesn't see stale "last night" data for up to 15s after 7 AM.
  // Fade-in via opacity so the screen doesn't pop on.
  if (_wasSleeping && !sleeping) {
    try { updateTransit && updateTransit(); } catch (e) {}
    try { updateWeather && updateWeather(); } catch (e) {}
    try { fetchAlerts && fetchAlerts(); } catch (e) {}
    try { fetchLocations && fetchLocations(); } catch (e) {}
    try { fetchFerries && fetchFerries(); } catch (e) {}
    try { fetchHop && fetchHop(); } catch (e) {}
    document.body.style.opacity = '0';
    requestAnimationFrame(function () {
      document.body.style.transition = 'opacity 600ms ease';
      document.body.style.opacity = '1';
    });
  }
  _wasSleeping = sleeping;
}

// LATE MODE — hide bus + ferry, expand map to full height.
// Weekdays after 5pm, weekends after 9pm.
function isLateMode() {
  const now = new Date();
  const day = now.getDay();   // 0=Sun, 6=Sat
  const hour = now.getHours();
  // Always considered "late" before 5 AM — panels reappear at 5 AM.
  if (hour < 5) return true;
  // Weekday evenings: hide from 5 PM onward.
  if (day >= 1 && day <= 5) return hour >= 17;
  // Weekend evenings: hide from 9 PM onward.
  return hour >= 21;
}
function applyLateMode() {
  document.body.classList.toggle('late-mode', isLateMode());
  if (_hobokenMap) _hobokenMap.invalidateSize();
}

updateClock();
updateTransit();
updateWeather();
fetchAlerts();
checkSleepMode();
applyLateMode();
setInterval(applyLateMode, 60000);
initCalAuth();
setInterval(fetchCalEvents, 5 * 60 * 1000); // refresh calendar every 5 min
setInterval(updateClock, 1000);
setInterval(checkSleepMode, 60000);
setInterval(updateStatusBar, 10000);
updateStatusBar();
setInterval(updateTransit, 15000);
setInterval(updateWeather, 600000);
setInterval(fetchAlerts,   300000);
// fetchLocations reschedules itself dynamically (7s when someone is
// approaching home inside Hoboken, otherwise 15s). Just kick off the
// first fetch — the loop runs from there.
setTimeout(function () { initHobokenMap(); fetchLocations(); }, 1500);
</script>
