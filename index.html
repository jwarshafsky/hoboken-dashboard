<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-title" content="Commute">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/pwa/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/pwa/icon-192.png">
<title>Commute</title>
<style>
  :root{
    --bg:#0b0f14; --card:#151b24; --card2:#1b2430; --line:#243040;
    --txt:#eef3f9; --dim:#8ea0b5; --live:#6bffb8;
    --urgent:#ff5050; --warn:#ff9b40; --yellow:#e0c040; --accent:#4aa8ff;
    --onaccent:#06121f; --colhead:#0e1620; --notebg:#1a222e;
  }
  /* Follows the launcher's Settings toggle when embedded (same origin, shared
     localStorage). On the public commute.jwarshafsky.com there is no launcher,
     so it simply stays dark. */
  :root[data-theme="light"]{
    --bg:#eef2f7; --card:#ffffff; --card2:#d8e2ee; --line:#ccd7e4;
    --txt:#16232f; --dim:#4d5f73; --live:#0a7a49;
    --urgent:#d32f2f; --warn:#b45f06; --yellow:#8a6d00; --accent:#0f5fa8;
    --onaccent:#ffffff; --colhead:#e6eef8; --notebg:#e8eef6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:max(14px, calc(env(safe-area-inset-top, 0px) + 10px)) 14px calc(24px + var(--sab, env(safe-area-inset-bottom, 0px)))}
  /* Installed (standalone) PWA: page draws under the status bar / Dynamic
     Island, and iOS sometimes reports safe-area-inset-top as 0 there —
     enforce a floor so the header and Flip button clear the camera bar. */
  @media (display-mode: standalone){
    body{padding-top:max(54px, calc(env(safe-area-inset-top, 0px) + 10px))}
  }
  body.standalone{padding-top:max(54px, calc(env(safe-area-inset-top, 0px) + 10px))}
  /* ...but NOT when embedded in the launcher. display-mode reports the TOP
     level app, so both rules above match inside the iframe, and the shell has
     already paid the inset — the two stacked to ~104px of dead space above the
     departures. `embedded` is set from JS and must outrank both. */
  body.embedded{padding-top:14px !important}
  .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px; position:relative}
  .hdr-eta{position:absolute; left:50%; transform:translateX(-50%); text-align:center;
    /* Neutral, NOT --live. This is a door-to-door total, and --live means "we
       have a live fix" everywhere else on the page — a 52-minute total rendered
       in the good-news colour straight off a dead feed. */
    font-size:24px; font-weight:800; line-height:1; color:var(--txt); pointer-events:none}
  .hdr-eta small{display:block; font-size:11px; font-weight:600; color:var(--dim); margin-top:2px}
  /* Fixed 20px/800 to match every other app page; vw units resolved against
     the iframe width and made this title smaller inside the launcher. */
  .dir{font-size:20px; font-weight:800; line-height:1.4; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px}
  .dir .sub{font-size:12px; font-weight:500; color:var(--dim); display:block}
  .btns{display:flex; align-items:center; gap:8px; flex:none}
  .swap{background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:10px 14px; font:inherit; font-size:14px;
    font-weight:600; cursor:pointer; touch-action:manipulation}
  .swap:active{background:var(--line)}
  /* Icon-only variant so two buttons still fit beside the centered ETA at 375px. */
  .swap.icon{padding:10px 12px; font-size:16px; line-height:1}
  /* The header ETA is absolutely centered, so the two side elements have to
     leave it room. On narrow phones drop the word "Flip" and keep just the
     glyph — cheap insurance against the second button crowding the centre. */
  @media (max-width: 340px){
    .swap#swapBtn{font-size:0; padding:10px 12px}
    .swap#swapBtn::before{content:'⇄'; font-size:16px; line-height:1}
  }
  .swap.icon.spin{color:var(--accent)}
  .swap.icon.spin span{display:inline-block; animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Bus | Ferry tabs. A full-width segmented control under the header — the
     old single cycling button hid what the other mode was. */
  .tabs{display:flex; gap:4px; background:var(--card2); border:1px solid var(--line);
    border-radius:13px; padding:4px; margin-bottom:14px}
  .tab{flex:1; background:none; border:0; border-radius:10px; color:var(--dim);
    /* 13px, not 10px: at 14px/1.2 text this is what puts the control over the
       44px minimum touch target. It was ~42px. */
    font:inherit; font-size:14px; font-weight:700; padding:13px 0; cursor:pointer;
    touch-action:manipulation}
  .tab[aria-selected="true"]{background:var(--accent); color:var(--onaccent)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px}
  .card h2{margin:0 0 12px; font-size:13px; font-weight:600; letter-spacing:.8px;
    text-transform:uppercase; color:var(--dim)}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none}
  .dot.live{background:var(--live); box-shadow:0 0 8px var(--live)}
  .dot.inferred{background:var(--warn)}
  .dot.sched{background:var(--dim)}
  .rows{display:flex; flex-direction:column; gap:8px}
  .row{display:flex; align-items:center; gap:12px; background:var(--card2);
    border-radius:12px; padding:12px 14px}
  .mins{font-size:28px; font-weight:800; line-height:1; min-width:70px}
  .mins small{font-size:13px; font-weight:600; color:var(--dim); margin-left:3px}
  .meta{margin-left:auto; text-align:right; font-size:12px; color:var(--dim)}
  /* "runs ~N late" is the statistical bias correction for this route and
     hour, NOT a measurement of this particular bus. Off by default; tap the
     bus/house icon to reveal. Always rendered and toggled purely in CSS, so
     flipping it is instant and needs no re-fetch. */
  .late{display:none; font-size:11px; font-weight:600; color:var(--warn); white-space:nowrap}
  body.show-late .late{display:block}
  .load{display:inline-flex; align-items:flex-end; gap:2px}
  .load i{display:block; width:5px; border-radius:2px}
  .loadlbl{font-size:11px; color:var(--dim); margin-left:5px}
  .tag{font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; margin-top:2px}
  .tag.est{color:var(--warn)}
  /* A PABT departure with no bus broadcasting for it yet. Marked like `est` is:
     the exception carries the label, so an unmarked row means a tracked bus. */
  .tag.sched{color:var(--dim)}
  .row.sched{box-shadow:inset 3px 0 0 var(--dim)}
  /* The countdown itself carries no urgency colour on a scheduled row — a red
     "3 min" you may not be able to catch is a worse claim than a quiet one. */
  .row.sched .mins{color:var(--dim)}
  /* Route number, tucked under the fullness bars. */
  .rt{display:block; font-size:11px; font-weight:600; color:var(--dim); margin-top:3px}
  .twocol{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .colhead{font-size:13px; font-weight:800; text-align:center; color:var(--accent);
    background:var(--colhead); border:1px solid var(--line); border-radius:8px;
    padding:5px 0; margin-bottom:8px}
  /* One line straight across: name left, minutes right. */
  .tunnel{display:flex; align-items:baseline; gap:7px}
  .tunnel .tname{font-size:13px; font-weight:600; letter-spacing:.8px;
    text-transform:uppercase; color:var(--dim); margin-right:auto; white-space:nowrap}
  .tunnel .big{font-size:22px; font-weight:800; line-height:1}
  .tunnel .lbl{font-size:13px; color:var(--dim); white-space:nowrap}
  /* Tap the row for recent Port Authority advisories. Same trick as .late:
     always rendered, shown purely in CSS, so the 15s repaint can't collapse it
     and re-opening costs no fetch. */
  .tunnel{cursor:pointer; -webkit-tap-highlight-color:transparent}
  .tunnel .tchev{font-size:15px; color:var(--dim); transition:transform .15s;
    margin-left:2px}
  body.show-tunnel-alerts .tunnel .tchev{transform:rotate(90deg)}
  .tunnel-alerts{display:none; margin-top:10px; border-top:1px solid var(--line);
    padding-top:9px}
  body.show-tunnel-alerts .tunnel-alerts{display:block}
  .ta-item{display:flex; gap:8px; font-size:13px; line-height:1.35;
    padding:5px 0; border-bottom:1px solid var(--line)}
  .ta-item:last-child{border-bottom:0}
  .ta-time{color:var(--accent); font-weight:700; white-space:nowrap;
    font-variant-numeric:tabular-nums}
  /* Superseded/cleared advisories stay visible but recede — the sequence is the
     story ("crash blocking lane" → "cleared"), so dropping them loses context. */
  .ta-item.resolved{opacity:.55}
  .ta-item.resolved .ta-time{color:var(--dim)}
  .ta-empty{color:var(--dim); font-size:13px; padding:3px 0}
  .ta-empty.err{color:var(--warn)}
  .empty{color:var(--dim); font-size:14px; padding:8px 2px}
  /* Upstream failure reads amber — distinct from quiet emptiness. */
  .empty.err{color:var(--warn)}
  /* NJT dropped the vehicle. Louder than "none soon" because the two are
     different facts and only one of them is actually knowable: a stripped
     column means we lost the bus, not that no bus is coming. */
  .empty.nolive{color:var(--warn); font-size:17px; font-weight:700; padding:10px 2px}
  .empty.nolive span{display:block; font-size:12px; font-weight:600;
    color:var(--dim); margin-top:3px}
  .note{background:var(--notebg); border:1px dashed var(--line); border-radius:12px;
    padding:12px 14px; color:var(--dim); font-size:13px; margin-bottom:14px}
  .foot{display:flex; justify-content:space-between; align-items:center;
    gap:10px; color:var(--warn); font-size:12px; margin-top:10px}
  .foot:empty{display:none}
  .foot .stat{display:flex; align-items:center; gap:6px}
  /* Staleness is signalled with a full-opacity coloured rail, NOT by dimming.
     Dimming #content dropped .meta (11-12px, --dim) to ~2.8:1 contrast, which
     is unreadable on a phone in direct sun — precisely the situation (outdoors,
     on a platform, deciding whether to run) where these times matter most. An
     inset shadow rather than a border so applying it shifts nothing on screen.
     .pending = "a moment behind"; .stale = "not updating at all". */
  body.pending .card{box-shadow:inset 0 3px 0 var(--warn)}
  body.stale .card{box-shadow:inset 0 3px 0 var(--urgent)}
  /* #hdrEta is a SIBLING of #content, so it escaped the old dimming entirely —
     the largest, brightest number on the page was the one thing with no
     staleness signal at all. */
  body.pending .hdr-eta, body.stale .hdr-eta{color:var(--dim)}
  /* Built from a timetable row with no bus tracked behind it. Same dim as
     .row.sched below, so the headline number and the row it came from agree. */
  .hdr-eta.sched{color:var(--dim)}
  a.reset{color:var(--accent); text-decoration:none}
  /* ---- Pull to refresh (custom — native PTR is dead in an installed iOS PWA) ---- */
  .ptr{position:fixed; top:-36px; left:50%; transform:translateX(-50%);
    width:34px; height:34px; border-radius:50%; background:var(--card);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    z-index:60; opacity:0; pointer-events:none; box-shadow:0 3px 12px rgba(0,0,0,.28);
    transition:opacity .15s ease}
  .ptr-spin{width:16px; height:16px; border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--dim)}
  .ptr.ready .ptr-spin{border-top-color:var(--accent)}
  .ptr.spinning .ptr-spin{border-top-color:var(--accent); animation:ptrspin .7s linear infinite}
  @keyframes ptrspin{to{transform:rotate(360deg)}}
  /* ---- Live bus map (tap a tracked bus) --------------------------------- */
  /* A tracked row is tappable; the dim pin is the only positive marker of that.
     Schedule-only rows carry no position and stay inert. */
  .row.mappable{cursor:pointer}
  .row.mappable:active{background:var(--line)}
  /* Rides on the countdown's own line, inside .mins. In .meta it landed after
     the block-level `tag`/`rt` lines and so made every mappable row taller than
     its neighbours — the board's whole job is a glanceable even list. Explicit
     line-height:1 because an emoji glyph can otherwise report a taller line box
     than its font-size and reintroduce the very height it's here to avoid. */
  .rowpin{font-size:11px; line-height:1; vertical-align:middle;
    margin-left:5px; opacity:.7}
  /* Full-screen overlay, sibling of #content so the 15s repaint never touches
     it. Shown purely by a body class, same idiom as .show-tunnel-alerts. */
  .busmap{position:fixed; inset:0; z-index:1000; background:var(--bg);
    display:none; flex-direction:column}
  body.show-busmap .busmap{display:flex}
  .busmap-bar{display:flex; align-items:center; gap:10px; flex:none;
    padding:max(12px, calc(env(safe-area-inset-top, 0px) + 8px)) 14px 12px;
    border-bottom:1px solid var(--line)}
  .bm-title{font-size:16px; font-weight:800; line-height:1.2}
  .bm-sub{font-size:12px; color:var(--dim); margin-top:2px}
  .bm-close{margin-left:auto; flex:none; width:40px; height:40px; border-radius:12px;
    background:var(--card2); border:1px solid var(--line); color:var(--txt);
    font-size:18px; line-height:1; cursor:pointer; touch-action:manipulation}
  .bm-close:active{background:var(--line)}
  .busmap-canvas{flex:1; min-height:0}
  .leaflet-container{background:var(--card)}
  .busmap-foot{flex:none; display:flex; align-items:center; gap:8px; font-size:13px;
    color:var(--dim); padding:12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--line)}
  .bm-dot{width:10px; height:10px; border-radius:50%; flex:none;
    background:var(--live); box-shadow:0 0 8px var(--live)}
  .bm-dot.stale{background:var(--warn); box-shadow:none}
  /* Marker glyphs (divIcons, so Leaflet's default marker PNGs never load). */
  .bm-bus{position:relative; display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%; background:var(--accent);
    font-size:15px; box-shadow:0 0 0 3px rgba(74,168,255,.35), 0 2px 6px rgba(0,0,0,.5)}
  /* Fleet number, pinned beside the marker. Absolute so it overflows the 30px
     icon box without changing iconSize/iconAnchor — the marker must stay
     anchored on the bus's actual coordinate, label or not. */
  .bm-busno{position:absolute; left:37px; top:50%; transform:translateY(-50%);
    font-size:12px; font-weight:700; line-height:1; color:var(--txt);
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:3px 6px; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .bm-bus.est{background:var(--warn); box-shadow:0 0 0 3px rgba(255,155,64,.35), 0 2px 6px rgba(0,0,0,.5)}
  .bm-stop{font-size:26px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
</style>
</head>
<body>
  <div class="top">
    <div class="dir" id="dirLabel">
      <span>
        <span id="dirText">Loading…</span>
        <span class="sub" id="dirSub">detecting location</span>
      </span>
    </div>
    <div class="hdr-eta" id="hdrEta"></div>
    <div class="btns">
      <button class="swap" id="swapBtn">⇄ Flip</button>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Travel mode">
    <button class="tab" id="tabBus" role="tab" aria-selected="false">🚌 Bus</button>
    <button class="tab" id="tabFerry" role="tab" aria-selected="false">⛴️ Ferry</button>
  </div>

  <div id="content"></div>

  <!-- Empty unless something needs saying: a staleness warning, or the way back
       to automatic direction after you have flipped it by hand. -->
  <div class="foot">
    <span class="stat" id="staleMsg" hidden></span>
  </div>

  <!-- Live bus map — opened by tapping a tracked departure. Sibling of #content
       so a repaint underneath can't collapse it; Leaflet is loaded on first open. -->
  <div class="busmap" id="busMap">
    <div class="busmap-bar">
      <div>
        <div class="bm-title" id="bmTitle">Bus</div>
        <div class="bm-sub" id="bmSub"></div>
      </div>
      <button class="bm-close" id="bmClose" aria-label="Close map">✕</button>
    </div>
    <div class="busmap-canvas" id="busMapCanvas"></div>
    <div class="busmap-foot"><span class="bm-dot" id="bmDot"></span><span id="bmFootTxt"></span></div>
  </div>

<script>
const PROXY_URL = 'https://proxy-105885243706.us-east1.run.app';
const POLL_MS = 15000;
const TIMEOUT_MS = 20000;  // comfortably above the proxy's 8s NJT timeout, so a
                           // cold (uncached) first load shows data rather than
                           // aborting early
// Buses shown per stop (and per route on the inbound board). Three is the
// practical ceiling — by the 4th departure you'd have left already.
const MAX_PER_STOP = 3;

// Anchors for auto direction detection.
const HOME = {lat: 40.7495, lon: -74.0300};          // central Hoboken
const NYC  = {lat: 40.7570, lon: -73.9903};          // Port Authority Bus Terminal
// Ride model for the inbound "ETA home": free-flow PABT->Hoboken minutes + walk.
const RIDE_BASE_MIN = 18;     // 126 PABT -> Hoboken stop, light traffic
const TUNNEL_FREEFLOW = 8;    // min; anything over this is added delay
const WALK_MIN = 2;         // inbound: Hoboken stop -> home (was 5; Jeff cut it by 3)
const WALK_TO_STOP_MIN = 3; // outbound: home -> Washington & 13th, so the
                            // headline total is "leave now" rather than
                            // "assuming you're already standing at the stop"

let dir = null;               // 'out' (to NYC) | 'in' (to Hoboken)
let manual = false;           // user flipped/overrode auto
// The bus currently shown on the live map, or null. Declared up here, not with
// the map code at the bottom, because closeBusMap() runs synchronously from
// setDir() during first paint (geolocation-absent path) — a `let` down in the
// map module would still be in its temporal dead zone and throw, leaving the
// page inert at "Loading…".
let openBus = null;

// ---------------------------------------------------------------------------
// FERRY
// NY Waterway has no API, so these are hardcoded — same as the wall dashboard's
// FERRY_VIEWS. A reissued timetable needs editing in BOTH places.
//
// Weekdays are the Wall St commuter route (Jenny's office end); weekends that
// route doesn't run at all, so the weekend pair is 14th St <-> Midtown.
// ---------------------------------------------------------------------------
// Ferry terminals, used for direction detection in ferry mode (see the anchor
// note in detectDirection).
const FERRY_HOBOKEN = {lat: 40.7568, lon: -74.0246};   // Hoboken 14th St terminal
const FERRY_PIER11  = {lat: 40.7033, lon: -74.0070};   // Pier 11 / Wall St
const FERRY_MIDTOWN = {lat: 40.7627, lon: -73.9995};   // Midtown / W 39th St

const FERRY = {
  weekday: {
    out: {label:'Hoboken 14th → Pier 11 / Wall St', times:[
      "06:28","07:08","07:33","07:58","08:28","08:53","09:18","09:48",
      "16:10","16:40","17:05","17:30","17:55","18:20","18:50"]},
    in:  {label:'Pier 11 / Wall St → Hoboken 14th', times:[
      "06:46","07:26","07:51","08:16","08:46","09:11",
      "15:50","16:20","16:45","17:10","17:35","18:00","18:30","19:00","19:30"]},
  },
  weekend: {
    out: {label:'Hoboken 14th → Midtown / W 39th', times:[
      "10:02","10:22","10:42","11:02","11:22","11:42","12:02","12:22","12:42",
      "13:02","13:22","13:42","14:02","14:22","14:42","15:02","15:22","15:42",
      "16:02","16:22","16:42","17:02","17:22","17:42","18:02","18:22","18:42",
      "19:02","19:22","19:42","20:02","20:22","20:42","21:02","21:22"]},
    // Mirrors the outbound list: each sailing is 8 min after its Hoboken
    // counterpart (10:02 -> 10:10), 35 each way.
    in:  {label:'Midtown / W 39th → Hoboken 14th', times:[
      "10:10","10:30","10:50","11:10","11:30","11:50","12:10","12:30","12:50",
      "13:10","13:30","13:50","14:10","14:30","14:50","15:10","15:30","15:50",
      "16:10","16:30","16:50","17:10","17:30","17:50","18:10","18:30","18:50",
      "19:10","19:30","19:50","20:10","20:30","20:50","21:10","21:30"]},
  },
};

// 'bus' | 'ferry'. Default follows who the device belongs to when we can tell:
// inside the launcher this page is same-origin with it, so `launcherMe` is
// readable and Jenny's phone opens on the ferry. Standalone on
// commute.jwarshafsky.com there's no such value, so it falls back to whatever
// was last chosen on that device, then to bus.
const MODE_KEY = 'commuteTravelMode';
let travelMode = 'bus';
try {
  const saved = localStorage.getItem(MODE_KEY);
  if (saved === 'bus' || saved === 'ferry') travelMode = saved;
  else if (localStorage.getItem('launcherMe') === 'jenny') travelMode = 'ferry';
} catch(e){}

function isWeekendNow(){ const d = new Date().getDay(); return d === 0 || d === 6; }

// Next departures with clock label + minutes away. The weekday Wall St service
// runs a morning block and an afternoon block with a long midday gap, so cap the
// horizon — a "410 min" countdown is noise — but always keep the real next boat.
function nextFerries(times, n){
  if (!Array.isArray(times)) return null;
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  return times.map(t => { const p = t.split(':'); return {min:(+p[0])*60 + (+p[1])}; })
    .filter(x => x.min >= nowMin)
    .map(x => {
      const h = Math.floor(x.min/60), m = x.min % 60, h12 = ((h+11)%12)+1;
      return {label:h12 + ':' + String(m).padStart(2,'0') + (h < 12 ? 'am' : 'pm'),
              wait:x.min - nowMin};
    })
    .filter((x,i) => i === 0 || x.wait <= 150)
    .slice(0, n);
}
let lastFetchedAt = 0;
let timer = null;

// ── Last-good board, kept in localStorage ────────────────────────────────
// Nothing polls the proxy's /commute_home between one open of this page and
// the next, so its server-side cache is always cold when you arrive and the
// first fetch blocks on NJT — measured 4.6-12s, against 2-4ms for every later
// request in the same session. Painting the last board immediately turns that
// dead time into a readable page that refreshes underneath you.
const SNAP_PREFIX = 'commuteSnap.v1.';
const LAST_DIR_KEY = 'commuteLastDir';
// 12 min. Past the proxy's own 10-minute carry-forward window the countdowns
// are no longer anchored to anything real, so a snapshot older than this is
// worse than an honest "Loading…".
const SNAP_MAX_AGE_S = 720;
// A payload older than this gets the dimmed "updating…" treatment, whether it
// came from localStorage or from the proxy's stale-while-revalidate window.
const PENDING_AGE_S = 90;

function snapAge(data){
  const t = data && data.fetched_at;
  return t ? (Date.now()/1000 - t) : Infinity;
}
function saveSnap(d, data){
  if (!d || !data || !data.fetched_at) return;
  try { localStorage.setItem(SNAP_PREFIX + d, JSON.stringify(data)); } catch(e){}
}
function loadSnap(d){
  let raw = null; try { raw = localStorage.getItem(SNAP_PREFIX + d); } catch(e){}
  if (!raw) return null;
  let data = null; try { data = JSON.parse(raw); } catch(e){ return null; }
  const age = snapAge(data);
  return (age >= 0 && age < SNAP_MAX_AGE_S) ? data : null;
}

function haversine(a, b){
  const R=3958.8, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLon=toR(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function detectDirection(){
  if (manual) { render(); return; }
  if (!navigator.geolocation){ setDir('out'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      // A late fix must never undo a manual flip made while geo was resolving.
      if (manual) return;
      const me = {lat: pos.coords.latitude, lon: pos.coords.longitude};
      // Anchor pair depends on the mode. PABT is the right NYC anchor for the
      // bus, but it's WRONG for the ferry: Pier 11 in the Financial District is
      // actually closer to central Hoboken than to PABT, so a ferry rider at
      // Wall St was told "To NYC" when they wanted the boat home.
      const nyc = travelMode === 'ferry'
        ? (isWeekendNow() ? FERRY_MIDTOWN : FERRY_PIER11) : NYC;
      const hob = travelMode === 'ferry' ? FERRY_HOBOKEN : HOME;
      setDir(haversine(me, nyc) < haversine(me, hob) ? 'in' : 'out', true);
    },
    () => { if (!manual && dir === null) setDir('out'); },   // denied/failed → default outbound
    {enableHighAccuracy:false, timeout:8000, maximumAge:60000}
  );
}

function setDir(d, fromGeo){
  const changed = d !== dir;
  if (changed) closeBusMap();   // the tracked bus belongs to the old direction
  dir = d;
  // Which board to paint on sight next time, before geolocation has answered.
  try { localStorage.setItem(LAST_DIR_KEY, d); } catch(e){}
  if (fromGeo) document.getElementById('dirSub').textContent = 'from your location';
  if (changed || fromGeo){
    render();
    if (changed) paintOrClear();
    refresh();
  }
}

function fetchT(url){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), TIMEOUT_MS);
  return fetch(url, {signal:c.signal, headers:{'Accept':'application/json'}})
    // A 5xx carrying a JSON body used to sail straight through to render: the
    // outbound board painted "none soon" and marked the feed HEALTHY, i.e. it
    // stated that no buses were coming when it had simply not been told.
    // Failing here routes both directions into the error handling they already
    // have, so a dead proxy reads as "Not updating", never as "no buses".
    .then((res)=>{ if(!res.ok) throw new Error('proxy ' + res.status); return res; })
    .finally(()=>clearTimeout(t));
}

// Reconcile a proxy countdown (minutes as of fetched_at) against the wall clock.
function liveMins(countdown, fetchedAt){
  const m = parseInt(countdown, 10);
  if (!isFinite(m)) return null;
  const drift = fetchedAt ? Math.floor((Date.now()/1000 - fetchedAt)) / 60 : 0;
  return Math.max(0, Math.round(m - drift));
}

function tunnelColor(tt){
  if (!isFinite(tt)) return 'var(--dim)';
  if (tt >= 35) return 'var(--urgent)';
  if (tt >= 20) return 'var(--warn)';
  if (tt >= 10) return 'var(--yellow)';
  return 'var(--live)';
}

// "Do I need to run?" should be answerable by colour, not by reading digits.
// Same idea as tunnelColor and inverted for the same reason: on a tunnel a BIG
// number is the bad one, on a bus a SMALL one is. Null (a clock time rather
// than a countdown) stays inherit — there is no urgency to infer from it.
function minsColor(m){
  if (m === null || !isFinite(m)) return '';
  if (m <= 2) return 'var(--urgent)';
  if (m <= 6) return 'var(--warn)';
  return 'var(--live)';
}

// Bus fullness as 3 ascending bars (cell-signal style) instead of NJT's raw
// "HALF_EMPTY" text. EMPTY→1 green, HALF_EMPTY→2 yellow, FULL→3 red.
function loadBars(passload){
  const key = (passload || '').toUpperCase();
  if (!key || /no data/i.test(key)) return '';
  const lvl = key.includes('FULL') && !key.includes('HALF') ? 3
            : key.includes('HALF') ? 2
            : key.includes('EMPTY') ? 1 : 0;
  if (!lvl) return '';
  const color = ['var(--live)','var(--yellow)','var(--urgent)'][lvl-1];
  const label = ['seats','filling','full'][lvl-1];
  let bars = '';
  for (let i = 1; i <= 3; i++)
    bars += `<i style="height:${4+i*4}px; background:${i<=lvl?color:'var(--line)'}"></i>`;
  return `<span class="load">${bars}<span class="loadlbl">${label}</span></span>`;
}

// The proxy sends NJT's own countdown as `raw_countdown` and a bias-corrected
// `countdown`. We show NJT's number as the headline (so it matches the NJT app)
// and surface the correction as a small "runs ~N late" note.
function njtCountdown(p){
  return (p.raw_countdown != null && p.raw_countdown !== '') ? p.raw_countdown : p.countdown;
}
function lateNote(p){
  const cd = parseInt(p.countdown, 10), rc = parseInt(p.raw_countdown, 10);
  return (isFinite(cd) && isFinite(rc) && cd - rc >= 1)
    ? `<span class="late">runs ~${cd - rc} late</span>` : '';
}

// `stop` (id/name/lat/lon) is threaded through only for the outbound Hoboken
// stops, so only there can a row become tappable. A row earns the map — and the
// pin that advertises it — only when the proxy sent a live GPS fix for the bus
// (p.lat/p.lon); schedule-only rows have no bus behind them and stay inert.
function predRow(p, fetchedAt, compact, stop){
  const m = liveMins(njtCountdown(p), fetchedAt);
  const label = m === null ? (p.departure_text||'') : (m <= 0 ? 'DUE' : m);
  const unit = (m !== null && m > 0) ? '<small>min</small>' : '';
  const load = loadBars(p.passload);
  // Schedule-only: the feed lists this departure but nothing is broadcasting for
  // it. BOTH boards render these (outbound since 2026-08-02) — untagged means a
  // bus is tracked, `sched` means NJT's timetable says so and nothing more. The
  // distinction is the whole point: hiding these showed a gap where the NJT app
  // showed a bus, and promoting them to live invents buses that never arrive.
  const sched = !p.is_live && !p.is_inferred;
  const tag = p.is_inferred ? '<div class="tag est">est</div>'
            : (sched ? '<div class="tag sched">sched</div>' : '');
  const col = sched ? '' : minsColor(m);
  // Fleet number of the actual bus (e.g. 20541), under the fullness bars.
  // The proxy leaves vehicle_id empty for schedule-only trips with no GPS match,
  // so render nothing rather than an empty line in that case.
  const rt = p.vehicle_id ? `<span class="rt">#${p.vehicle_id}</span>` : '';
  const hasPos = stop && p.lat != null && p.lon != null
    && isFinite(+p.lat) && isFinite(+p.lon);
  let mapAttrs = '', mapCls = '', pin = '';
  if (hasPos){
    const slat = (stop.lat != null && isFinite(+stop.lat)) ? ` data-slat="${+stop.lat}"` : '';
    const slon = (stop.lon != null && isFinite(+stop.lon)) ? ` data-slon="${+stop.lon}"` : '';
    mapAttrs = ` data-blat="${+p.lat}" data-blon="${+p.lon}"${slat}${slon}`
      + ` data-sid="${escHtml(stop.id||'')}" data-sname="${escHtml(stop.name||'')}"`
      + ` data-route="${escHtml(p.route||'')}" data-trip="${escHtml(p.trip_id||'')}"`
      + ` data-vid="${escHtml(p.vehicle_id||'')}" data-est="${p.is_inferred ? '1' : ''}"`;
    mapCls = ' mappable';
    pin = '<span class="rowpin" aria-hidden="true">📍</span>';
  }
  return `<div class="row${sched ? ' sched' : ''}${mapCls}"${mapAttrs}${compact ? ' style="padding:10px 12px"' : ''}>
    <span class="mins"${col ? ` style="color:${col}"` : ''}>${label}${unit}${pin}</span>
    <span class="meta">${lateNote(p)}${load}${rt}${tag}</span>
  </div>`;
}

// The feed listed departures and NJT is tracking a bus behind none of them —
// i.e. the vehicles are lost, which is a different statement from "no bus is
// coming". Every row still renders (tagged sched); this only decides wording
// when `upcoming()` has since emptied the column.
function allPhantom(preds){
  return Array.isArray(preds) && preds.length > 0
    && !preds.some(p => p.is_live || p.is_inferred);
}

// Drop departures whose bus has already gone. On fresh data this is a no-op,
// but a board painted from a snapshot (or from the proxy's stale window) is
// minutes behind, and liveMins() clamps at 0 — so a bus that left ten minutes
// ago would sit at "DUE" forever, which is the one thing worse than a blank
// board. One minute of grace, because a genuine "DUE" is still catchable.
function upcoming(preds, fetchedAt){
  if (!Array.isArray(preds)) return preds;
  const drift = fetchedAt ? (Date.now()/1000 - fetchedAt) / 60 : 0;
  return preds.filter(p => {
    const m = parseInt(njtCountdown(p), 10);
    return !isFinite(m) || (m - drift) > -1;
  });
}

// ── The board, shared by both directions ─────────────────────────────────
// One card, a status dot beside the title, and a row of columns underneath.
// Both directions render through this so they cannot drift apart visually —
// only what heads each column differs: PABT gate numbers on the way home, stop
// names on the way out.
function boardCard(title, mode, cols, note, stack){
  const inner = cols.map(c =>
    `<div><div class="colhead">${c.head}</div><div class="rows">${c.rows}</div></div>`).join('');
  // `stack` forces a single column so the entries sit one above the other. The
  // outbound board uses it: two Hoboken stops side by side are too narrow to
  // read, so 13th stacks on top of 15th instead.
  const gt = stack ? '1fr' : `repeat(${cols.length || 1},1fr)`;
  return `<div class="card">
    <h2><span class="dot ${mode}" style="display:inline-block;vertical-align:middle;margin-right:7px"></span>${title}</h2>
    ${note || ''}
    <div class="twocol" style="grid-template-columns:${gt}">${inner}</div>
  </div>`;
}

// Rows for one column: the departures, or a quiet "none soon". `max` caps how
// many show (defaults to MAX_PER_STOP).
function colRows(preds, fetchedAt, max, dropped, stop){
  if (Array.isArray(preds) && preds.length)
    return preds.slice(0, max || MAX_PER_STOP).map(p => predRow(p, fetchedAt, true, stop)).join('');
  // "none soon" asserts something we may not know. If the feed DID list
  // departures and phantom-stripping emptied the column, the fact is that NJT
  // has lost the vehicles — the ~85% dropout — not that no bus is coming.
  return dropped
    ? `<div class="empty nolive">no live bus<span>NJT isn’t tracking one right now</span></div>`
    : '<div class="empty">none soon</div>';
}

// Which dot the card gets, from whatever predictions it ended up with.
function boardMode(preds){
  return preds.some(p => p.is_inferred) ? 'inferred'
       : (preds.some(p => p.is_live) ? 'live' : 'sched');
}

// An upstream failure is NOT the same as "no buses are coming", and saying the
// latter once sent us hunting for a bug in this page when NJT's prediction API
// was simply timing out. Say which it is — once, above the columns, rather than
// repeated inside every one of them.
function feedError(...sources){
  const err = sources.map(s => s && s.error).find(Boolean);
  if (!err) return '';
  return `<div class="empty err">` +
    (/auth/i.test(err) ? 'NJT authentication failed.' : 'NJT feed unreachable right now.') +
    `<br><span style="opacity:.75">Times will return on their own.</span></div>`;
}

// One line straight across: name on the left, the crossing time on the right.
// It used to be a stacked card with a 40px figure, which spent a third of the
// screen on a single number that is only ever context for the bus times above.
function tunnelCard(tunnel){
  const name = `<span class="tname">Lincoln Tunnel</span>`;
  if (!tunnel || tunnel.error){
    return `<div class="card"><div class="tunnel">${name}
      <span class="lbl">unavailable</span><span class="tchev">›</span></div>
      ${tunnelAlertsHtml()}</div>`;
  }
  const tt = parseInt(tunnel.travelTime, 10);
  const c = tunnelColor(tt);
  return `<div class="card"><div class="tunnel">${name}
    <span class="big" style="color:${c}">${isFinite(tt)?tt:'--'}</span>
    <span class="lbl">min</span><span class="tchev">›</span></div>
    ${tunnelAlertsHtml()}</div>`;
}

// ── Lincoln Tunnel advisories (tap the tunnel row) ────────────────────────
// Fetched ONLY on tap, never on the 15s poll: the upstream is Port Authority's
// alert feed via the proxy, and PANYNJ throttles chatty callers.
const TUNNEL_ALERTS_TTL_MS = 120000;
let tunnelAlerts = null;          // last response, or {alerts:[],error}
let tunnelAlertsAt = 0;
let tunnelAlertsLoading = false;

// PANYNJ text is third-party content going into innerHTML — escape it.
function escHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, ch => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function tunnelAlertsHtml(){
  let inner;
  if (!tunnelAlerts){
    inner = tunnelAlertsLoading
      ? '<div class="ta-empty">Checking Port Authority…</div>'
      : '<div class="ta-empty">Tap for recent alerts</div>';
  } else if (tunnelAlerts.error){
    inner = '<div class="ta-empty err">Alerts unavailable</div>';
  } else if (!(tunnelAlerts.alerts || []).length){
    inner = `<div class="ta-empty">No alerts in the past ${tunnelAlerts.window_hours || 2} hours</div>`;
  } else {
    inner = tunnelAlerts.alerts.map(a =>
      `<div class="ta-item${a.resolved ? ' resolved' : ''}">
         <span class="ta-time">${escHtml(a.time)}</span>
         <span class="ta-msg">${escHtml(a.message)}</span>
       </div>`).join('');
  }
  return `<div class="tunnel-alerts">${inner}</div>`;
}

// Repaint just the alerts block, so loading state lands without waiting for the
// next 15s render (and without disturbing the bus columns).
function paintTunnelAlerts(){
  document.querySelectorAll('.tunnel-alerts').forEach(n => { n.outerHTML = tunnelAlertsHtml(); });
}

function loadTunnelAlerts(){
  if (tunnelAlertsLoading) return;
  if (tunnelAlerts && !tunnelAlerts.error && Date.now() - tunnelAlertsAt < TUNNEL_ALERTS_TTL_MS) return;
  tunnelAlertsLoading = true;
  paintTunnelAlerts();
  fetchT(PROXY_URL + '/tunnel_alerts')
    .then(r => r.json())
    .then(d => { tunnelAlerts = d; tunnelAlertsAt = Date.now(); })
    .catch(() => { tunnelAlerts = {alerts: [], error: true}; })
    .finally(() => { tunnelAlertsLoading = false; paintTunnelAlerts(); });
}

// Delegated: #content survives the repaint, the cards inside it do not. Bound on
// the row only, so tapping an alert doesn't collapse the list you just opened.
// (Guarded: an unguarded null here would throw at parse-time-adjacent script
// level and leave the page inert at "Loading…", same failure mode the
// localStorage try/catch below exists to prevent.)
const _contentEl = document.getElementById('content');
if (_contentEl) _contentEl.addEventListener('click', (e) => {
  if (!e.target.closest('.tunnel')) return;
  if (document.body.classList.toggle('show-tunnel-alerts')) loadTunnelAlerts();
});

// Header ETA — total door-to-door minutes, centered at the top of the page.
// `sched` = this total was built from a departure NJT lists but isn't tracking.
// Dimmed rather than annotated: the row it came from is on screen a few pixels
// below carrying the `sched` tag, so the number only has to agree with it.
function setHdrEta(mins, sched){
  const el = document.getElementById('hdrEta');
  el.innerHTML = (mins !== null && isFinite(mins)) ? `${mins}<small>min total</small>` : '';
  el.classList.toggle('sched', !!sched);
}

// Outbound: to NYC. Uses proxy `/` (stops 20514, 20523 + tunnel).
async function refreshOut(){
  const res = await fetchT(PROXY_URL);
  const data = await res.json();
  saveSnap('out', data);          // before renderOut, which filters in place
  // Flipped while this was in flight — the board on screen is the other
  // direction's now, and painting this over it would be simply wrong. The same
  // is true of the MODE: tapping Ferry during a cold 4-5s fetch used to end with
  // bus times landing on top of the ferry board seconds later.
  if (dir !== 'out' || travelMode !== 'bus') return;
  cancelSnap();                   // fresh data won the race
  everLoaded = true;
  renderOut(data);
}

// Rendering is split from fetching so the same board can be drawn from a
// localStorage snapshot on open, seconds before the network answers.
// `live` false = painted from a snapshot: don't let it reset the health footer,
// which is tracking the real fetch behind it.
function renderOut(data, live){
  lastFetchedAt = data.fetched_at || Math.floor(Date.now()/1000);
  const s2 = data.stops && data.stops['20523'];
  const s3 = data.stops && data.stops['20514'];
  // True when NJT listed departures but is tracking a bus behind none of them.
  // Only Washington & 13th needs it: 15th & Willow is only given a column when a
  // 119 is genuinely coming, so its empty branch is unreachable.
  const drop3 = allPhantom(s3 && s3.predictions);
  // Drop anything that has already left, which only bites when this data is a
  // few minutes old. Timetable rows are NOT stripped here any more — the proxy
  // tags them is_scheduled and predRow renders them dimmed, because hiding them
  // outright showed a gap where the NJT app showed a bus (2026-08-02).
  if (s2) s2.predictions = upcoming(s2.predictions, lastFetchedAt);
  if (s3) s3.predictions = upcoming(s3.predictions, lastFetchedAt);
  // 15th & Willow is the 119 stop (the 126 is covered at Washington & 13th) —
  // show only 119s there. Applies to the header ETA below too.
  if (s2 && Array.isArray(s2.predictions))
    s2.predictions = s2.predictions.filter(p => p.route === '119');

  const p3 = Array.isArray(s3 && s3.predictions) ? s3.predictions : [];
  const p2 = Array.isArray(s2 && s2.predictions) ? s2.predictions : [];
  // Same shape as the ride home, with the stop name where the gate number goes.
  // Washington & 13th always holds its column — it's the stop you actually walk
  // to. 15th & Willow only earns one when a 119 is genuinely coming; an empty
  // column for a bus that runs a few times an hour is just dead space.
  // Stacked, not side by side: 13th on top with up to 4 departures, 15th below
  // with up to 3. 15th only earns its block when a 119 is genuinely coming.
  // Stop context so a tapped row can put the bus and its stop on a map. Coords
  // come from the proxy payload (added alongside `name`); an older proxy without
  // them simply yields no `data-slat` and the map centres on the bus alone.
  const stop3 = {id: '20514', name: 'Washington & 13th', lat: s3 && s3.lat, lon: s3 && s3.lon};
  const stop2 = {id: '20523', name: '15th & Willow',     lat: s2 && s2.lat, lon: s2 && s2.lon};
  const cols = [{head: 'Washington & 13th', rows: colRows(p3, lastFetchedAt, 4, drop3, stop3)}];
  if (p2.length) cols.push({head: '15th & Willow', rows: colRows(p2, lastFetchedAt, 3, null, stop2)});

  let html = boardCard('To Port Authority', boardMode(p3.concat(p2)), cols,
                       feedError(s3 && s3.predictions, s2 && s2.predictions), true);
  html += tunnelCard(data.tunnel);
  document.getElementById('content').innerHTML = html;

  // Total: walk to the stop + next bus at Washington & 13th + tunnel-adjusted
  // ride to PABT. No walk is added at the far end — the office is at PABT.
  // The next departure at Washington & 13th, tracked or not: the header and the
  // board's top row have to name the same bus, so this reads p3[0] rather than
  // hunting for the first live one. setHdrEta dims it when that bus is only
  // scheduled.
  const next3 = p3.length ? p3[0] : null;
  const wait = next3 ? liveMins(njtCountdown(next3), lastFetchedAt) : null;
  const tt = data.tunnel && !data.tunnel.error ? parseInt(data.tunnel.travelTime,10) : NaN;
  const delay = isFinite(tt) ? Math.max(0, tt - TUNNEL_FREEFLOW) : 0;
  setHdrEta(wait !== null ? wait + RIDE_BASE_MIN + delay + WALK_TO_STOP_MIN : null,
            next3 && !next3.is_live && !next3.is_inferred);
  if (live !== false) markHealth(data);
  markFreshness(data);
  updateBusMap(data);   // move the marker if a bus map is open
}

// Inbound: to Hoboken. Uses proxy `?mode=commute_home` (Hoboken-bound 126 from PABT).
// Falls back gracefully until the proxy ships that mode.
async function refreshIn(){
  let homeData = null;
  try {
    const r = await fetchT(PROXY_URL + '?mode=commute_home');
    homeData = await r.json();
  } catch(e){ homeData = {error:'unavailable'}; }
  // Only snapshot a real inbound response — see the `supported` gate below.
  if (homeData && Array.isArray(homeData.predictions)) saveSnap('in', homeData);
  if (dir !== 'in' || travelMode !== 'bus') return;   // flipped mid-fetch; see refreshOut
  cancelSnap();               // fresh data won the race
  everLoaded = true;
  renderIn(homeData);
}

// How many polls a PABT gate keeps its column after dropping out of the feed.
// Two is enough to ride out a single-cycle blip without pinning a gate that has
// genuinely closed for the evening.
const GATE_HOLD_POLLS = 2;
const gateHold = {};

// Split from the fetch for the same reason as renderOut: this is what paints a
// stored board the instant the page opens.
function renderIn(homeData, live){
  // Only trust data from the real commute_home mode. Before the proxy ships it,
  // `?mode=commute_home` falls through to the default (outbound) response, whose
  // `tunnel` is the ToNY crossing — wrong direction for the ride home. Gate on
  // the `predictions` key, which only the real inbound response carries.
  const preds = homeData && Array.isArray(homeData.predictions) ? homeData.predictions : null;
  const supported = Array.isArray(preds);
  const tunnel = supported ? (homeData.tunnel || null) : null;   // ToNJ / homebound

  let html = '';
  // Only reachable if the proxy answers without a `predictions` key, i.e. it is
  // genuinely broken or mid-deploy. Says what the user can do, not what the
  // developer was mid-way through shipping.
  if (!supported){
    html += `<div class="note">Inbound times aren’t available right now.
      They’ll come back on their own.</div>`;
  }
  lastFetchedAt = (homeData && homeData.fetched_at) || Math.floor(Date.now()/1000);
  // The 126 is the only bus home. During rush hour it leaves from two PABT gates
  // (213 and 214) -> one column per gate; off-peak there's a single gate (often a
  // different number entirely). Group by the gate the feed actually reports so
  // the headers stay correct when NJT moves the stop -- never hardcode 213/214.
  // PABT is an origin terminal, so a scheduled departure with no live vehicle
  // yet is a real bus about to leave — this board never stripped them, and as of
  // 2026-08-02 the outbound board doesn't either. Just drop buses already gone.
  const realPreds = upcoming(preds, lastFetchedAt) || [];
  // "213-1" -> "213": drop the sub-lane suffix. Blank gate => no header number.
  const gateOf = p => ((p.gate || '').split(/[-\s]/)[0] || '').trim();
  const gateKeys = [];
  const byGate = {};
  for (const p of realPreds){
    const g = gateOf(p);
    if (!(g in byGate)){ byGate[g] = []; gateKeys.push(g); }
    byGate[g].push(p);
  }
  // Gates come and go with the feed's dropout, and #content is rebuilt from
  // scratch every poll — so a gate absent for a single cycle let the gate below
  // it slide up into its screen position, under a thumb already on the way
  // down. Hold a vanished gate's column for a couple of polls with an explicit
  // placeholder instead. Live data only: repainting a snapshot must not age the
  // hold out, or backgrounding the tab would expire every gate at once.
  // Held gates are RENDERED on every paint, but only aged by a live one. A
  // snapshot repaint is the same board drawn again, not another poll's worth of
  // evidence that the gate is gone — letting it decrement meant reopening the
  // tab collapsed the layout immediately, which is what this exists to stop.
  if (supported){
    if (live !== false) for (const g of gateKeys) gateHold[g] = GATE_HOLD_POLLS;
    for (const g of Object.keys(gateHold)){
      if (g in byGate) continue;
      if (live !== false && --gateHold[g] <= 0){ delete gateHold[g]; continue; }
      byGate[g] = [];
      gateKeys.push(g);
    }
  }
  // Ascending gate order (213 left, 214 right); a blank/unknown gate sorts last.
  gateKeys.sort((a,b) => (a === '') - (b === '')
    || (parseInt(a,10) || 0) - (parseInt(b,10) || 0)
    || a.localeCompare(b));
  // No buses at all -> keep one empty column so the card isn't blank.
  const cols = gateKeys.length
    ? gateKeys.map(g => ({head: g ? ('Gate ' + g) : '126',
                          rows: colRows(byGate[g], lastFetchedAt, null,
                                        byGate[g].length === 0)}))
    : [{head: '126', rows: colRows([], lastFetchedAt)}];
  // Stacked (gates sorted ascending -> 213 on top, 214 below), not side by side.
  html += boardCard('Home from Port Authority', boardMode(realPreds), cols,
                    feedError(homeData), true);
  html += tunnelCard(tunnel);

  // ETA home (shown in the header): next departure + tunnel-adjusted ride + walk.
  let total = null;
  // realPreds, NOT preds — the header total must use the same phantom-filtered
  // list as the board below it, or it can be built from a departure with no bus
  // behind it. (The proxy also strips phantoms server-side; this is the belt to
  // that braces.) `?? 0` not `|| 0`: liveMins returns null for an unparseable
  // countdown, and `||` silently turned that into "due now".
  if (supported && realPreds.length){
    const next = liveMins(njtCountdown(realPreds[0]), lastFetchedAt) ?? 0;
    const tt = tunnel && !tunnel.error ? parseInt(tunnel.travelTime,10) : NaN;
    const delay = isFinite(tt) ? Math.max(0, tt - TUNNEL_FREEFLOW) : 0;
    total = next + RIDE_BASE_MIN + delay + WALK_MIN;
  }
  document.getElementById('content').innerHTML = html;
  setHdrEta(total);
  if (live !== false) markHealth(supported ? homeData : null);
  markFreshness(homeData);
}

let lastOkAt = 0;
// A dead feed used to keep firing at the flat 15s poll indefinitely. Back off
// instead — but cap at 60s rather than the couple of minutes you would normally
// pick: this is a bus board, and being slow to notice the feed came back is
// worse than the handful of requests it saves.
const MAX_BACKOFF_MS = 60000;
let failStreak = 0, nextTryAt = 0;
function noteOk(){ failStreak = 0; nextTryAt = 0; }
function noteFail(){
  failStreak++;

  // first rungs of the backoff ladder are seconds, not poll cycles — and the
  // retry is scheduled directly, because the 15s interval tick is the only
  // thing that honours nextTryAt and it may be most of a cycle away.
  const base = everLoaded ? POLL_MS : 5000;
  const wait = Math.min(MAX_BACKOFF_MS, base * Math.pow(2, failStreak - 1));
  nextTryAt = Date.now() + wait;
  if (!everLoaded){
    clearTimeout(catchupTimer);
    catchupTimer = setTimeout(() => { catchupTimer = null; refresh(); }, wait);
  }
}

function markHealth(data){
  const ok = !!data;
  const el = document.getElementById('staleMsg');
  const fmt = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if (ok) {
    noteOk();
    lastOkAt = Date.now();
    el.hidden = true; el.textContent = '';
    document.body.classList.remove('stale');
  } else {
    noteFail();
    // The one thing the board above genuinely cannot tell you: it has stopped
    // updating. Frozen countdowns look exactly like live ones.
    el.hidden = false;
    el.textContent = lastOkAt
      ? 'Not updating — times are from ' + fmt(lastOkAt)
      : 'Can’t reach the bus feed';
    document.body.classList.add('stale');
  }
}

// How old the times on screen actually are — a separate question from whether
// the last fetch worked. A payload can be perfectly healthy and still be
// minutes behind: served out of the proxy's stale-while-revalidate window, or
// painted from localStorage before the network answered. Say so and dim it
// rather than passing it off as live. When the feed is genuinely down,
// markHealth owns the footer and the dimming, so leave both alone.
// While the board is dimmed "updating…", every poll is a ~2ms cache hit on the
// proxy while its background NJT refresh runs — so ask every few seconds, not
// every 15. Measured 2026-07-31 9:31pm: the refresh finished at 9:32:01 and the
// page didn't come back for it until 9:32:26; with the 90s pending threshold on
// top, that read as 43 seconds of "updating…". Only while the feed is HEALTHY:
// a failing fetch belongs to noteFail's backoff, and fast-polling a dead proxy
// would undo exactly what that backoff exists for.
const CATCHUP_MS = 4000;
let catchupTimer = null;
function scheduleCatchup(on){
  clearTimeout(catchupTimer); catchupTimer = null;
  if (!on || failStreak) return;
  catchupTimer = setTimeout(() => { catchupTimer = null; refresh(); }, CATCHUP_MS);
}

function markFreshness(data){
  if (document.body.classList.contains('stale')){ scheduleCatchup(false); return; }
  const el = document.getElementById('staleMsg');
  const age = snapAge(data);
  const behind = isFinite(age) && age > PENDING_AGE_S;
  document.body.classList.toggle('pending', behind);
  scheduleCatchup(behind);
  if (behind){
    const fmt = t => new Date(t*1000).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    el.hidden = false;
    el.textContent = 'Times from ' + fmt(data.fetched_at) + ' — updating…';
  } else {
    el.hidden = true;
    el.textContent = '';
  }
}

// Say the board is behind BEFORE the fetch goes out, not after it lands. The
// treatment below already existed but only ever ran on arriving data, so the
// commonest interaction there is — tile hidden ten minutes in a pocket, pulled
// out on the platform, cold proxy taking ~5s — showed a ten-minute-old
// countdown at full confidence for that entire window. Countdowns are computed
// once at render and never decay, so "4 min" can mean a bus that left six
// minutes ago.
function markPendingIfStale(){
  if (!everLoaded || !lastFetchedAt) return;
  markFreshness({fetched_at: lastFetchedAt});
}

// Draw the stored board for the current direction right now, ahead of any
// network call. `false` = not live, so it can't touch the health footer that
// the real fetch behind it is still deciding.
function paintSnap(data){
  try { (dir === 'in' ? renderIn : renderOut)(data, false); return true; }
  catch(e){ console.error(e); return false; }
}

// The stored board is a fallback for a slow network, NOT the default view.
// Painting it immediately meant every open showed old times that you then had
// to watch correct themselves — which reads as "slow to update" even though it
// was the opposite. Since the proxy answers a warm cache in ~0.1s, holding the
// snapshot back for a beat means the fresh board almost always wins the race
// and the stale one is never seen; on a genuinely slow or cold fetch it still
// appears fast enough to beat a blank screen.
// 250ms, not the original 600ms. That 600 was chosen on the assumption quoted
// above — a warm proxy answering in ~0.1s — which holds INSIDE the commute
// window and nowhere else: measured cold, the proxy takes 4.4-4.9s, so off-peak
// this spent 600ms on a blank screen before a four-second wait. 250ms still
// comfortably loses the race to a warm response (~80ms local, ~150ms via the
// tailnet), so the snapshot stays unseen exactly when it should be.
const SNAP_PAINT_DELAY_MS = 250;
let snapTimer = null;
// The snapshot is a BUS concept — it is a stored copy of a fetched board, and
// the ferry has nothing to fetch. Checked both when arming and when firing:
// arming covers a flip made while already on the ferry, firing covers a tap on
// the Ferry tab in the 250ms after a bus snapshot was armed.
function scheduleSnap(d){
  if (travelMode !== 'bus') return;
  const snap = loadSnap(d);
  if (!snap) return;
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    snapTimer = null;
    // still the same direction, still on the bus, still waiting
    if (dir === d && travelMode === 'bus') paintSnap(snap);
  }, SNAP_PAINT_DELAY_MS);
}
// Real data landed — drop any snapshot still queued behind it.
function cancelSnap(){ clearTimeout(snapTimer); snapTimer = null; }

// Entering a direction: show its last-good board immediately if there is one,
// instead of blanking to "Loading…" for however long NJT takes to answer.
function paintOrClear(){
  setHdrEta(null);
  // Ferry mode loads nothing: refreshFerry() paints the local timetable in this
  // same tick, so "Loading…" would be a lie and there is no race for a stored
  // board to lose. Flipping direction on the ferry used to arm a BUS snapshot
  // here, which then landed on top of the ferry board 250ms later — the board
  // was right for a quarter of a second and then showed buses.
  if (travelMode !== 'bus') return;
  document.getElementById('content').innerHTML = '<div class="empty">Loading…</div>';
  scheduleSnap(dir);   // only lands if the fetch is slower than the delay
}

// Ferry board. No network at all — the timetable is local, so this also works
// with the proxy down.
function refreshFerry(){
  cancelSnap();               // this board won the race, same as the bus paths
  const leg = FERRY[isWeekendNow() ? 'weekend' : 'weekday'][dir === 'out' ? 'out' : 'in'];
  const list = nextFerries(leg.times, 4);
  let rows;
  if (list === null){
    rows = `<div class="empty">Weekend ${dir === 'out' ? 'outbound' : 'return'}
      times aren't loaded yet.</div>`;
  } else if (!list.length){
    rows = `<div class="empty">No more ferries today on this route.</div>`;
  } else {
    // Same .mins/.meta shape as predRow so a ferry row reads identically to a
    // bus row -- countdown on the left, detail on the right.
    rows = list.map(f =>
      `<div class="row">
        <span class="mins">${f.wait <= 0 ? 'DUE' : f.wait}${f.wait > 0 ? '<small>min</small>' : ''}</span>
        <span class="meta">⛴️ ${f.label}</span>
      </div>`).join('');
  }
  document.getElementById('content').innerHTML =
    `<div class="card"><h2>${leg.label}</h2><div class="rows">${rows}</div></div>`;
  setHdrEta(list && list.length ? list[0].wait : null);
  // The ferry board is a local timetable — nothing was fetched, so there is no
  // upstream that can go stale and nothing for the footer to warn about.
  markHealth({});
}

function render(){
  const out = dir === 'out';
  const ferry = travelMode === 'ferry';
  document.getElementById('dirText').textContent = out ? 'To NYC' : 'To Hoboken';
  if (manual) document.getElementById('dirSub').textContent = 'manual';

let inFlight = null, inFlightDir = null;
// Set once real data has rendered. Until then this page has nothing to show
// but a stored board, so it fetches regardless of visibility — see below.
let everLoaded = false;
// Inside the launcher this page lives in an iframe that is swapped out rather
// than unloaded, so `document.hidden` follows the TOP-level document and stays
// false the whole time the tile is off screen. The launcher posts
// {type:'hidden'} / {type:'shown'} for exactly this; until we tracked it the
// 15s poll kept billing the proxy while Jeff sat on the launcher home screen.
let frameHidden = false;
// `isPoll` marks the unattended 15s tick. Only those are subject to backoff —
// a pull-to-refresh, a flip, or coming back to the tile always tries at once.
function refresh(isPoll){
  if (dir === null) return Promise.resolve();
  // `document.hidden` keeps a BACKGROUNDED tab from polling, because every poll
  // is a billable request on the proxy. But a freshly launched iOS PWA reports
  // hidden for its first seconds, and bailing out there meant the very first
  // fetch never went out: the stored board sat under "Times from … — updating…"
  // until visibilitychange or the 15s poll finally fired. Measured with the tab
  // hidden: board painted, zero requests attempted. So the guard applies to
  // POLLING, never to the first load.
  if ((document.hidden || frameHidden) && everLoaded) return Promise.resolve();
  if (isPoll && failStreak && Date.now() < nextTryAt) return Promise.resolve();
  if (travelMode === 'ferry'){
    try { refreshFerry(); } catch(e){ console.error(e); }
    return Promise.resolve();
  }
  // Coalesce. Opening the page fires a fetch straight away and geolocation
  // resolving fires another a beat later; without this both go out, and the
  // first one is the slow uncached one we're trying to hide.
  if (inFlight && inFlightDir === dir) return inFlight;
  markPendingIfStale();
  inFlightDir = dir;
  inFlight = (dir === 'out' ? refreshOut() : refreshIn())
    .catch(e => { console.error(e); markHealth(null); })
    .finally(() => { inFlight = null; });
  return inFlight;
}

// Pull down at the top of the board to refresh — replaces the old ↻ button.
// Native PTR does not fire in an installed iOS PWA, so this is a custom gesture;
// onRefresh returns refresh()'s promise so the spinner tracks the real fetch.
function attachPullToRefresh(scroller, onRefresh, canStart){
  const usePage = scroller === document.scrollingElement
    || scroller === document.documentElement || scroller === document.body;
  const target = usePage ? window : scroller;
  const topOf = () => usePage
    ? (window.scrollY || document.documentElement.scrollTop || 0) : scroller.scrollTop;
  const THRESH = 68, MAX = 100, MIN_SPIN = 600;
  const ind = document.createElement('div');
  ind.className = 'ptr'; ind.innerHTML = '<div class="ptr-spin"></div>';
  document.body.appendChild(ind);
  let startY = 0, active = false, dist = 0, busy = false;
  const set = (d, ready, spin) => {
    ind.style.transform = 'translateX(-50%) translateY(' + d + 'px)';
    ind.style.opacity = d > 4 ? '1' : '0';
    ind.classList.toggle('ready', !!ready);
    ind.classList.toggle('spinning', !!spin);
  };
  // touchmove has to be non-passive (it calls preventDefault to own the drag),
  // but registering it permanently on window makes Safari block every scroll
  // frame on JS for a handler that early-returns on all but a gesture starting
  // at the very top. So it is attached only for the life of such a gesture.
  const onMove = e => {
    if (!active || busy) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0 || topOf() > 0){ endGesture(); return; }
    e.preventDefault();
    dist = Math.min(MAX, dy * 0.5);
    set(dist, dist >= THRESH);
  };
  const detachMove = () => target.removeEventListener('touchmove', onMove);
  function endGesture(){
    active = false;
    if (dist) set(0, false);
    dist = 0;
    detachMove();
  }
  target.addEventListener('touchstart', e => {
    if (busy || e.touches.length !== 1){ active = false; detachMove(); return; }
    active = topOf() <= 0 && (!canStart || canStart());
    startY = e.touches[0].clientY; dist = 0;
    // Re-adding an identical listener is a no-op, so repeat touches can't stack.
    if (active) target.addEventListener('touchmove', onMove, {passive:false});
  }, {passive:true});
  const finish = () => {
    if (busy) return;
    detachMove();
    if (active && dist >= THRESH){
      busy = true; active = false; set(THRESH, true, true);
      const t0 = Date.now();
      Promise.resolve().then(onRefresh).catch(()=>{}).then(() => {
        setTimeout(() => { busy = false; dist = 0; set(0,false); },
                   Math.max(0, MIN_SPIN - (Date.now() - t0)));
      });
    } else { active = false; dist = 0; set(0,false); }
  };
  target.addEventListener('touchend', finish, {passive:true});
  target.addEventListener('touchcancel', finish, {passive:true});
}

function setMode(m){

// ---- Self-report position ------------------------------------------------
// Life360's fixes lag minutes, so the family ETAs can call you a "walk" while

}
function setBusMarker(lat, lon, est, vid){
  if (!_busMk) _busMk = L.marker([lat, lon], {icon: busIcon(est, vid), zIndexOffset: 1000}).addTo(_map);
  else { _busMk.setLatLng([lat, lon]); _busMk.setIcon(busIcon(est, vid)); }
}
function setStopMarker(lat, lon){
  if (lat == null || lon == null || !isFinite(lat) || !isFinite(lon)){
    if (_stopMk){ _map.removeLayer(_stopMk); _stopMk = null; }
    return;
  }
  if (!_stopMk) _stopMk = L.marker([lat, lon], {icon: stopIcon()}).addTo(_map);
  else _stopMk.setLatLng([lat, lon]);
}

// Fit both points on open; on later polls just slide the marker so the map
// doesn't yank the view out from under a pan/zoom.
function fitBusMap(){
  const pts = [[openBus.blat, openBus.blon]];
  if (isFinite(openBus.slat) && isFinite(openBus.slon)) pts.push([openBus.slat, openBus.slon]);
  if (pts.length > 1) _map.fitBounds(pts, {padding: [60, 60], maxZoom: 16});
  else _map.setView(pts[0], 15);
}

function setFoot(mins, est, stale){
  const dot = document.getElementById('bmDot');
  const txt = document.getElementById('bmFootTxt');
  dot.className = 'bm-dot' + ((est || stale) ? ' stale' : '');
  if (stale){ txt.textContent = 'Live position lost — showing where it last was'; return; }
  const eta = (mins == null || !isFinite(mins)) ? '' : (mins <= 0 ? 'arriving now' : mins + ' min away');
  txt.textContent = [est ? 'estimated from GPS' : 'live', eta].filter(Boolean).join(' · ');
}

function buildBusMap(){
  const box = document.getElementById('busMapCanvas');
  if (!_map){
    box.innerHTML = '';   // clear any prior offline-fallback message
    _map = L.map(box, {zoomControl: true, attributionControl: false});
    L.tileLayer(MAP_TILE_URL, {maxZoom: 19}).addTo(_map);
  }
  _map.invalidateSize();
  setStopMarker(openBus.slat, openBus.slon);
  setBusMarker(openBus.blat, openBus.blon, openBus.est, openBus.vid);
  fitBusMap();
}

function showMapFallback(lat, lon){
  const box = document.getElementById('busMapCanvas');
  box.innerHTML = `<div style="padding:24px; color:var(--dim); font-size:14px; line-height:1.5">
    Couldn’t load the map.<br>
    <a class="reset" target="_blank" rel="noopener"
       href="https://maps.google.com/?q=${lat},${lon}">Open the bus location in Google Maps ›</a></div>`;
}

function openBusMap(row){
  const d = row.dataset;
  const blat = parseFloat(d.blat), blon = parseFloat(d.blon);
  if (!isFinite(blat) || !isFinite(blon)) return;
  openBus = {
    sid: d.sid || '', trip: d.trip || '', vid: d.vid || '', route: d.route || '',
    sname: d.sname || '', est: d.est === '1',
    slat: parseFloat(d.slat), slon: parseFloat(d.slon), blat, blon,
  };
  document.getElementById('bmTitle').textContent = (openBus.route || 'Bus') + ' · to Port Authority';
  document.getElementById('bmSub').textContent = openBus.sname;
  // Seed the footer from the number already on the row, so it reads right the
  // instant the map opens; updateBusMap refines it on the next poll.
  const minsTxt = (row.querySelector('.mins') || {}).textContent || '';
  const mm = minsTxt.match(/\d+/);
  const due = /due|now|arriv/i.test(minsTxt);
  setFoot(due ? 0 : (mm ? parseInt(mm[0], 10) : null), openBus.est, false);
  document.body.classList.add('show-busmap');
  ensureLeaflet().then(buildBusMap).catch(() => showMapFallback(blat, blon));
}

// Called at the end of every outbound render. If a map is open, re-find the bus
// in the fresh payload and slide its marker; if it has dropped out of the feed,
// keep the last position but mark it stale.
function updateBusMap(data){
  if (!openBus || !window.L || !_map) return;
  const s = data && data.stops && data.stops[openBus.sid];
  const preds = s && Array.isArray(s.predictions) ? s.predictions : [];
  const p = preds.find(x =>
    (openBus.trip && x.trip_id === openBus.trip) ||
    (openBus.vid && x.vehicle_id === openBus.vid));
  if (p && p.lat != null && p.lon != null && isFinite(+p.lat) && isFinite(+p.lon)){
    openBus.blat = +p.lat; openBus.blon = +p.lon; openBus.est = !!p.is_inferred;
    // NJT populates vehicle_id inconsistently, so a bus matched by trip number
    // can gain a fleet number partway through — take it when it shows up, but
    // never blank an id we already have.
    if (p.vehicle_id) openBus.vid = p.vehicle_id;
    setBusMarker(openBus.blat, openBus.blon, openBus.est, openBus.vid);
    setFoot(liveMins(njtCountdown(p), data.fetched_at || Math.floor(Date.now()/1000)),
            openBus.est, false);
  } else {
    setFoot(null, openBus.est, true);
  }
}

function closeBusMap(){
  document.body.classList.remove('show-busmap');
  openBus = null;
}

document.getElementById('bmClose').addEventListener('click', closeBusMap);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('show-busmap')) closeBusMap();
});
// Delegated on #content (rebuilt every poll). Distinct from the tunnel handler
// above — a `.row.mappable` is never a `.tunnel`, so the two don't collide.
if (_contentEl) _contentEl.addEventListener('click', e => {
  const row = e.target.closest('.row.mappable');
  if (row) openBusMap(row);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('commute-sw.js').catch(e => console.warn('SW reg failed', e));
  });
}
</script>
</body>
</html>
