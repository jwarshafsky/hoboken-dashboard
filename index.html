<!DOCTYPE html>
<!--
  Hoboken Family Dashboard
  ========================
  Charter: A wall display that tells the Warshafskys where their people are
  and what's next. Family presence is the primary use case; transit, weather,
  and alerts are supporting data. Anything that doesn't serve that single
  sentence goes in a "maybe" file, not in here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Hoboken Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>

<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23151520'/><path fill='%236bffb8' d='M14 40c0 2.2 1 4.2 2.5 5.5V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-2.5h20V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-4.5c1.5-1.4 2.5-3.3 2.5-5.5V15c0-8.75-8.95-10-20-10S14 6.25 14 15v25zm8.75 2.5c-2.1 0-3.75-1.7-3.75-3.75S20.65 35 22.75 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm22.5 0c-2.1 0-3.75-1.7-3.75-3.75S43.15 35 45.25 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm3.75-15h-30V15h30v12.5z'/></svg>">
<style>
  /* ─────────────────────────────────────────────────────────────────
     Design tokens — keep all radii, font sizes, and key colors here.
     New panels MUST reuse these instead of introducing new values.
     ───────────────────────────────────────────────────────────────── */
  :root {
    /* Border radii */
    --r-card:  14px;
    --r-chip:  8px;
    --r-pill:  999px;
    --r-badge: 4px;

    /* Font sizes (4-tier + 1 sub for emphasis numbers) */
    --fs-micro: 0.6rem;   /* tiny labels (badges, day headers, micro status) */
    --fs-label: 0.75rem;  /* secondary text */
    --fs-body:  0.95rem;  /* primary readable content */
    --fs-sub:   1.4rem;   /* secondary numbers (tunnel min, hop ETA) */
    --fs-hero:  2.4rem;   /* time, temperature */

    /* Semantic colors */
    --c-live:   #6bffb8;  /* GREEN: reserved for live-state ONLY */
    --c-urgent: #ff6b6b;  /* RED: actionable urgency (≤5min bus, alerts) */
    --c-warn:   #ffb84d;  /* AMBER: warnings */
    --c-text:   #e8e8ec;
    --c-label:  #9a9aa8;
    --c-mute:   #888;
    --c-deep:   #0a0a0f;
    --c-border: #2a2a35;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    background: #000;
    color: #e8e8ec;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 0.67fr 1.62fr 0.97fr;
    grid-template-rows: 1fr auto auto;
    gap: 10px;
    padding: 12px;
  }

  /* TV simulation mode — body becomes a fixed 1920x1080 surface that's scaled
     to fit the browser window. Activate by adding ?tv to the URL. */
  html.tv-sim {
    background: #000;
    overflow: hidden;
  }
  html.tv-sim body {
    width: 930px;
    height: 539px;
    transform-origin: top left;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* Cards */
  .card {
    background: #0a0a0f;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 0.5px solid #2a2a35;
  }

  .card-title {
    font-size: var(--fs-micro);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9a9aa8;
    margin-bottom: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-title svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  /* Clock card — hidden (map takes full left) */
  .clock-card {
    display: none;
  }

  .time {
    font-size: var(--fs-hero);
    font-weight: 200;
    letter-spacing: 0.02em;
    line-height: 1;
    color: #fff;
    white-space: nowrap;
  }

  .date-line {
    font-size: var(--fs-label);
    font-weight: 300;
    color: #888;
    margin-top: 4px;
  }

  /* Weather card — bottom-right. Three vertical zones:
       1) HERO  : big icon + hero temp + desc + hi/lo + rain pill
       2) HOURLY: 7-step hourly forecast strip
       3) STATS : wind / humidity / pollen as 3 labeled stat blocks
     Sized to fit ~2× transit-card height × column-3 width. */
  .weather-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
  }
  /* Shift hero (icon+temp) and summary (desc+hi/lo) upward, opening
     more breathing room between the summary and the forecast strip below. */
  .weather-top { transform: translateY(-6px); }
  .weather-summary { transform: translateY(-6px); }

  .weather-main { display: contents; }  /* transparent wrapper */

  /* HERO ROW ------------------------------------------------------- */
  /* Icon and temperature share one row, centered with equal space on
     either side of each — space-evenly distributes the leftover width
     equally between left edge, between items, and right edge. */
  .weather-top {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-evenly;
    padding: 2px 2px 0;
  }

  .weather-icon {
    flex-shrink: 0;
    width: 54px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .weather-icon svg { width: 100%; height: 100%; }

  /* Weather icon animations — applied only to the main (hero) icon, not the
     small hourly icons (which would be too busy at 20px). Each weather type
     gets a subtle motion appropriate to its phenomenon. Respects
     prefers-reduced-motion (see global rule near ferry-wave). */

  /* Sun: slow rotation — rays sweep around the disc. */
  .weather-icon .wi-sun .sun-body,
  .weather-icon .wi-partly_cloudy .sun-body {
    transform-origin: 12px 12px;
    transform-box: fill-box;
    animation: wx-sun-spin 30s linear infinite;
  }
  .weather-icon .wi-partly_cloudy .sun-body {
    transform-origin: 6.5px 6.5px;
    animation-duration: 25s;
  }

  /* Cloud floats gently side-to-side (whole icon for plain cloud/fog). */
  .weather-icon .wi-cloud,
  .weather-icon .wi-fog {
    animation: wx-drift 6s ease-in-out infinite;
  }

  /* Rain drops fall + fade in sequence. */
  .weather-icon .rain-drop {
    transform-box: fill-box;
    transform-origin: top center;
    opacity: 0;
    animation: wx-rain-fall 1.4s ease-in infinite;
  }
  .weather-icon .wi-rain .rd1 { animation-delay: 0s; }
  .weather-icon .wi-rain .rd2 { animation-delay: 0.45s; }
  .weather-icon .wi-rain .rd3 { animation-delay: 0.9s; }

  /* Snow flakes drift down + fade, slower than rain. */
  .weather-icon .snow-flake {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: wx-snow-fall 2.6s ease-in-out infinite;
  }
  .weather-icon .wi-snow .sf1 { animation-delay: 0s; }
  .weather-icon .wi-snow .sf2 { animation-delay: 0.85s; }
  .weather-icon .wi-snow .sf3 { animation-delay: 1.7s; }

  /* Lightning bolt flickers — bright most of the time with brief dim flashes. */
  .weather-icon .lightning {
    animation: wx-flash 3.5s ease-in-out infinite;
  }

  /* Fog lines drift horizontally with slight stagger. */
  .weather-icon .fog-line {
    animation: wx-fog-drift 5s ease-in-out infinite;
  }
  .weather-icon .wi-fog .fg2 { animation-delay: 1.2s; animation-direction: reverse; }

  @keyframes wx-sun-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes wx-drift {
    0%, 100% { transform: translateX(-1.5px); }
    50%      { transform: translateX(1.5px); }
  }
  @keyframes wx-rain-fall {
    0%   { opacity: 0; transform: translateY(-2px); }
    15%  { opacity: 0.9; }
    80%  { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(4px); }
  }
  @keyframes wx-snow-fall {
    0%   { opacity: 0; transform: translateY(-1.5px); }
    20%  { opacity: 1; }
    85%  { opacity: 0.85; }
    100% { opacity: 0; transform: translateY(3px); }
  }
  @keyframes wx-flash {
    0%, 88%, 100% { opacity: 1; }
    91%, 95%      { opacity: 0.25; }
  }
  @keyframes wx-fog-drift {
    0%, 100% { transform: translateX(-1px); opacity: 0.7; }
    50%      { transform: translateX(1px); opacity: 1; }
  }

  /* Summary block (description + Hi/Lo + rain) sits below the icon/temp
     row, centered so the whole hero zone reads as a single composition. */
  .weather-summary {
    text-align: center;
  }

  .weather-temp {
    font-size: 2rem;
    font-weight: 200;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .weather-desc {
    font-size: var(--fs-body);
    color: #cfcfd6;
    line-height: 1.15;
  }

  .weather-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-top: 2px;
    font-size: var(--fs-micro);
    color: var(--c-mute);
    white-space: nowrap;
  }
  .weather-meta .wm-hilo { color: var(--c-mute); }
  .weather-meta .wm-hilo span { color: #cfcfd6; font-weight: 500; }

  /* Rain probability — small amber pill, only visible when JS sets display:flex */
  #weatherRain {
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    background: rgba(240, 192, 64, 0.10);
    border: 0.5px solid rgba(240, 192, 64, 0.35);
    border-radius: var(--r-pill);
    color: #f0c040;
    font-size: var(--fs-micro);
    font-weight: 600;
    line-height: 1;
  }
  #weatherRain svg { flex-shrink: 0; }

  /* HOURLY FORECAST ----------------------------------------------- */
  .weather-forecast {
    display: flex;
    flex-direction: row;
    gap: 0;
    justify-content: space-between;
    align-items: center;
    border-top: 0.5px solid #1e1e2e;
    border-bottom: 0.5px solid #1e1e2e;
    padding: 5px 2px;
  }

  .weather-hour {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }

  .weather-hour .wh-time {
    font-size: var(--fs-micro);
    color: var(--c-label);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .weather-hour .wh-icon {
    line-height: 1;
    opacity: 0.95;
  }
  .weather-hour .wh-icon svg { width: 20px; height: 20px; }

  .weather-hour .wh-temp {
    font-size: var(--fs-label);
    font-weight: 500;
    color: #e0e0e6;
    line-height: 1;
  }

  /* STATS ROW (wind / humidity / pollen) -------------------------- */
  .weather-details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 0 2px;
  }

  .weather-details .wd-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1;
  }

  .weather-details .wd-label {
    font-size: var(--fs-micro);
    color: var(--c-label);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  .weather-details .wd-value {
    font-size: var(--fs-body);
    color: #e0e0e6;
    font-weight: 500;
    line-height: 1;
  }

  .weather-details .wd-unit {
    font-size: var(--fs-micro);
    color: var(--c-mute);
    margin-left: 1px;
    font-weight: 400;
  }

  /* Calendar — top row, right column */
  #calCard {
    grid-row: 1;
    grid-column: 3;
  }

  /* Map card — top row, spans left two columns */
  #mapCard {
    grid-row: 1;
    grid-column: 1 / 3;
    padding: 0;
    overflow: hidden;
  }

  /* Late mode (weekday after 5pm, weekend after 9pm):
     hide bus + ferry, let map take the full left height. */
  body.late-mode #busCard,
  body.late-mode #ferryCard { display: none; }
  body.late-mode #mapCard   { grid-row: 1 / 4; }

  /* Weather card — bottom right, spans bus + ferry rows */
  #weatherCard {
    grid-row: 2 / 4;
    grid-column: 3;
  }

  #mapCard { position: relative; }
  #mapCard #hobokenMap { width: 100%; height: 100%; }


  /* Overlay showing when each person last updated — one pill per person,
     sitting in the bottom-left corner of the map. */
  #mapStatusOverlay {
    position: absolute;
    bottom: 8px;
    left: 8px;
    z-index: 1000;
    pointer-events: none;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ms-pill {
    background: rgba(0, 0, 0, 0.55);
    padding: 3px 8px;
    border-radius: 12px;
    font-size: var(--fs-micro);
    color: #ddd;
    line-height: 1.3;
    white-space: nowrap;
  }
  .ms-name { color: #fff; font-weight: 600; }
  .ms-status { color: #ddd; margin-left: 5px; }
  .ms-ago { color: #777; margin-left: 5px; font-size: var(--fs-micro); }

  /* Calendar events (rendered from Google Calendar API) */
  .cal-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    padding-right: 4px;
  }

  .cal-content::-webkit-scrollbar { width: 0; }

  .cal-day-header {
    font-size: var(--fs-micro);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6bffb8;
    margin: 6px 0 3px 0;
    padding-bottom: 2px;
    border-bottom: 0.5px solid #1a1a28;
  }

  .cal-day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .cal-header-time {
    font-weight: 700;
    font-size: 1.15rem;
    color: #fff;
    letter-spacing: 0;
    text-transform: none;
    white-space: nowrap;
  }

  .cal-day-header:first-child { margin-top: 0; }

  .cal-day-header.is-today {
    color: #fff;
    font-size: 1.15rem;
    margin-bottom: 8px;
    white-space: nowrap;
  }
  .cal-day-header.is-future { color: #9a9aa8; }

  /* Morning commute estimate — first line of the calendar Mon-Fri 7-10:30 AM.
     Reads as a prominent action item; the minute count picks up red when
     it's tight (>= 35 min) so Jeff can glance and judge urgency. */
  #commuteEstimate {
    font-size: 0.95rem;
    font-weight: 600;
    color: #6bffb8;
    padding: 8px 0 10px;
    margin-bottom: 6px;
    border-bottom: 0.5px solid #1a1a28;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  #commuteEstimate #commuteMin {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
  }
  #commuteEstimate.tight #commuteMin { color: #ff9b40; }

  .cal-event {
    padding: 2px 0;
    font-size: var(--fs-label);
    line-height: 1.25;
  }

  .cal-event-time {
    color: #888;
    font-weight: 500;
    font-size: var(--fs-micro);
    margin-left: 4px;
    white-space: nowrap;
  }

  .cal-leave-by {
    color: #ffb84d;
    font-size: var(--fs-micro);
    font-weight: 600;
    margin-top: 1px;
  }
  .cal-leave-mode {
    color: #aaa;
    font-weight: 400;
  }

  .cal-event-title {
    color: #e8e8ec;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-event.all-day .cal-event-time { color: #9a9aa8; }

  .cal-empty, .cal-signin-prompt {
    font-size: var(--fs-label);
    color: #9a9aa8;
    padding: 20px 8px;
    text-align: center;
  }

  .cal-signin-btn {
    background: #6bffb8;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 14px 28px;
    font-size: var(--fs-body);
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    outline: none;
  }

  .cal-signin-btn:focus {
    box-shadow: 0 0 0 3px #fff;
    transform: scale(1.05);
  }

  /* Alerts now stacked inside the calendar card (right column) */
  .cal-alert-divider {
    border-top: 0.5px solid #2a2a35;
    margin: 8px -12px 6px -12px;
  }

  .alerts-panel {
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }

  .alerts-list {
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 50%;
  }

  .alert-item {
    font-size: var(--fs-micro);
    line-height: 1.3;
    color: #ccc;
    padding: 3px 0;
    border-bottom: 0.5px solid #1a1a28;
  }

  .alert-item:last-child { border-bottom: none; }

  .alert-item.is-alert {
    color: #ff9b6b;
    font-weight: 600;
  }

  .alert-badge {
    display: inline-block;
    font-size: var(--fs-micro);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 4px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .alert-badge.njt {
    background: #c0392b;
    color: #fff;
  }

  .alert-badge.nixle {
    background: #e67e22;
    color: #fff;
  }

  .alert-badge.news {
    background: #2a2a3a;
    color: #888;
  }

  /* Map panel (replaces news in alerts card during specific hours) */
  .map-container {
    flex: 2;
    min-height: 220px;
    border-radius: 8px;
    overflow: hidden;
    background: #0a0a0f;
    margin-top: 8px;
    border-top: 0.5px solid #2a2a35;
  }

  .map-container .leaflet-container {
    width: 100%;
    height: 100%;
    background: #0a0a0f;
  }

  /* Subtle tone adjustment on map tiles */
  .map-container .leaflet-tile-pane {
    filter: brightness(0.95);
  }

  /* Hide Leaflet controls — we want a clean ambient view */
  .leaflet-control-zoom,
  .leaflet-control-attribution {
    display: none !important;
  }

  /* Custom location markers */
  .person-marker {
    width: 36px !important;
    height: 36px !important;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.45);
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
    overflow: hidden;
    background: #3a3a48;
    color: #000;
    font-weight: 700;
    font-size: var(--fs-label);
    line-height: 36px;
    text-align: center;
  }

  .person-marker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Small "orbit" face used when a person is at home */
  .person-marker.small {
    width: 20px !important;
    height: 20px !important;
    line-height: 18px;
    font-size: var(--fs-micro);
    border-width: 1.5px;
  }

  .home-marker {
    width: 30px !important;
    height: 30px !important;
    background: #3a7bd5;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.45);
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
    display: flex !important;
    align-items: center;
    justify-content: center;
  }

  .bus-marker {
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
  }
  .leaflet-tooltip.bus-tip {
    background: rgba(10, 10, 15, 0.92);
    color: #e8e8ec;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .leaflet-tooltip.bus-tip::before { display: none; }
  /* NJT bus marker — NJTbus.png logo + direction arrow above (NY-bound) or
     below (return). Arrow color is set inline per bus from passload. */
  .bus-marker .nbm-wrap {
    display: flex;

// ============================================================
// TV SIMULATION MODE — ?tv in URL renders the dashboard at fixed 1920x1080,
// scaled to fit any browser window while preserving TV proportions.
// ============================================================
(function setupTvSimulation() {
  if (!/(\?|&)tv(=|&|$)/.test(location.search)) return;
  document.documentElement.classList.add('tv-sim');
  function applyScale() {
    const targetW = 930, targetH = 539;
    const scale = Math.min(window.innerWidth / targetW, window.innerHeight / targetH);
    const offsetX = (window.innerWidth  - targetW * scale) / 2;
    const offsetY = (window.innerHeight - targetH * scale) / 2;
    document.body.style.transform = 'translate(' + offsetX + 'px,' + offsetY + 'px) scale(' + scale + ')';
  }
  if (document.body) applyScale();
  else window.addEventListener('DOMContentLoaded', applyScale);
  window.addEventListener('resize', applyScale);
})();

// ============================================================
// PROXY
// ============================================================
const PROXY_URL = 'https://proxy-105885243706.us-east1.run.app';

// Trim trailing children of a container until they all fit without overflow.
// Used for alerts + calendar so nothing is half-cut at the bottom.
function trimOverflow(container) {
  if (!container) return;
  // Wait for layout
  let safety = 200;
  while (safety-- > 0 &&
         container.scrollHeight > container.clientHeight + 1 &&
         container.lastElementChild) {
    container.removeChild(container.lastElementChild);
  }
}

// fetch with abort timeout — prevents hung TCP from piling up callbacks
function fetchT(url, opts, ms) {
  ms = ms || 15000;
  const c = new AbortController();
  const id = setTimeout(function() { c.abort(); }, ms);
  return fetch(url, Object.assign({}, opts || {}, { signal: c.signal }))
    .finally(function() { clearTimeout(id); });
}

const apiStatus = {
  transit: { ok: null, lastUpdate: null },
  weather: { ok: null, lastUpdate: null },
  hop:     { ok: null, lastUpdate: null },
  alerts:  { ok: null, lastUpdate: null },
};

function markOk(key) {
  apiStatus[key].ok = true;
  apiStatus[key].lastUpdate = Date.now();
  apiStatus[key].failCount = 0;
}

function markFail(key) {
  // Require 2 consecutive failures before flagging offline — prevents flashes
  // from transient Cloud Run cold starts or network blips.
  apiStatus[key].failCount = (apiStatus[key].failCount || 0) + 1;
  if (apiStatus[key].failCount >= 2) {
    apiStatus[key].ok = false;
  }
}

function agoText(ts) {
  if (!ts) return 'never';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return `${sec}s ago`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
  return `${Math.floor(sec / 3600)}h ago`;
}

// Show actual viewport dims so we can compare TV vs PC

  const el = document.getElementById('statusViewport');
  if (!el) return;
  el.textContent = window.innerWidth + 'x' + window.innerHeight +
    ' @' + (window.devicePixelRatio || 1) + 'x';
}
window.addEventListener('resize', updateViewportDiag);

function updateStatusBar() {
  updateViewportDiag();
  // Freshness: most recent successful update (transit/hop update every 15s)
  let newest = null;
  for (const key of Object.keys(apiStatus)) {
    const ts = apiStatus[key].lastUpdate;
    if (ts && (newest === null || ts > newest)) newest = ts;
  }
  document.getElementById('statusFreshness').textContent =
    newest ? `Updated ${agoText(newest)}` : 'Loading...';

  // Errors: list any failed APIs
  const failed = [];
  for (const [key, s] of Object.entries(apiStatus)) {
    if (s.ok === false) failed.push(key);
  }
  const errEl = document.getElementById('statusErrors');
  if (failed.length > 0) {
    errEl.className = 'status-warning';
    errEl.innerHTML =
      '<svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor" style="vertical-align:middle;margin-right:3px;">' +
      '<path d="M12 2 1 21h22z M11 9h2v6h-2z M11 17h2v2h-2z"/></svg>' +
      failed.join(', ') + ' offline';
  } else {
    errEl.className = 'status-ok';
    errEl.textContent = '';
  }
}

// Moon phase 0-7: 0=new, 1=waxing crescent, 2=first quarter, 3=waxing gibbous,
// 4=full, 5=waning gibbous, 6=last quarter, 7=waning crescent.
// Uses a known new moon as reference (Jan 6 2000 18:14 UTC).
function moonPhase() {
  const REF_NEW_MOON_MS = Date.UTC(2000, 0, 6, 18, 14, 0);
  const SYNODIC_DAYS = 29.5305882;
  const days = (Date.now() - REF_NEW_MOON_MS) / 86400000;
  let phase = (days / SYNODIC_DAYS) % 1;
  if (phase < 0) phase += 1;
  return Math.floor(phase * 8) % 8;
}

// Same dimensions/position as the small partly_cloudy sun, but a moon.
function moonForPartlyCloudy() {
  const p = moonPhase();
  // Use radius 2.5 to match sun-circle in partly_cloudy
  const fill = (p === 4 || p === 3 || p === 5) ? '#dfdfa6' : '#1a1a2e';
  const lit = '#dfdfa6';
  const dark = '#1a1a2e';
  if (p === 0) return '<circle cx="6.5" cy="6.5" r="2.5" fill="' + dark + '" stroke="#666" stroke-width="0.3"/>';
  if (p === 4) return '<circle cx="6.5" cy="6.5" r="2.5" fill="' + lit + '"/>';
  // Crescents & quarters
  const lightSide = (p === 1 || p === 2 || p === 3) ? 1 : 0; // waxing → right lit
  const shaper = (p === 1 || p === 7) ? 1.5 : (p === 3 || p === 5) ? 1.5 : 2.5;
  // Simple approximation: half circle of light + offset dark cover
  const lightHalf = '<path d="M6.5 4 a2.5 2.5 0 0 ' + lightSide + ' 0 5 z" fill="' + lit + '"/>';
  if (p === 2 || p === 6) {
    // half lit
    const base = '<circle cx="6.5" cy="6.5" r="2.5" fill="' + dark + '"/>';
    return base + lightHalf;
  }
  // crescent / gibbous — base + ellipse overlay
  const base = (p === 1 || p === 2 || p === 3) ? dark : lit;
  const overlay = (p === 1 || p === 7) ? lit : dark;
  return '<circle cx="6.5" cy="6.5" r="2.5" fill="' + base + '"/>' +
    '<ellipse cx="6.5" cy="6.5" rx="' + (p === 1 || p === 3 ? '1.4' : '1.4') + '" ry="2.5" fill="' + overlay + '"/>';
}

function wIcon(key, size, isNight) {
  const s = size || 24;
  let svgKey = key;
  // At night, swap sun-related icons for moon variants
  if (isNight) {
    if (key === 'sun') svgKey = 'moon';
    else if (key === 'partly_cloudy') svgKey = 'partly_cloudy_night';
  }
  const cls = 'wi wi-' + (SVG_ICONS[svgKey] ? svgKey : 'cloud');
  let body = SVG_ICONS[svgKey];
  // Dynamic moon body based on current phase
  if (svgKey === 'moon') {
    body = '<g transform="translate(0,0) scale(2.0) translate(-6,-6)">' + MOON_SVGS[moonPhase()] + '</g>';
  } else if (svgKey === 'partly_cloudy_night') {
    body = moonForPartlyCloudy() +
      '<path d="M9 17h7c2.21 0 4-1.79 4-4 0-2.05-1.53-3.74-3.5-3.97-.07-2.79-2.34-5.03-5.14-5.03-2.4 0-4.41 1.65-4.97 3.88-.04 0-.07 0-.11 0-2.21 0-4 1.79-4 4 0 1.95 1.4 3.57 3.24 3.92" fill="#9aa5b8"/>';
  }
  if (!body) body = SVG_ICONS.cloud;
  return `<svg class="${cls}" viewBox="0 0 24 24" width="${s}" height="${s}" style="display:inline-block;vertical-align:middle;overflow:visible;">${body}</svg>`;
}

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;

  const timeStr = `${h12}:${m} ${ampm}`;
  const el = document.querySelector('.cal-header-time');
  if (el) el.textContent = timeStr;

  // Refresh the commute estimate every clock tick so the wait countdown
  // tracks elapsed time between proxy polls (proxy fetches are typically
  // every 30-60s; we want minute-accurate display).
  updateCommuteEstimate();
}

// ============================================================
// COMMUTE ESTIMATE — Mon-Fri 7:00-10:30 AM
// Total minutes from leaving home now to being at 11 Times Square:
//   wait_for_next_bus + 13 (ride to PABT) + max(0, tunnel - 8) + 5
// where the 5 covers home→stop walk (2) + PABT→office walk (3).
// ============================================================
function updateCommuteEstimate() {
  const el = document.getElementById('commuteEstimate');
  if (!el) return;
  const now = new Date();
  const day = now.getDay();
  const time = now.getHours() * 60 + now.getMinutes();
  // Mon-Fri only, 7:00 AM to 10:30 AM inclusive
  if (day === 0 || day === 6 || time < 7 * 60 || time > 10 * 60 + 30) {
    el.style.display = 'none';
    return;
  }

  const data = window._lastProxyData;
  const fetchedAtSec = window._transitFetchedAt || Math.floor(Date.now() / 1000);

  // Collect next-bus minutes from both stops, reconciled against now.
  let waitMin = null;
  if (data && data.stops) {
    const allPreds = [];
    for (const sid of ['20490', '20523']) {
      const s = data.stops[sid];
      if (s && Array.isArray(s.predictions)) allPreds.push(...s.predictions);
    }
    for (const p of allPreds) {
      const reported = parseInt(p.countdown, 10);
      if (!isFinite(reported)) continue;
      const arrivalMs = fetchedAtSec * 1000 + reported * 60000;
      const mins = Math.max(0, Math.round((arrivalMs - Date.now()) / 60000));
      if (mins < 60 && (waitMin === null || mins < waitMin)) waitMin = mins;
    }
  }
  // Fallback to static schedule if no live/inferred data
  if (waitMin === null) waitMin = _nextBusFromSchedule();
  if (waitMin === null) { el.style.display = 'none'; return; }

  // Tunnel delay: schedule already bakes in ~8 min for the tunnel; only
  // count excess as extra delay.
  let tunnelExtra = 0;
  if (data && data.tunnel && data.tunnel.travelTime) {
    const t = parseInt(data.tunnel.travelTime, 10);
    if (isFinite(t) && t > 8) tunnelExtra = t - 8;
  }

  const total = waitMin + 13 + tunnelExtra + 5;
  document.getElementById('commuteMin').textContent = total;
  el.style.display = '';
  el.classList.toggle('tight', total >= 35);
}

function _nextBusFromSchedule() {
  // Minutes until the next scheduled 126 or 119, whichever is sooner.
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const sched126 = isSunday() ? BUS_126_SCHEDULE.sunday
                  : isWeekend() ? BUS_126_SCHEDULE.saturday
                  : BUS_126_SCHEDULE.weekday;
  const sched119 = isWeekend() ? BUS_119_SCHEDULE.saturday : BUS_119_SCHEDULE.weekday;
  let earliest = null;
  for (const arr of [sched126, sched119]) {
    if (!arr) continue;
    for (const t of arr) {
      const [h, m] = t.split(':').map(n => parseInt(n, 10));
      const depMin = h * 60 + m;
      const delta = depMin - nowMin;
      if (delta >= 0 && (earliest === null || delta < earliest)) earliest = delta;
    }
  }
  return earliest;
}

// ============================================================
async function updateWeather() {
  if (document.hidden || isSleeping()) return;
  let apiSucceeded = false;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.744&longitude=-74.032'
      + '&current_weather=true&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max'
      + '&hourly=relativehumidity_2m,temperature_2m,weathercode,precipitation_probability,is_day,uv_index'
      + '&temperature_unit=fahrenheit&timezone=America/New_York';
    const res = await fetchT(url);
    const data = await res.json();
    apiSucceeded = true;
    markOk('weather');
    const cw = data.current_weather;
    const code = WMO_CODES[cw.weathercode] || ["Unknown", "?"];

    // Is it night right now? Use the per-hour is_day flag from the API.
    const nowHourForNight = new Date().getHours();
    const isNightNow = !(data.hourly && data.hourly.is_day && data.hourly.is_day[nowHourForNight]);

    const tempF = Math.round(cw.temperature);
    document.getElementById('weatherTemp').innerHTML = `${tempF}&deg;F`;
    document.getElementById('weatherDesc').textContent = code[0];
    document.getElementById('weatherIcon').innerHTML = wIcon(code[1], 44, isNightNow);
    document.getElementById('weatherWind').textContent = Math.round(cw.windspeed);

    // UV — prefer current hour's value, fall back to today's daily max
    try {
      let uvNow = null;
      const hourlyUV = data.hourly && data.hourly.uv_index;
      if (Array.isArray(hourlyUV) && hourlyUV[nowHourForNight] != null) {
        uvNow = hourlyUV[nowHourForNight];
      } else if (data.daily && Array.isArray(data.daily.uv_index_max)) {
        uvNow = data.daily.uv_index_max[0];
      }
      const uvEl = document.getElementById('weatherUV');
      if (uvEl) {
        if (uvNow == null) {
          uvEl.textContent = '--';
        } else {
          const uvR = Math.round(uvNow);
          uvEl.textContent = uvR;
          // Color matches the standard EPA UV index scale
          let uvColor = '#9aa5b8';
          if (uvR >= 11) uvColor = '#c970c9';      // extreme — violet
          else if (uvR >= 8) uvColor = '#ff5050';  // very high — red
          else if (uvR >= 6) uvColor = '#ff9b40';  // high — orange
          else if (uvR >= 3) uvColor = '#e0c040';  // moderate — yellow
          else if (uvR >= 1) uvColor = '#8acc70';  // low — green-ish
          uvEl.style.color = uvColor;
        }
      }
    } catch (e) { console.error('UV display error:', e); }

    document.getElementById('weatherHi').textContent = Math.round(data.daily.temperature_2m_max[0]);
    document.getElementById('weatherLo').textContent = Math.round(data.daily.temperature_2m_min[0]);

    // Precipitation: show umbrella if any hour in next 12 hours has >30% chance
    const nowH = new Date().getHours();
    const rainProbs = data.hourly.precipitation_probability || [];
    let maxRain = 0;
    for (let h = nowH; h < Math.min(nowH + 12, rainProbs.length); h++) {
      if (rainProbs[h] > maxRain) maxRain = rainProbs[h];
    }
    const rainEl = document.getElementById('weatherRain');
    if (maxRain >= 30) {
      rainEl.style.display = 'flex';
      document.getElementById('weatherRainPct').textContent = maxRain;
    } else {
      rainEl.style.display = 'none';
    }

    const nowHour = new Date().getHours();
    const humidity = data.hourly.relativehumidity_2m
      ? data.hourly.relativehumidity_2m[nowHour]
      : (data.hourly.relative_humidity_2m ? data.hourly.relative_humidity_2m[nowHour] : '--');
    document.getElementById('weatherHumidity').textContent = humidity;

    // Pollen
    try {
      const pollenUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=40.744&longitude=-74.032'
        + '&current=grass_pollen,birch_pollen,alder_pollen,ragweed_pollen,mugwort_pollen,olive_pollen';
      const pollenRes = await fetchT(pollenUrl);
      const pollenData = await pollenRes.json();
      const pc = pollenData.current;
      const vals = [pc.grass_pollen||0, pc.birch_pollen||0, pc.alder_pollen||0,
                    pc.ragweed_pollen||0, pc.mugwort_pollen||0, pc.olive_pollen||0];
      const peak = Math.max(...vals);
      // Color rule: only highlight in red when pollen is High or worse. Low
      // and Medium read as white (matches the surrounding details text) so
      // they don't grab attention on a normal day.
      let level, color;
      if (peak < 20)       { level = 'Low';    color = '#fff';    }
      else if (peak < 80)  { level = 'Med';    color = '#fff';    }
      else if (peak < 200) { level = 'High';   color = '#f44336'; }
      else                 { level = 'V.High'; color = '#f44336'; }
      const el = document.getElementById('weatherPollen');
      el.textContent = level;
      el.style.color = color;
    } catch (e) { console.error('Pollen error:', e); }

    // Hourly forecast
    const hourlyTemps = data.hourly.temperature_2m;
    const hourlyCodes = data.hourly.weathercode;
    const hourlyIsDay = data.hourly.is_day || [];
    if (hourlyTemps && hourlyCodes) {
      let fhtml = '';
      let count = 0;
      let h = nowHour + 2;
      while (count < 7 && h < hourlyTemps.length) {
        const t = Math.round(hourlyTemps[h]);
        const ic = WMO_CODES[hourlyCodes[h]] || ['?', 'cloud'];
        const displayH = h % 24;
        const ampm = displayH >= 12 ? 'PM' : 'AM';
        const h12 = displayH % 12 || 12;
        const hourIsNight = !hourlyIsDay[h];
        fhtml += `<div class="weather-hour"><span class="wh-time">${h12} ${ampm}</span><span class="wh-icon">${wIcon(ic[1], 14, hourIsNight)}</span><span class="wh-temp">${t}&deg;</span></div>`;
        h += 2;
        count++;
      }
      document.getElementById('weatherForecast').innerHTML = fhtml;
    }
  } catch (e) {
    console.error('Weather error:', e);
    if (!apiSucceeded) {
      document.getElementById('weatherDesc').textContent = 'Error loading weather';
      markFail('weather');
    }
  }
}

// ============================================================
// TRANSIT HELPERS
// ============================================================
function timeToMinutes(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function formatTime12(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
}

function minutesUntil(timeStr) {
  const target = timeToMinutes(timeStr);
  const now = nowMinutes();
  let diff = target - now;
  // Late-night service (target before 3am) only wraps when viewer is also late evening
  // (after 6pm). Prevents 00:05 bus from showing "23h59m" when checked at 00:10.
  if (diff < -180 && target < 180 && now > 18 * 60) {
    diff += 24 * 60;
  }
  return diff;
}

function countdownText(mins) {
  const u = s => `<span class="cd-unit">${s}</span>`;
  if (mins <= 0) return 'now';
  if (mins < 60) return `${mins}${u('m')}`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m > 0 ? `${h}${u('h')}${m}${u('m')}` : `${h}${u('h')}`;
}

function isWeekend() {
  const day = new Date().getDay();
  return day === 0 || day === 6;
}

function isSunday() {
  return new Date().getDay() === 0;
}

function getNextDepartures(times, count) {
  const upcoming = times.filter(t => minutesUntil(t) >= 0);
  upcoming.sort((a, b) => minutesUntil(a) - minutesUntil(b));
  return upcoming.slice(0, count);
}

function renderDepartures(times, label) {
  const next = getNextDepartures(times, 3);
  if (times.length === 0) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service">No service today</div></div>`;
  }
  if (next.length === 0) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service">Done for today</div></div>`;
  }
  let html = `<div class="route-group"><div class="route-label">${label}:</div><div class="dep-row">`;
  for (const t of next) {
    const mins = minutesUntil(t);
    const cdColor = mins <= 5 ? '#ff6b6b' : '#6bffb8';
    html += `<div class="dep-chip"><span class="t">${formatTime12(t)}</span><span class="cd" style="color:${cdColor}">${countdownText(mins)}</span></div>`;
  }
  html += '</div></div>';
  return html;
}

function get126WillowSchedule() {
  let base;
  if (isSunday()) base = BUS_126_SCHEDULE.sunday;

  else base = BUS_126_SCHEDULE.weekday;
  return base.map(t => {

    if (mins >= 24 * 60) mins -= 24 * 60;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  });
}

// ============================================================
// PROXY FETCH
// ============================================================
function loadDot(passload) {
  const p = (passload || '').toUpperCase();
  // Map passload to number of filled bars (0-4)
  let level = 0;
  if (p === 'EMPTY') level = 1;
  else if (p === 'LIGHT') level = 2;
  else if (p === 'MEDIUM') level = 3;
  else if (p === 'HEAVY' || p === 'FULL' || p === 'OVERLOADED') level = 4;
  else return '';

  // Render 4 bars, filling based on level, each colored by the level
  let bars = '';
  for (let i = 1; i <= 4; i++) {
    const filled = i <= level ? ` lvl-${level}` : '';
    bars += `<span class="load-bar${filled}"></span>`;
  }
  return `<span class="load-bars" title="${p}">${bars}</span>`;
}

function renderLivePredictions(predictions, label) {
  if (!predictions || predictions.error) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service">Error</div></div>`;
  }
  if (Array.isArray(predictions) && predictions.length > 0) {
    let html = `<div class="route-group"><div class="route-label">${label}:</div><div class="dep-row">`;
    const items = predictions.slice(0, 3);
    // Compute the absolute arrival time (Unix ms) for each prediction by using
    // the proxy's fetched_at + the countdown that was true at that moment.
    // Then derive mins from current time. Conservative (floor) so we don't show
    // a longer countdown than reality and have the user miss the bus.
    const fetchedAtMs = (window._transitFetchedAt || Math.floor(Date.now() / 1000)) * 1000;
    // NJT seems to round their countdowns up, so shift the predicted arrival
    // ~30s earlier than reported. Makes the displayed countdown feel right —
    // not over-promising on time available.
    const DISPLAY_SHIFT_MS = 30000;
    for (const p of items) {
      const reportedMins = parseInt(p.countdown, 10);
      const arrivalMs = fetchedAtMs + reportedMins * 60000 - DISPLAY_SHIFT_MS;
      const msUntil = arrivalMs - Date.now();
      // Hide buses that are clearly more than 2 min past arrival.
      if (msUntil < -120000) continue;
      // Anything in (-2 min, +1 min) shows as "Due" so the imminent bus stays
      // visible until it's actually departed.
      const isDue = msUntil < 60000;
      const mins = isDue ? 0 : Math.floor(msUntil / 60000);
      const cdColor = mins <= 5 ? '#ff6b6b' : '#6bffb8';
      let displayTime;
      if (isDue) {
        displayTime = 'Due';
      } else {
        const arrive = new Date(arrivalMs);
        const hh = arrive.getHours();
        const mm = String(arrive.getMinutes()).padStart(2, '0');
        const ampm = hh >= 12 ? 'PM' : 'AM';
        const h12 = hh % 12 || 12;
        displayTime = `${h12}:${mm} ${ampm}`;
      }
      html += `<div class="dep-chip"><span class="t">${displayTime}</span><span class="cd" style="color:${cdColor}">${countdownText(mins)}</span></div>`;
    }
    html += '</div></div>';
    return html;
  }
  return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service">No predictions</div></div>`;
}

async function fetchProxy() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(PROXY_URL);
    const data = await res.json();
    markOk('transit');

    // Stash fetched_at so renderLivePredictions can reconcile against current time
    window._transitFetchedAt = data.fetched_at || Math.floor(Date.now() / 1000);
    // Stash the whole response so updateCommuteEstimate() can derive the
    // morning commute number even on its own clock-driven timer ticks.
    window._lastProxyData = data;

    if (data.tunnel && !data.tunnel.error) {
      const t = data.tunnel;
      const tt = parseInt(t.travelTime, 10);
      const timeEl = document.getElementById('tunnelTime');
      timeEl.textContent = isFinite(tt) ? tt : '--';
      // Color tiers (research-confirmed thresholds; free-flow is 6-8 min):
      //   < 10 min → Light    (green)
      //   10-19 min → Moderate (yellow)
      //   20-34 min → Heavy    (orange)
      //   35+ min → Very Heavy (red)
      let color = '#6bffb8';
      if (isFinite(tt)) {
        if      (tt >= 35) color = '#ff5050';
        else if (tt >= 20) color = '#ff9b40';
        else if (tt >= 10) color = '#e0c040';
      }
      timeEl.style.color = color;
      const minEl = document.getElementById('tunnelMin');
      if (minEl) minEl.style.color = color;
      // PA's infomationalText ("USUAL TRAFFIC" etc.) is uninformative —
      // hide the status row entirely; color of the number says it all.
      const statusEl = document.getElementById('tunnelStatus');
      statusEl.style.display = 'none';
    }

    if (data.stops) {
      const container = document.getElementById('busContent');
      let html = '';
      let apiWorking = false;

      const stop20490 = data.stops['20490'];
      if (stop20490 && Array.isArray(stop20490.predictions) && stop20490.predictions.length > 0) {
        html += renderLivePredictions(stop20490.predictions, '126 @ 14th');
        // API is working if we got an array of predictions back (live or scheduled)
        apiWorking = true;
      } else {
        let schedule;
        if (isSunday()) schedule = BUS_126_SCHEDULE.sunday;
        else if (isWeekend()) schedule = BUS_126_SCHEDULE.saturday;
        else schedule = BUS_126_SCHEDULE.weekday;
        html += renderDepartures(schedule, '126 @ 14th');
      }

      const stop20523 = data.stops['20523'];
      if (stop20523 && Array.isArray(stop20523.predictions) && stop20523.predictions.length > 0) {
        const preds14 = (stop20490 && Array.isArray(stop20490.predictions)) ? stop20490.predictions : [];
        const etaMins14 = preds14.filter(p => p.route === '126').map(p => parseInt(p.countdown, 10));
        const filtered = stop20523.predictions.filter(p => {
          if (p.route !== '126') return true;
          const mins = parseInt(p.countdown, 10);
          return !etaMins14.some(m14 => Math.abs(mins - m14) <= 3);
        });
        if (filtered.length > 0) {
          html += renderLivePredictions(filtered, '119 @ 15th');
          apiWorking = true;
        } else {
          html += renderDepartures(get119Schedule(), '119 @ 15th');
        }
      } else {
        html += renderDepartures(get119Schedule(), '119 @ 15th');
      }

      container.innerHTML = html;

      const hl1 = document.getElementById('busHL1');
      const hl2 = document.getElementById('busHL2');
      if (hl1 && hl2) {
        // Detect inferred predictions: if the proxy fell back to
        // vehicle-position inference for any stop (BUSDV2 had no trips
        // there), those predictions carry is_inferred=true. Even a single
        // inferred prediction means at least one data stream is degraded,
        // so surface that as orange headlights — more honest than green.
        const allPreds = [stop20490, stop20523]
          .filter(s => s && Array.isArray(s.predictions))
          .flatMap(s => s.predictions);
        const anyInferred = allPreds.some(p => p.is_inferred);
        const mode = !apiWorking ? 'schedule' : (anyInferred ? 'inferred' : 'live');
        hl1.setAttribute('class', 'bus-headlight ' + mode);
        hl2.setAttribute('class', 'bus-headlight ' + mode);
      }
    }

    // Recompute the morning commute estimate with this fresh data.
    updateCommuteEstimate();
  } catch (e) {
    console.error('Proxy fetch error:', e);
    markFail('transit');
  }
}

function renderHopEtas(data) {
  // Hop right panel mirrors the Lincoln Tunnel layout: big primary value +
  // "min" suffix on top, smaller status text below. The status line shows
  // the next 1–2 ETAs or a service note. Keeps bus and ferry cards visually
  // symmetric — both right-side panels read the same way.
  const timeEl = document.getElementById('hopTime');
  const minEl = document.getElementById('hopMin');
  const statusEl = document.getElementById('hopStatus');
  if (!timeEl || !statusEl) return;

  const setStatus = (text, color) => {
    statusEl.textContent = text;
    statusEl.style.color = color || '#9a9aa8';
  };

  // When the Hop isn't running, replace the "X min" line with a single
  // "No service" message (hide the trailing "min" suffix entirely).
  const showNoService = () => {
    timeEl.textContent = 'No service';
    timeEl.style.fontSize = '0.9rem';  // shrink so the words fit the chip
    if (minEl) minEl.style.display = 'none';
    setStatus('', '#666');
  };
  const showServiceMins = (n) => {
    timeEl.textContent = String(n);
    timeEl.style.fontSize = '';  // reset to the panel's default big number size
    if (minEl) minEl.style.display = '';
  };

  if (!data || data.error) {
    showNoService();
    setStatus(data && data.error ? 'Error' : '', '#666');
    return;
  }
  if (data.status === 'no vehicles' || !Array.isArray(data) || data.length === 0) {
    showNoService();
    return;
  }

  const mins = data.map(e => {
    const m = (e.eta || '').match(/^(\d+)/);
    return m ? parseInt(m[1], 10) + 1 : null;
  }).filter(n => n !== null);

  if (mins.length === 0) {
    showNoService();
    return;
  }

  showServiceMins(mins[0]);
  if (mins.length > 1) {
    setStatus('next ' + mins.slice(1, 3).join(', ') + ' min', '#6bffb8');
  } else {
    setStatus('Running', '#6bffb8');
  }
}

async function fetchHop() {
  if (document.hidden || isSleeping()) return;
  try {
    const resp = await fetchT('https://passiogo.com/mapGetData.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'json=' + encodeURIComponent(JSON.stringify({s0:'466',sA:1})) + '&eta=3&deviceId=web&stopIds=158942',
    });
    const data = await resp.json();

    // ETAs
    const etas = [];
    for (const [key, entries] of Object.entries(data.ETAs || {})) {
      for (const entry of entries) {
        if (entry.eta && entry.eta !== 'no vehicles') {
          etas.push({ eta: entry.eta });
        }
      }
    }
    if (etas.length > 0) {
      renderHopEtas(etas);
    } else {
      renderHopEtas({ status: 'no vehicles' });
    }

    // Build a routeId → route name map (PassioGo returns "routes" alongside "buses")
    const routeNameById = {};
    const routesArr = data.routes || [];
    if (Array.isArray(routesArr)) {
      for (const r of routesArr) {
        routeNameById[r.id || r.routeId] = (r.name || r.routeName || '').toString();
      }
    } else if (typeof routesArr === 'object') {
      for (const k of Object.keys(routesArr)) {
        routeNameById[k] = (routesArr[k].name || routesArr[k].routeName || '').toString();
      }
    }

    // Live bus positions
    const hopBuses = [];
    const busesData = data.buses || {};
    for (const routeId of Object.keys(busesData)) {
      const arr = busesData[routeId];
      if (!Array.isArray(arr)) continue;
      const routeName = routeNameById[routeId] || '';
      for (const b of arr) {
        if (b.outOfService === '1' || b.outOfService === 1) continue;
        const lat = parseFloat(b.latitude);
        const lon = parseFloat(b.longitude);
        if (!isFinite(lat) || !isFinite(lon)) continue;
        // Determine color by route name (or bus name as fallback)
        const probe = (routeName + ' ' + (b.busName || b.name || '')).toLowerCase();
        let color = '#b070ff';  // generic purple fallback
        if (probe.includes('red'))   color = '#ff5050';
        if (probe.includes('green')) color = '#6bffb8';
        const course = parseFloat(b.calculatedCourse || b.course);
        hopBuses.push({
          busId: b.busId || b.id || b.busName || b.name || '',
          name: b.busName || b.name || 'Hop',
          lat: lat,
          lon: lon,
          heading: isFinite(course) ? course : null,
          route: routeName || 'Hop',
          color: color,
        });
      }
    }
    renderHopBuses(hopBuses);
    markOk('hop');
  } catch (e) {
    console.error('Hop fetch error:', e);
    renderHopEtas({ error: e.message });
    renderHopBuses([]);  // clear stale markers on error
    markFail('hop');
  }
}

// ============================================================
// MAP MODE — show map on weekends all day, weekdays 4-8 PM
// ============================================================
function isMapMode() {
  const now = new Date();
  const day = now.getDay();
  const hour = now.getHours();
  // Weekend (Sat=6, Sun=0): always map mode
  if (day === 0 || day === 6) return true;
  // Weekday: 4 PM (16) to 8 PM (20)
  return hour >= 16 && hour < 20;
}

let _hobokenMap = null;
let _personMarkers = {};
let _busMarkers = {};

// Animation state for smooth bus/hop marker movement between polls
const MARKER_ANIM_MS = 14000;
let _markerAnims = {};
let _markerAnimFrame = null;

function _animateMarkers() {
  const now = performance.now();
  let active = false;
  for (const id of Object.keys(_markerAnims)) {
    const a = _markerAnims[id];
    if (!a.marker) { delete _markerAnims[id]; continue; }
    const t = Math.min((now - a.t0) / MARKER_ANIM_MS, 1);
    a.marker.setLatLng([
      a.lat0 + (a.lat1 - a.lat0) * t,
      a.lon0 + (a.lon1 - a.lon0) * t,
    ]);
    if (t < 1) active = true;
    else delete _markerAnims[id];
  }
  _markerAnimFrame = active ? requestAnimationFrame(_animateMarkers) : null;
}

function _slideTo(id, marker, lat, lon) {
  const cur = marker.getLatLng();
  if (Math.abs(cur.lat - lat) < 0.00001 && Math.abs(cur.lng - lon) < 0.00001) return;
  _markerAnims[id] = { marker, lat0: cur.lat, lon0: cur.lng, lat1: lat, lon1: lon, t0: performance.now() };
  if (!_markerAnimFrame) _markerAnimFrame = requestAnimationFrame(_animateMarkers);
}

let _busHeadings = {};

// Snap compass heading to Hoboken's street grid then convert to screen-space rotation.
// Markers live outside leaflet-rotate-pane (screen space), so subtract map bearing (29°).
var _GRID_DIRS = [29, 119, 209, 299];
function _snapToGrid(heading) {
  var best = _GRID_DIRS[0], bestDiff = 360;
  for (var i = 0; i < _GRID_DIRS.length; i++) {
    var diff = Math.abs(((heading - _GRID_DIRS[i] + 540) % 360) - 180);
    if (diff < bestDiff) { bestDiff = diff; best = _GRID_DIRS[i]; }
  }
  return (best - 29 + 360) % 360;
}

function _computeHeading(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
            Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

const HOME_RADIUS_MI = 0.014;     // ~75 ft — inside the house
const NEAR_HOME_RADIUS_MI = 0.15; // ~2 blocks — triggers close-up zoom
// All of Hoboken — never zoom tighter than this. West edge ~ Jackson St.
const HOBOKEN_BOUNDS = [[40.734, -74.030], [40.760, -74.022]];
// People outside this radius (miles) from HOME don't trigger an auto-zoom-out.
const AUTO_FIT_RADIUS_MI = 5;

// Mapping from Owntracks tracker ID (TID) to face image URL.
const FACE_IMAGES = {
  'HW':  'jeff.jpg',
  'JHW': 'jeff.jpg',
  'XW':  'jenny.jpg',
  'JXW': 'jenny.jpg',
  'SY':  'sydney.jpg',
  'EL':  'elizabeth.jpg',
  'JU':  'juno.jpg',
};

// Display name override per TID (overrides whatever username Owntracks reports)
const PERSON_NAMES = {
  'HW':  'Jeff',
  'JHW': 'Jeff',
  'XW':  'Jenny',
  'JXW': 'Jenny',
  'SY':  'Sydney',
  'EL':  'Elizabeth',
  'JU':  'Juno',
};

// Static home stubs — shown at home until real Tile data arrives.
// When a Tile with matching TID comes online, the live position takes over.
const HOME_STUBS = [
  { tid: 'SY', name: 'Sydney',    lat: HOME.lat, lon: HOME.lon, received_at: 0 },
  { tid: 'EL', name: 'Elizabeth', lat: HOME.lat, lon: HOME.lon, received_at: 0 },
  { tid: 'JU', name: 'Juno',      lat: HOME.lat, lon: HOME.lon, received_at: 0 },
];

function displayName(loc) {
  return PERSON_NAMES[loc.tid] || loc.name || loc.tid || '';
}

// Hudson River bounding box — anyone in this lon/lat strip is over the water,
// so we assume they're on the ferry.
function isOverWater(lat, lon) {
  return lat >= 40.700 && lat <= 40.770 &&
         lon >= -74.020 && lon <= -74.011;
}

// Persistence tracker: only claim "on bus/Hop" if the person has been near
// the SAME vehicle for at least 60 seconds (avoids false positives from
// momentarily passing a stopped bus or standing at a stop).
const _statusPersistence = {};  // tid → { candidate, since, confirmed }

function personStatus(loc) {
  const dHome = distMi(HOME, loc);
  if (dHome < HOME_RADIUS_MI) return 'at home';

  const now = Date.now();
  const tid = loc.tid || 'XX';
  const p = _statusPersistence[tid] || (_statusPersistence[tid] = {});

  // Detect near a vehicle (NJT bus or Hop). Pick whichever is closer.
  let candidate = null;
  for (const b of _lastBuses) {
    if (b.lat == null || b.lon == null) continue;
    if (distMi(loc, { lat: b.lat, lon: b.lon }) < 0.12) {
      candidate = 'on ' + b.route;
      break;
    }
  }
  if (!candidate) {
    for (const b of _lastHopBuses) {
      if (distMi(loc, { lat: b.lat, lon: b.lon }) < 0.08) {
        const probe = (b.route || '').toLowerCase();
        candidate = probe.includes('red')   ? 'on Red Hop' :
                    probe.includes('green') ? 'on Green Hop' :
                    'on Hop';
        break;
      }
    }
  }

  // Update persistence tracking
  if (candidate) {
    if (p.candidate !== candidate) {
      p.candidate = candidate;
      p.since = now;
    }
    if (now - p.since >= 60000) {
      return candidate;  // confirmed — been alongside the vehicle 60+ sec
    }
  } else {
    p.candidate = null;
    p.since = null;
  }

  // Over water → on ferry (no persistence check needed; physically impossible
  // to be over the Hudson without being on a boat)
  if (isOverWater(loc.lat, loc.lon)) return 'on ferry';

  if (dHome < 0.5) return 'near home';
  return dHome.toFixed(1) + ' mi away';
}

function distMi(a, b) {
  const R = 3959; // miles
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(lat1) * Math.cos(lat2);
  return 2 * R * Math.asin(Math.sqrt(x));
}

function initHobokenMap() {
  if (_hobokenMap || typeof L === 'undefined') return;
  const hasRotate = typeof L.Map.prototype.setBearing === 'function';
  _hobokenMap = L.map('hobokenMap', Object.assign({
    zoomControl: false,
    attributionControl: false,
    dragging: true,
    scrollWheelZoom: false,
  }, hasRotate ? { rotate: true, bearing: -29, touchRotate: false } : {}));
  // Use setView with center+zoom (works better with rotation than fitBounds)
  // Center: between Hoboken and Midtown Manhattan
  _hobokenMap.setView([40.750, -74.003], 14);
  // Jawg.Dark — clean dark theme, no road shield badges
  L.tileLayer('https://{s}.tile.jawg.io/jawg-dark/{z}/{x}/{y}{r}.png?access-token=Lrrwi9HKsiS8ptMSGUR1K7cGy3sg60y1kCop0PsvWIy3H5yUz85QIzfTXJwtjwnq', {
    maxZoom: 22,
    subdomains: 'abcd',
    attribution: '',
  }).addTo(_hobokenMap);

  // Home marker — blue house icon (always shown)
  const homeIcon = L.divIcon({
    className: 'home-marker',
    html:
      '<svg viewBox="0 0 24 24" width="22" height="22" fill="#fff">' +
      '<path d="M12 3 3 11h2v8h5v-5h4v5h5v-8h2z"/></svg>',
    iconSize: [30, 30],
    iconAnchor: [15, 15],
  });
  _homeMarker = L.marker([HOME.lat, HOME.lon], {
    icon: homeIcon,
    zIndexOffset: 1000,  // keep home on top of person markers
  }).addTo(_hobokenMap);

  // Initial view: tight on home (will re-fit once locations arrive)
  _hobokenMap.setView([HOME.lat, HOME.lon], 14);

  // Remote-control zoom: channel-up / channel-down buttons zoom the map.
  // Different TV platforms emit different key identifiers for these buttons,
  // so we match all the common ones. D-pad arrows are left alone so they keep
  // panning via Leaflet's default keyboard handler.
  const ZOOM_IN_KEYS  = new Set(['ChannelUp',   'PageUp',   'MediaTrackNext']);
  const ZOOM_OUT_KEYS = new Set(['ChannelDown', 'PageDown', 'MediaTrackPrevious']);
  const ZOOM_IN_CODES  = new Set([427, 33]);   // 427 = VK_CHANNEL_UP, 33 = PageUp
  const ZOOM_OUT_CODES = new Set([428, 34]);   // 428 = VK_CHANNEL_DOWN, 34 = PageDown
  // Select / OK button in the center of the D-pad: typically Enter (13),
  // sometimes 'Select' or the legacy 'Spacebar'. Cycles map view mode.
  const SELECT_KEYS  = new Set(['Enter', 'Select', ' ', 'Spacebar']);
  const SELECT_CODES = new Set([13, 32]);

  // View-mode state machine (0..3):
  //   0 = default                  (street-grid bearing, no labels)
  //   1 = rotated north-up         (bearing 0, no labels)
  //   2 = default + bus labels     (street-grid bearing, permanent #s)
  //   3 = north-up + bus labels    (bearing 0, permanent #s)
  // Compass is always visible (replaces the old on/off toggle so it can't
  // "disappear"); the needle counter-rotates to always point true north.
  const DEFAULT_BEARING = -29;
  window._viewMode = 0;
  window._showBusLabels = false;
  function applyViewMode() {
    const m = window._viewMode | 0;
    const wantRotated = (m === 0 || m === 2);   // street-grid bearing
    const wantLabels  = (m === 2 || m === 3);
    if (_hobokenMap && typeof _hobokenMap.setBearing === 'function') {
      _hobokenMap.setBearing(wantRotated ? DEFAULT_BEARING : 0);
    }
    window._showBusLabels = wantLabels;
    // Re-bind tooltips on existing bus markers so permanent flag matches.
    for (const key of Object.keys(_busMarkers || {})) {
      const mk = _busMarkers[key];
      if (!mk) continue;
      const content = mk.getTooltip() ? mk.getTooltip().getContent() : '';
      mk.unbindTooltip();
      mk.bindTooltip(content, {
        direction: 'top',
        offset: [0, -18],
        className: 'bus-tip',
        permanent: wantLabels,
      });
    }
  }
  applyViewMode();
  window.addEventListener('keydown', function (e) {
    if (!_hobokenMap) return;
    const k = e.key || '';
    if (ZOOM_IN_KEYS.has(k) || ZOOM_IN_CODES.has(e.keyCode)) {
      _hobokenMap.zoomIn(1);
      e.preventDefault(); e.stopPropagation();
    } else if (ZOOM_OUT_KEYS.has(k) || ZOOM_OUT_CODES.has(e.keyCode)) {
      _hobokenMap.zoomOut(1);
      e.preventDefault(); e.stopPropagation();
    } else if (SELECT_KEYS.has(k) || SELECT_CODES.has(e.keyCode)) {
      window._viewMode = ((window._viewMode | 0) + 1) % 4;
      applyViewMode();
      e.preventDefault(); e.stopPropagation();
    }
  }, true);

  // Seed home stubs so face bubbles appear before first network fetch
  renderLocations(HOME_STUBS);
}

async function fetchLocations() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  const token = localStorage.getItem('calToken') || '';
  try {
    const res = await fetchT(PROXY_URL + '?mode=locations',
      { headers: { 'X-Cal-Token': token } });
    if (!res.ok) return;
    const data = await res.json();
    renderBuses(data.buses || []);     // first so _lastBuses is populated
    const liveLocs = data.locations || [];
    const liveTids = new Set(liveLocs.map(l => l.tid));
    const stubs = HOME_STUBS.filter(s => !liveTids.has(s.tid));
    renderLocations([...stubs, ...liveLocs]);
    renderTiles(data.tiles || []);
  } catch (e) {
    console.error('Locations fetch error:', e);
  }
}

function renderTiles(tiles) {
  if (!_hobokenMap) return;
  const seen = new Set();
  for (const t of tiles) {
    const key = t.uuid;
    seen.add(key);
    const latlng = [t.lat, t.lon];
    const cfg = TILE_DEVICES[t.name] || {};
    const label = cfg.icon || (t.name || '?').substring(0, 2).toUpperCase();
    const style = cfg.color ? ('background:' + cfg.color + ';') : '';
    const icon = L.divIcon({
      className: 'tile-marker',
      html: '<div style="' + style + 'width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;">' + label + '</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13],
    });
    if (_tileMarkers[key]) {
      _tileMarkers[key].setLatLng(latlng);
      _tileMarkers[key].setIcon(icon);
    } else {
      _tileMarkers[key] = L.marker(latlng, { icon: icon }).addTo(_hobokenMap);
    }
  }
  for (const key of Object.keys(_tileMarkers)) {
    if (!seen.has(key)) {
      _hobokenMap.removeLayer(_tileMarkers[key]);
      delete _tileMarkers[key];
    }
  }
}

function busLoadColor(passload) {
  const p = (passload || '').toUpperCase();
  if (p === 'EMPTY')                      return '#44ee44';
  if (p === 'LIGHT')                      return '#a0e060';
  if (p === 'MEDIUM')                     return '#e0c040';
  if (p === 'HEAVY')                      return '#ff9b40';
  if (p === 'FULL' || p === 'OVERLOADED') return '#ff5050';
  return '#7090a0';
}

function _busSvg(arrowColor, toNYC) {
  // NJT bus marker: NJTbus.png logo as the body, with a colored direction
  // arrow stacked above (NY-bound) or below (return). Arrow color encodes
  // passenger load (see busLoadColor).
  const pts = toNYC ? '13,1 1,13 25,13' : '13,13 1,1 25,1';
  const arrow =
    '<svg class="nbm-arrow" width="26" height="14" viewBox="0 0 26 14">' +
      '<polygon points="' + pts + '" fill="' + arrowColor + '"' +
        ' stroke="rgba(20,30,40,0.8)" stroke-width="1" stroke-linejoin="round"/>' +
    '</svg>';
  const img = '<img src="NJTbus.png" class="nbm-body" alt="">';
  return '<div class="nbm-wrap">' + (toNYC ? arrow + img : img + arrow) + '</div>';
}

function renderBuses(buses) {
  _lastBuses = buses || [];
  if (!_hobokenMap) return;
  const seen = new Set();
  for (const b of buses) {
    const key = 'bus_' + (b.vehicle_id || (b.route + '_' + b.lat.toFixed(4) + '_' + b.lon.toFixed(4)));
    seen.add(key);
    const toNYC = (b.destination || '').toUpperCase().includes('NEW YORK');
    const arrowColor = busLoadColor(b.passload);
    const icon = L.divIcon({
      className: 'bus-marker',
      html: _busSvg(arrowColor, toNYC),
      iconSize: [26, 40],
      iconAnchor: [13, 20],
    });
    const label = (b.route ? b.route : 'Bus') + (b.vehicle_id ? ' · #' + b.vehicle_id : '');
    if (_busMarkers[key]) {
      _busMarkers[key].setIcon(icon);
      _busMarkers[key].setTooltipContent(label);
      _slideTo(key, _busMarkers[key], b.lat, b.lon);
    } else {
      _busMarkers[key] = L.marker([b.lat, b.lon], { icon: icon })
        .bindTooltip(label, {
          direction: 'top',
          offset: [0, -18],
          className: 'bus-tip',
          permanent: !!window._showBusLabels,
        })
        .addTo(_hobokenMap);
    }
  }
  for (const key of Object.keys(_busMarkers)) {
    if (!seen.has(key)) {
      _hobokenMap.removeLayer(_busMarkers[key]);
      delete _busMarkers[key];
      delete _markerAnims[key];
    }
  }
}

var _lastZoomKey = null;
function _smoothZoomTo(center, zoom) {
  var key = center[0].toFixed(5) + ',' + center[1].toFixed(5) + ',' + zoom;
  if (_lastZoomKey === key) return;
  _lastZoomKey = key;
  _hobokenMap.flyTo(center, zoom, { duration: 1.2 });
}
function _smoothZoomBounds(bounds, opts) {
  var key = bounds[0][0].toFixed(5) + ',' + bounds[0][1].toFixed(5) + ',' +
            bounds[1][0].toFixed(5) + ',' + bounds[1][1].toFixed(5) + ',' + (opts.maxZoom || '');
  if (_lastZoomKey === key) return;
  _lastZoomKey = key;
  _hobokenMap.flyToBounds(bounds, Object.assign({ duration: 1.2 }, opts));
}

function renderLocations(locations) {
  if (!_hobokenMap) return;
  const OVERLAP_MI = 0.05;        // ~265 ft for clustering non-home people
  const RING_RADIUS_DEG = 0.0003; // ~110 ft for non-home clustering

  // Split into at-home vs elsewhere
  const atHome = locations.filter(function (l) { return distMi(HOME, l) < HOME_RADIUS_MI; });
  const elsewhere = locations.filter(function (l) { return distMi(HOME, l) >= HOME_RADIUS_MI; });

  // At-home people: pinned to HOME lat/lng, positioned by iconAnchor (pixel offset
  // from home). Smaller icon so they look like satellites orbiting the home badge.
  const HOME_FACE_SIZE = 20;
  const HOME_ORBIT_RADIUS = 18; // px from home center to face center
  const homeIconConfig = {};
  atHome.forEach(function (l, idx) {
    const angle = (idx / Math.max(atHome.length, 1)) * 2 * Math.PI - Math.PI / 2;
    const dx = Math.cos(angle) * HOME_ORBIT_RADIUS;
    const dy = Math.sin(angle) * HOME_ORBIT_RADIUS;
    // iconAnchor positions the (x,y) point of the icon at the latlng. To shift
    // the icon's visual center by (dx, dy), we offset the anchor by (-dx, -dy)
    // from the icon's natural center (size/2).
    homeIconConfig[l.tid] = {
      latlng: [HOME.lat, HOME.lon],
      iconSize: [HOME_FACE_SIZE, HOME_FACE_SIZE],
      iconAnchor: [HOME_FACE_SIZE / 2 - dx, HOME_FACE_SIZE / 2 - dy],
      className: 'person-marker small',
    };
  });

  // Cluster elsewhere people who happen to be near each other
  const positions = {};
  for (const loc of elsewhere) positions[loc.tid] = { lat: loc.lat, lon: loc.lon };
  const handled = new Set();
  for (let i = 0; i < elsewhere.length; i++) {
    if (handled.has(elsewhere[i].tid)) continue;
    const cluster = [elsewhere[i]];
    handled.add(elsewhere[i].tid);
    for (let j = i + 1; j < elsewhere.length; j++) {
      if (handled.has(elsewhere[j].tid)) continue;
      if (distMi(elsewhere[i], elsewhere[j]) < OVERLAP_MI) {
        cluster.push(elsewhere[j]);
        handled.add(elsewhere[j].tid);
      }
    }
    if (cluster.length > 1) {
      const cx = cluster.reduce(function (s, c) { return s + c.lat; }, 0) / cluster.length;
      const cy = cluster.reduce(function (s, c) { return s + c.lon; }, 0) / cluster.length;
      cluster.forEach(function (c, idx) {
        const angle = (idx / cluster.length) * 2 * Math.PI + 0.5;
        positions[c.tid].lat = cx + RING_RADIUS_DEG * Math.cos(angle);
        positions[c.tid].lon = cy + RING_RADIUS_DEG * Math.sin(angle);
      });
    }
  }

  // Render markers
  const seen = new Set();
  for (const loc of locations) {
    seen.add(loc.tid);
    const faceUrl = FACE_IMAGES[loc.tid];
    const html = faceUrl
      ? '<img src="' + faceUrl + '" alt="' + displayName(loc) + '"/>'
      : (displayName(loc) || '?').substring(0, 2).toUpperCase();

    let latlng, iconSize, iconAnchor, className;
    if (homeIconConfig[loc.tid]) {
      const cfg = homeIconConfig[loc.tid];
      latlng = cfg.latlng;
      iconSize = cfg.iconSize;
      iconAnchor = cfg.iconAnchor;
      className = cfg.className;
    } else {
      const pos = positions[loc.tid] || { lat: loc.lat, lon: loc.lon };
      latlng = [pos.lat, pos.lon];
      iconSize = [36, 36];
      iconAnchor = [18, 18];
      className = 'person-marker';
    }

    const icon = L.divIcon({
      className: className,
      html: html,
      iconSize: iconSize,
      iconAnchor: iconAnchor,
    });
    if (_personMarkers[loc.tid]) {
      _personMarkers[loc.tid].setLatLng(latlng);
      _personMarkers[loc.tid].setIcon(icon);
    } else {
      _personMarkers[loc.tid] = L.marker(latlng, { icon: icon }).addTo(_hobokenMap);
    }
  }
  // Remove markers for people no longer in the list
  for (const tid of Object.keys(_personMarkers)) {
    if (!seen.has(tid)) {
      _hobokenMap.removeLayer(_personMarkers[tid]);
      delete _personMarkers[tid];
    }
  }
  // Update overlay — one semi-transparent pill per person, left-aligned
  const overlay = document.getElementById('mapStatusOverlay');
  if (overlay) {
    if (locations.length === 0) {
      overlay.innerHTML = '';
    } else {
      overlay.innerHTML = locations.map(function (l) {
        const status = personStatus(l);
        const ago = agoText(l.received_at * 1000);
        return '<span class="ms-pill"><span class="ms-name">' + displayName(l) +
          '</span><span class="ms-status">' + status +
          '</span><span class="ms-ago">' + ago + '</span></span>';
      }).join('');
    }
  }

  // Auto-fit: include home + any person within 5mi. If none in range, default Hoboken view.
  const inRange = locations.filter(function (l) {
    return distMi(HOME, l) <= AUTO_FIT_RADIUS_MI;
  });
  var anyApproaching = inRange.some(function (l) {
    var d = distMi(HOME, l);
    return d >= HOME_RADIUS_MI && d <= NEAR_HOME_RADIUS_MI;
  });
  if (inRange.length === 0) {
    _smoothZoomTo([HOME.lat, HOME.lon], 14);
  } else if (locations.length > 0 && inRange.length === locations.length &&
             inRange.every(function (l) { return distMi(HOME, l) < HOME_RADIUS_MI; })) {
    _smoothZoomTo([HOME.lat, HOME.lon], 15);
  } else if (anyApproaching) {
    var approaching = inRange.filter(function (l) { return distMi(HOME, l) <= NEAR_HOME_RADIUS_MI; });
    var lats = [HOME.lat].concat(approaching.map(function (l) { return l.lat; }));
    var lngs = [HOME.lon].concat(approaching.map(function (l) { return l.lon; }));
    _smoothZoomBounds(
      [[Math.min.apply(null, lats), Math.min.apply(null, lngs)],
       [Math.max.apply(null, lats), Math.max.apply(null, lngs)]],
      { padding: [30, 30], maxZoom: 18 }
    );
  } else {
    var lats = [HOME.lat].concat(inRange.map(function (l) { return l.lat; }));
    var lngs = [HOME.lon].concat(inRange.map(function (l) { return l.lon; }));
    var minLat = Math.min.apply(null, lats);
    var maxLat = Math.max.apply(null, lats);
    var minLng = Math.min.apply(null, lngs);
    var maxLng = Math.max.apply(null, lngs);
    _smoothZoomBounds([[minLat, minLng], [maxLat, maxLng]], {
      padding: [20, 20],
      maxZoom: 15,
    });
  }
}

function setAlertsMode(mode) {
  // mode: 'news' or 'map'
  const mapEl = document.getElementById('mapContainer');
  const listEl = document.getElementById('personList');
  if (mode === 'map') {
    mapEl.style.display = 'block';
    listEl.style.display = 'flex';
    initHobokenMap();
    if (_hobokenMap) setTimeout(function () { _hobokenMap.invalidateSize(); }, 100);
  } else {
    mapEl.style.display = 'none';
    listEl.style.display = 'none';
  }
}

// ============================================================
// ALERTS & NEWS
// ============================================================
async function fetchAlerts() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(PROXY_URL + '?mode=alerts');
    const data = await res.json();
    markOk('alerts');
    const container = document.getElementById('alertsList');
    let items = [];

    // Only NJT alerts that mention routes/services the family rides (126, 119, ferry).
    // Nixle and broader NJT system-wide noise are filtered out by default.
    const RELEVANT_KEYWORDS = /\b(126|119|ferry|hoboken|all bus|systemwide)\b/i;
    if (Array.isArray(data.njt_alerts)) {
      for (const a of data.njt_alerts) {
        if (a.error) continue;
        const text = a.description || a.title || '';
        if (!RELEVANT_KEYWORDS.test(text)) continue;
        items.push({ text: text, badge: 'njt', badgeText: 'NJT', isAlert: true });
      }
    }

    // Alerts only — no news, no stocks
    const divider = document.querySelector('.cal-alert-divider');
    if (items.length === 0) {
      container.innerHTML = '';
      container.style.display = 'none';
      if (divider) divider.style.display = 'none';
    } else {
      container.style.display = 'flex';
      if (divider) divider.style.display = 'block';
      let html = '';
      for (const item of items) {
        html += `<div class="alert-item is-alert">`;
        html += `<span class="alert-badge ${item.badge}">${item.badgeText}</span>`;
        html += item.text;
        html += '</div>';
      }
      container.innerHTML = html;
      requestAnimationFrame(() => trimOverflow(container));
    }
  } catch (e) {
    console.error('Alerts fetch error:', e);
    markFail('alerts');
  }
}
