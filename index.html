<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Hoboken Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23151520'/><path fill='%236bffb8' d='M14 40c0 2.2 1 4.2 2.5 5.5V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-2.5h20V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-4.5c1.5-1.4 2.5-3.3 2.5-5.5V15c0-8.75-8.95-10-20-10S14 6.25 14 15v25zm8.75 2.5c-2.1 0-3.75-1.7-3.75-3.75S20.65 35 22.75 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm22.5 0c-2.1 0-3.75-1.7-3.75-3.75S43.15 35 45.25 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm3.75-15h-30V15h30v12.5z'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23151520'/><path fill='%236bffb8' d='M14 40c0 2.2 1 4.2 2.5 5.5V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-2.5h20V50c0 1.4 1.1 2.5 2.5 2.5h2.5c1.4 0 2.5-1.1 2.5-2.5v-4.5c1.5-1.4 2.5-3.3 2.5-5.5V15c0-8.75-8.95-10-20-10S14 6.25 14 15v25zm8.75 2.5c-2.1 0-3.75-1.7-3.75-3.75S20.65 35 22.75 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm22.5 0c-2.1 0-3.75-1.7-3.75-3.75S43.15 35 45.25 35s3.75 1.7 3.75 3.75-1.65 3.75-3.75 3.75zm3.75-15h-30V15h30v12.5z'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    background: #000;
    color: #e8e8ec;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 0.7fr 1.7fr 0.85fr;
    grid-template-rows: auto 1fr auto auto;
    gap: 10px;
    padding: 12px;
  }

  /* Cards */
  .card {
    background: #0a0a0f;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 0.5px solid #2a2a35;
  }

  .card-title {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9a9aa8;
    margin-bottom: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-title svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  /* Clock card ‚Äî top left */
  .clock-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .time {
    font-size: 2.4rem;
    font-weight: 200;
    letter-spacing: 0.02em;
    line-height: 1;
    color: #fff;
    white-space: nowrap;
  }

  .date-line {
    font-size: 0.75rem;
    font-weight: 300;
    color: #888;
    margin-top: 4px;
  }

  /* Weather card ‚Äî below clock */
  .weather-card {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: 1fr auto;
    gap: 0 10px;
  }

  .weather-main {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .weather-top {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .weather-icon { font-size: 2.4rem; line-height: 1; }

  .weather-temp {
    font-size: 2.4rem;
    font-weight: 200;
    color: #fff;
    line-height: 1;
  }

  .weather-temp-c {
    font-size: 1rem;
    font-weight: 200;
    color: #888;
    line-height: 1;
  }

  .weather-desc {
    font-size: 0.75rem;
    color: #aaa;
    margin-top: 3px;
  }

  .weather-details {
    grid-column: 1 / -1;
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 0.75rem;
    color: #777;
    padding-top: 6px;
    border-top: 0.5px solid #1e1e2e;
    margin-top: 6px;
    white-space: nowrap;
  }

  .weather-details span { color: #bbb; }

  .weather-forecast {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: visible;
    border-left: 0.5px solid #1e1e2e;
    padding-left: 8px;
    justify-content: center;
    min-width: 90px;
  }

  .weather-hour {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .weather-hour .wh-time {
    font-size: 0.6rem;
    color: #9a9aa8;
    min-width: 38px;
  }

  .weather-hour .wh-icon {
    font-size: 0.75rem;
    line-height: 1;
  }

  .weather-hour .wh-temp {
    font-size: 0.75rem;
    font-weight: 500;
    color: #ccc;
  }

  /* Calendar ‚Äî spans both rows in right column */
  #calCard {
    grid-row: 1 / 3;
    grid-column: 3;
  }

  /* Map card ‚Äî spans both rows in middle column, no padding so map fills it */
  #mapCard {
    grid-row: 1 / 3;
    grid-column: 2;
    padding: 0;
    overflow: hidden;
  }

  #mapCard #hobokenMap { width: 100%; height: 100%; }

  /* Calendar events (rendered from Google Calendar API) */
  .cal-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    padding-right: 4px;
  }

  .cal-content::-webkit-scrollbar { width: 0; }

  .cal-day-header {
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #6bffb8;
    margin: 8px 0 4px 0;
    padding-bottom: 3px;
    border-bottom: 0.5px solid #1a1a28;
  }

  .cal-day-header:first-child { margin-top: 0; }

  .cal-day-header.is-today { color: #6bffb8; }
  .cal-day-header.is-future { color: #9a9aa8; }

  .cal-event {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    font-size: 0.95rem;
    line-height: 1.3;
  }

  .cal-event-time {
    color: #888;
    font-weight: 500;
    flex-shrink: 0;
    min-width: 105px;
    font-size: 0.85rem;
  }

  .cal-event-title {
    color: #e8e8ec;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-event.all-day .cal-event-time { color: #9a9aa8; font-style: italic; }

  .cal-empty, .cal-signin-prompt {
    font-size: 0.75rem;
    color: #9a9aa8;
    padding: 20px 8px;
    text-align: center;
  }

  .cal-signin-btn {
    background: #6bffb8;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    outline: none;
  }

  .cal-signin-btn:focus {
    box-shadow: 0 0 0 3px #fff;
    transform: scale(1.05);
  }

  /* Alerts now stacked inside the calendar card (right column) */
  .cal-alert-divider {
    border-top: 0.5px solid #2a2a35;
    margin: 8px -12px 6px -12px;
  }

  .alerts-panel {
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }

  .alerts-list {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .alert-item {
    font-size: 0.65rem;
    line-height: 1.3;
    color: #ccc;
    padding: 3px 0;
    border-bottom: 0.5px solid #1a1a28;
  }

  .alert-item:last-child { border-bottom: none; }

  .alert-item.is-alert {
    color: #ff9b6b;
    font-weight: 600;
  }

  .alert-badge {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 4px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .alert-badge.njt {
    background: #c0392b;
    color: #fff;
  }

  .alert-badge.nixle {
    background: #e67e22;
    color: #fff;
  }

  .alert-badge.news {
    background: #2a2a3a;
    color: #888;
  }

  /* Map panel (replaces news in alerts card during specific hours) */
  .map-container {
    flex: 2;
    min-height: 220px;
    border-radius: 8px;
    overflow: hidden;
    background: #0a0a0f;
    margin-top: 8px;
    border-top: 0.5px solid #2a2a35;
  }

  .map-container .leaflet-container {
    width: 100%;
    height: 100%;
    background: #0a0a0f;
  }

  /* Subtle tone adjustment on map tiles */
  .map-container .leaflet-tile-pane {
    filter: brightness(0.95);
  }

  /* Hide Leaflet controls ‚Äî we want a clean ambient view */
  .leaflet-control-zoom,
  .leaflet-control-attribution {
    display: none !important;
  }

  /* Custom location markers */
  .person-marker {
    width: 36px !important;
    height: 36px !important;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
    overflow: hidden;
    background: #6bffb8;
    color: #000;
    font-weight: 700;
    font-size: 0.8rem;
    line-height: 36px;
    text-align: center;
  }

  .person-marker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .home-marker {
    width: 30px !important;
    height: 30px !important;
    background: #3a7bd5;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
    display: flex !important;
    align-items: center;
    justify-content: center;
  }

  .bus-marker {
    width: 20px !important;
    height: 20px !important;
    background: #888;
    border-radius: 50%;
    border: 1.5px solid #fff;
    box-shadow: 0 0 3px rgba(0,0,0,0.6);
    font-size: 0.55rem;
    font-weight: 700;
    color: #000;
    line-height: 18px;
    text-align: center;
  }
  .bus-marker.load-empty  { background: #6bffb8; }
  .bus-marker.load-light  { background: #a0e060; }
  .bus-marker.load-medium { background: #e0c040; }
  .bus-marker.load-heavy  { background: #ff9b40; }
  .bus-marker.load-full   { background: #ff5050; }

  /* Tile (Life360) tracker markers ‚Äî purple */
  .tile-marker {
    width: 26px !important;
    height: 26px !important;
    background: #c870ff;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
    font-size: 0.85rem;
    font-weight: 700;
    color: #000;
    line-height: 22px;
    text-align: center;
  }

  .person-list {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.7rem;
    padding-top: 4px;
    color: #aaa;
  }

  .person-list .person-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6bffb8;
    margin-right: 4px;
    vertical-align: middle;
  }

  .stock-ticker-bar {
    flex-shrink: 0;
    border-top: 0.5px solid #1e1e2e;
    padding-top: 6px;
    margin: 8px -12px 0 -12px;
    padding-left: 0;
    padding-right: 0;
    overflow: hidden;
    position: relative;
  }

  .stock-ticker-track {
    display: flex;
    gap: 18px;
    animation: ticker-scroll 25s linear infinite;
    width: max-content;
  }

  @keyframes ticker-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .stock-item {
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    font-size: 0.6rem;
  }

  .stock-symbol {
    font-weight: 600;
    color: #999;
  }

  .stock-pct { font-weight: 500; }
  .stock-up { color: #6bffb8; }
  .stock-down { color: #ff6b6b; }

  /* Transit cards - full width */
  .transit-card {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    min-height: 0;
  }

  .transit-icon {
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  .transit-icon svg {
    width: 32px;
    height: 32px;
    fill: #555;
  }

  .transit-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .transit-title {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9a9aa8;
    margin-bottom: 3px;
  }

  .transit-routes {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px 16px;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
  }

  .route-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .route-label {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #9a9aa8;
    white-space: nowrap;
  }

  .dep-row {
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
  }

  .dep-chip {
    display: flex;
    align-items: baseline;
    gap: 4px;
    background: #1a1a2a;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .dep-chip:first-child {
    background: #1a2a1a;
  }

  .dep-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 4px 8px;
  }

  .dep-chip .t {
    font-size: 0.65rem;
    font-weight: 400;
    color: #888;
    order: 2;
    line-height: 1.1;
  }

  .dep-chip:first-child .t {
    font-size: 0.65rem;
  }

  .dep-chip .cd {
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    order: 1;
    line-height: 1.1;
  }

  .load-bars {
    display: inline-flex;
    gap: 1.5px;
    margin-left: 5px;
    vertical-align: middle;
    align-items: flex-end;
    height: 10px;
  }

  .load-bar {
    width: 2.5px;
    background: #2a2a3a;
    border-radius: 1px;
    transition: background 0.3s;
  }

  .load-bar:nth-child(1) { height: 3px; }
  .load-bar:nth-child(2) { height: 5px; }
  .load-bar:nth-child(3) { height: 7px; }
  .load-bar:nth-child(4) { height: 10px; }

  .load-bar.lvl-1 { background: #6bffb8; }
  .load-bar.lvl-2 { background: #a0e060; }
  .load-bar.lvl-3 { background: #e0c040; }
  .load-bar.lvl-4 { background: #ff9b40; }

  .tunnel-traffic {
    flex-shrink: 0;
    text-align: center;
    padding: 3px 14px;
    border-left: 0.5px solid #1e1e2e;
    margin-left: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 130px;
    box-sizing: border-box;
  }

  .tunnel-label {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9a9aa8;
    margin-bottom: 2px;
  }

  .tunnel-time {
    font-size: 1.4rem;
    font-weight: 300;
    color: #fff;
  }

  .tunnel-min {
    font-size: 0.75rem;
    color: #888;
  }

  .tunnel-status {
    font-size: 0.6rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .no-service {
    font-size: 0.75rem;
    color: #444;
  }

  /* Bus headlights ‚Äî green when API live, red when offline */
  .bus-headlight { filter: none; }
  .bus-headlight.live { fill: #6bffb8; }
  .bus-headlight.schedule { fill: #c0392b; }

  /* Ferry wave animation (only when active) */
  .ferry-wave {
    transform-origin: center;
  }

  .ferry-wave.active {
    animation: ferry-wave-move 2.5s ease-in-out infinite;
  }

  @keyframes ferry-wave-move {
    0%, 100% { transform: translateX(-1.5px); }
    50% { transform: translateX(1.5px); }
  }

  /* Pause animations during sleep mode to save CPU/GPU on slow hardware */
  body.sleeping .stock-ticker-track,
  body.sleeping .ferry-wave {
    animation-play-state: paused;
  }

  /* Respect user/system reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    .stock-ticker-track,
    .ferry-wave.active {
      animation: none !important;
    }
  }

  /* Hop */
  .hop-etas {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    margin-top: 2px;
  }

  .hop-eta-item {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .hop-eta-time {
    font-size: 1rem;
    font-weight: 300;
    color: #fff;
  }

  .hop-no-service {
    font-size: 0.6rem;
    color: #444;
  }

  .status-bar {
    position: fixed;
    bottom: 1px;
    right: 14px;
    left: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.42rem;
    color: #555;
    pointer-events: none;
    line-height: 1;
  }

  .status-warning {
    color: #ffb84d;
    font-weight: 600;
  }

  .status-ok { color: #666; }

  @media (max-width: 800px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto auto;
    }
    #calCard, #alertsCard { grid-row: auto; grid-column: auto; }
    .transit-card { flex-direction: column; align-items: flex-start; }
    .time { font-size: 2.4rem; }
    .weather-temp { font-size: 2.4rem; }
  }
</style>
</head>
<body>

<!-- Row 1: Clock (top-left) -->
<div class="card clock-card">
  <div class="time" id="clock">--:--</div>
  <div class="date-line" id="dateLine">---</div>
</div>

<!-- Row 1-2: Map (middle, always visible, fills its panel) -->
<div class="card" id="mapCard">
  <div id="hobokenMap"></div>
</div>

<!-- Row 1-2: Calendar + Alerts (right column, stacked with divider) -->
<div class="card" id="calCard">
  <div class="cal-content" id="calContent">
    <div class="cal-signin-prompt" id="calSigninPrompt" style="display:none;"></div>
    <div id="calEvents"></div>
  </div>
  <div class="cal-alert-divider"></div>
  <div class="alerts-list" id="alertsList" style="max-height:35%;overflow:hidden;flex-shrink:0;">
    <div class="alert-item" style="color:#444;">Loading...</div>
  </div>
</div>

<!-- Row 2: Weather (below clock, left) -->
<div class="card weather-card" id="weatherCard">
  <div class="weather-main">
    <div class="weather-top">
      <div class="weather-icon" id="weatherIcon">--</div>
      <div>
        <div class="weather-temp" id="weatherTemp">--&deg;F</div>

// Trim trailing children of a container until they all fit without overflow.
// Used for alerts + calendar so nothing is half-cut at the bottom.
function trimOverflow(container) {
  if (!container) return;
  // Wait for layout
  let safety = 200;
  while (safety-- > 0 &&
         container.scrollHeight > container.clientHeight + 1 &&
         container.lastElementChild) {
    container.removeChild(container.lastElementChild);
  }
}

// fetch with abort timeout ‚Äî prevents hung TCP from piling up callbacks
function fetchT(url, opts, ms) {
  ms = ms || 15000;
  const c = new AbortController();
  const id = setTimeout(function() { c.abort(); }, ms);
  return fetch(url, Object.assign({}, opts || {}, { signal: c.signal }))
    .finally(function() { clearTimeout(id); });
}

function markOk(key) {
  apiStatus[key].ok = true;
  apiStatus[key].lastUpdate = Date.now();

function markFail(key) {
  apiStatus[key].ok = false;

function agoText(ts) {
  if (!ts) return 'never';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return `${sec}s ago`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
  return `${Math.floor(sec / 3600)}h ago`;
}

function updateStatusBar() {
  // Freshness: oldest successful update
  let oldest = null;
  for (const key of Object.keys(apiStatus)) {
    const ts = apiStatus[key].lastUpdate;
    if (ts && (oldest === null || ts < oldest)) oldest = ts;
  }
  document.getElementById('statusFreshness').textContent =
    oldest ? `Updated ${agoText(oldest)}` : 'Loading...';

  // Errors: list any failed APIs
  const failed = [];
  for (const [key, s] of Object.entries(apiStatus)) {
    if (s.ok === false) failed.push(key);
  }
  const errEl = document.getElementById('statusErrors');
  if (failed.length > 0) {
    errEl.className = 'status-warning';
    errEl.innerHTML =
      '<svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor" style="vertical-align:middle;margin-right:3px;">' +
      '<path d="M12 2 1 21h22z M11 9h2v6h-2z M11 17h2v2h-2z"/></svg>' +
      failed.join(', ') + ' offline';
  } else {
    errEl.className = 'status-ok';
    errEl.textContent = '';
  }
}

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('clock').textContent = `${h12}:${m} ${ampm}`;

  const opts = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
  document.getElementById('dateLine').textContent = now.toLocaleDateString('en-US', opts);
}

// ============================================================
// WEATHER
// ============================================================
async function updateWeather() {
  if (document.hidden || isSleeping()) return;
  let apiSucceeded = false;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.744&longitude=-74.032'
      + '&current_weather=true&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'
      + '&hourly=relativehumidity_2m,temperature_2m,weathercode,precipitation_probability'
      + '&temperature_unit=fahrenheit&timezone=America/New_York';
    const res = await fetchT(url);
    const data = await res.json();
    apiSucceeded = true;
    markOk('weather');
    const cw = data.current_weather;
    const code = WMO_CODES[cw.weathercode] || ["Unknown", "?"];

    const tempF = Math.round(cw.temperature);
    const tempC = Math.round((tempF - 32) * 5 / 9);
    document.getElementById('weatherTemp').innerHTML = `${tempF}&deg;F`;
    document.getElementById('weatherTempC').innerHTML = `${tempC}&deg;C`;
    document.getElementById('weatherDesc').textContent = code[0];
    document.getElementById('weatherIcon').innerHTML = wIcon(code[1], 44);
    document.getElementById('weatherWind').textContent = Math.round(cw.windspeed);
    document.getElementById('weatherHi').textContent = Math.round(data.daily.temperature_2m_max[0]);
    document.getElementById('weatherLo').textContent = Math.round(data.daily.temperature_2m_min[0]);

    // Precipitation: show umbrella if any hour in next 12 hours has >30% chance
    const nowH = new Date().getHours();
    const rainProbs = data.hourly.precipitation_probability || [];
    let maxRain = 0;
    for (let h = nowH; h < Math.min(nowH + 12, rainProbs.length); h++) {
      if (rainProbs[h] > maxRain) maxRain = rainProbs[h];
    }
    const rainEl = document.getElementById('weatherRain');
    if (maxRain >= 30) {
      rainEl.style.display = 'flex';
      document.getElementById('weatherRainPct').textContent = maxRain;
    } else {
      rainEl.style.display = 'none';
    }

    const nowHour = new Date().getHours();
    const humidity = data.hourly.relativehumidity_2m
      ? data.hourly.relativehumidity_2m[nowHour]
      : (data.hourly.relative_humidity_2m ? data.hourly.relative_humidity_2m[nowHour] : '--');
    document.getElementById('weatherHumidity').textContent = humidity;

    // Hourly forecast
    const hourlyTemps = data.hourly.temperature_2m;
    const hourlyCodes = data.hourly.weathercode;
    if (hourlyTemps && hourlyCodes) {
      let fhtml = '';
      let count = 0;
      let h = nowHour + 2;
      while (count < 7 && h < hourlyTemps.length) {
        const t = Math.round(hourlyTemps[h]);
        const ic = WMO_CODES[hourlyCodes[h]] || ['?', 'cloud'];
        const displayH = h % 24;
        const ampm = displayH >= 12 ? 'PM' : 'AM';
        const h12 = displayH % 12 || 12;
        fhtml += `<div class="weather-hour"><span class="wh-time">${h12} ${ampm}</span><span class="wh-icon">${wIcon(ic[1], 14)}</span><span class="wh-temp">${t}&deg;</span></div>`;
        h += 2;
        count++;
      }
      document.getElementById('weatherForecast').innerHTML = fhtml;
    }
  } catch (e) {
    console.error('Weather error:', e);
    if (!apiSucceeded) {
      document.getElementById('weatherDesc').textContent = 'Error loading weather';
      markFail('weather');
    }
  }
}

// ============================================================
// TRANSIT HELPERS
// ============================================================
function timeToMinutes(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function formatTime12(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
}

function minutesUntil(timeStr) {
  const target = timeToMinutes(timeStr);
  const now = nowMinutes();
  let diff = target - now;
  // Late-night service (target before 3am) only wraps when viewer is also late evening
  // (after 6pm). Prevents 00:05 bus from showing "23h59m" when checked at 00:10.
  if (diff < -180 && target < 180 && now > 18 * 60) {
    diff += 24 * 60;
  }
  return diff;
}

function countdownText(mins) {
  if (mins <= 0) return 'now';
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m > 0 ? `${h}h${m}m` : `${h}h`;
}

function isWeekend() {
  const day = new Date().getDay();
  return day === 0 || day === 6;
}

function isSunday() {
  return new Date().getDay() === 0;
}

function getNextDepartures(times, count) {
  const upcoming = times.filter(t => minutesUntil(t) >= 0);
  upcoming.sort((a, b) => minutesUntil(a) - minutesUntil(b));
  return upcoming.slice(0, count);
}

function renderDepartures(times, label) {
  const next = getNextDepartures(times, 3);
  if (times.length === 0) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service">No service today</div></div>`;
  }
  if (next.length === 0) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service">Done for today</div></div>`;
  }
  let html = `<div class="route-group"><div class="route-label">${label}:</div><div class="dep-row">`;
  for (const t of next) {
    const mins = minutesUntil(t);
    const cdColor = mins <= 5 ? '#ff6b6b' : '#6bffb8';
    html += `<div class="dep-chip"><span class="t">${formatTime12(t)}</span><span class="cd" style="color:${cdColor}">${countdownText(mins)}</span></div>`;
  }
  html += '</div></div>';
  return html;
}

function get126WillowSchedule() {
  let base;
  if (isSunday()) base = BUS_126_SCHEDULE.sunday;
  else if (isWeekend()) base = BUS_126_SCHEDULE.saturday;
  else base = BUS_126_SCHEDULE.weekday;
  return base.map(t => {
    let mins = timeToMinutes(t) + 2;
    if (mins >= 24 * 60) mins -= 24 * 60;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  });
}

function loadDot(passload) {
  const p = (passload || '').toUpperCase();
  // Map passload to number of filled bars (0-4)
  let level = 0;
  if (p === 'EMPTY') level = 1;
  else if (p === 'LIGHT') level = 2;
  else if (p === 'MEDIUM') level = 3;
  else if (p === 'HEAVY' || p === 'FULL' || p === 'OVERLOADED') level = 4;
  else return '';

  // Render 4 bars, filling based on level, each colored by the level
  let bars = '';
  for (let i = 1; i <= 4; i++) {
    const filled = i <= level ? ` lvl-${level}` : '';
    bars += `<span class="load-bar${filled}"></span>`;
  }
  return `<span class="load-bars" title="${p}">${bars}</span>`;
}

function renderLivePredictions(predictions, label) {
  if (!predictions || predictions.error) {
    return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service">Error</div></div>`;
  }
  if (Array.isArray(predictions) && predictions.length > 0) {
    let html = `<div class="route-group"><div class="route-label">${label}:</div><div class="dep-row">`;
    const items = predictions.slice(0, 3);
    for (const p of items) {
      const mins = parseInt(p.countdown, 10);
      const cdColor = mins <= 5 ? '#ff6b6b' : '#6bffb8';
      // For live API, we only have countdown minutes ‚Äî compute the clock time
      let displayTime;
      if (mins === 0) {
        displayTime = 'Due';
      } else {
        const now = new Date();
        const arrive = new Date(now.getTime() + mins * 60000);
        const hh = arrive.getHours();
        const mm = String(arrive.getMinutes()).padStart(2, '0');
        const ampm = hh >= 12 ? 'PM' : 'AM';
        const h12 = hh % 12 || 12;
        displayTime = `${h12}:${mm} ${ampm}`;
      }
      const dot = '';  // load indicator removed
      html += `<div class="dep-chip"><span class="t">${displayTime}</span><span class="cd" style="color:${cdColor}">${countdownText(mins)}</span>${dot}</div>`;
    }
    html += '</div></div>';
    return html;
  }
  return `<div class="route-group"><div class="route-label">${label}:</div><div class="no-service">No predictions</div></div>`;
}

async function fetchProxy() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(PROXY_URL);
    const data = await res.json();
    markOk('transit');

    if (data.tunnel && !data.tunnel.error) {
      const t = data.tunnel;
      document.getElementById('tunnelTime').textContent = t.travelTime || '--';
      const statusEl = document.getElementById('tunnelStatus');
      statusEl.textContent = t.status || '';
      statusEl.style.color = t.travelTime && parseInt(t.travelTime) > 15 ? '#ff6b6b' : '#6bffb8';
    }

    if (data.stops) {
      const container = document.getElementById('busContent');
      let html = '';
      let apiWorking = false;

      const stop20490 = data.stops['20490'];
      if (stop20490 && Array.isArray(stop20490.predictions) && stop20490.predictions.length > 0) {
        html += renderLivePredictions(stop20490.predictions, '126 @ 14th');
        // API is working if we got an array of predictions back (live or scheduled)
        apiWorking = true;
      } else {
        let schedule;
        if (isSunday()) schedule = BUS_126_SCHEDULE.sunday;
        else if (isWeekend()) schedule = BUS_126_SCHEDULE.saturday;
        else schedule = BUS_126_SCHEDULE.weekday;
        html += renderDepartures(schedule, '126 @ 14th');
      }

      const stop20523 = data.stops['20523'];
      if (stop20523 && Array.isArray(stop20523.predictions) && stop20523.predictions.length > 0) {
        const preds14 = (stop20490 && Array.isArray(stop20490.predictions)) ? stop20490.predictions : [];
        const etaMins14 = preds14.filter(p => p.route === '126').map(p => parseInt(p.countdown, 10));
        const filtered = stop20523.predictions.filter(p => {
          if (p.route !== '126') return true;
          const mins = parseInt(p.countdown, 10);
          return !etaMins14.some(m14 => Math.abs(mins - m14) <= 3);
        });
        if (filtered.length > 0) {
          html += renderLivePredictions(filtered, '119 @ 15th');
          apiWorking = true;
        } else {
          html += renderDepartures(get119Schedule(), '119 @ 15th');
        }
      } else {
        html += renderDepartures(get119Schedule(), '119 @ 15th');
      }

      container.innerHTML = html;

      const hl1 = document.getElementById('busHL1');
      const hl2 = document.getElementById('busHL2');
      if (hl1 && hl2) {
        const mode = apiWorking ? 'live' : 'schedule';
        hl1.setAttribute('class', 'bus-headlight ' + mode);
        hl2.setAttribute('class', 'bus-headlight ' + mode);
      }
    }
  } catch (e) {
    console.error('Proxy fetch error:', e);
    markFail('transit');
  }
}

function renderHopEtas(data) {
  const container = document.getElementById('hopContent');
  if (!data) { container.innerHTML = '<div class="hop-no-service">No data</div>'; return; }
  if (data.status === 'no vehicles') {
    container.innerHTML = '<div class="hop-no-service">No vehicles running</div>';
    return;
  }
  if (data.error) {
    container.innerHTML = '<div class="hop-no-service">Error</div>';
    return;
  }
  if (Array.isArray(data) && data.length > 0) {
    let html = '';
    for (const e of data.slice(0, 3)) {
      let eta = e.eta || '';
      const minsMatch = eta.match(/^(\d+)\s*min/i);
      if (minsMatch) {
        const adjusted = parseInt(minsMatch[1], 10) + 1;
        eta = `${adjusted} min`;
      }
      html += `<div class="hop-eta-item"><span class="hop-eta-time">${eta}</span></div>`;
    }
    container.innerHTML = html;
    return;
  }
  container.innerHTML = '<div class="hop-no-service">No vehicles running</div>';
}

function isMapMode() {
  const now = new Date();

  // Weekend (Sat=6, Sun=0): always map mode
  if (day === 0 || day === 6) return true;

let _hobokenMap = null;
let _personMarkers = {};
let _busMarkers = {};
let _tileMarkers = {};
let _homeMarker = null;

// Tile device display config ‚Äî map the device name (as set in the Tile app)
// to a display icon and label. Update once you have the devices set up.
const TILE_DEVICES = {
  // 'Buddy Collar':    { icon: 'üêï', color: '#c87000' },
  // 'Kid 1 Backpack':  { icon: 'S',  color: '#c870ff' },
  // 'Kid 2 Backpack':  { icon: 'M',  color: '#70b8ff' },
};

// Home: 1227 Garden St, Hoboken ‚Äî also used as the radius center for the auto-fit logic.
const HOME = { lat: 40.75202, lon: -74.02816, name: 'Home' };
// All of Hoboken ‚Äî never zoom tighter than this. West edge ~ Jackson St.
const HOBOKEN_BOUNDS = [[40.734, -74.030], [40.760, -74.022]];
// People outside this radius (miles) from HOME don't trigger an auto-zoom-out.
const AUTO_FIT_RADIUS_MI = 5;

// Mapping from Owntracks tracker ID (TID) to face image URL.
const FACE_IMAGES = {
  'HW':  'jeff.jpg',
  'JHW': 'jeff.jpg',
  'XW':  'jenny.jpg',
  'JXW': 'jenny.jpg',
};

// Display name override per TID (overrides whatever username Owntracks reports)
const PERSON_NAMES = {
  'HW':  'Jeff',
  'JHW': 'Jeff',
  'XW':  'Jenny',
  'JXW': 'Jenny',
};

function displayName(loc) {
  return PERSON_NAMES[loc.tid] || loc.name || loc.tid || '';
}

function distMi(a, b) {
  const R = 3959; // miles
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(lat1) * Math.cos(lat2);
  return 2 * R * Math.asin(Math.sqrt(x));
}

function initHobokenMap() {

  L.tileLayer('https://{s}.tile.jawg.io/jawg-dark/{z}/{x}/{y}{r}.png?access-token=Lrrwi9HKsiS8ptMSGUR1K7cGy3sg60y1kCop0PsvWIy3H5yUz85QIzfTXJwtjwnq', {
    maxZoom: 22,

function renderTiles(tiles) {
  if (!_hobokenMap) return;
  const seen = new Set();
  for (const t of tiles) {
    const key = t.uuid;
    seen.add(key);
    const latlng = [t.lat, t.lon];
    const cfg = TILE_DEVICES[t.name] || {};
    const label = cfg.icon || (t.name || '?').substring(0, 2).toUpperCase();
    const style = cfg.color ? ('background:' + cfg.color + ';') : '';
    const icon = L.divIcon({
      className: 'tile-marker',
      html: '<div style="' + style + 'width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;">' + label + '</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13],
    });
    if (_tileMarkers[key]) {
      _tileMarkers[key].setLatLng(latlng);
      _tileMarkers[key].setIcon(icon);
    } else {
      _tileMarkers[key] = L.marker(latlng, { icon: icon }).addTo(_hobokenMap);
    }
  }
  for (const key of Object.keys(_tileMarkers)) {
    if (!seen.has(key)) {
      _hobokenMap.removeLayer(_tileMarkers[key]);
      delete _tileMarkers[key];

function renderLocations(locations) {
  if (!_hobokenMap) return;
  // Compute display positions ‚Äî offset overlapping markers so the home icon
  // is always visible and multiple people at the same place don't stack.
  // Within ~265 ft of any other marker, spread them in a small ring.
  const OVERLAP_MI = 0.05;        // ~265 ft
  const RING_RADIUS_DEG = 0.0003; // ~110 ft
  const positions = {};
  for (const loc of locations) positions[loc.tid] = { lat: loc.lat, lon: loc.lon };

  // Cluster people who are near HOME ‚Äî distribute around home
  const nearHome = locations.filter(function (l) { return distMi(HOME, l) < OVERLAP_MI; });
  if (nearHome.length > 0) {
    nearHome.forEach(function (l, idx) {
      const angle = (idx / Math.max(nearHome.length, 1)) * 2 * Math.PI + 0.5;
      positions[l.tid].lat = HOME.lat + RING_RADIUS_DEG * Math.cos(angle);
      positions[l.tid].lon = HOME.lon + RING_RADIUS_DEG * Math.sin(angle);
    });
  }

  // Cluster people near each other but not at home
  const elsewhere = locations.filter(function (l) { return distMi(HOME, l) >= OVERLAP_MI; });
  const handled = new Set();
  for (let i = 0; i < elsewhere.length; i++) {
    if (handled.has(elsewhere[i].tid)) continue;
    const cluster = [elsewhere[i]];
    handled.add(elsewhere[i].tid);
    for (let j = i + 1; j < elsewhere.length; j++) {
      if (handled.has(elsewhere[j].tid)) continue;
      if (distMi(elsewhere[i], elsewhere[j]) < OVERLAP_MI) {
        cluster.push(elsewhere[j]);
        handled.add(elsewhere[j].tid);
      }
    }
    if (cluster.length > 1) {
      const cx = cluster.reduce(function (s, c) { return s + c.lat; }, 0) / cluster.length;
      const cy = cluster.reduce(function (s, c) { return s + c.lon; }, 0) / cluster.length;
      cluster.forEach(function (c, idx) {
        const angle = (idx / cluster.length) * 2 * Math.PI + 0.5;
        positions[c.tid].lat = cx + RING_RADIUS_DEG * Math.cos(angle);
        positions[c.tid].lon = cy + RING_RADIUS_DEG * Math.sin(angle);
      });
    }
  }

  // Clear stale markers
  const seen = new Set();
  for (const loc of locations) {
    seen.add(loc.tid);
    const pos = positions[loc.tid];
    const latlng = [pos.lat, pos.lon];
    const faceUrl = FACE_IMAGES[loc.tid];
    const html = faceUrl
      ? '<img src="' + faceUrl + '" alt="' + displayName(loc) + '"/>'
      : (displayName(loc) || '?').substring(0, 2).toUpperCase();
    if (_personMarkers[loc.tid]) {
      _personMarkers[loc.tid].setLatLng(latlng);
    } else {
      const icon = L.divIcon({
        className: 'person-marker',
        html: html,
        iconSize: [36, 36],
        iconAnchor: [18, 18],
      });
      _personMarkers[loc.tid] = L.marker(latlng, { icon: icon }).addTo(_hobokenMap);
    }
  }
  // Remove markers for people no longer in the list
  for (const tid of Object.keys(_personMarkers)) {
    if (!seen.has(tid)) {
      _hobokenMap.removeLayer(_personMarkers[tid]);
      delete _personMarkers[tid];
    }
  }
  // Update person list under map
  const list = document.getElementById('personList');
  if (locations.length === 0) {
    list.innerHTML = '<span style="color:#666;">No locations shared yet</span>';
  } else {
    list.innerHTML = locations.map(function (l) {
      const ago = agoText(l.received_at * 1000);
      return '<span><span class="person-dot"></span>' +
        displayName(l) + ' <span style="color:#666;">' + ago + '</span></span>';
    }).join('');
  }

  // Auto-fit: include home + any person within 5mi. If none in range, default Hoboken view.
  const inRange = locations.filter(function (l) {
    return distMi(HOME, l) <= AUTO_FIT_RADIUS_MI;
  });
  if (inRange.length === 0) {
    // Nobody in range ‚Äî tight on home (Hoboken-wide view)
    _hobokenMap.setView([HOME.lat, HOME.lon], 14);
  } else {
    // Fit tightly around home + in-range people. No Hoboken-include constraint ‚Äî
    // padding gives a bit of context and maxZoom caps how tight we go.
    const lats = [HOME.lat].concat(inRange.map(function (l) { return l.lat; }));
    const lngs = [HOME.lon].concat(inRange.map(function (l) { return l.lon; }));
    const minLat = Math.min.apply(null, lats);
    const maxLat = Math.max.apply(null, lats);
    const minLng = Math.min.apply(null, lngs);
    const maxLng = Math.max.apply(null, lngs);
    _hobokenMap.fitBounds([[minLat, minLng], [maxLat, maxLng]], {
      padding: [20, 20],
      maxZoom: 15,
    });
  }
}

function setAlertsMode(mode) {
  // mode: 'news' or 'map'
  const mapEl = document.getElementById('mapContainer');
  const listEl = document.getElementById('personList');
  if (mode === 'map') {
    mapEl.style.display = 'block';
    listEl.style.display = 'flex';
    initHobokenMap();
    if (_hobokenMap) setTimeout(function () { _hobokenMap.invalidateSize(); }, 100);
  } else {
    mapEl.style.display = 'none';
    listEl.style.display = 'none';
  }
}

// ============================================================
// ALERTS & NEWS
// ============================================================
async function fetchAlerts() {
  if (!PROXY_URL) return;
  if (document.hidden || isSleeping()) return;
  try {
    const res = await fetchT(PROXY_URL + '?mode=alerts');
    const data = await res.json();
    markOk('alerts');
    const container = document.getElementById('alertsList');
    let items = [];

    if (Array.isArray(data.njt_alerts)) {
      for (const a of data.njt_alerts) {
        if (a.error) continue;
        items.push({ text: a.description || a.title || '', badge: 'njt', badgeText: 'NJT', isAlert: true });
      }
    }

    if (Array.isArray(data.nixle_alerts)) {
      for (const a of data.nixle_alerts) {
        if (a.error) continue;
        items.push({ text: a.title || '', badge: 'nixle', badgeText: 'Nixle', isAlert: true });
      }
    }

    // Alerts only ‚Äî no news, no stocks
    if (items.length === 0) {
      container.innerHTML = '<div class="alert-item" style="color:#444;">No alerts</div>';
    } else {
      let html = '';
      for (const item of items) {
        html += `<div class="alert-item is-alert">`;
        html += `<span class="alert-badge ${item.badge}">${item.badgeText}</span>`;
        html += item.text;
        html += '</div>';
      }
      container.innerHTML = html;
      requestAnimationFrame(() => trimOverflow(container));
    }
  } catch (e) {
    console.error('Alerts fetch error:', e);
    markFail('alerts');
  }
}

// ============================================================
// CALENDAR (private ICS feed via proxy, token stored per-device)
// ============================================================
function initCalAuth() {
  const token = localStorage.getItem('calToken');
  if (!token) {
    showCalTokenPrompt();
    return;
  }
  document.getElementById('calSigninPrompt').style.display = 'none';
  fetchCalEvents();
}

function showCalTokenPrompt() {
  const c = document.getElementById('calContent');
  c.innerHTML =
    '<div class="cal-signin-prompt">' +
    '<div style="margin-bottom:10px;">Enter calendar token:</div>' +
    '<input id="calTokenInput" type="password" autocomplete="off" ' +
    'style="background:#1a1a2a;border:0.5px solid #2a2a35;border-radius:6px;' +
    'color:#fff;padding:8px 12px;font-size:0.85rem;width:80%;outline:none;" />' +
    '<div><button class="cal-signin-btn" onclick="saveCalToken()">Save</button></div>' +
    '</div>';
  setTimeout(function () {
    const inp = document.getElementById('calTokenInput');
    if (inp) inp.focus();
  }, 100);
}

function saveCalToken() {
  const inp = document.getElementById('calTokenInput');
  if (!inp || !inp.value.trim()) return;
  localStorage.setItem('calToken', inp.value.trim());
  initCalAuth();
}

function resetCalendarChoice() {
  // Triggered by double-click on calendar title ‚Äî clear the saved token so the user
  // can re-enter it. To actually switch to a different calendar's ICS feed,
  // update the CALENDAR_ICS_URL env var on Cloud Run.
  if (confirm('Reset calendar token? You will need to re-enter it.')) {
    localStorage.removeItem('calToken');
    initCalAuth();
  }
}

async function fetchCalEvents() {
  if (document.hidden || isSleeping()) return;
  const token = localStorage.getItem('calToken') || '';
  try {
    // Token via header (not query string) to avoid URL logging
    const res = await fetchT(PROXY_URL + '?mode=calendar',
      { headers: { 'X-Cal-Token': token } });
    if (res.status === 403) {
      // Bad token ‚Äî re-prompt
      localStorage.removeItem('calToken');
      showCalTokenPrompt();
      return;
    }
    const data = await res.json();
    if (data.events && Array.isArray(data.events)) {
      renderCalEvents(data.events);
    } else if (data.events && data.events.error) {
      document.getElementById('calEvents').innerHTML =
        '<div class="cal-empty">Calendar error</div>';
      console.error('Calendar error:', data.events.error);
    }
  } catch (e) {
    console.error('Calendar fetch error:', e);
  }
}

function renderCalEvents(events) {
  const container = document.getElementById('calEvents');
  if (!events || events.length === 0) {
    container.innerHTML = '<div class="cal-empty">No upcoming events</div>';
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);

  // Today as YYYY-MM-DD for cross-day comparisons
  const todayStr = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  function fmtMonthDay(dateStr) {
    // dateStr is YYYY-MM-DD; render as "May 25"
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function daysBetween(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }

  // Normalize ICS-feed format. Preserve start, end, allDay.
  // Compute display anchor date: if a multi-day event is happening today,
  // anchor to today instead of its original start.
  events = events.map(function (e) {
    const isAllDay = !!e.allDay || /^\d{4}-\d{2}-\d{2}$/.test(e.start || '');
    const startStr = e.start || '';
    const endStr = e.end || '';
    let anchorDate;
    if (isAllDay) {
      // ICS DTEND is exclusive ‚Äî a multi-day all-day event runs [start, end)
      const isMultiDay = endStr && daysBetween(startStr, endStr) > 1;
      const lastDayInclusive = isMultiDay
        ? new Date(new Date(endStr + 'T00:00:00').getTime() - 86400000)
            .toISOString().substring(0, 10)
        : startStr;
      // If today falls within [start, lastDayInclusive], anchor to today
      if (startStr <= todayStr && todayStr <= lastDayInclusive) {
        anchorDate = todayStr;
      } else {
        anchorDate = startStr;
      }
      return {
        summary: e.summary,
        start: { date: startStr },
        end: { date: endStr },
        isMultiDay: isMultiDay,
        lastDay: lastDayInclusive,
        anchorDate: anchorDate,
        _calendarColor: '#6bffb8',
      };
    } else {
      const d = new Date(e.start);
      anchorDate = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      return {
        summary: e.summary,
        start: { dateTime: e.start },
        end: e.end ? { dateTime: e.end } : null,
        isMultiDay: false,
        anchorDate: anchorDate,
        _calendarColor: '#6bffb8',
      };
    }
  });

  // Group by anchor date
  const byDate = {};
  for (const ev of events) {
    if (!ev.anchorDate) continue;
    if (!byDate[ev.anchorDate]) byDate[ev.anchorDate] = [];
    byDate[ev.anchorDate].push(ev);
  }

  const dateKeys = Object.keys(byDate).sort();
  let html = '';
  for (const dateKey of dateKeys) {
    const date = new Date(dateKey + 'T12:00:00');
    const isToday = date.toDateString() === today.toDateString();
    const isTomorrow = date.toDateString() === tomorrow.toDateString();

    let dayLabel;
    let cls = 'is-future';
    if (isToday) { dayLabel = 'TODAY'; cls = 'is-today'; }
    else if (isTomorrow) dayLabel = 'TOMORROW';
    else dayLabel = date.toLocaleDateString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric'
    }).toUpperCase();

    html += '<div class="cal-day-header ' + cls + '">' + dayLabel + '</div>';

    for (const ev of byDate[dateKey]) {
      let timeLabel;
      let evCls = 'cal-event';
      if (ev.start.date) {
        evCls += ' all-day';
        if (ev.isMultiDay) {
          timeLabel = fmtMonthDay(ev.start.date) + ' - ' + fmtMonthDay(ev.lastDay);
        } else {
          timeLabel = 'All day';
        }
      } else {
        const startDate = new Date(ev.start.dateTime);
        const h = startDate.getHours();
        const m = String(startDate.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        timeLabel = h12 + ':' + m + ' ' + ampm;
      }
      const title = (ev.summary || '(no title)').replace(/</g, '&lt;');
      const color = ev._calendarColor || '#6bffb8';
      const dot = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:' +
        color + ';margin-right:6px;vertical-align:middle;"></span>';
      html += '<div class="' + evCls + '"><span class="cal-event-time">' +
        timeLabel + '</span><span class="cal-event-title">' + dot + title + '</span></div>';
    }
  }
  container.innerHTML = html;
  // After paint, trim trailing items / orphan day headers until everything fits cleanly.
  // Use double-rAF + setTimeout to make sure layout has settled before measuring.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      setTimeout(trimCalendarOverflow, 30);
    });
  });
}

function trimCalendarOverflow() {
  const container = document.getElementById('calEvents');
  const scrollParent = document.getElementById('calContent');
  if (!container || !scrollParent) return;
  let safety = 300;
  // Alternate: trim trailing item, then trim trailing orphan headers, repeat
  while (safety-- > 0 && container.lastElementChild) {
    const overflow = scrollParent.scrollHeight > scrollParent.clientHeight + 1;
    const lastIsHeader = container.lastElementChild.classList.contains('cal-day-header');
    if (!overflow && !lastIsHeader) break;
    container.removeChild(container.lastElementChild);
  }
}

function updateTransit() {
  if (PROXY_URL) {
    fetchProxy();
  } else {
    updateBusStatic();
  }
  updateFerries();
  fetchHop();
}

// ============================================================
// SLEEP MODE ‚Äî black screen midnight to 7am (also pauses animations + polls)
// ============================================================
function isSleeping() {
  const h = new Date().getHours();
  return h >= 1 && h < 7;
}

function checkSleepMode() {
  const sleeping = isSleeping();
  document.body.style.visibility = sleeping ? 'hidden' : 'visible';
  document.body.style.background = sleeping ? '#000' : '#0a0a0f';
  document.body.classList.toggle('sleeping', sleeping);
}
